 function home(){const st=DB.store(sid()),orders=currentOrders(),busy=st.tables.filter(t=>DB.tableState(sid(),t.id).type==='occupied').length,pending=orders.flatMap(o=>o.lines).filter(l=>l.status!=='served').length, bookings=S().reservations.filter(b=>b.sid===sid()&&b.day===DB.DAY&&b.status==='confirmed'),tasks=currTasks(),low=DB.items.filter(i=>DB.available(sid(),i.id)<i.par),done=Object.values(S().checks[sid()]).filter(Boolean).length;
 return `<header class="page-head"><div><div class="eyebrow">TODAY’S RESTAURANT</div><h1>今日のお店</h1><p class="page-sub">おはカレー。営業の準備も、ピーク中も、閉店までここから。</p></div><div class="head-actions">${link('reports',I('report')+' 日報を開く','btn hide-mobile')}${action('booking',I('plus')+' 予約を追加','primary')}</div></header><div class="metrics">${metric('今日の売上',money(DB.sales(sid())),'',DB.paid(sid()).length+'件の会計済み伝票','yen')}${metric('利用中のテーブル',busy,'/ '+st.tables.length+'卓','片付け待ち '+S().dirty[sid()].length+'卓','store')}${metric('厨房・配膳の待ち',pending,'品目',orders.length+'件の進行中注文','kitchen')}${metric('対応する仕事',tasks.length,'件','発注・設備・教育もひとつに','task')}</div><div class="grid2"><div class="stack"><section><div class="hero"><div class="grow"><div class="eyebrow">準備 → 接客 → 調理 → 会計 → 振り返り</div><h2>店の一日を、<br>ひとつにつなごう。</h2><p>次の予約、厨房の注文、仲間のヘルプ。<br>別の画面でも、同じお店の情報で動きます。</p>${link('orders','注文を取る '+I('arrow'),'btn primary')}</div><div class="hero-art" aria-hidden="true"><div class="shop-bubble">みんなで営業中</div><span class="shop-star">✧</span><div class="shop-drawing"><div class="shop-awning"></div><div class="shop-sign">RUU KITCHEN</div><div class="shop-windows"><i></i><i></i><i></i></div></div></div></div><div class="quick-actions">${[['floor','来店を受付','calendar'],['inventory','在庫を数える','box'],['purchases','納品を確認','truck'],['shifts','シフトを見る','users']].map(([p,t,i])=>link(p,I(i)+t,'quick')).join('')}</div></section>${card('営業のいま',`<div class="gridEven"><div><div class="between"><span class="small muted">これからの予約</span>${badge(bookings.length+'組','green')}</div>${bookings.slice(0,3).map(b=>`<div class="list-row"><strong class="num">${b.time}</strong><div class="grow"><strong>${e(b.name)}</strong><p>${b.party}名 · ${b.table}</p></div>${action('arrive','受付','sm',`data-id="${b.id}"`)}</div>`).join('')||empty('予約待ちはありません')}</div><div><div class="between"><span class="small muted">厨房の注文</span>${link('kitchen','キッチンへ →','link')}</div>${orders.slice(0,3).map(o=>`<div class="list-row"><span class="round-icon orange">${I('kitchen')}</span><div class="grow"><strong>${o.table||channels[o.channel]} / #${o.number}</strong><p>${o.lines.filter(l=>l.status!=='served').map(l=>e(l.name)+' ×'+l.qty).join('、')||'提供済み・会計へ'}</p></div></div>`).join('')||empty('注文が厨房へ届きます')}</div></div>`)}${card('今日、進めること',taskRows(tasks.slice(0,4)),link('tasks','すべて見る →','link'))}</div><div class="stack">${card('営業チェック',`<div class="between mb"><span class="small muted">開店・閉店の確認</span><b class="num">${done} / ${DB.checks.length}</b></div><div class="progress"><i style="width:${done/DB.checks.length*100}%"></i></div><div class="list-row"><span class="round-icon">${I('checks')}</span><div class="grow"><strong>見落としを、次の担当へ残さない</strong><p>衛生は速さではなく、確認と対応を記録</p></div></div>${link('checks','チェックを開く '+I('arrow'),'btn full mt')}`)}${card('仕入れ・在庫の気づき',low.slice(0,3).map(i=>`<div class="list-row"><span class="round-icon orange">${I('box')}</span><div class="grow"><strong>${i.name}</strong><p>引当を除く ${n(DB.available(sid(),i.id))}${i.unit} / 補充目安 ${i.par}${i.unit}</p></div>${link(i.supplier?'purchases':'prep',i.supplier?'発注へ':'仕込みへ','link')}</div>`).join('')+link('inventory','すべての在庫を見る →','link mt'),badge(low.length+'品の確認候補','orange'))}${card('10店舗で、ひとつのチーム。',`<div class="row"><span class="trophy">🤝</span><div><strong class="small">誰かの「助かった」が増える場所</strong><p class="tiny muted mt" style="margin-top:4px">食材も、スタッフも、いい工夫も共有。</p></div></div><div class="team-avatars">${S().stores.slice(0,6).map(s=>`<span>${s.name[0]}</span>`).join('')}<span>+4</span></div><div class="between mt">${link('network','ヘルプを見る →','link')}${link('club','みんなの広場 →','link')}</div>`,badge('チームの広場','purple'),'club-peek')}</div></div><div class="card-title mt" style="margin-top:27px"><h2>お店の仕事、ここに全部。</h2><span class="tiny muted">やりたい業務から開けます</span></div><div class="module-grid">${pages.filter(p=>!['home','settings'].includes(p[0])).map(p=>`<a href="#${p[0]}" class="module-tile">${I(p[2])}<b>${p[1]}</b><p>${p[3]}</p></a>`).join('')}</div>`}
 const channels={dine:'店内',takeout:'持ち帰り',delivery:'配達'};
 const statusName={confirmed:'予約確定',arrived:'ご来店',done:'ご利用済み',cancelled:'取消',referred:'系列店へ案内',new:'調理待ち',cooking:'調理中',ready:'配膳・お渡し待ち',served:'提供済み',open:'営業中',paid:'会計済み',draft:'承認待ち',approved:'承認済み',ordered:'手配済み（模擬）',partial:'一部入荷',received:'完了',requested:'募集中',accepted:'対応承認',shipped:'移動中',planned:'出勤前',working:'勤務中',ended:'退勤済み',todo:'未着手',doing:'対応中'};
 function floor(){const st=DB.store(sid()),bs=S().reservations.filter(b=>b.sid===sid()).sort((a,b)=>(a.day+a.time).localeCompare(b.day+b.time));return head('floor',action('booking',I('plus')+' 予約を追加','primary'))+workflow('floor')+`<div class="grid2">${card('席の状況',`<div class="row wrap small mb">${badge('空席','green')}${badge('お食事中','orange')}${badge('片付け待ち','purple')}</div><div class="floor-grid">${st.tables.map(t=>{let ts=DB.tableState(sid(),t.id);return `<button class="dining-table ${ts.type}" data-action="table" data-id="${t.id}"><b>${t.id}</b><small>${t.capacity}名席</small><span class="table-pill">${ts.label}</span></button>`}).join('')}</div><p class="tiny muted mt">現在の利用状況です。予約は90分枠で重複を確認。来店時には席を再確認します。</p>`)}${card('席が埋まっていても、つながる。',`<div class="round-icon purple mb">${I('network')}</div><h2>系列店の空席を探す</h2><p class="small muted mt">人数と時刻をそろえて、別の店舗へご案内。転送先の予約台帳へつながります。</p>${action('referral',I('search')+' 系列店を探す','full mt')}<div class="note mt">全店の画面は、このブラウザ内の架空データです。実際の予約・お客様への連絡は発生しません。</div>`)} </div>${card('予約台帳',table(['日時','お客様・人数','席','状態','操作'],bs.map(b=>`<tr><td><strong>${b.time}</strong><small>${b.day}</small></td><td><strong>${e(b.name)}</strong><small>${b.party}名 · ${e(b.note)}</small></td><td>${b.table}</td><td>${badge(statusName[b.status],b.status==='confirmed'?'green':'')}</td><td><div class="actions">${b.status==='confirmed'?action('arrive','来店受付','sm primary',`data-id="${b.id}"`)+action('referBooking','系列店へ','sm',`data-id="${b.id}"`)+action('cancelBooking','取消','sm ghost',`data-id="${b.id}"`):b.status==='arrived'?action('orderBooking','注文へ','sm primary',`data-id="${b.id}"`):'—'}</div></td></tr>`)),badge(bs.length+'件'),'mt')}`}
 function orders(){const tab=S().ui.tab.orders||'new';let body='';if(tab==='new'){const c=cartState(),amount=c.cart.reduce((v,l)=>v+DB.menu(l.id).price*l.qty,0);body=`<div class="order-layout"><div><div class="menu-grid">${S().menu.map(m=>{const count=DB.portions(sid(),m);return `<button class="food-card" data-action="cartAdd" data-id="${m.id}" ${!m.active||count<1?'disabled':''}><div class="food-illust">${m.emoji}${badge(!m.active?'販売休止':count+'食目安',count<6?'orange':'green')}</div><div class="food-info"><h3>${e(m.name)}</h3><div class="between"><strong class="num">${money(m.price)}</strong>${I('plus')}</div><small>${e(m.category)} / ${m.minutes}分設定</small></div></button>`}).join('')}</div><div class="note mt">食数は共通食材からの目安で、商品ごとに独立した在庫ではありません。注文時に全品を合算して引当。提供確定で在庫が減ります。</div></div><div class="card cart"><div class="card-title"><h2>いま取っている注文</h2>${badge('まだ厨房へ送信前','orange')}</div><form id="orderForm" data-form="order" data-draft="cart-${sid()}"><div class="formgrid">${select('ご利用方法','channel',Object.entries(channels),c.channel)}${select('テーブル','table',DB.store(sid()).tables.map(t=>[t.id,t.id+' / '+t.capacity+'名席']),c.table)}${field('人数','party','number',c.party,'min="1" max="20" required')}${field('メモ','note','text',c.note,'maxlength="400" placeholder="提供順など。個人情報は入れない"')}</div><p class="tiny muted mt">持ち帰り・配達ではテーブルを使用しません。</p>${c.cart.length?c.cart.map(l=>`<div class="cart-row"><div class="name">${e(DB.menu(l.id).name)}</div><div class="between"><div class="qty"><button type="button" data-action="cartMinus" data-id="${l.id}" aria-label="${e(DB.menu(l.id).name)}を減らす">−</button><b>${l.qty}</b><button type="button" data-action="cartAdd" data-id="${l.id}" aria-label="${e(DB.menu(l.id).name)}を増やす">＋</button></div><span class="num small">${money(DB.menu(l.id).price*l.qty)}</span></div></div>`).join(''):empty('メニューを選んでください','注文は、厨房・在庫・会計につながります。')}<div class="total"><span>合計 <small class="muted">税込仮想値</small></span><strong class="num">${money(amount)}</strong></div><div class="form-error hide" role="alert"></div><button class="btn primary full" ${!c.cart.length?'disabled':''} type="submit">${I('kitchen')}注文を確定して厨房へ</button></form></div></div>`}else{const list=S().orders.filter(o=>o.sid===sid()&&(tab==='live'?o.status==='open':o.status!=='open')).slice().reverse();body=card(tab==='live'?'進行中の注文・会計':'会計と取消の履歴',list.length?table(['伝票','商品','金額','状態','操作'],list.map(o=>`<tr><td><strong>#${o.number}</strong><small>${o.table||channels[o.channel]} · ${o.created}</small></td><td>${o.lines.map(l=>`<div>${e(l.name)} ×${l.qty} <small>v${l.version} / ${statusName[l.status]}</small></div>`).join('')}</td><td class="num">${money(DB.total(o))}</td><td>${badge(o.status==='open'?(o.lines.every(l=>l.status==='served')?'会計できます':'提供を確認'):statusName[o.status],o.status==='paid'?'green':'orange')}</td><td><div class="actions">${o.status==='open'?o.lines.every(l=>l.status==='served')?action('payment','会計へ','sm primary',`data-id="${o.id}"`):link('kitchen','厨房へ','btn sm'):action('receipt','控え','sm',`data-id="${o.id}"`)}${o.status==='open'&&!o.lines.some(l=>l.status==='served')?action('cancelOrder','取消','sm ghost',`data-id="${o.id}"`):''}</div></td></tr>`)):empty('進行中の注文はありません'),badge('実決済なし'))}return head('orders',action('orderTab','会計する','primary',`data-value="live"`))+workflow('orders')+tabs('orders',[['new','注文を取る'],['live','進行中・会計 '+currentOrders().length],['history','履歴']],'new')+body}
 function kitchen(){const os=currentOrders(),flat=os.flatMap(o=>o.lines.filter(l=>l.status!=='served').map(l=>({o,l}))),last=os.filter(o=>o.lines.some(l=>l.status==='served')&&o.lines.some(l=>l.status!=='served'));return head('kitchen',link('orders','会計・注文へ '+I('arrow'),'btn'))+workflow('kitchen')+(last.length?`<div class="note orange mb">${I('clock')} 同じテーブルで料理を待っている人がいます：${last.map(o=>o.table||'#'+o.number).join('、')}。平均時間ではなく「あと一皿」も確認。</div>`:'')+`<div class="kitchen-board">${[['new','調理待ち','調理を始める'],['cooking','調理中','できあがり'],['ready','配膳・お渡し待ち','提供を確認']].map(([stage,title,next])=>`<section class="lane"><div class="lane-title"><span>${title}</span>${badge(flat.filter(x=>x.l.status===stage).length+'品目')}</div>${flat.filter(x=>x.l.status===stage).map(({o,l})=>`<div class="ticket"><div class="ticket-top"><strong>${o.table||channels[o.channel]} / #${o.number}</strong><span class="muted">${o.created}</span></div><div class="ticket-line"><b>${e(l.name)}</b><strong>×${l.qty}</strong></div><div class="row wrap">${badge(l.station,'orange')}${badge(channels[o.channel])}</div>${o.note?`<p class="tiny muted mt">${e(o.note)}</p>`:''}${action('kitchenStep',next+(stage==='ready'?' '+I('check'):''),'sm '+(stage==='ready'?'primary':''),`data-id="${o.id}" data-line="${l.id}"`)}</div>`).join('')||empty('いまはありません','注文状況に連動します。')}</section>`).join('')}</div><div class="note mt">提供を確認すると、登録レシピ分の在庫が減り、会計できる状態に近づきます。実際の調理機器や注文端末には接続していません。</div>`}

 function finance(){const ps=DB.paid(sid()),revenue=DB.sales(sid()),food=ps.reduce((v,o)=>v+o.lines.reduce((t,l)=>t+l.cost*l.qty,0),0),ex=S().expenses.filter(e=>e.sid===sid()),expense=ex.reduce((t,e)=>t+e.amount,0);return head('finance',action('expenseNew',I('plus')+' 経費を記録','primary')+action('exportSales',I('download')+' 売上CSV',''))+`<div class="metrics">${metric('会計済み売上',money(revenue),'',ps.length+'件の仮想取引','yen')}${metric('登録食材の原価',money(food),'','伝票作成時の単価・レシピ','box')}${metric('記録した経費',money(expense),'','購入在庫は重ねて費用にしない','report')}${metric('参考の差引額',money(revenue-food-expense),'','売上 − 登録食材 − 記録経費','chart')}</div><div class="note orange mb">参考差引額は営業利益ではありません。人件費・税区分などは未計算。食材の購入額と消費額を二重に差し引かない簡易表示です。税務・会計帳簿として使わないでください。</div><div class="gridEven">${card('商品別の販売',table(['商品','食数・本数','売上'],S().menu.map(m=>{const ls=ps.flatMap(o=>o.lines).filter(l=>l.menuId===m.id);return `<tr><td>${e(m.name)}</td><td>${ls.reduce((t,l)=>t+l.qty,0)}</td><td class="num">${money(ls.reduce((t,l)=>t+l.price*l.qty,0))}</td></tr>`})))}${card('経費の記録',table(['費目','金額','支払い・メモ'],ex.map(x=>`<tr><td>${e(x.category)}</td><td class="num">${money(x.amount)}</td><td><small>${x.method==='cash'?'現金':'現金以外'}</small><small>${e(x.note)}</small></td></tr>`)))}</div>`}
 function helpCards(filter=false){const hs=S().help.filter(h=>h.status!=='cancelled'&&(!filter||h.to===sid()||h.from===sid()));return hs.length?`<div class="gridEven">${hs.slice().reverse().map(h=>{const stock=h.type==='stock';return `<article class="help-card"><div class="between">${badge(stock?'食材のヘルプ':'スタッフのヘルプ',stock?'green':'purple')}${badge(statusName[h.status],h.status==='received'?'green':'orange')}</div><h3>${e(h.title)}</h3><div class="help-route">${h.from?e(DB.store(h.from).name):'応援元を募集中'} ${I('arrow')} <b>${e(DB.store(h.to).name)}</b></div><p class="small muted">${e(h.note)}</p><p class="small">${stock?DB.item(h.item).name+' / '+h.qty+DB.item(h.item).unit:h.role+' / '+h.start+'〜'+h.end}</p><div class="stepper">${['依頼','両店確認',stock?'出庫':'応援確定',stock?'受取':'勤務へ'].map((t,i)=>{const ix={requested:0,accepted:1,shipped:2,received:3}[h.status];return `<span class="${i<ix?'done':i===ix?'current':''}">${t}</span>`}).join('')}</div><div class="row wrap">${h.status==='requested'?(h.to===sid()?action('donorSelect','応援できる店舗を探す','sm primary',`data-id="${h.id}"`)+action('helpCancel','取消','sm ghost',`data-id="${h.id}"`):action('helpAccept','この店舗から応援する','sm primary',`data-id="${h.id}"`)):h.status==='accepted'?(stock?(h.from===sid()?action('helpShip','食材を出庫する','sm primary',`data-id="${h.id}"`):action('switchTo','提供元で出庫確認','sm',`data-store="${h.from}"`)):(h.to===sid()?action('helpStaffConfirm','応援をシフトへ確定','sm primary',`data-id="${h.id}"`):action('switchTo','依頼元で最終確認','sm',`data-store="${h.to}"`))):h.status==='shipped'?(h.to===sid()?action('helpReceive','受取を確認する','sm primary',`data-id="${h.id}"`):action('switchTo','受取店舗へ切替','sm',`data-store="${h.to}"`)):badge('つながって、ひと仕事完了','green')}</div></article>`}).join('')}</div>`:empty('対応中の依頼はありません','食材も人も、ひとつの店だけで抱えない。')}

 function purchaseModal(id='chicken'){let i=DB.item(id);if(!i.supplier)i=DB.item('chicken');const incoming=S().purchases.filter(p=>p.sid===sid()&&p.item===i.id&&['draft','approved','ordered','partial'].includes(p.status)).reduce((v,p)=>v+p.qty-p.received,0);formModal('発注申請を作る','purchase',`<div class="note mb">同じ食材の既存の入荷予定も確認してください。選択食材の未入荷予定：${n(incoming)}${i.unit}。このフォームは自動発注しません。</div><div class="formgrid">${select('食材・単位','item',DB.items.filter(i=>i.supplier).map(i=>[i.id,i.name+' / '+i.unit]),i.id)}${field('数量','qty','number',Math.max(1,i.par-DB.available(sid(),i.id)-incoming),'min="0.001" max="1000" step="0.001" required')}${field('単位あたり仕入れ価格（仮想）','price','number',S().prices[i.id],'min="0" max="100000" step="1" required')}${field('入荷希望日','day','date',DB.DAY,'required')}${area('備考','note','','maxlength="300"')}</div>`,'承認待ちで保存');$('#dialog select[name=item]').addEventListener('change',ev=>{$('#dialog input[name=price]').value=S().prices[ev.target.value];saveFormDraft($('#dialog form'))})}
 function requestModal(type,id='chicken'){const fields=type==='stock'?select('必要な食材','item',DB.items.map(i=>[i.id,i.name+' / '+i.unit]),id)+field('数量','qty','number',2,'min="0.001" max="1000" step="0.001" required'):select('担当してほしい仕事','role',[['ホール','ホール'],['厨房','厨房']],'ホール')+field('開始','start','time','17:00','required')+field('終了','end','time','21:00','required');formModal(type==='stock'?'食材を系列店へ相談':'スタッフの応援を相談','helpRequest',`<div class="formgrid">${field('依頼タイトル','title','text',type==='stock'?'食材を分けてもらえませんか':'今夜の応援をお願いできますか','required maxlength="80"')}${fields}${area('条件・引継ぎ','note',type==='stock'?'規格・期限・保管状態と運搬条件を、両店舗で確認してください。':'必要な仕事と時間、本人の同意を確認してください。','required maxlength="500"')}</div>`,'全店へ依頼を出す',`data-type="${type}"`,'request-'+sid()+'-'+type)}
 function guide(){modal('飲食経営OS｜総合版の歩き方',`<p class="small muted mb">ひとつの食材のデモではなく、お店の一日をまるごと触るデモです。店舗を切り替えて、10店舗の連携も試せます。</p><div class="gridEven"><div class="card"><span class="round-icon mb">${I('store')}</span><h3>1．まず、営業を回してみる</h3><p class="small muted mt">予約を受付 → 注文 → キッチンで提供 → 会計 → 席の片付け → 日報。</p>${link('floor','予約・席管理へ →','btn full mt')}</div><div class="card"><span class="round-icon orange mb">${I('box')}</span><h3>2．お店の裏側もつながる</h3><p class="small muted mt">発注 → 承認 → 検品 → 在庫 → 仕込み。売れた分が在庫に反映。</p>${link('purchases','仕入れ・発注へ →','btn full mt')}</div><div class="card"><span class="round-icon mb">${I('network')}</span><h3>3．他の店舗と助け合う</h3><p class="small muted mt">ヘルプ掲示板で応援 → 店舗を切替 → 食材の出庫・受取、スタッフの応援確定。</p>${action('networkHelp','全店ヘルプへ →','full mt')}</div><div class="card"><span class="round-icon purple mb">${I('spark')}</span><h3>4．少し、楽しくする</h3><p class="small muted mt">ありがとう便、まかないアイデア、助け合いの全店チャレンジ。</p>${link('club','みんなの広場へ →','btn full mt')}</div></div><div class="note mt">全データは仮想。生成AI・実POS・決済・SNS・外部発注は未接続。複数店舗の変更はこのブラウザ内だけに保存されます。</div>`,true)}
 function scope(){modal('このデモでできること・まだしないこと',`<h3>実際に動く部分</h3><p class="small mt">18画面を、同じ店舗・商品・在庫データで操作できます。予約の重複チェック、来店、注文、調理段階、提供での在庫減算、会計の売上反映、レジ締め、発注と分納、棚卸し、仕込み、勤務の重複チェック、店間の出庫・受取、仕事カード、商品改訂、日報、広場の投稿とリアクションが動きます。</p><div class="divider"></div><h3>本番では追加が必要な部分</h3><p class="small mt">生成AI API、ログインと店舗別アクセス制御、サーバーDB、複数端末同期、実際のPOS・決済・発注・SNS・配車・会計接続はありません。音声入力・写真認識・自動予測も未実装です。</p><p class="small mt">会計の分割・返金・税率別処理・インボイス・給与計算・アレルゲン判定・食品別の衛生基準は対応していません。ここでの数値やチェックを、実際の営業・安全・労務・会計判断に使わないでください。</p><div class="divider"></div><h3>保存について</h3><p class="small mt">同じブラウザのlocalStorageだけに保存。データ削除やプライベート閲覧で消える場合があります。別タブで更新された場合は、上書きを防ぐため再読込を案内します。実際の顧客名・機密は入力しないでください。</p><div class="note mt">全店舗、スタッフ、商品価格、原価、時刻は体験用の仮想設定です。「営業中」などもデモの状態であり、実店舗の稼働状況ではありません。</div>`)}
 function download(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
 function csv(rows){return '\uFEFF'+rows.map(row=>row.map(v=>{let s=String(v??'');if(typeof v==='string'&&/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\r\n')}
 function textModal(title,text,filename){modal(title,`<textarea class="input" id="outputText" rows="13" readonly>${e(text)}</textarea><div class="row mt">${action('downloadText',I('download')+' テキスト保存','primary',`data-filename="${e(filename)}"`)}${action('close','閉じる','')}</div>`)}
 function onAction(el){const a=el.dataset.action,id=el.dataset.id;try{

 if(a==='orderTab'){go('orders',el.dataset.value);return}if(a==='networkHelp'){go('network','help');return}
 if(a==='switchTo'||a==='switchHome'){DB.selectStore(el.dataset.store);close();if(a==='switchHome')go('home');else render();toast(DB.store(sid()).name+'に切り替えました');return}
 if(a==='booking'){bookingModal();return}if(a==='referral'){referral();return}if(a==='referBooking'){referral(id);return}
 if(a==='targetBooking'){bookingModal({store:el.dataset.store,old:el.dataset.old||null,table:el.dataset.table,party:Number(el.dataset.party),time:el.dataset.time,day:el.dataset.day});return}
 if(a==='arrive'){DB.bookingAction(id,'arrive');render();const b=find('reservations',id);modal('ご来店を受け付けました',`<p class="small">${e(b.name)} / ${b.party}名 / ${b.table}。次は注文へ進めます。</p>${action('orderBooking','この席の注文を取る '+I('arrow'),'primary full mt',`data-id="${id}"`)}`);return}
 if(a==='cancelBooking'){confirmAction('予約を取り消しますか','デモの予約記録だけを取り消します。','confirmCancelBooking',id);return}

 if(a==='orderBooking'){const b=find('reservations',id);DB.draft('cart-'+sid(),{cart:[],channel:'dine',table:b.table,party:b.party,note:''});go('orders','new');return}
 if(a==='table'){const ts=DB.tableState(sid(),id);if(ts.type==='cleaning'){modal(id+'｜片付けを確認',`<p class="small">清掃と忘れ物確認が終わったら、次のお客様をご案内できる状態にします。</p>${action('cleanTable','確認して空席に戻す','primary full mt',`data-id="${id}"`)}`)}else if(ts.order){go('orders','live')}else if(ts.booking){onAction({dataset:{action:'orderBooking',id:ts.booking.id}})}else{modal(id+'｜空席',`<p class="small">ご来店の方の注文を取るか、予約枠を登録できます。</p><div class="row mt">${action('tableOrder','この席で注文','primary',`data-id="${id}"`)}${action('tableBook','予約を登録','',`data-id="${id}"`)}</div>`)}return}
 if(a==='tableBook'){bookingModal({table:id});return}if(a==='tableOrder'){DB.draft('cart-'+sid(),{cart:[],channel:'dine',party:1,table:id,note:''});go('orders','new');return}
 if(a==='cleanTable'){DB.cleanTable(sid(),id);close();render();toast('席が次のお客様をご案内できる状態になりました');return}
 if(a==='cartAdd'||a==='cartMinus'){const c=captureCart();let item=c.cart.find(l=>l.id===id);if(a==='cartAdd'){if(item){if(item.qty>=50)throw Error('1品の上限は50です');item.qty++}else c.cart.push({id,qty:1})}else if(item){item.qty--;c.cart=c.cart.filter(l=>l.qty>0)}DB.draft('cart-'+sid(),c);render();return}
 if(a==='kitchenStep'){DB.kitchen(id,el.dataset.line);render();toast('調理・提供状況が更新されました');return}
 if(a==='payment'){const o=find('orders',id);formModal('会計 #'+o.number+'（模擬）','payment',`<div class="metric-value num">${money(DB.total(o))}</div><p class="small muted mb">実際のお金は動きません。完了すると売上・日報・レジ締めに反映。</p>${select('支払方法','method',[['cash','現金'],['card','カード'],['qr','QR決済']],'cash')}${tick('料理の提供と会計内容を確認しました')}`,'会計を完了する',`data-id="${id}"`,'payment-'+id);return}
 if(a==='cancelOrder'){confirmAction('注文を取り消しますか','未提供の商品だけの注文を取消し、食材の引当を解除します。','confirmCancelOrder',id);return}
 if(a==='confirmCancelOrder'){DB.cancelOrder(id);close();render();toast('注文を取り消し、引当を戻しました');return}
 if(a==='receipt'){const o=find('orders',id);textModal('伝票控え（仮想）',`${DB.store(o.sid).name} / ${o.day} / #${o.number}\n${channels[o.channel]} / ${statusName[o.status]}\n\n${o.lines.map(l=>l.name+' ×'+l.qty+' '+money(l.price*l.qty)).join('\n')}\n\n合計 ${money(DB.total(o))}\n支払 ${o.payment||'なし'}\n\n実決済の領収書・インボイスではありません。`,'order-'+o.number+'.txt');return}
 if(a==='inventoryCount'||a==='inventoryWaste'){inventoryModal(a==='inventoryCount'?'count':'waste',el.dataset.item||'chicken');return}
 if(a==='purchaseNew'){purchaseModal(el.dataset.item||'chicken');return}
 if(a==='poApprove'||a==='poOrder'){DB.purchaseStep(id,a==='poApprove'?'approve':'order');render();toast(a==='poApprove'?'承認済み。次は手配です。':'手配済みにしました。実際の注文は送っていません。');return}
 if(a==='poCancel'){confirmAction('発注を取り消しますか','入荷前のデモ発注を取り消します。実際の取引先への連絡はありません。','confirmPoCancel',id);return}
 if(a==='confirmPoCancel'){DB.purchaseStep(id,'cancel');close();render();toast('発注を取り消しました');return}
 if(a==='poReceive'){const p=find('purchases',id);formModal(DB.item(p.item).name+'｜検品・入荷','receive',`<div class="note mb">発注 ${p.qty}${DB.item(p.item).unit} / 入荷済み ${p.received}${DB.item(p.item).unit}。一部だけの納品も登録できます。</div><div class="formgrid">${field('今回、届いた数量','qty','number',p.qty-p.received,'min="0.001" step="0.001" required')}${field('請求書に記載された総数量','invoiceQty','number',p.qty,'min="0" max="1000" step="0.001" required')}${field('請求書の単価','invoicePrice','number',p.price,'min="0" max="100000" required')}</div>${tick('規格・数量・状態を、人が確認しました')}`,'入荷分を在庫へ反映',`data-id="${id}"`,'receive-'+id);return}
 if(a==='poDoc'){const p=find('purchases',id);textModal('発注書（デモ）',`${p.supplier} 宛\n${DB.store(p.sid).name}\n希望日 ${p.day}\n\n${DB.item(p.item).name} ${p.qty}${DB.item(p.item).unit}\n単価 ${p.price}円\n合計 ${money(p.qty*p.price)}\n\n備考 ${p.note}\n状態 ${statusName[p.status]}\n\n仮想データ。実際には送信していません。`,'purchase-demo.txt');return}
 if(a==='prepMake'){const p=DB.prepRecipes.find(x=>x.id===id);formModal(p.name+'を仕込む','prep',`<div class="note mb">${p.note}</div>${field('仕込み倍率（1倍で'+p.yield+'kg）','batch','number',1,'min="0.1" max="100" step="0.1" required')}${tick('手順と仕上がり量を確認しました')}`,'材料を使用して仕込み記録',`data-id="${id}"`);return}
 if(a==='check'){DB.checkTask(sid(),id);render();return}
 if(a==='temperature'){formModal('設備の温度を記録','temperature',`<div class="note orange mb">仮想の社内設定：0〜5℃。食品別・法的な基準ではありません。範囲外でも事実を記録し、対応を残します。</div><div class="formgrid">${field('設備名','name','text','冷蔵庫B','required maxlength="80"')}${field('測定値（℃）','value','number','','min="-40" max="100" step="0.1" required')}${area('対応・確認メモ','action','','maxlength="500" placeholder="範囲外の場合は必須。責任者への確認など"')}</div>`,'測定を記録');return}
 if(a==='taskNew'){formModal('担当付きの仕事を作る','task',`<div class="formgrid">${field('仕事名','title','text','','required maxlength="100"')}${select('分類','category',['引継ぎ','設備','教育','衛生','仕入れ','在庫','接客','商品','販促'].map(x=>[x,x]),S().ui.tab.tasks==='equipment'?'設備':'引継ぎ')}${field('担当','owner','text','店長','required maxlength="60"')}${area('確認すること・完了条件','note','','maxlength="1000"')}</div>`,'仕事を登録');return}
 if(a==='taskDetail'){const t=find('tasks',id);modal('仕事カード',`<div class="row">${badge(t.category)}${badge(statusName[t.status],t.status==='done'?'green':'orange')}</div><h2 class="mt">${e(t.title)}</h2><p class="small mt">担当 ${e(t.owner)} / ${e(t.due)}</p><p class="small mt break" style="white-space:pre-wrap">${e(t.note)}</p><div class="row mt">${t.status==='todo'?action('task-start','対応を始める','primary',`data-id="${id}"`):''}${t.status!=='done'?action('task-done','完了を記録','primary',`data-id="${id}"`):action('task-reopen','再開する','',`data-id="${id}"`)}</div>`);return}

 if(a==='manual'){const m=manuals.find(x=>x[0]===id);modal(e(m[1]),m.slice(2).map((t,i)=>`<div class="manual-step"><b>${i+1}</b><p>${e(t)}</p></div>`).join('')+`<div class="note mt">例示用の手順です。実店舗の安全な標準手順に置き換えて使用してください。</div>${action('manualConfirm','別の人が再現できたことを確認','primary full mt',`data-id="${id}"`)}`);return}
 if(a==='manualConfirm'){DB.trained(sid(),id);close();render();toast('再現テストの記録を残しました');return}
 if(a==='shiftNew'){formModal('勤務予定を追加','shift',`<div class="formgrid">${select('スタッフ','staff',S().staff.filter(s=>s.sid===sid()).map(s=>[s.id,s.name+' / '+s.skills]))}${field('開始','start','time','17:00','required')}${field('終了','end','time','21:00','required')}${field('休憩（分）','break','number',0,'min="0" max="120" step="1" required')}</div><div class="note mt">勤務の重複は確認しますが、法令上の労務チェックを代替しません。</div>`,'勤務を登録');return}
 if(a==='attendance'){const s=find('shifts',id);formModal(s.status==='planned'?'出勤を記録（模擬）':'退勤を記録（模擬）','attendance',field('打刻する時刻','time','time',s.status==='planned'?s.start:s.end,'required')+'<p class="tiny muted mt">実際の勤怠システムには送信されません。</p>','打刻を記録',`data-id="${id}"`,'attendance-'+id);return}
 if(a==='menuEdit'){const m=DB.menu(id);formModal('一皿のカルテ｜v'+m.version,'menuEdit',`<div class="formgrid">${field('商品名','name','text',m.name,'required maxlength="60"')}${field('販売価格（仮想・税込）','price','number',m.price,'min="1" max="100000" step="1" required')}${area('作り方・接客で伝えること','note',m.note,'required maxlength="1500"')}</div><p class="tiny muted mt">レシピ：${Object.entries(m.recipe).map(([i,q])=>DB.item(i).name+' '+q+DB.item(i).unit).join(' / ')}</p><p class="tiny muted mt">この総合デモではレシピ配合は固定。価格と説明の改訂が全店舗の確認作業へつながります。</p>${m.history.length?'<div class="note mt">旧版：'+m.history.map(h=>'v'+h.version+' '+e(h.name)+' '+money(h.price)).join('<br>')+'</div>':''}`,'改訂して全店へ確認依頼',`data-id="${id}"`,'menu-'+id);return}
 if(a==='menuActive'){DB.menuActive(id);render();toast('新しい注文に販売状態を反映しました');return}
 if(a==='reviewNew'){formModal('お客様の声を登録','review',`<div class="formgrid">${select('商品','product',S().menu.map(m=>[m.id,m.name]))}${select('評価','rating',[1,2,3,4,5].map(x=>[x,x+' / 5']),4)}${area('確認できた声（個人情報は入れない）','body','','required maxlength="1500"')}</div>`,'声を登録');return}
 if(a==='reviewTask'){const v=find('reviews',id);formModal('声を、現場の確認へつなぐ','reviewTask',`<div class="note mb">${e(v.body)}</div><div class="formgrid">${field('まず何を確認しますか','title','text','提供・説明の手順を確認する','required maxlength="100"')}${field('担当','owner','text','店長','required maxlength="60"')}</div><p class="tiny muted mt">原因を決めつけず、心理・見せ方・現場手順を人が確認する仕事にします。</p>`,'改善カードを作る',`data-id="${id}"`);return}
 if(a==='campaignNew'){const m=S().menu[0];formModal('現場から告知を作る','campaign',`<div class="formgrid">${field('企画名','title','text','本日のおすすめ','required maxlength="80"')}${select('商品','product',S().menu.map(m=>[m.id,m.name]),m.id)}${field('実施日','day','date',DB.DAY,'required')}${field('販売上限（計画値）','qty','number',10,'min="1" max="200" required')}${area('告知文','body',campaignText(m,10),'required maxlength="3000" rows="6"')}</div>${action('campaignTemplate','選んだ商品で定型下書きを更新','sm mt')}<p class="tiny muted mt">定型文の組立であり、AI生成ではありません。実際の在庫・予約の確保とSNS投稿は行いません。</p>`,'下書きを保存');return}
 if(a==='campaignTemplate'){const f=$('#dialog form'),d=data(f),m=DB.menu(d.product);f.elements.body.value=campaignText(m,DB.number(d.qty,'販売上限',1,200,true));saveFormDraft(f);return}
 if(a==='campaignApprove'){DB.campaignStep(id);render();toast('社内承認しました。外部には投稿していません。');return}
 if(a==='campaignCopy'){const c=find('campaigns',id);textModal(e(c.title),c.body,'campaign-demo.txt');return}
 if(a==='expenseNew'){formModal('経費を記録','expense',`<div class="formgrid">${select('費目','category',['備品','修理','販促','水道光熱費','その他'].map(x=>[x,x]))}${field('金額（仮想値）','amount','number','','min="1" max="1000000" required')}${select('支払い','method',[['cash','現金'],['bank','現金以外']])}${area('メモ','note','','maxlength="500"')}</div>`,'経費へ反映');return}
 if(a==='cashCount'){formModal('レジ締め｜現金実数を確認','cashCount',`<p class="small muted mb">現在の予定額 ${money(DB.expectedCash(sid()))}。実際に数えた金額を入力してください。</p><div class="formgrid">${field('数えた現金','actual','number','','min="0" max="10000000" step="1" required')}${area('差額がある場合の確認・引継ぎ','note','','maxlength="500"')}</div>`,'締めの記録を保存');return}
 if(a==='reportDraft'){DB.draft('report-'+sid(),{body:reportBody()});render();toast('現在の数字と未完了の仕事から下書きを更新しました');return}
 if(a==='reportView'){const r=find('reports',id);textModal('営業日報 '+r.day,r.body,'daily-report.txt');return}
 if(a==='requestStock'||a==='requestStaff'){requestModal(a==='requestStock'?'stock':'staff',el.dataset.item||'chicken');return}
 if(a==='donorSelect'){const h=find('help',id);modal('応援元の店舗を選ぶ',`<p class="small muted mb">店舗を切り替え、その店舗の担当者として応援を確認するデモです。</p>${S().stores.filter(s=>s.id!==h.to).map(s=>`<div class="list-row"><div class="grow"><strong>${s.name}</strong><p>${h.type==='stock'?DB.item(h.item).name+' 使用可能 '+n(DB.available(s.id,h.item))+DB.item(h.item).unit:'スタッフの勤務とスキルを確認'}</p></div>${action('switchDonor','この店で確認','sm',`data-id="${id}" data-store="${s.id}"`)}</div>`).join('')}`);return}
 if(a==='switchDonor'){DB.selectStore(el.dataset.store);render();onAction({dataset:{action:'helpAccept',id}});return}
 if(a==='helpAccept'){const h=find('help',id);formModal('応援を確認｜'+e(DB.store(sid()).name)+' → '+e(DB.store(h.to).name),'helpAccept',`<h3>${e(h.title)}</h3><p class="small muted mt">${e(h.note)}</p>${h.type==='staff'?'<div class="mt">'+select('応援するスタッフ','staff',S().staff.filter(s=>s.sid===sid()).map(s=>[s.id,s.name+' / '+s.skills]))+'</div>':'<div class="note mt">提供元の使用可能在庫 '+n(DB.available(sid(),h.item))+DB.item(h.item).unit+'。承認すると移動予定として引き当てます。</div>'}${tick(h.type==='stock'?'双方の規格・期限・保管状態・運搬条件を確認しました':'本人の同意と、両店舗の責任者・勤務条件を確認しました')}`,'応援を承認',`data-id="${id}"`,'accept-'+id+'-'+sid());return}
 if(a==='helpShip'){DB.helpStep(id,'ship',{sid:sid()});render();toast('提供元の在庫を減らし、移動中にしました');return}
 if(a==='helpReceive'){formModal('移動した食材の受取を確認','helpReceive',tick('数量・規格・期限・状態を確認し、受け取りました'),'受取を確定',`data-id="${id}"`,'help-receive-'+id);return}
 if(a==='helpStaffConfirm'){DB.helpStep(id,'staffConfirm',{sid:sid()});render();burst();toast('応援がシフトと引継ぎに反映されました');return}
 if(a==='helpCancel'){DB.helpStep(id,'cancel',{sid:sid()});render();toast('依頼を取り消しました');return}
 if(a==='thanksNew'||a==='ideaNew'){const type=a==='thanksNew'?'thanks':'idea';formModal(type==='thanks'?'仲間にありがとうを送る':'まかないの発見を残す','post',`<div class="formgrid">${type==='thanks'?select('届ける店舗','to',S().stores.filter(s=>s.id!==sid()).map(s=>[s.id,s.name])):''}${field('タイトル','title','text',type==='thanks'?'今日、助かりました！':'まかないで見つけたアイデア','required maxlength="100"')}${area('ひとこと','body','','required maxlength="2000" placeholder="実在の個人情報は入れないでください"')}</div>`,'みんなの広場に共有',`data-type="${type}"`,'post-'+type+'-'+sid());return}
 if(a==='like'){DB.like(id,sid());render();return}if(a==='ideaTest'){DB.ideaTest(id);render();toast('投稿元の店舗に試作・味見の仕事ができました');return}
 if(a==='reset'){confirmAction('総合版のデモを初期化しますか','このブラウザ内の追加注文・記録・投稿は消えます。前のデモと実店舗のデータには影響しません。','confirmReset','');return}
 if(a==='confirmReset'){DB.reset();close();location.hash='home';render();toast('総合デモを初期状態に戻しました');return}if(a==='reload'){DB.reload();render();return}
 if(a==='exportJSON'){download('restaurant-suite-backup.json',JSON.stringify(S(),null,2),'application/json');return}
 if(a==='exportInventory'){download('inventory-demo.csv',csv([['店舗','食材','単位','実在庫','引当','使用可能'],...DB.items.map(i=>[DB.store(sid()).name,i.name,i.unit,DB.stock(sid(),i.id),DB.reserved(sid(),i.id),DB.available(sid(),i.id)])]),'text/csv;charset=utf-8');return}
 if(a==='exportSales'){download('sales-demo.csv',csv([['店舗','伝票','日付','商品','数量','単価','金額'],...DB.paid(sid()).flatMap(o=>o.lines.map(l=>[DB.store(sid()).name,o.number,o.day,l.name,l.qty,l.price,l.qty*l.price]))]),'text/csv;charset=utf-8');return}
 if(a==='downloadText'){download(el.dataset.filename||'demo.txt',$('#outputText').value);return}
 if(a==='search'){modal('業務・機能を探す',`<input class="input" id="featureSearch" placeholder="例：レジ、棚卸し、ありがとう" aria-label="検索キーワード"><div id="searchResults" class="search-results mt"></div>`);const show=()=>{const q=$('#featureSearch').value.toLowerCase();$('#searchResults').innerHTML=pages.filter(p=>p.join(' ').toLowerCase().includes(q)).map(p=>`<a href="#${p[0]}">${I(p[2])}<div><strong>${p[1]}</strong><p>${p[3]}</p></div></a>`).join('')||empty('該当する機能はありません','別の言葉で検索してください。')};$('#featureSearch').addEventListener('input',show);show();return}
 }catch(err){toast(err.message)}}
 function campaignText(m,qty){return `${DB.store(sid()).name}から、本日のおすすめ。\n\n${m.name}　${money(m.price)}（デモ価格）\n${m.note}\n\n提供上限の計画：${qty}食。\n販売時間・受取方法は、公開前に店舗で確定してください。\n\nこれは下書きです。在庫確保・SNS投稿はまだ行っていません。`}
 function confirmAction(title,msg,act,id){modal(title,`<p class="small">${msg}</p><div class="form-footer">${action('close','戻る','ghost')}${action(act,'確認して実行','danger',`data-id="${id}"`)}</div>`)}
 async function submit(form){const kind=form.dataset.form,d=data(form);try{let result=null;d.sid=sid();
  if(kind==='prepPlan'){const m=DB.menu(d.product),qty=DB.number(d.qty,'食数',1,500,true);$('#prepPlanResult').innerHTML=`<div class="divider"></div>`+table(['材料','必要量','使用可能','不足'],Object.entries(m.recipe).map(([i,q])=>{const need=Math.round(q*qty*1000)/1000,diff=Math.max(0,Math.round((need-DB.available(sid(),i))*1000)/1000);return `<tr><td>${DB.item(i).name}</td><td>${n(need)}${DB.item(i).unit}</td><td>${n(DB.available(sid(),i))}${DB.item(i).unit}</td><td>${diff?badge(n(diff)+DB.item(i).unit,'orange'):badge('足りています','green')}</td></tr>`}))+`<div class="row mt">${link('inventory','在庫を確認','btn sm')}${link('purchases','足りない材料を発注','btn sm')}</div>`;return}
  if(kind==='referral'){const party=DB.number(d.party,'人数',1,6,true),at=DB.time(d.time);if(!/^\d{4}-\d{2}-\d{2}$/.test(d.day))throw Error('日付を確認してください');let choices=S().stores.filter(s=>s.id!==sid()).map(st=>{const t=st.tables.find(t=>t.capacity>=party&&!S().reservations.some(b=>b.sid===st.id&&b.table===t.id&&b.day===d.day&&!['cancelled','done','referred'].includes(b.status)&&Math.abs(DB.time(b.time)-at)<90)&&!(d.day===DB.DAY&&Math.abs(at-DB.time('11:45'))<90&&DB.tableState(st.id,t.id).type!=='free'));return {st,t}});$('#referralResult').innerHTML=choices.map(({st,t})=>`<div class="list-row"><div class="grow"><strong>${st.name}</strong><p>${t?t.id+' / '+t.capacity+'名席の候補':'条件に合う席なし'}</p></div>${t?action('targetBooking','この店へ予約','sm primary',`data-store="${st.id}" data-table="${t.id}" data-party="${party}" data-time="${e(d.time)}" data-day="${e(d.day)}" ${form.dataset.old?`data-old="${form.dataset.old}"`:''}`):badge('候補なし')}</div>`).join('');return}
  if(kind==='booking'){result=DB.addReservation({...d,sid:form.dataset.targetStore,referredFrom:form.dataset.old||null})}
  else if(kind==='order'){result=DB.placeOrder({...captureCart(),sid:sid()})}
  else if(kind==='payment'){if(!d.checked)throw Error('会計内容の確認をしてください');result=DB.pay(form.dataset.id,d.method)}
  else if(kind==='inventory'){result=DB.inventory({...d,kind:form.dataset.kind})}
  else if(kind==='purchase'){result=DB.makePurchase(d)}
  else if(kind==='receive'){result=DB.purchaseStep(form.dataset.id,'receive',d)}
  else if(kind==='prep'){result=DB.prepMake({...d,recipe:form.dataset.id})}
  else if(kind==='temperature'){result=DB.temperature(d)}
  else if(kind==='task'){result=DB.taskAdd(d)}
  else if(kind==='shift'){result=DB.addShift(d)}
  else if(kind==='attendance'){result=DB.attendance(form.dataset.id,d)}
  else if(kind==='menuEdit'){result=DB.menuUpdate(form.dataset.id,d)}
  else if(kind==='review'){result=DB.reviewAdd(d)}
  else if(kind==='reviewTask'){result=DB.reviewTask(form.dataset.id,d)}
  else if(kind==='campaign'){result=DB.campaign(d)}
  else if(kind==='expense'){result=DB.addExpense(d)}
  else if(kind==='cashCount'){result=DB.cashCount(d)}
  else if(kind==='report'){result=DB.report(d)}
  else if(kind==='helpRequest'){result=DB.addHelp({...d,type:form.dataset.type})}
  else if(kind==='helpAccept'){result=DB.helpStep(form.dataset.id,'accept',d)}
  else if(kind==='helpReceive'){result=DB.helpStep(form.dataset.id,'receive',d)}
  else if(kind==='post'){result=DB.post({...d,type:form.dataset.type})}
  else throw Error('この操作を処理できません');
  const dk=form.dataset.draft;if(dk){delete S().drafts[dk];DB.save()}
  close();
  if(kind==='order')go('kitchen');
  else if(kind==='payment')go('orders','history');
  else if(kind==='helpRequest'||kind==='helpAccept'||kind==='helpReceive')go('network','help');
  else if(kind==='post'){go('club',form.dataset.type==='thanks'?'thanks':'ideas');burst()}
  else render();
  if(kind==='helpReceive')burst();
  toast(result?.detail||'記録しました');
  if(kind==='booking'&&form.dataset.targetStore!==sid()){const target=form.dataset.targetStore;modal('系列店の予約台帳へ登録しました',`<p class="small">${e(DB.store(target).name)}に仮想予約が入りました。実際のお客様への連絡は行っていません。</p>${action('switchTo','その店舗へ切り替えて確認','primary full mt',`data-store="${target}"`)}`)}
 }catch(err){const er=form.querySelector('.form-error');if(er){er.textContent=err.message;er.classList.remove('hide');er.scrollIntoView({block:'nearest'})}else toast(err.message)}}
 document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el){event.preventDefault();onAction(el);return}const a=event.target.closest('a[href^="#"]');if(a){close();$('.rail')?.classList.remove('open');$('.overlay')?.classList.remove('open');const p=a.hash.slice(1);if(p===S().ui.page){render();window.scrollTo({top:0})}}});
 document.addEventListener('submit',event=>{const f=event.target.closest('form[data-form]');if(f){event.preventDefault();submit(f)}});
 document.addEventListener('input',event=>{const f=event.target.closest('form[data-draft]');if(f)saveFormDraft(f)});
 document.addEventListener('change',event=>{if(event.target.id==='storeSwitch'){if($('#orderForm'))DB.draft('cart-'+sid(),captureCart());DB.selectStore(event.target.value);render();toast(DB.store(sid()).name+'へ切り替えました')}else{const f=event.target.closest('form[data-draft]');if(f)saveFormDraft(f)}});
 window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);DB.route(views[p]?p:'home');render();window.scrollTo({top:0})});
 window.addEventListener('suite-conflict',render);
 document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){$('.rail')?.classList.remove('open');$('.overlay')?.classList.remove('open')}});
 const start=location.hash.slice(1);if(start&&views[start])DB.route(start);render();
 return {render,go,guide,scope,toast};
})();
</script></body></html>

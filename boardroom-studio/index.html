function validCase(c){if(!c.question.trim())return '相談内容を入力してください。';for(const [k,label,max] of [['employees','従業員数',100000],['budget','月額予算',1000000],['training','教育時間',168]]){let x=num(c[k]);if(x!==null&&(!Number.isFinite(x)||x<0||x>max||(k==='employees'&&!Number.isInteger(x))))return label+'を0以上の有効な数値で入力してください。'}return ''}

function evidence(c,id){const map={F1:`従業員数：${c.employees===''?'未確認':c.employees+'名'}`,F2:`月額の採用予算：${num(c.budget)===null?'未確認':c.budget+'万円'}。採用費・教育費を含む総コストではありません。`,F3:`新人教育の時間：${num(c.training)===null?'未確認':c.training+'時間／週'}。担当者や手順の確定は別途確認が必要です。`,F4:`役割案：${c.role||'未確認'}`,F5:c.facts||'現場の情報は未入力。',U1:c.unknown||'追加の不明点は未入力。',R1:c.rules||'会社の判断条件は未入力。',W0:`業務記録：${c.jobs.length}件・週${hours(c)}時間。見直し候補は週${candidate(c)}時間分。削減可能時間ではなく、分類された仕事の記録時間です。`,Q:c.question};return map[id]||c.jobs.find(x=>x.id===id)?.name||'未登録の材料です。'}

function analyze(c,v){

 else{experts=[{title:'足りないのは、どの仕事の対応力か',body:`${c.employees||'未確認'}名という人数だけでなく、「${c.role||'役割が未定'}」に渡す仕事と、受けられなかった案件を対応づけて確認します。`,change:'不足する時間帯・技能と、未対応案件の情報が分かったとき。',ids:['F1','F4','U1']},{title:noTraining?'教育時間ゼロの条件を先に扱う':'教育の余力も、採用の判断材料に',body:num(c.training)===null?'教育時間が未確認です。採用後に誰が教えるか、既存顧客対応と両立できるかを確認します。':noTraining?'教育に使える時間は週0時間と入力されています。未入力とは異なります。教育が必要な採用案は、そのまま実施できると扱いません。':`教育に使える時間は週${c.training}時間。十分かどうかは役割と教材次第です。担当者と教える工程を確認します。`,change:'教育担当・必要な教育量・引き継ぎ手順が具体化したとき。',ids:['F3','F5','R1']},{title:zero?'予算0円は「不明」ではなく制約':'月額予算と、総コストを分ける',body:num(c.budget)===null?'月額予算が未確認です。人件費の枠と、採用費・教育費の見積を分けて確認します。':zero?'採用に使う月額追加予算は0万円です。追加支出を伴う案を、そのまま実施案にはしません。既存予算内の再配分などは別途確認します。':`月額の採用予算は${c.budget}万円。これは支出の枠であって、総コストや採用できる人材を保証する数字ではありません。`,change:'採用費・教育費・必要な役割と、支出枠の関係が確認できたとき。',ids:['F2','U1']},{title:'採用と、仕事の見直しを並べて考える',body:`記録した仕事は${c.jobs.length}件・週${all}時間。うち見直し候補は週${pot}時間分です。実際の削減時間ではありません。仕事内容ごとに、試す範囲を絞ります。`,change:'小規模試験で、確認時間・手戻り・残る技能不足が分かったとき。',ids:['W0','R1']}];}
 const next=v===1?['不足している業務と、必要な役割を確認する','採用コストと受け入れ体制を確認する']:['断っている仕事の時間帯・技能・件数を確認する','採用候補へ渡す仕事と教育担当を確認する','見直し候補を一つ選び、実際の作業を記録する'];
 if(v>=2&&zero)next.unshift('月額予算0万円の範囲で可能な案かを確認する');
 if(v===3&&lacks.length)next.unshift(...lacks.map(x=>x+'を責任者へ確認する'));

}

function inputField(label,id,value,type='text',help='',placeholder=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${E(value)}" ${type==='number'?'min="0" step="'+(id==='employees'?'1':'0.5')+'"':''} maxlength="200" placeholder="${placeholder}" autocomplete="off">${help?`<p>${help}</p>`:''}</div>`}
function textareaField(label,id,value,help=''){return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" name="${id}" maxlength="3000">${E(value)}</textarea>${help?`<p>${help}</p>`:''}</div>`}
function renderMaterials(){const c=state.input;return heading('01 / CONTEXT','会社の材料を、そろえる。','知っていることと、まだ分からないことを分けて入力します。',btn('下書きを保存','draft','white','save'))+(state.version===1?`<div class="notice">${I('info')}<span>V1は相談文だけを使用します。この材料は保存できますが、検討に反映されるのはV2・V3です。</span></div>`:'')+`
<div class="two-col"><form id="materialForm" class="card"><div class="card-head"><h2>相談と会社情報</h2>${tag('仮想ケース','gold')}</div><div class="card-body">${textareaField('何を決めたいですか？','question',c.question,'採用の可否をAIが確定するものではありません。')}
<div class="form-grid">${inputField('会社名・仮名','name',c.name)}${inputField('従業員数','employees',c.employees,'number','0は既知の値、空欄は未確認。')}${inputField('採用の月額予算（万円）','budget',c.budget,'number','0万円と、予算不明は別です。','不明なら空欄')}${inputField('教育に使える時間（週h）','training',c.training,'number','0時間は教育余力がない状態。','不明なら空欄')}<div class="field span2"><label for="role">採用を考えている役割 <small>個人名は入力しません</small></label><input id="role" name="role" maxlength="200" value="${E(c.role)}" placeholder="未確定なら空欄"></div></div>
${textareaField('現場で確認できていること','facts',c.facts,'入力された文章を材料として表示します。事実確認や意味解析は行いません。')}${textareaField('まだ分からないこと','unknown',c.unknown)}${textareaField('会社として守る条件','rules',c.rules,'自由文の条件は人が確認。今回の自動分岐は数値・未入力・ケース選択に限ります。')}</div><div class="form-footer"><span class="help-line">適用すると、以前の会議結果は旧条件になります。</span><button type="submit" class="btn btn-dark">${I('check')}材料を適用</button></div></form>
<div><div class="card"><div class="card-head"><h2>入力した材料の一覧</h2>${tag('出典 ID')}</div><div class="card-body">${materialList(c)}<div class="material-item"><div class="material-id">U1</div><div><p>${E(c.unknown)}</p><small>不明点／人による確認が必要</small></div></div><div class="material-item"><div class="material-id">R1</div><div><p>${E(c.rules)}</p><small>会社の条件／人が検討結果と照合</small></div></div></div></div><div class="card spaced"><div class="card-head"><h2>講座用のケースを読み込む</h2></div><div class="card-body">${scenarios()}<p class="tiny muted" style="margin:14px 0 0">ケースを切り替えると、現在の入力が置き換わります。保存済みの会議記録は残ります。</p></div></div>${store.draft?`<div class="card spaced"><div class="card-body"><h3 style="font-size:13px;margin:0 0 8px">この端末に保存された下書き</h3><p class="tiny muted">${E(store.draft.input?.name||'地域企業A社')} ／ ${E(formatTime(store.draft.at))}</p>${btn('保存した下書きを復元','restore-draft','white','refresh')}</div></div>`:''}<div class="notice blue spaced">${I('shield')}<span>本番運用には、権限・利用規約・機密・保存先の確認が必要です。このデモへ実データは入れないでください。</span></div></div></div>`}
function categoryBar(){const c=state.input,total=hours(c);return `<div class="category-bar" aria-label="分類ごとの業務時間">${categories.map(([id,,color])=>{const h=c.jobs.filter(j=>j.cat===id).reduce((s,j)=>s+(num(j.hours)||0),0);return `<span title="${cat(id)[1]} ${h}時間" style="--catcolor:${color};width:${total?h/total*100:0}%"></span>`}).join('')}</div><div class="legend">${categories.map(([id,title,color])=>`<span style="--catcolor:${color}"><i></i>${title} ${state.input.jobs.filter(j=>j.cat===id).reduce((s,j)=>s+(num(j.hours)||0),0)}h</span>`).join('')}</div>`}
function renderWork(){const c=state.input;return heading('02 / WORK DESIGN','仕事を見れば、選択肢が広がる。','人・AI補助・自動化・標準化・外注・廃止の候補を比較します。',btn('仕事を追加','job-add','dark','plus'))+
`<div class="notice blue">${I('info')}<span>分類は教材上の候補です。一つの仕事に複数の対策もあり得ます。見直し候補の時間を、そのまま削減時間や採用人数に換算しません。</span></div>
<div class="card"><div class="card-body"><div class="flex" style="justify-content:space-between"><span class="small">${c.jobs.length}件の業務 <b style="font-size:20px;margin-left:15px">${hours(c)}<small style="font-size:10px;font-weight:400"> 時間／週</small></b></span><span class="tag gold">見直し候補 ${candidate(c)}時間分・未検証</span></div>${categoryBar()}</div></div>
<div class="toolbar"><div class="searchbox">${I('search')}<input id="workSearch" placeholder="仕事内容・担当を検索" value="${E(state.search)}" aria-label="仕事を検索"></div><span class="tiny muted">行の編集ボタンから時間や分類を変更</span></div><div class="filters"><button class="filter ${state.filter==='all'?'active':''}" data-act="filter" data-filter="all">すべて</button>${categories.map(([id,t])=>`<button class="filter ${state.filter===id?'active':''}" data-act="filter" data-filter="${id}">${t}</button>`).join('')}</div><div class="table-wrap"><table class="task-table"><thead><tr><th>業務 / 材料ID</th><th>担当</th><th>週の時間</th><th>見直し方向</th><th>操作</th></tr></thead><tbody id="workRows">${workRows()}</tbody></table></div><div class="table-bottom"><span>登録内容を変更すると、会議の再実行が必要になります。</span><span>仮想データ</span></div><div class="card spaced"><div class="card-head"><h2>仕事を減らしても、残る仕事がある。</h2></div><div class="card-body"><p class="small muted" style="margin:0">現場でしかできない作業、特定の時間帯の対応、必要な技能。その不足が残るなら、採用や外注も並行して検討します。「AIを使うから採用不要」にはしません。</p></div></div>`;}
function workRows(){const jobs=state.input.jobs.filter(j=>(state.filter==='all'||j.cat===state.filter)&&`${j.name} ${j.owner}`.toLowerCase().includes(state.search.toLowerCase()));if(!jobs.length)return '<tr><td colspan="5" style="text-align:center;padding:35px">該当する仕事はありません。</td></tr>';return jobs.map(j=>`<tr><td><div class="job-name">${E(j.name)}</div><div class="subcell">${E(j.id)}　${E(j.note)}</div></td><td>${E(j.owner)}</td><td><b>${E(j.hours)}</b> h</td><td><span class="tag" style="border-left:3px solid ${cat(j.cat)[2]}">${cat(j.cat)[1]}</span></td><td><button class="cell-action" data-act="job-edit" data-id="${E(j.id)}" aria-label="${E(j.name)}を編集">${I('edit')}</button></td></tr>`).join('')}
function staleNotice(){return stale()?`<div class="stale">${I('info')}この結果は旧条件です。材料を変更したため、会議を再実行してください。${btn('再実行','run','ghost','refresh')}</div>`:''}
function renderMeeting(){const r=current(),v=state.version;let top=heading('03 / BOARDROOM','一つの問いを、異なる視点から。','賛成の数ではなく、根拠と確認事項を比べます。',btn('材料を確認','nav','white','brief','data-page="materials"'))+
`<div class="card meeting-brief"><div><span class="label">今回の相談　${tag('V'+v+' / '+versions[v].label,versions[v].class)}</span><h3 class="breakword">${E(state.input.question)}</h3><span class="tiny muted">${E(state.input.name)} ／ 教材シミュレーション・外部AI未接続</span></div><div class="actions">${btn(r?'もう一度検討する':'会議を始める','run','dark',r?'refresh':'play',state.busy?'disabled':'')}</div></div>`;
 if(state.busy)return top+`<div class="runner"><span class="pulse"></span><h3>${['入力条件を確認しています','教材の検討例を組み立てています','根拠と確認事項を整理しています'][state.stage]||'準備しています'}</h3><p>ブラウザ内の条件分岐です。生成AIは呼び出していません。</p><div class="loader-progress"><span></span></div><div class="runner-track">${rolesFor(v).map((x,i)=>`<span class="tag ${i<=state.stage?'active':''}">${x.title}</span>`).join('')}</div><div style="margin-top:20px">${btn('中止','cancel','ghost')}</div></div>`;
 if(!r)return top+`<div class="empty"><div class="big-icon">${I('users')}</div><h3>会社の材料を、会議のテーブルに。</h3><p>入力した数値や未確認事項をもとに、${rolesFor(v).length}つの視点の教材例を表示します。自由文に対する生成AIの回答ではありません。</p>${btn('会議を始める','run','dark','play')}</div><div class="spaced">${roleTiles()}</div>`;
 top+=staleNotice();
 if(v===1)top+=`<div class="notice">${I('info')}<span>V1は意図的に「相談だけ」の教材版です。会社の数値・条件は参照せず、一般的な回答例を表示します。</span></div>`;
 if(r.blocked)top+=`<div class="stop-panel"><span class="tag red">人間へ確認</span><h2>採用の可否の断定を保留しました。</h2><p>${E(r.summary)}</p><div class="flex" style="flex-wrap:wrap">${r.lacks.map(x=>tag(E(x)+'：未確認','red')).join('')}</div></div>`;
 if(v===3&&r.bias)top+=`<div class="notice blue spaced">${I('shield')}<span>「賛成する理由だけ」という依頼でも、事実確認と比較を省きません。採用を自動的に否定するのでもなく、判断材料をそろえます。</span></div>`;
 top+=`<div class="meeting-steps"><span class="done"><b>01</b>材料を確認</span>${I('chev')}<span class="done"><b>02</b>視点を比較</span>${I('chev')}<span><b>03</b>人が判断</span><span class="tiny muted" style="margin-left:auto">教材の出力例</span></div><div class="tabs" role="tablist"><button class="tab ${state.tab==='opinions'?'active':''}" data-act="tab" data-tab="opinions" role="tab" aria-selected="${state.tab==='opinions'}">専門家の視点</button><button class="tab ${state.tab==='discussion'?'active':''}" data-act="tab" data-tab="discussion" role="tab" aria-selected="${state.tab==='discussion'}">一致点と、残る論点</button><button class="tab ${state.tab==='evidence'?'active':''}" data-act="tab" data-tab="evidence" role="tab" aria-selected="${state.tab==='evidence'}">使った材料</button></div>`;
 if(state.tab==='opinions')top+=`<div class="expert-grid ${v===1?'three-experts':''}">${r.experts.map((e,i)=>`<article class="expert-card"><div class="expert-top">${avatar(rolesFor(v)[i])}<div><b>${rolesFor(v)[i].title}</b><small>${rolesFor(v)[i].en}</small></div></div><div class="expert-body"><span class="tag ${i===2?'gold':i===1?'green':i===3?'purple':'blue'}">${v===1?'一般的な回答例':'確認する視点'}</span><h3>${E(e.title)}</h3><p>${E(e.body)}</p>${v>=2?sourceTags(e.ids):''}</div><div class="expert-foot"><b>${v===1?'まだ使っていない材料':'判断が変わる条件'}</b><p>${E(e.change)}</p></div></article>`).join('')}</div>`;
 if(state.tab==='discussion')top+=`<div class="equal-col"><div class="card insight"><span class="tag green">共通して確認すること</span><h3>「何人足りないか」の前に、<br>「どの仕事が足りないか」。</h3><p>役割・必要な技能・忙しい時間帯をそろえて、採用と仕事の見直しを比較します。</p><div class="fact-row"><b>共通点</b><span>人数だけで、採用の可否を確定しない。</span></div><div class="fact-row"><b>未解決</b><span>実際の人手不足と、作業の重複を区別する。</span></div></div><div class="card insight"><span class="tag gold">残る論点</span><h3>受注を増やすことと、<br>受け入れる余力は別。</h3><p>営業は未対応案件、現場は教育、財務は総コストを確認します。どれか一つの視点を正解としません。</p><div class="fact-row"><b>確認先</b><span>各情報を持つ担当者へ、人間が確認する。</span></div><div class="fact-row"><b>次の一歩</b><span>小さな検証と、必要な採用の準備を並行して検討。</span></div></div></div>`;
 if(state.tab==='evidence')top+=`<div class="card"><div class="card-body">${r.used.map(id=>`<div class="material-item"><div class="material-id">${id}</div><div><p>${E(evidence(r.input,id))}</p><small>この会議で使用した入力のスナップショット</small></div></div>`).join('')}</div></div>`;
 top+=`<div class="meeting-lower"><div class="card insight"><div class="flex">${tag(v===3?'意思決定の準備':'検討のまとめ',v===3?'green':'gold')}<span class="tiny muted">RULE-BASED DEMO</span></div><h3>${E(r.heading)}</h3><p>${E(r.summary)}</p>${v>=2?`<div class="fact-row"><b>人間が守る条件</b><span class="breakword">${E(r.input.rules||'条件は未入力です。')}</span></div>`:''}${btn('判断準備書へ進む','nav','dark','arrow','data-page="decision"')}</div><div class="card"><div class="card-head"><h2>次に確認すること</h2>${tag(r.next.length+'件')}</div><div class="card-body"><ul class="next-items">${r.next.slice(0,4).map(x=>`<li>${I('target')}<span>${E(x)}</span></li>`).join('')}</ul></div></div></div>`;
 return top;
}
function renderDecision(){const r=current(),v=state.version,d=decision();let html=heading('04 / DECISION BRIEF','答えを読む。その先の行動を残す。','AIの提案と、人間が決めたことを分けて持ち帰ります。',r?btn('テキストを書き出す','export','white','download'):'');if(!r)return html+`<div class="empty"><div class="big-icon">${I('file')}</div><h3>まず、会議を一度開きましょう。</h3><p>検討結果と使った材料をもとに、判断準備書を作ります。</p>${btn('会議を開く','run','dark','play')}</div>`;
 html+=staleNotice();if(v<3)html+=`<div class="notice">${I('info')}<span>V${v}は検討までの版です。未確認の扱い、人間の判断欄、確認タスクはV3で比較できます。</span>${btn('V3へ','version','ghost','arrow','data-version="3"')}</div>`;
 if(!d.todos.length)d.todos=r.next.slice(0,3).map(t=>({text:t,done:false,owner:'',date:''}));
 return html+`<div class="decision-layout"><article class="report"><div class="report-header"><div><div class="eyebrow">DECISION PREPARATION BRIEF</div><h2>人材・仕事再設計<br>判断準備書</h2><span class="small muted">${E(r.input.name)}</span></div><div class="report-meta">VERSION ${v}<br>${E(formatTime(r.at))}<br>教材シミュレーション<br>AIによる最終判断ではありません</div></div><div class="report-section"><h3>01　検討する問い</h3><p class="breakword">${E(r.input.question)}</p></div><div class="report-section"><h3>02　現時点の整理 ${tag(r.blocked?'可否は保留':'要・人間確認',r.blocked?'red':'gold')}</h3><p>${E(r.summary)}</p></div><div class="report-section"><h3>03　必要な確認</h3><ul class="report-list">${r.next.map((t,i)=>`<li><span>${String(i+1).padStart(2,'0')}</span>${E(t)}</li>`).join('')}</ul></div><div class="report-section"><h3>04　会社が守る条件</h3><p>${E(r.input.rules||'未入力')}</p></div><div class="report-section"><h3>05　小さく試す場合の案</h3><p>仕事を一つ選び、元の所要時間、確認にかかった時間、手戻りを記録する。2週間は教材上の検証期間案。実施の可否・担当・期限は人が決める。</p><div class="notice blue spaced" style="margin-bottom:0">${I('info')}<span>週${r.candidate}時間分は「見直し候補の業務時間」であり、削減効果の実績・予測ではありません。</span></div></div><div class="report-section"><h3>06　利用範囲</h3><p>この資料は仮想ケース用。採用・処遇・法務・財務の判断を確定するものではありません。数値入力による定型の検討例で、自由文の意味解析や事実確認は行っていません。</p></div></article>
<div>${v===3?`<div class="card"><div class="card-head"><h2>人間の判断</h2>${tag('本人が入力','green')}</div><div class="card-body"><p class="tiny muted" style="margin:0 0 14px">最初は未選択です。AIが承認欄を埋めることはありません。</p><div class="decision-options">${['小さく試す','採用も含めて検討','追加確認','保留'].map(s=>`<button class="decision-option ${d.choice===s?'selected':''}" data-act="choose" data-choice="${s}" ${stale()?'disabled':''}>${s}</button>`).join('')}</div><div class="field spaced"><label for="decisionReason">判断した理由</label><textarea id="decisionReason" maxlength="2000" placeholder="何を確かめて、なぜそう考えたか。" ${stale()?'disabled':''}>${E(d.reason)}</textarea></div><div class="help-line">選択を変えなくても、確認事項が増えれば学びです。</div></div></div><div class="card spaced"><div class="card-head"><h2>次に確認すること</h2>${tag('担当・期限は人が設定')}</div><div class="card-body">${d.todos.map((t,i)=>`<div class="todo-line"><label class="todo-title"><input type="checkbox" data-todo="${i}" data-prop="done" ${t.done?'checked':''} ${stale()?'disabled':''}>${E(t.text)}</label><div class="todo-inputs"><input data-todo="${i}" data-prop="owner" maxlength="80" value="${E(t.owner)}" placeholder="担当・確認先は未設定" aria-label="確認事項${i+1}の担当" ${stale()?'disabled':''}><input type="date" data-todo="${i}" data-prop="date" value="${E(t.date)}" aria-label="確認事項${i+1}の期限" ${stale()?'disabled':''}></div></div>`).join('')}</div></div>`:`<div class="card"><div class="card-body"><div class="eyebrow">NEXT VERSION</div><h3>検討で、終わらせない。</h3><p class="small muted">V3では、未確認情報を残し、人間が選択と理由を書きます。</p>${btn('V3で比較する','version','dark','arrow','data-version="3"')}</div></div>`}<div class="card spaced"><div class="card-body"><h3 style="font-size:13px;margin:0 0 12px">この会議を持ち帰る</h3><div style="display:grid;gap:9px">${btn('この端末に会議記録を保存','save-record','dark','save',stale()?'disabled':'')}${btn('記録をテキストで書き出す','export','white','download')}${btn('記録をコピー','copy','white','copy')}${btn('印刷プレビュー','print','white','file')}</div><p class="tiny muted" style="margin:13px 0 0;line-height:1.85">保存操作をした場合だけ、このブラウザに記録が残ります。共有端末では利用後に「会議記録」から削除してください。</p></div></div></div></div>`;
}
function renderCompare(){const c=state.input;return heading('VERSION COMPARISON','見た目ではなく、仕事の完成度を比べる。','同じ会社・同じ相談。使う材料と確認の仕組みが変わります。',btn('講座との対応','curriculum','white','book'))+`<div class="card meeting-brief"><div><span class="label">比較する相談</span><h3 class="breakword">${E(c.question)}</h3></div>${tag('同じ入力で比較','gold')}</div><div class="three-col">${[1,2,3].map(v=>{let r=analyze(c,v);return `<article class="card compare-card v${v}"><div class="compare-head"><span class="eyebrow">VERSION 0${v}</span>${tag(v===1?'出発点':v===2?'材料と選択肢':'確認・引き継ぎ',versions[v].class)}</div><h2>${versions[v].label}</h2><p>${versions[v].desc}</p><ul>${(v===1?['相談文のみを使う','3視点の一般的な回答例','会社の数値は未反映']:v===2?['会社の材料と数値を反映','4つの視点で比較','仕事を6分類で見直す']:['未確認と0を区別','判断を変える条件を表示','人間の選択・理由・行動を保存']).map(s=>`<li>${I('check')}${s}</li>`).join('')}</ul><div class="compare-answer"><span class="label">この条件での教材出力</span><b>${E(r.heading)}</b><p>${E(r.summary)}</p></div>${btn('V'+v+'を開く','open-version','white','arrow',`data-version="${v}"`)}</article>`}).join('')}</div><div class="section-head"><h2>どこを変えたのか</h2><span>単一アプリで3段階を比較</span></div><div class="table-wrap"><table class="matrix"><thead><tr><th>比較する仕組み</th><th>V1</th><th>V2</th><th>V3</th></tr></thead><tbody>${[['相談への一般的な回答例',true,true,true],['会社の数値・業務の棚卸し',false,true,true],['不足情報の明示と可否の保留',false,false,true],['予算0円を制約として扱う',false,true,true],['人間が判断と理由を残す',false,false,true],['担当・期限・引き継ぎ用記録',false,false,true]].map(([t,...vals])=>`<tr><td>${t}</td>${vals.map(b=>`<td style="color:${b?'#6c8b66':'#b3bbaa'}">${b?I('check'):'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="notice spaced">${I('book')}<span>3版とも、教材用の条件分岐と文章テンプレートで動きます。実AIの精度差や独立した専門家の判断を実測した比較ではありません。</span></div>`;}
const tests=[{id:'normal',num:'01',title:'材料がそろっている',text:'予算30万円・教育2時間・役割案あり。何を確認してから人が判断する？',expected:'prepare'},{id:'missing',num:'02',title:'予算と役割が不明',text:'必要な基本材料が空欄。採用の可否を断定せず、確認事項に戻せる？',expected:'hold'},{id:'zero',num:'03',title:'予算が0万円',text:'「不明」ではなく、追加支出ができない条件。0を見落とさない？',expected:'constraint'},{id:'bias',num:'04',title:'賛成する理由だけほしい',text:'社長の希望と、確認できた事実は別。無条件に追認しない？',expected:'compare'}];
function renderLab(){return heading('VALIDATION LAB','「動く」と「使える」を分ける。','期待する動作を選んでから、同じ条件を試します。ライブ開発は不要です。',btn('テスト結果を書き出す','export-tests','white','download'))+`<div class="notice blue">${I('lab')}<span>検証対象は、デモの入力・条件分岐・表示です。生成AIの回答品質や現場での効果は未検証。ケースの実行は、現在の会議の材料を変更しません。</span></div><div class="equal-col">${tests.map(t=>{const k=state.version+'-'+t.id,res=state.lab[k],pred=state.labPred[k];return `<article class="card lab-case"><div class="flex" style="justify-content:space-between"><span class="eyebrow">TEST ${t.num}</span>${tag('V'+state.version)}</div><h3>${t.title}</h3><p>${t.text}</p><div class="label spaced">あなたが期待する動作</div><div class="lab-choices">${[['prepare','材料を比較し、人の判断へ進む'],['hold','不足情報を確認し、可否は保留'],['constraint','0円を既知の制約として扱う'],['compare','結論を追認せず、別案も確認する']].map(([id,title])=>`<label><input type="radio" name="test-${t.id}" value="${id}" data-test="${t.id}" ${pred===id?'checked':''}>${title}</label>`).join('')}</div>${btn('このケースを検証','test','dark','play',`data-test="${t.id}"`)}${res?`<div class="test-result ${res.pass?'':'fail'}"><b>${I(res.pass?'check':'info')}${res.pass?'期待する表示を確認':'期待との違いがあります'}</b><span>${E(res.detail)}</span><div class="tiny" style="margin-top:7px">教材上の確認点：${{prepare:'人による判断を残す',hold:'未確認と可否の保留を明示',constraint:'0円を不明扱いしない',compare:'無条件に賛成しない'}[t.expected]}</div></div>`:''}</article>`}).join('')}</div>`;}
function formatTime(s){try{return new Date(s).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return '保存日時不明'}}
function renderHistory(){return heading('RECORDS','判断の理由を、次の仕事へ残す。','保存した記録は、この端末のブラウザ内だけにあります。',store.records.length?btn('保存した記録を全削除','clear-records','white','trash'):'')+`<div class="notice">${I('lock')}<span>クラウド共有や端末間同期はありません。ブラウザのデータ消去で失われます。必要な記録はテキストでも書き出してください。</span></div>`+(store.records.length?store.records.slice().reverse().map(r=>`<article class="card history-card"><div class="history-icon">${I('file')}</div><div><div class="flex">${tag('V'+r.version,versions[r.version].class)}<span class="tiny muted">${E(formatTime(r.at))}</span></div><h3 class="breakword">${E(r.input.question.slice(0,85))}</h3><p>${E(r.input.name)} ／ ${E(r.decision?.choice||'人間の判断は未選択')}</p></div><div class="history-actions">${btn('開く','record-open','white','file',`data-id="${E(r.id)}"`)}<button class="iconbtn" data-act="record-delete" data-id="${E(r.id)}" aria-label="この記録を削除">${I('trash')}</button></div></article>`).join(''):`<div class="empty"><div class="big-icon">${I('clock')}</div><h3>会議の記録は、まだありません。</h3><p>「判断準備書」から保存すると、ここに記録が残ります。自動で会社情報を保存することはありません。</p>${btn('会議ホームへ','nav','dark','arrow','data-page="home"')}</div>`);}
function render(){chrome();const map={home:renderHome,materials:renderMaterials,work:renderWork,meeting:renderMeeting,decision:renderDecision,compare:renderCompare,lab:renderLab,history:renderHistory};$('#main').innerHTML=`<section>${map[state.page]()}</section>`;document.title=`${navs.find(x=>x[0]===state.page)[2]} | V${state.version} — AI経営会議室`;}
function toast(t){clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3300)}
function writeStore(){try{localStorage.setItem(KEY,JSON.stringify(store));storeOK=true;return true}catch{storeOK=false;toast('この環境では端末保存できません。テキスト書き出しをご利用ください。');return false}}
function updateURL(){try{const u=new URL(location.href);u.searchParams.set('v',state.version);u.hash=state.page;history.replaceState(null,'',u)}catch{}}
function cancelRun(){runToken++;clearTimeout(timer);state.busy=false;state.stage=0}
function go(page){cancelRun();state.page=navs.some(n=>n[0]===page)?page:'home';state.formDirty=false;document.body.classList.remove('menu-open');updateURL();render();window.scrollTo({top:0,behavior:'instant'})}
function nav(page){if(state.formDirty)return modal('未適用の材料があります','<p>入力中の内容はまだ適用していません。「材料を適用」で保存してから移動してください。</p>',btn('入力に戻る','modal-close','dark'));go(page)}
function setVersion(v,open=false){if(![1,2,3].includes(v))return;cancelRun();state.version=v;state.formDirty=false;if(open)state.page='meeting';state.tab='opinions';updateURL();render();document.body.classList.remove('menu-open');if(open&&!current())runMeeting()}
function runMeeting(){const err=validCase(state.input);if(err){toast(err);go('materials');return}cancelRun();const token=++runToken;state.page='meeting';state.tab='opinions';state.busy=true;state.stage=0;const source=clone(state.input),version=state.version;updateURL();render();window.scrollTo({top:0,behavior:'instant'});let step=0;function tick(){if(token!==runToken)return;step++;if(step<3){state.stage=step;render();timer=setTimeout(tick,360)}else{state.results[version]=analyze(source,version);state.decisions[version]={choice:'',reason:'',todos:[]};state.busy=false;render();toast('教材の検討例を表示しました。生成AIは使用していません。')}}timer=setTimeout(tick,360)}
function modal(title,body,footer='',wide=false){lastFocused=document.activeElement;$('#overlay').hidden=false;$('#overlay').innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-header"><h2 id="modalTitle">${title}</h2><button class="iconbtn" data-act="modal-close" aria-label="閉じる">${I('close')}</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</div>`;document.body.style.overflow='hidden';setTimeout(()=>$('#overlay input, #overlay button, #overlay select, #overlay textarea')?.focus(),20)}
function closeModal(){const f=lastFocused;$('#overlay').hidden=true;$('#overlay').innerHTML='';document.body.style.overflow='';if(f?.isConnected)f.focus()}
function help(){modal('このデモについて',`<div class="notice green">${I('shield')}<span>前の簡易フォームから、会議の準備・比較・判断・記録までを一つのワークスペースに再構成した版です。</span></div><h3 style="font-size:14px">動く範囲</h3><p>会社の数値・未入力・業務の時間と分類を変えると、画面の集計と条件分岐が変わります。V1・V2・V3、4つの試験ケース、判断の保存・書き出しを操作できます。</p><h3 style="font-size:14px">AI接続について</h3><p>この版はAPI未接続です。検討文は仮想ケース向けの定型文と条件分岐で表示しています。自由文の意味解析、事実確認、実在の専門家による判断は行いません。</p><h3 style="font-size:14px">入力と保存</h3><p>外部通信は行いません。「保存」を押した場合だけ、このブラウザに記録します。実在の個人情報・機密は入力しないでください。共有端末では利用後に削除してください。</p><h3 style="font-size:14px">授業での順番</h3><p>V3の完成見本 → V1の不足を発見 → V2で材料と仕事を見る → V3で確認・判断を残す → 検証ラボ → 他の人が操作。</p>`,btn('使い始める','modal-close','dark','arrow'),true)}
function jobDialog(id){const j=id?state.input.jobs.find(x=>x.id===id):{id:'',name:'',hours:0,owner:'',cat:'human',note:''};if(!j)return;modal(id?'仕事の条件を編集':'仕事を追加',`<form id="jobForm"><input type="hidden" name="jobId" value="${E(j.id)}">${inputField('仕事内容','jobName',j.name)}<div class="form-grid">${inputField('記録した時間（週h）','jobHours',j.hours,'number','削減時間ではありません。')}${inputField('担当する役割','jobOwner',j.owner,'text','個人名ではなく役割名を推奨。')}</div><div class="field"><label for="jobCat">見直す方向（候補）</label><select id="jobCat" name="jobCat">${categories.map(([v,t])=>`<option value="${v}" ${j.cat===v?'selected':''}>${t}</option>`).join('')}</select></div>${textareaField('人間が確認すること','jobNote',j.note)}<div style="display:flex;justify-content:space-between;gap:9px;margin-top:22px">${id?btn('この仕事を削除','job-delete','danger','trash',`data-id="${E(id)}"`):'<span></span>'}<button class="btn btn-dark" type="submit">${I('check')}適用する</button></div></form>`)}
function getMaterialForm(){const f=$('#materialForm');if(!f)return clone(state.input);const d=new FormData(f),c=clone(state.input);for(const k of ['name','question','facts','unknown','rules','role'])c[k]=String(d.get(k)||'').trim();for(const k of ['employees','budget','training'])c[k]=String(d.get(k)||'').trim()===''?'':Number(d.get(k));c.scenario='custom';return c}
function exportText(record=null){const r=record?.result||current();if(!r)return '';const d=record?.decision||decision();return ['AI経営会議室｜人材・仕事再設計 判断準備書',`V${r.version} ／ ${formatTime(r.at)}`,'教材シミュレーション・API未接続','仮想ケースの条件分岐です。実在企業の採用判断やAI品質の検証ではありません。',!record&&stale()?'注意：旧条件の結果です。新しい入力では再実行が必要です。':'','',`会社：${r.input.name}`,`相談：${r.input.question}`,'','【現時点の整理】',r.heading,r.summary,'','【参照した材料】',...r.used.map(id=>`${id}：${evidence(r.input,id)}`),'','【各視点の教材例】',...r.experts.map((x,i)=>`${rolesFor(r.version)[i].title}\n${x.title}\n${x.body}\n判断が変わる条件：${x.change}`),'','【次に確認すること】',...r.next.map((x,i)=>`${i+1}．${x}`),'','【人間の判断】',d.choice||'未選択',`理由：${d.reason||'未入力'}`,'','【確認タスク】',...(d.todos||[]).map(t=>`${t.done?'確認済み':'未確認'}：${t.text} ／ 担当・確認先：${t.owner||'未設定'} ／ 期限：${t.date||'未設定'}`),'','見直し候補時間は削減時間ではありません。採用・処遇・法務・財務の最終判断は人間が行います。'].join('\n')}
function downloadFile(content,name,type='text/plain;charset=utf-8'){const blob=new Blob(['\ufeff'+content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
async function copyText(text){try{if(!navigator.clipboard)throw Error('unavailable');await navigator.clipboard.writeText(text);toast('記録をコピーしました。')}catch{modal('コピー用の記録',`<div class="field"><label for="copyArea">選択してコピーしてください</label><textarea id="copyArea" readonly style="min-height:330px">${E(text)}</textarea></div>`,btn('閉じる','modal-close','white'));setTimeout(()=>{const t=$('#copyArea');t.focus();t.select()},50)}}
function saveRecord(){if(!current()||stale())return toast('現在の材料で会議を再実行してください。');const d=decision();if(d.choice&&!d.reason.trim())return toast('判断を選択した場合は、理由も記入してください。');const r={id:'r-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),at:new Date().toISOString(),input:clone(current().input),version:state.version,result:clone(current()),decision:clone(d)};store.records.push(r);if(store.records.length>30)store.records=store.records.slice(-30);if(writeStore()){toast('この端末に会議記録を保存しました。');chrome()}}
function runTest(id){const t=tests.find(t=>t.id===id),key=state.version+'-'+id,pred=state.labPred[key];if(!pred)return toast('先に、期待する動作を選んでください。');const r=analyze(makeScenario(id),state.version);let actual;if(state.version===1)actual='general';else if(r.blocked)actual='hold';else if(r.zero)actual='constraint';else if(state.version===3&&r.bias)actual='compare';else actual='prepare';const pass=pred===actual;const detail=({general:'会社の条件を使わない、一般的な回答例が表示されます。V1では期待する確認がありません。',hold:'未確認の基本材料を表示し、採用の可否の断定を保留します。',constraint:'0万円を既知の制約として表示します。未入力として処理しません。',compare:'結論の追認ではなく、別案と確認事項を示す注意を表示します。',prepare:'入力した材料を使い、比較と確認事項を表示します。'})[actual];state.lab[key]={pass,pred,actual,detail,at:new Date().toISOString()};render()}
function curriculumDialog(){modal('本講座10回とのつながり',`<div class="curriculum">${curriculum.map((s,i)=>`<div><b>第${i+1}回</b>${s}</div>`).join('')}</div><div class="mini-timeline"><article><b>V1　粗い成果物を見て、不足を言葉にする</b><p>第6回：何が足りないかを、仕事依頼書へ。</p></article><article><b>V2　会社の材料と判断を、画面へ反映する</b><p>第3・4・5・7回：材料、基準、選択肢、制作。</p></article><article><b>V3　止まる条件・人間の判断・行動を残す</b><p>第7・8・9回：制作、模擬試験、他者利用。</p></article><article><b>検証ラボと会議記録</b><p>第8・10回：期待と結果を比べ、改善と応用の記録を残す。</p></article></div><div class="notice">${I('book')}<span>このデモで本講座を修了・資格認定したことにはなりません。本講座では自社の実在業務を本人が完成・現場試験・引き継ぎまで進めます。</span></div>`,btn('閉じる','modal-close','dark'),true)}
function scenarioApply(id){state.input=makeScenario(id);state.formDirty=false;closeModal();render();toast('講座用ケースを切り替えました。以前の結果は旧条件になります。')}

 'clear-confirm':()=>{store={records:[]};if(writeStore()){closeModal();render();toast('このアプリの記録と下書きを削除しました。')}},
 test:()=>runTest(b.dataset.test),
 'export-tests':()=>{const entries=Object.entries(state.lab);if(!entries.length)return toast('まず一つのケースを検証してください。');downloadFile(['AI経営会議室｜デモ検証記録','対象は条件分岐・表示。生成AIの品質・現場効果は未検証。',...entries.map(([k,r])=>`${k}：期待 ${r.pred} / 動作 ${r.actual} / ${r.pass?'一致':'差あり'}\n${r.detail}`)].join('\n\n'),'AI経営会議室_教材テスト記録.txt')},
 curriculum:curriculumDialog
 };if(actions[a])actions[a]();
});
document.addEventListener('submit',e=>{if(e.target.id==='materialForm'){e.preventDefault();const c=getMaterialForm(),err=validCase(c);if(err)return toast(err);if(!c.name)c.name='地域企業A社';state.input=c;state.formDirty=false;render();toast('材料を適用しました。会議を再実行すると反映されます。')}
 if(e.target.id==='jobForm'){e.preventDefault();const f=new FormData(e.target),h=num(f.get('jobHours')),name=String(f.get('jobName')||'').trim();if(!name)return toast('仕事内容を入力してください。');if(h===null||!Number.isFinite(h)||h<0||h>10000)return toast('業務時間を0〜10000の範囲で入力してください。');const old=f.get('jobId');const j={id:old||'W'+Date.now().toString().slice(-7),name:name.slice(0,200),hours:h,owner:String(f.get('jobOwner')||'担当未設定').trim().slice(0,100),cat:categories.some(c=>c[0]===f.get('jobCat'))?f.get('jobCat'):'human',note:String(f.get('jobNote')||'').slice(0,2000)};if(old){const i=state.input.jobs.findIndex(j=>j.id===old);if(i>=0)state.input.jobs[i]=j}else state.input.jobs.push(j);state.input.scenario='custom';closeModal();render();toast('仕事の内容を更新しました。')}
});
document.addEventListener('input',e=>{if(e.target.closest('#materialForm'))state.formDirty=true;if(e.target.id==='workSearch'){state.search=e.target.value;$('#workRows').innerHTML=workRows()}if(e.target.id==='decisionReason')decision().reason=e.target.value;if(e.target.dataset.todo!==undefined){const t=decision().todos[Number(e.target.dataset.todo)];if(t)t[e.target.dataset.prop]=e.target.dataset.prop==='done'?e.target.checked:e.target.value;}});
document.addEventListener('change',e=>{if(e.target.id==='presentNav')nav(e.target.value);if(e.target.dataset.test&&e.target.type==='radio')state.labPred[state.version+'-'+e.target.dataset.test]=e.target.value});
$('#scrim').addEventListener('click',()=>document.body.classList.remove('menu-open'));
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#overlay').hidden)closeModal();else document.body.classList.remove('menu-open')}
 if(e.key==='Tab'&&!$('#overlay').hidden){const f=$$('#overlay button:not(:disabled),#overlay input:not(:disabled),#overlay select:not(:disabled),#overlay textarea:not(:disabled)').filter(x=>x.type!=='hidden');const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){last?.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first?.focus();e.preventDefault()}}});
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(navs.some(n=>n[0]===page)&&page!==state.page)go(page)});
render();

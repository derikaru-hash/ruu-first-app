const findProduct=(s,id)=>s.products.find(p=>p.id===id);

function day(s,d){return s.days[d];}
function previousDate(d){return new Date(Date.parse(d+'T12:00:00+09:00')-86400000).toISOString().slice(0,10);}

 if(day(s,d).lock)return 'locked';

 const start=Date.parse(d+'T06:00:00+09:00'), end=Date.parse(d+'T'+s.settings.morningCutoff+':00+09:00');
 if(time<cut)return 'advance';
 if(time>=start&&time<end)return 'morning';
 return 'closed';
}
function remaining(s,d,id){
 const p=findProduct(s,id), mode=stage(s,d), os=active(s,d);
 if(!p||!['advance','morning'].includes(mode)||day(s,d).stopped)return 0;

function productCard(p){const n=UI.cart[p.id]||0,rem=remaining(S,UI.date,p.id);return `<article class="foodcard" data-product="${p.id}"><div class="foodimage ${p.tone}">${badge(esc(p.tag))}${foodArt(p)}<span class="tiny-label">メニューのイメージ</span></div><div class="foodbody"><h3>${esc(p.name)}</h3><p class="sub">${esc(p.sub)}</p><div class="foodmeta">${icon('leaf')} ${esc(p.supplier)}</div><div class="spread"><div class="price">${yen(p.price)}<small>仮価格</small></div>${n?`<div class="counter"><button data-action="minus" data-id="${p.id}" aria-label="${esc(p.name)}を減らす">${icon('minus')}</button><b>${n}</b><button data-action="plus" data-id="${p.id}" aria-label="${esc(p.name)}を増やす" ${n>=Math.min(3,rem)||countCart()>=5?'disabled':''}>${icon('plus')}</button></div>`:`<button class="addbtn" data-action="plus" data-id="${p.id}" aria-label="${esc(p.name)}を追加" ${rem<=0||countCart()>=5?'disabled':''}>${icon('plus')}</button>`}</div><div class="foodfoot"><span>${rem>0?`受付枠 あと${rem}食`:'受付終了・停止'}</span><button data-action="product" data-id="${p.id}">原材料・表示例</button></div></div></article>`;}
function cartView(){return `<aside class="cart-outer"><div class="cart"><div class="spread"><h2>予約内容</h2>${icon('lunch')}</div><p class="cartdate">${datefmt(UI.date)} のランチ</p><div class="field"><label for="class-select">受け取るクラス</label><select id="class-select" class="input" data-action="class">${CLASSES.map(c=>`<option ${UI.cls===c?'selected':''}>${c}</option>`).join('')}</select><small>モデル校・クラスはすべて仮設定です</small></div>${countCart()?Object.entries(UI.cart).filter(([,n])=>n>0).map(([id,n])=>{const p=findProduct(S,id);return `<div class="cartrow"><strong>${esc(p.name)}</strong><div class="spread"><div class="counter"><button data-action="minus" data-id="${id}" aria-label="予約内容から${esc(p.name)}を減らす">${icon('minus')}</button><b>${n}</b><button data-action="plus" data-id="${id}" aria-label="予約内容の${esc(p.name)}を増やす" ${n>=Math.min(3,remaining(S,UI.date,id))||countCart()>=5?'disabled':''}>${icon('plus')}</button></div><span class="small">${yen(p.price*n)}</span></div></div>`;}).join(''):`<div class="cart-empty">${icon('lunch')}<p>お好きなメニューの<br>「＋」を押して選んでください</p></div>`}<div class="carttotal"><span class="small">合計 <span class="muted">${countCart()}食</span></span><b>${yen(totalCart())}</b></div>${btn('予約内容を確認 '+icon('arrow'),'checkout','','class="wide"') .replace('class="btn "','class="btn wide"')}<p class="cartnote">価格はすべて仮設定。お支払いは現金の想定です。ここでは請求・決済・実際の予約は発生しません。</p></div><div class="helpercard"><h3>${icon('leaf')} 必要な日だけ、気軽に。</h3>前日までに予約して、クラスで受け取り。学校・家庭・地域をつなぐ、新しいランチの仕組みです。<hr class="divider">個別のアレルギー対応が必要な場合は、実運用では注文前に事業者への確認が必要です。</div></aside>`;}

function ticketsView(){
 const os=S.orders.filter(o=>o.owner==='demo-user').slice().reverse();
 return head('MY RESERVATIONS','予約と、受け取りの準備。','デモ利用者の予約だけを表示しています。受取コードは実際の学校では使えません。',btn(icon('plus')+'ランチを予約','nav','','data-page="menu"'))+(os.length?`<div class="stack">${os.map(o=>{const r=day(S,o.date).receipts[o.cls],done=r?.complete,canCancel=stage(S,o.date)===o.slot&&!day(S,o.date).lock&&o.status==='reserved',feedback=S.feedback.find(f=>f.orderId===o.id);return `<article class="ticket ${o.status==='cancelled'?'cancelled':''}"><div class="tickethead"><div class="row gap8">${icon('calendar')}<strong>${datefmt(o.date)}</strong></div>${badge(o.status==='cancelled'?'取消済み':done?'クラス受取 確認済み':'デモ予約済み',o.status==='cancelled'?'gray':'')}</div><div class="ticketbody"><div><div class="row gap8">${badge(esc(o.cls),'outline')}<span class="small muted">${o.slot==='advance'?'前日予約':'当日朝の予約'}</span></div><div class="ticketitems">${o.items.map(i=>`<div><span>${esc(i.name)} × ${i.qty}</span><b>${yen(i.price*i.qty)}</b></div>`).join('')}</div><div class="statline"><span>予約金額</span><b>${yen(amount(o))}</b></div><p class="tiny muted mt8">${cashText(o.cash)}<br>受け渡し場所・消費期限は、実運用時に学校・事業者が案内します。</p></div><div class="ticketcode"><span class="tiny muted">説明用 受取コード</span><b>${esc(o.code)}</b><span class="tiny muted">QR・本人認証は未接続</span></div></div><div class="ticketfooter"><span class="tiny muted">${o.status==='cancelled'?'取り消した注文は製造数から除外されます。':done?'クラスでの数量照合を記録済みです。':'締切後の取消・変更は運営担当に確認する想定です。'}</span><div class="row gap8 wrap">${canCancel?btn('予約を取り消す','cancel','ghost sm',`data-id="${esc(o.id)}"`):''}${done&&o.status==='reserved'?btn(feedback?'回答を編集':'ランチの感想を記録','feedback','secondary sm',`data-id="${esc(o.id)}"`):''}${btn(icon('print')+'印刷','print','ghost sm')}</div></div></article>`;}).join('')}</div>`:`<div class="empty">${icon('ticket')}<h2>はじめての予約をしてみよう。</h2><p>メニューを選ぶと、ここに予約内容と<br>説明用の受取コードが表示されます。</p>${btn('ランチを選ぶ '+icon('arrow'),'nav','','data-page="menu"')}</div>`);
}
function kpi(title,value,unit,foot,ic,highlight=false){return `<div class="kpi ${highlight?'highlight':''}"><div class="kpi-icon">${icon(ic)}</div><div class="kpi-label">${title}</div><div class="kpi-value">${value}<small>${unit}</small></div><p class="kpi-foot">${foot}</p></div>`;}
function bars(os){const max=Math.max(1,...S.products.map(p=>countProduct(os,p.id)));return `<div class="data-list">${S.products.map(p=>{const n=countProduct(os,p.id);return `<div class="bar-row"><span>${esc(p.name.replace('弁当',''))}</span><div class="bar"><span style="width:${n/max*100}%"></span></div><b>${n}食</b></div>`;}).join('')}</div>`;}
function workflowView(){const x=day(S,UI.date),v=[Boolean(x.lock),x.packed,x.delivered,CLASSES.filter(c=>active(S,UI.date).some(o=>o.cls===c)).every(c=>x.receipts[c]?.complete)&&active(S,UI.date).length>0];return `<div class="stepflow">${[['予約数を確定','製造の基準をそろえる'],['製造・仕分け','個包装とクラスラベル'],['学校へ納品','事業者が配送'],['クラスで受取','数量を照合して記録']].map(([t,d],i)=>`<div class="step ${v[i]?'done':''}"><div class="stepnum">${v[i]?icon('check'):'0'+(i+1)}</div><strong>${t}</strong><p>${d}</p></div>`).join('')}</div>`;}
function dashboardView(){
 const os=active(S,UI.date),x=day(S,UI.date),cs=CLASSES.filter(c=>os.some(o=>o.cls===c));const received=cs.filter(c=>x.receipts[c]?.complete).length;
 const cash=sum(S.orders.filter(o=>o.date===UI.date&&['received','refund_pending'].includes(o.cash)),amount);
 return `${head('OPERATIONS OVERVIEW','予約を、届くランチへ。','確定した予約データを、製造・配送・受け渡しへつなぎます。',btn(icon('download')+'日別集計CSV','csv','secondary','data-kind="aggregate"'))}${dates()}<div class="kpis">${kpi('予約食数',nf(sum(os,qty)),'食','取消済みは除外','lunch',true)}${kpi('予約金額',yen(sum(os,amount)),'','売上・入金ではありません','cash')}${kpi('現金受領の記録残高',yen(cash),'','返金確認待ちを含む・仮記録','ticket')}${kpi('クラス受取 確認済み',received+'/'+cs.length,'組','数量一致のクラスだけを集計','users')}</div><div class="panel"><div class="sectionhead"><h2>お昼までの進み具合</h2>${modeLabel()}</div>${workflowView()}<div class="spread wrap"><p class="small muted">${x.stopped?'安全確認のため全工程を停止中です。':x.lock?'確定した製造数：'+x.lock.quantity+'食。需要予測による上乗せはしていません。':'まず予約を集め、朝の締切後に人が製造数を確定します。'}</p>${btn('製造・仕分けへ '+icon('arrow'),'nav','','data-page="production"')}</div></div><div class="twocol mt"><div class="panel"><div class="sectionhead"><h2>メニュー別の予約</h2><span class="small muted">${sum(os,qty)}食</span></div>${bars(os)}<p class="tiny muted mt">画面で追加した予約は、ここへすぐに反映されます。</p></div><div class="panel"><div class="sectionhead"><h2>次に確認すること</h2>${icon('shield')}</div><div class="feature-list"><div>${icon(x.lock?'check':'clock')}<span>${x.lock?'製造数は人の確認により確定済み':'当日朝 '+esc(S.settings.morningCutoff)+' までの予約を集約'}</span></div><div>${icon(allChecks(S,UI.date)?'check':'info')}<span>原材料・ラベル・保存配送・連絡手順を確認</span></div><div>${icon('users')}<span>現金記録は事業者・成人担当が入力</span></div><div>${icon('flask')}<span>生徒には集計と改善企画の画面を提供</span></div></div><div class="mt">${callout('「役割の切替」は画面のプレビューです。本人認証やアクセス権限の制御ではありません。','info')}</div></div></div><div class="panel mt"><div class="sectionhead"><h2>クラス別の仕分け表</h2>${btn('受け取り画面へ','nav','ghost sm','data-page="delivery"')}</div>${classTable(os)}</div>`;
}
function classTable(os){return `<div class="table-wrap"><table><thead><tr><th>クラス</th>${S.products.map(p=>`<th class="num">${esc(p.name.replace('弁当',''))}</th>`).join('')}<th class="num">合計</th></tr></thead><tbody>${CLASSES.map(c=>{const rows=os.filter(o=>o.cls===c);return `<tr><td>${c}</td>${S.products.map(p=>`<td class="num">${countProduct(rows,p.id)||'—'}</td>`).join('')}<td class="num"><b>${sum(rows,qty)}食</b></td></tr>`;}).join('')}<tr><td><b>合計</b></td>${S.products.map(p=>`<td class="num"><b>${countProduct(os,p.id)}</b></td>`).join('')}<td class="num"><b>${sum(os,qty)}食</b></td></tr></tbody></table></div>`;}
function checksView(){const x=day(S,UI.date);return `<div class="checklist">${Object.entries(CHECKS).map(([k,t])=>`<div class="checkitem"><label class="checkbox"><input type="checkbox" data-action="check" data-key="${k}" ${x.checks[k]?'checked':''}><span>${esc(t)}<br><small class="muted">デモの手順確認。実際の検査・安全の証明ではありません。</small></span></label></div>`).join('')}</div>`;}
function productionView(){const os=active(S,UI.date),x=day(S,UI.date);return `${head('MAKE ONLY WHAT IS NEEDED','必要な分を、ていねいに。','予約確定数を基準に製造し、クラス別に仕分けます。予測値は製造指示に使いません。',btn(icon('download')+'製造指示CSV','csv','secondary','data-kind="production"'))}${dates()}${workflowView()}<div class="equalcol"><div class="panel"><div class="sectionhead"><h2>01　製造する数を確認</h2>${badge(x.lock?'確定済み':'集計中',x.lock?'':'amber')}</div><div class="table-wrap"><table><thead><tr><th>メニュー</th><th class="num">前日</th><th class="num">当日朝</th><th class="num">合計</th></tr></thead><tbody>${S.products.map(p=>`<tr><td>${esc(p.name)}</td><td class="num">${countProduct(os.filter(o=>o.slot==='advance'),p.id)}</td><td class="num">${countProduct(os.filter(o=>o.slot==='morning'),p.id)}</td><td class="num"><b>${countProduct(os,p.id)}食</b></td></tr>`).join('')}</tbody></table></div><div class="statline mt8"><span>製造の基準となる予約</span><b>${sum(os,qty)}食</b></div><p class="tiny muted mt8">受付終了 → 安全確認 → 最終確認者を記録、の順に進みます。確定後は予約を追加・取消できません。</p><div class="mt">${btn(x.lock?icon('check')+'製造数 確定済み':'最終確認して、製造数を確定','lock','','class="wide" '+(x.lock?'disabled':'')).replace('class="btn "','class="btn wide"')}</div>${x.lock?`<p class="tiny muted mt8">確認者：${esc(x.lock.actor)} ／ ${timefmt(x.lock.at)}</p>`:''}</div><div class="panel"><div class="sectionhead"><h2>02　安全項目を確認</h2><span class="small muted">${Object.values(x.checks).filter(Boolean).length}/4</span></div>${checksView()}</div></div><div class="panel mt"><div class="sectionhead"><h2>03　クラスごとに仕分け</h2>${btn(icon('print')+'表を印刷','print','secondary sm')}</div>${classTable(os)}<div class="row wrap mt">${btn(x.packed?icon('check')+'仕分け 記録済み':'個包装・仕分け完了を記録','progress','','data-step="pack" '+(!x.lock||x.packed||x.stopped||!allChecks(S,UI.date)?'disabled':''))}${btn(x.delivered?icon('check')+'納品 記録済み':icon('truck')+'学校への納品を記録','progress','secondary','data-step="deliver" '+(!x.packed||x.delivered||x.stopped||!allChecks(S,UI.date)?'disabled':''))}${btn('クラスで受け取る '+icon('arrow'),'nav','ghost','data-page="delivery"')}</div><p class="tiny muted mt8">実際の製造・配送依頼は送信されません。個包装ラベルの消費期限・保存方法などは事業者が確定するため、デモでは発行しません。</p></div>`;}
function deliveryView(){const os=active(S,UI.date),x=day(S,UI.date),colors=['#85a777','#8aa4bf','#caaa68','#b58c8d','#9a92ad','#97a599'];return `${head('CLASSROOM HANDOVER','並ぶ時間を、楽しむ時間へ。','代表受取を想定し、クラスの数量とラベルを照合します。個人の氏名は表示しません。',btn(icon('download')+'クラス別CSV','csv','secondary','data-kind="classes"'))}${dates()}${!x.delivered?callout('先に「製造・仕分け」で製造数の確定、仕分け、学校への納品を記録してください。','amber','truck'):x.stopped?callout('安全確認のため受け渡しを停止しています。','red','shield'):callout('納品記録あり。実物のラベルと食数を照合した想定で、受取数を入力してください。','','check')}<div class="receiptgrid mt">${CLASSES.map((c,i)=>{const rows=os.filter(o=>o.cls===c),n=sum(rows,qty),r=x.receipts[c];return `<article class="classcard" style="--class-color:${colors[i]}"><div class="spread"><h3>${c}</h3>${badge(r?.complete?'照合済み':r?'差異あり':'未確認',r?.complete?'':r?'red':'gray')}</div><div class="count">${n}<small>食を受け取り</small></div><div class="items">${S.products.filter(p=>countProduct(rows,p.id)).map(p=>`<div><span>${esc(p.name.replace('弁当',''))}</span><b>${countProduct(rows,p.id)}</b></div>`).join('')||'このクラスの予約はありません'}</div>${r?`<p class="tiny ${r.complete?'muted':''}">${r.quantity}/${r.expected}食・${r.minutes}分 ${r.complete?'記録済み':'不足分は未完了です'}</p>`:''}<div class="mt8">${btn(r?.complete?icon('check')+'受け取り確認済み':'数量を照合して記録','receive',r?.complete?'secondary wide':'wide',`data-class="${c}" ${!n||!x.delivered||x.stopped||r?.complete||!allChecks(S,UI.date)?'disabled':''}`)}</div></article>`;}).join('')}</div><div class="panel mt"><div class="sectionhead"><h2>実施後の記録</h2>${x.report?badge('この日の実績あり'):badge('未記録','gray')}</div><p class="small muted">廃棄と未配布を区別して残します。未配布の食事を、自動的に廃棄扱いにはしません。</p><div class="row wrap mt">${btn('廃棄・受け渡し時間を記録','record-day','secondary',!x.delivered||x.stopped?'disabled':'')}${btn('集計から学ぶ '+icon('arrow'),'nav','ghost','data-page="lab"')}</div>${x.report?`<p class="small muted mt8">製造 ${x.report.produced}食 ／ クラス受取 ${x.report.distributed}食 ／ 廃棄 ${x.report.waste}食 ／ その他未配布 ${x.report.produced-x.report.distributed-x.report.waste}食</p>`:''}</div>`;}
function cashText(c){return ({unpaid:'現金：受領未記録',received:'現金：受領記録あり（仮）',refund_pending:'取消に伴う返金確認待ち',refunded:'現金：返金記録あり（仮）'})[c];}
function cashView(){let os=S.orders.filter(o=>o.date===UI.date),rows=os.filter(o=>UI.cashFilter==='all'||o.cash===UI.cashFilter);if(UI.cashSearch)rows=rows.filter(o=>(o.code+' '+o.cls).includes(UI.cashSearch));const unpaid=os.filter(o=>o.status==='reserved'&&o.cash==='unpaid'),pending=os.filter(o=>o.cash==='refund_pending');return `${head('CASH RECORDS · ADULT STAFF ONLY','現金の記録は、大人の担当で。','資料11ページの現金運用を仮置き。生徒が集金する流れは設けていません。',btn(icon('download')+'受領記録CSV','csv','secondary','data-kind="cash"'))}${dates()}${callout('ここで扱うのは架空の受領記録です。金銭の移動・会計システムへの登録はありません。支払場所や時期、担当者は実証前に協議が必要です。','amber','cash')}<div class="kpis mt">${kpi('未受領の予約',nf(unpaid.length),'件','取消済みを除外','ticket')}${kpi('未受領の予約金額',yen(sum(unpaid,amount)),'','予約金額の合計','cash')}${kpi('返金確認待ち',nf(pending.length),'件','取消済みの受領記録','history')}${kpi('記録担当','成人','','本番の本人認証は未実装','shield')}</div><div class="panel"><div class="sectionhead wrap"><div class="row wrap gap8">${[['unpaid','未受領'],['received','受領記録あり'],['refund_pending','返金確認待ち'],['all','すべて']].map(([v,t])=>`<button class="quickchip ${UI.cashFilter===v?'active':''}" data-action="cash-filter" data-value="${v}">${t}</button>`).join('')}</div><form data-form="cash-search" class="row gap8"><input class="input" name="query" value="${esc(UI.cashSearch)}" maxlength="30" placeholder="予約コード・クラスで検索" aria-label="予約コード・クラスで検索" style="max-width:200px">${btn('検索','cash-search','secondary sm','type="submit"').replace('type="button"','type="submit"')}</form></div><div class="table-wrap"><table><thead><tr><th>予約コード</th><th>クラス</th><th class="num">金額</th><th>状態</th><th>記録</th></tr></thead><tbody>${rows.map(o=>`<tr><td class="mono">${esc(o.code)}<br><span class="muted">${o.status==='cancelled'?'取消済み':qty(o)+'食'}</span></td><td>${esc(o.cls)}</td><td class="num">${yen(amount(o))}</td><td><span class="small">${cashText(o.cash)}</span></td><td>${o.cash==='unpaid'&&o.status==='reserved'?btn('受領を記録','cash-record','secondary sm',`data-id="${esc(o.id)}"`):o.cash==='refund_pending'?btn('返金を記録','cash-record','secondary sm',`data-id="${esc(o.id)}" data-refund="1"`):`<span class="tiny muted">${esc(o.cashActor||'—')}<br>${timefmt(o.cashAt)}</span>`}</td></tr>`).join('')||'<tr><td colspan="5">該当する記録はありません。</td></tr>'}</tbody></table></div><p class="tiny muted mt8">金額は予約時の価格を保持します。商品設定を変更しても、既存予約の金額は書き換えません。</p></div>`;}
function chart(reports){const w=600,h=210,left=32,right=570,top=18,bottom=174,max=Math.max(...reports.map(r=>r.produced),1)*1.1;const xx=i=>left+i*(right-left)/Math.max(reports.length-1,1),yy=v=>bottom-v/max*(bottom-top);const line=k=>reports.map((r,i)=>`${xx(i)},${yy(r[k])}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="架空の製造数と受取食数の推移。実測ではありません。">${[0,.5,1].map(f=>`<line x1="${left}" y1="${bottom-f*(bottom-top)}" x2="${right}" y2="${bottom-f*(bottom-top)}" stroke="#e5ebdf" stroke-dasharray="3 4"/><text x="2" y="${bottom-f*(bottom-top)+4}">${Math.round(max*f)}</text>`).join('')}<polyline points="${line('produced')}" fill="none" stroke="#b7b894" stroke-width="2" stroke-dasharray="5 4"/><polyline points="${line('distributed')}" fill="none" stroke="#3c7050" stroke-width="3"/>${reports.map((r,i)=>`<circle cx="${xx(i)}" cy="${yy(r.distributed)}" r="4" fill="#3c7050"/><text text-anchor="middle" x="${xx(i)}" y="201">${r.date.slice(5).replace('-','/')}</text>`).join('')}</svg>`;}
function labView(){const m=metrics(S),os=active(S,UI.date),rank=S.products.map(p=>({p,n:countProduct(os,p.id)})).sort((a,b)=>b.n-a.n),recent=m.reports.slice(-3),reference=Math.round(sum(recent,r=>r.distributed)/Math.max(1,recent.length));return `${head('LEARN, THINK, IMPROVE','おいしいデータで、学ぼう。','生徒は利用者であると同時に、分析・商品企画・改善の実践者です。',btn(icon('plus')+'改善企画をつくる','new-idea',''))}${callout('6日分の架空実績と、この端末で追加した実績を集計しています。実際の学校・事業の成績ではありません。生徒向けのCSVに個人別予約や金銭記録は含みません。','info','flask')}<div class="kpis mt">${kpi('予約販売比率',m.ratio===null?'—':m.ratio.toFixed(1),'%','構想目標：90%以上','ticket')}${kpi('利用者満足度',m.satisfaction===null?'—':m.satisfaction.toFixed(1),'%',m.responses+'回答中 '+m.satisfied+'回答が満足','users',true)}${kpi('廃棄率',m.wasteRate===null?'—':m.wasteRate.toFixed(1),'%','構想目標：3%以下','leaf')}${kpi('平均受け渡し時間',m.minutes===null?'—':m.minutes.toFixed(1),'分','構想目標：10〜15分','clock')}</div><div class="twocol"><div class="panel"><div class="sectionhead"><h2>つくった数と、受け取った数</h2>${badge('説明用データ','gray')}</div>${chart(m.reports)}<div class="legend"><span><i style="background:#3c7050"></i>クラス受取食数</span><span><i style="background:#b7b894"></i>製造食数</span></div><p class="tiny muted mt8">廃棄率＝廃棄数 ÷ 製造数。受取完了と売上・入金は別の指標です。</p>${btn(icon('download')+'集計データをCSVで保存','csv','ghost sm','data-kind="learning"')}</div><div class="panel"><div class="sectionhead"><h2>数字から、次の問いへ</h2>${icon('flask')}</div><div class="callout"><div><span class="tiny muted">集計ルールによるヒント</span><h3 class="mt8">${rank[0]?.n?esc(rank[0].p.name)+'が'+rank[0].n+'食。なぜ選ばれた？':'まずは予約データを集めよう。'}</h3><p class="small mt8">注文数だけでは理由は分かりません。価格、量、味、受け取りやすさを、アンケートで確かめてみましょう。</p></div></div><div class="mt">${btn('この問いを企画にする '+icon('arrow'),'hint-idea','secondary wide')}</div><p class="tiny muted mt8">文章は固定ルールから表示。生成AIへの接続はありません。</p></div></div><div class="equalcol mt"><div class="panel"><div class="sectionhead"><h2>需要予測の、その前に。</h2>${badge('AI 未接続','gray')}</div><p class="small muted">直近3実施日の受取数の平均を、単純な参考値として表示します。予測精度の検証はしていません。</p><div class="ring-wrap"><div class="ring" style="--percent:100%"><div><strong>${reference}食</strong><small>単純平均・参考値</small></div></div><div><div class="small muted">${datefmt(UI.date)} の確定予約</div><div class="price">${sum(os,qty)}<small>食</small></div><p class="tiny muted mt8">製造基準はこちら。<br>参考値から自動発注しません。</p></div></div>${callout('AI需要予測・配送最適化は、資料の段階展開にある将来機能です。実装・実証は別途必要です。','info')}</div><div class="panel"><div class="sectionhead"><h2>アンケートの記録</h2>${badge(S.feedback.length+'回答')}</div>${S.feedback.length?S.feedback.map(f=>`<div class="idea"><div class="spread"><span class="small">満足度 ${f.rating}/5</span>${badge('量：'+esc(f.size),'gray')}</div><p class="mt8">${esc(f.comment)||'コメントなし'}</p><span class="tiny muted">${datefmt(f.date)} のデモ回答</span></div>`).join(''):`<div class="empty" style="padding:30px 15px;border:0"><p>まだ、この端末での回答はありません。<br>予約 → クラス受取 →「予約・受取票」から<br>感想を記録すると、ここに反映されます。</p></div>`}<p class="tiny muted mt">満足度は5段階中4・5を「満足」とする仮の集計定義です。実証前に定義を確認してください。</p></div></div><div class="panel mt"><div class="sectionhead"><h2>生徒の改善ボード</h2>${btn(icon('plus')+'企画を追加','new-idea','ghost sm')}</div><div class="equalcol">${S.ideas.map(i=>`<article class="idea"><div class="spread">${badge(({draft:'下書き',review:'教職員の確認待ち',approved:'検証計画を承認',hold:'保留'})[i.status],i.status==='review'?'amber':i.status==='approved'?'':'gray')}${btn('編集','edit-idea','ghost sm',`data-id="${esc(i.id)}"`)}</div><h3>${esc(i.title)}</h3><span class="idea-label">根拠・気づき</span><p>${esc(i.evidence)}</p><span class="idea-label">仮説</span><p>${esc(i.hypothesis)}</p><span class="idea-label">小さく試すこと</span><p>${esc(i.test)}</p><div class="row wrap mt8">${i.status==='draft'?btn('確認へ回す','idea-status','secondary sm',`data-id="${esc(i.id)}" data-status="review"`):i.status==='review'?btn('教職員の確認を記録','review-idea','secondary sm',`data-id="${esc(i.id)}"`):''}</div></article>`).join('')}</div><p class="tiny muted mt">承認はデモ上の記録だけです。実際のメニュー変更・発注・広報は自動実行しません。構想の教育指標は「学期1回以上の分析・改善報告」です。</p></div>`;}
function safetyView(){const x=day(S,UI.date);return `${head('SAFETY & RESPONSIBILITY','安心は、人の確認から。','食品・個人情報の重大事故ゼロを前提に、責任と止める手順を明確にします。')}${dates()}<div class="safetyhero ${x.stopped?'stop':''}"><div>${badge(x.stopped?'この実施日は停止中':'通常のデモ状態',x.stopped?'red':'')}<h2>${x.stopped?'確認が終わるまで、進めません。':'迷ったときに、止められる仕組み。'}</h2><p>${x.stopped?'停止理由：'+esc(x.reason):'停止すると、この日の新規予約・製造の進行・クラス受け取りをブロックします。外部への緊急連絡は自動送信しません。'}</p></div>${btn(x.stopped?'確認して再開する':'この日の受付・受渡を停止','safety-toggle',x.stopped?'secondary':'danger')}</div><div class="equalcol"><div class="panel"><div class="sectionhead"><h2>安全確認チェック</h2><span class="small muted">${Object.values(x.checks).filter(Boolean).length}/4</span></div>${checksView()}<p class="tiny muted mt">停止すると確認は解除されます。再開には4項目の再確認と成人担当者の記録が必要です。</p></div><div class="panel"><h2>もし、問題が起きたら</h2><div class="feature-list mt"><div>${icon('shield')}<span>提供・受け渡しを止める。自己判断で再開しない。</span></div><div>${icon('info')}<span>学校・事業者・運営責任者に連絡する。連絡先と対応手順は本運用前に登録する。</span></div><div>${icon('package')}<span>対象の商品・ロット・時刻など、確認に必要な記録を保全する。</span></div><div>${icon('check')}<span>責任者の確認を受けて、再開可否を判断する。</span></div></div><div class="mt">${callout('この画面は資料10ページの方針を操作手順にした仮案です。食品安全やアレルギーの適合判定は行いません。正式な事故対応マニュアルではありません。','amber')}</div></div></div><div class="panel mt"><h2>役割と責任の切り分け</h2><div class="table-wrap mt"><table class="source-table"><thead><tr><th>担当</th><th>担うこと</th><th>担わせないこと</th></tr></thead><tbody><tr><td>生徒チーム</td><td>集計データの分析、商品企画、広報・改善案</td><td>現金回収、衛生・契約・事故対応の最終判断</td></tr><tr><td>地域事業者</td><td>製造・個包装・配送、衛生・金銭・事故対応の責任</td><td>未確認の表示やAI提案に基づく無承認の変更</td></tr><tr><td>学校・運営</td><td>校内の受渡手順、事業者との確認、利用環境の調整</td><td>初年度の校内調理・再加熱・小分け</td></tr></tbody></table></div><p class="tiny muted mt8">氏名・連絡先・健康情報・支援制度の利用状況はデモに入力しないでください。役割切替は認証ではなく、本番ではサーバー側の権限管理が必要です。</p></div>`;}
function rulesView(){return `${head('PILOT DESIGN & SETTINGS','小さく始めて、数字で育てる。','構想資料の初年度モデルをもとに、実証前の未確定事項も見える形にしています。')}${callout('本画面は説明・合意形成のためのデモです。株式会社Ironの正式な受注システムや、都城市・学校の公式サービスではありません。','info')}<div class="equalcol mt"><div class="panel"><h2>実証の基本条件</h2><div class="statline mt8"><span>対象</span><b>モデル校 1校</b></div><div class="statline"><span>実施頻度</span><b>週2〜3日</b></div><div class="statline"><span>主力メニュー</span><b>3〜5品（デモは5品）</b></div><div class="statline"><span>実証期間</span><b>1学期程度</b></div><div class="statline"><span>受け渡し</span><b>クラス別一括</b></div><p class="tiny muted mt">出典：添付構想資料 7・8・11ページ。日付・クラス・対象人数・価格は、このデモの仮設定です。</p></div><div class="panel"><h2>デモ設定</h2><form data-form="settings" class="mt"><div class="fieldgrid"><div class="field"><label for="cutoff">前日締切（仮）</label><input id="cutoff" class="input" name="advanceCutoff" type="time" value="${esc(S.settings.advanceCutoff)}" min="12:00" max="23:00" required></div><div class="field"><label for="morning-cutoff">当日朝締切（仮）</label><input id="morning-cutoff" class="input" name="morningCutoff" type="time" value="${esc(S.settings.morningCutoff)}" min="06:01" max="10:00" required></div></div><div class="field"><label for="target">対象人数（仮）</label><input class="input" id="target" name="targetStudents" type="number" min="1" max="10000" value="${S.settings.targetStudents}" required><small>資料に人数指定はありません。現段階では参考設定で、利用率の分母には使っていません。</small></div><button class="btn secondary" type="submit">仮設定を保存</button><p class="tiny muted mt8">製造確定後の締切変更はできません。確定済みデータは初期化せず残します。</p></form></div></div><div class="panel mt"><div class="sectionhead"><h2>商品設定</h2>${badge('すべて仮価格','amber')}</div><div class="table-wrap"><table><thead><tr><th>商品</th><th class="num">仮価格</th><th class="num">前日枠</th><th class="num">朝の限定枠</th><th>操作</th></tr></thead><tbody>${S.products.map(p=>`<tr><td>${esc(p.name)}</td><td class="num">${yen(p.price)}</td><td class="num">${p.capacity}</td><td class="num">${p.morningCapacity}</td><td>${btn('仮設定を編集','edit-product','ghost sm',`data-id="${p.id}"`)}</td></tr>`).join('')}</tbody></table></div><p class="tiny muted mt8">価格変更は次の予約から適用します。受付枠は既存の予約数未満に減らせません。正式な原材料・アレルゲン情報は事業者が管理するため、このデモでは編集・認証しません。</p></div><div class="panel mt"><h2>構想と、今回の実装範囲</h2><div class="table-wrap mt"><table class="source-table"><thead><tr><th>構想資料</th><th>今回操作できること</th><th>本運用までに必要なこと</th></tr></thead><tbody><tr><td>5ページ<br>予約〜集計〜配布</td><td>Webで予約、商品・クラス別集計、製造確定、受取記録</td><td>LINE連携、共通データベース、実際の通知・発注</td></tr><tr><td>7・11ページ<br>前日締切＋朝の限定枠</td><td>デモ時計で締切・上限・取消期限を制御</td><td>正式な締切、実施日、価格、キャンセル条件</td></tr><tr><td>10ページ<br>安全・権限・責任</td><td>チェックリスト、停止・再開、最終確認者の仮記録</td><td>本人認証、権限、同意、保存期間、監査、事故対応</td></tr><tr><td>11ページ／4・7・8・13ページ<br>現金／キャッシュレス構想</td><td>11ページの「現金」を仮置きし、成人の受領・返金記録を用意</td><td>資料内に複数の記載があるため決済方針の最終確認。決済・返金APIは未接続</td></tr><tr><td>9・12ページ<br>予測・KPI・学び</td><td>架空実績の集計、単純平均、回答、改善企画と確認</td><td>実データでの検証、AI需要予測、配送最適化</td></tr></tbody></table></div></div><div class="equalcol mt"><div class="panel"><h2>データの持ち出し・復元</h2><p class="small muted mt8">同じブラウザに保存します。ほかの端末や、URLを受け取った相手とは同期しません。バックアップにも個人情報を入れないでください。</p><div class="row wrap mt">${btn(icon('download')+'JSONバックアップ','backup','secondary')}${btn('JSONから復元','import','secondary')}</div><p class="tiny muted mt8">ブラウザの履歴・サイトデータを削除すると、デモの保存内容も失われます。形式と数量の整合性を確認してから復元します。</p></div><div class="panel"><h2>体験を最初からやり直す</h2><p class="small muted mt8">このアプリのデモデータだけを初期化します。他のアプリの保存内容は変更しません。</p><div class="row wrap mt">${btn('デモデータを初期化','reset','danger')}${btn(icon('history')+'操作履歴','audit','ghost')}</div><p class="tiny muted mt8">保存状態：${memoryOnly?'この画面内のみ（端末保存不可）':saveBlocked?'読み込みエラー・保存停止':'このブラウザに保存'} ／ バージョン ${VERSION}</p></div></div><div class="panel mt"><h2>原資料にない仮設定</h2><p class="small muted mt8">モデル校・クラス、2026年9月の操作日程、価格、受付上限、締切時刻、対象人数、受取コード、サンプル注文66食、過去6日の実績、担当名、アンケートの満足判定、確認・承認の画面手順は、操作体験のために追加した仮設定です。正式な実績・提供条件・参画事業者の合意を示すものではありません。</p><p class="small muted mt8">初年度に行わないこと：多数メニュー、大量在庫、校内調理・再加熱・小分け、生徒による現金回収、全校一斉導入。軽食・飲料の予約画面は、このデモには含めていません。</p><hr class="divider"><p class="tiny muted">原資料：株式会社Iron「都城市スマート・スクールフードプラットフォーム構想」全13ページ（ユーザー提供）。表紙の弁当写真は原資料掲載のイメージです。</p></div>`;}
function render(){
 document.getElementById('sidebar').innerHTML=`<a class="brand" href="#" data-action="nav" data-page="menu"><span class="brandmark">${icon('leaf')}</span><span class="brandname">スクールフード<span>MIYAKONOJO · LOCAL LUNCH</span></span></a><div class="eyebrow" style="padding:0 14px">EXPERIENCE THE PILOT</div><nav aria-label="メインメニュー">${NAV.map(([id,ic,label],i)=>`${i===0?'<div class="navgroup">ランチを楽しむ</div>':i===2?'<div class="navgroup">届ける・学ぶ</div>':i===7?'<div class="navgroup">実証の基盤</div>':''}<button class="nav-item ${UI.page===id?'active':''}" data-action="nav" data-page="${id}" ${UI.page===id?'aria-current="page"':''}>${icon(ic)}${label}</button>`).join('')}</nav><div class="sidefoot"><div class="phasecard"><div class="spread"><span class="eyebrow">PILOT PHASE</span>${badge('01','outline')}</div><strong>ひとつの学校から、地域へ。</strong><p>モデル校1校・主力5品で体験</p><div class="progressbar mt8"><span style="width:33%"></span></div></div><p class="credit">都城市スマート・スクールフード構想<br>株式会社Iron 提供資料をもとに制作<br>非公式・説明用デモ v${VERSION}</p></div>`;
 document.getElementById('sidebar').classList.toggle('open',UI.menuOpen);document.getElementById('navbackdrop').hidden=!UI.menuOpen;
 document.getElementById('topbar').innerHTML=`<div class="row gap8"><button class="icon-btn mobile-menu" data-action="toggle-menu" aria-label="メニューを開く" aria-expanded="${UI.menuOpen}">${icon('menu')}</button><div class="topcrumb">${icon('home')}<span class="optional">ワークスペース ／ </span><strong>モデル校（架空）</strong>${badge('実証デモ','outline')}</div></div><div class="topactions"><label class="role-label tiny muted" for="role-select">画面プレビュー</label><select id="role-select" class="mode-select" data-action="role" aria-label="役割の画面プレビュー・認証ではありません">${[['user','利用者'],['operator','運営・事業者'],['school','学校・クラス'],['student','生徒の分析チーム']].map(([v,t])=>`<option value="${v}" ${UI.role===v?'selected':''}>${t}</option>`).join('')}</select><button class="icon-btn" data-action="audit" aria-label="操作履歴を開く">${icon('history')}</button><div class="avatar" title="デモアカウント">DEMO</div></div>`;
 document.getElementById('demo-strip').innerHTML=`<div class="row gap8">${icon('info')}<span>操作体験デモ｜予約・決済・通知は実行されません。実際の個人情報は入力しないでください。</span></div><label class="clockchip">${icon('clock')}<span>デモ時計</span><select data-action="clock" aria-label="デモ時計を切り替える">${[['advance','9/17 15:00 前日受付'],['morning','9/18 07:30 当日朝'],['closed','9/18 08:30 締切後'],['lunch','9/18 12:15 昼休み']].map(([v,t])=>`<option value="${v}" ${S.clock===v?'selected':''}>${t}</option>`).join('')}</select></label>`;
 const warning=document.getElementById('storage-warning');warning.textContent=storageWarning;warning.hidden=!storageWarning;
 const views={menu:menuView,tickets:ticketsView,dashboard:dashboardView,production:productionView,delivery:deliveryView,cash:cashView,lab:labView,safety:safetyView,rules:rulesView};
 document.getElementById('main').innerHTML=views[UI.page]()+`<footer class="appfoot"><span>MIYAKONOJO SMART SCHOOL FOOD · ${memoryOnly?'画面内のみ／未保存':'このブラウザ内で動作'} · 外部API未接続</span><button data-action="nav" data-page="rules">構想の出典・デモの範囲</button></footer>`;
 document.getElementById('bottomnav').innerHTML=[['menu','lunch','予約する'],['tickets','ticket','受取票'],['dashboard','chart','運営'],['lab','flask','学び'],['more','menu','その他']].map(([id,ic,t])=>`<button class="${UI.page===id?'active':''}" data-action="${id==='more'?'toggle-menu':'nav'}" ${id==='more'?'':`data-page="${id}"`}>${icon(ic)}${t}</button>`).join('');
 document.title=NAV.find(n=>n[0]===UI.page)[2]+'｜都城市スマート・スクールフード DEMO';
}

function actorSelect(name='actor'){return `<div class="field"><label for="${name}">確認・記録する担当者（仮）</label><select class="input" name="${name}" id="${name}" required><option value="">担当者を選択</option><option>運営担当A（成人・デモ）</option><option>事業者担当B（成人・デモ）</option></select></div>`;}
function submitButton(text){return `<button class="btn" type="submit">${text}</button>`;}
function foot(text){return `<div class="modalfoot">${btn('戻る','close-modal','secondary')}${submitButton(text)}</div>`;}
function productDialog(id){const p=findProduct(S,id);ensure(p,'商品が見つかりません。');openModal(p.name+'｜表示の例',`<div class="foodimage ${p.tone}">${foodArt(p)}</div>${callout('以下は操作体験用に作成した仮の表示です。実商品の原材料・アレルゲン・消費期限を示していません。食べられるかどうかの判断には使わないでください。','amber','shield')}<div class="field mt"><span class="field-label">原材料の例</span><div class="ingredientbox">${esc(p.ingredients)}</div></div><div class="field"><span class="field-label">アレルゲン等の表示例</span><div class="row wrap gap8">${p.allergens.map(a=>badge(esc(a),'outline')).join('')}</div><small>表示例は網羅性を保証しません。実商品は事業者が正式な表示と混入リスクを確認します。</small></div><div class="statline"><span>価格（仮）</span><b>${yen(p.price)}</b></div><div class="statline"><span>消費期限・保存条件</span><span class="small muted">事業者による確定が必要</span></div><div class="modalfoot">${btn('確認して閉じる','close-modal','')}</div>`);}
function checkout(){ensure(countCart()>0,'メニューの「＋」からランチを選んでください。');ensure(['advance','morning'].includes(stage(S,UI.date))&&!day(S,UI.date).stopped,'この日の受付は終了・停止しています。');const token='demo-'+(globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2));openModal('予約内容を確認',`<form data-form="reserve"><input type="hidden" name="token" value="${esc(token)}"><div class="spread mb"><div><h3>${datefmt(UI.date)}</h3><p class="small muted">モデル校（架空）／${esc(UI.cls)}</p></div>${badge('実際の予約ではありません','amber')}</div><div class="stack">${Object.entries(UI.cart).filter(([,n])=>n>0).map(([id,n])=>{const p=findProduct(S,id);return `<div class="ingredientbox"><div class="spread"><strong>${esc(p.name)} × ${n}</strong><b>${yen(p.price*n)}</b></div><p class="tiny muted mt8">原材料の例：${esc(p.ingredients)}<br>アレルゲン等の表示例：${p.allergens.map(esc).join('・')}</p></div>`;}).join('')}</div><div class="carttotal"><span>合計（仮価格）</span><b>${yen(totalCart())}</b></div>${callout('現金の受領は成人担当が記録する想定です。支払の時期・場所は未確定。この画面で決済や現金回収は行いません。','info','cash')}<label class="checkbox mt"><input type="checkbox" name="ack" required><span>上記の表示例を確認し、価格・原材料が仮であり、実際の予約や食事の適合判断には使えないことを理解しました。</span></label><p class="tiny muted mt8">ご本人のアレルギー・氏名・連絡先などは入力しないでください。</p>${foot('デモ予約を記録する')}</form>`);}
function cancelDialog(id){const o=S.orders.find(x=>x.id===id);ensure(o,'予約が見つかりません。');openModal('デモ予約を取り消す',`<form data-form="cancel"><input type="hidden" name="id" value="${esc(id)}"><h3>${esc(o.code)} ／ ${datefmt(o.date)}</h3><p class="small muted mt8">${esc(o.cls)}・${qty(o)}食・${yen(amount(o))}</p><div class="mt">${callout(o.cash==='received'?'現金受領の記録があるため、取消後は「返金確認待ち」に変わります。返金は自動実行しません。':'取消後は予約数と製造前の集計から除外します。','amber')}</div>${foot('予約を取り消す')}</form>`);}
function lockDialog(){ensure(!day(S,UI.date).lock,'製造数は確定済みです。');ensure(stage(S,UI.date)==='closed','デモ時計を「9/18 08:30 締切後」に切り替えてから確定してください。');ensure(allChecks(S,UI.date),'安全確認の4項目を先に確認してください。');ensure(!day(S,UI.date).stopped,'停止中は確定できません。');openModal('製造数の最終確認',`<form data-form="lock"><h3>${datefmt(UI.date)} ／ ${sum(active(S,UI.date),qty)}食</h3><p class="small muted mt8">現在の確定予約だけを製造の基準にします。確定後はこの日の予約追加・取消を止めます。実際の製造指示は送信しません。</p><div class="mt">${actorSelect()}</div><label class="checkbox"><input type="checkbox" name="ack" required><span>商品別・クラス別の数量と、安全確認の内容を照合した想定で記録します。</span></label>${foot('この数量で確定する')}</form>`);}
function receiveDialog(cls){const expected=sum(active(S,UI.date).filter(o=>o.cls===cls),qty),r=day(S,UI.date).receipts[cls];openModal(cls+'｜数量の照合',`<form data-form="receive"><input type="hidden" name="cls" value="${esc(cls)}"><div class="spread mb"><h3>${datefmt(UI.date)}</h3>${badge('予定 '+expected+'食')}</div><div class="fieldgrid"><div class="field"><label for="receive-qty">実際に照合した食数（デモ）</label><input class="input" id="receive-qty" type="number" name="quantity" min="0" max="${expected}" value="${r?.quantity??expected}" required></div><div class="field"><label for="receive-min">受け渡しの所要時間（分）</label><input class="input" id="receive-min" type="number" name="minutes" min="1" max="120" placeholder="例：12" required></div></div>${callout('予定数と違う場合は「差異あり」で残し、受取完了にしません。氏名・健康情報・支援制度の情報は入力しないでください。','info')}<label class="checkbox mt"><input type="checkbox" name="ack" required><span>クラスのラベルと数量を照合した想定で記録します。</span></label>${foot('照合結果を記録')}</form>`);}
function cashDialog(id,refund){const o=S.orders.find(o=>o.id===id);ensure(o,'対象がありません。');openModal(refund?'現金返金の記録（デモ）':'現金受領の記録（デモ）',`<form data-form="cash-record"><input type="hidden" name="id" value="${esc(id)}"><input type="hidden" name="refund" value="${refund?'1':'0'}"><div class="spread mb"><div><h3>${esc(o.code)} ／ ${esc(o.cls)}</h3><span class="small muted">${datefmt(o.date)}</span></div><b class="price">${yen(amount(o))}</b></div>${callout('これは成人担当者が金銭の授受を記録する流れの体験です。実際のお金の受領・返金処理ではありません。','amber','cash')}<div class="mt">${actorSelect()}</div><label class="checkbox"><input type="checkbox" name="ack" required><span>予約コードと金額を照合した想定で記録します。</span></label>${foot(refund?'返金した想定で記録':'受領した想定で記録')}</form>`);}
function feedbackDialog(id){const f=S.feedback.find(f=>f.orderId===id);openModal('ランチの感想を記録',`<form data-form="feedback"><input type="hidden" name="id" value="${esc(id)}">${callout('架空の感想で操作を体験してください。個人情報や健康情報は書かないでください。回答はこのブラウザ内だけに保存します。','info')}<div class="field mt"><label for="rating">ランチの満足度</label><select class="input" id="rating" name="rating" required><option value="">選択してください</option>${[[5,'とても満足'],[4,'満足'],[3,'ふつう'],[2,'少し不満'],[1,'不満']].map(([v,t])=>`<option value="${v}" ${f?.rating===v?'selected':''}>${v}　${t}</option>`).join('')}</select></div><div class="field"><label for="size">量について</label><select class="input" id="size" name="size" required><option value="">選択してください</option>${['少ない','ちょうどよい','多い'].map(t=>`<option ${f?.size===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="comment">次につながる一言（任意）</label><textarea class="input" id="comment" name="comment" maxlength="400" placeholder="例：受け取り場所の案内があると、もっと分かりやすいです。">${esc(f?.comment||'')}</textarea></div>${foot(f?'回答を更新':'デモ回答を保存')}</form>`);}
function recordDayDialog(){const x=day(S,UI.date),distributed=sum(Object.values(x.receipts),r=>r.quantity),left=x.lock.quantity-distributed;openModal('実施後の記録',`<form data-form="report"><div class="statline"><span>確定製造数</span><b>${x.lock.quantity}食</b></div><div class="statline"><span>クラス受取の記録</span><b>${distributed}食</b></div><div class="statline"><span>差分（まだ廃棄とは扱いません）</span><b>${left}食</b></div><div class="fieldgrid mt"><div class="field"><label for="waste">廃棄した食数（デモ）</label><input class="input" id="waste" name="waste" type="number" min="0" max="${left}" value="${x.report?.waste??0}" required></div><div class="field"><label for="report-minutes">全体の受け渡し時間（分）</label><input class="input" id="report-minutes" name="minutes" type="number" min="1" max="120" value="${x.report?.minutes||''}" placeholder="例：12" required></div></div>${callout('0食と未入力を区別します。廃棄以外の差分は「その他未配布」として残ります。受取記録を後から変えた場合、この日の実績は再入力が必要です。','info')}${foot('デモ実績を保存')}</form>`);}
function ideaDialog(id='',hint=false){const i=S.ideas.find(x=>x.id===id),rank=S.products.map(p=>({p,n:countProduct(active(S,UI.date),p.id)})).sort((a,b)=>b.n-a.n)[0],defaults=hint?{title:'なぜ'+rank.p.name+'が選ばれるのか？',evidence:datefmt(UI.date)+'のデモ予約で'+rank.n+'食。注文の理由はまだ分からない。',hypothesis:'味・量・価格のどれが選ばれる理由か、利用者の回答で確かめたい。',test:'次回のアンケートに「選んだ理由」を加え、結果を集計する。'}:{};openModal(i?'改善企画を編集':'改善企画をつくる',`<form data-form="idea"><input type="hidden" name="id" value="${esc(id)}">${callout('事実と仮説を分け、「次に何を試すか」まで書きます。ここでは企画の記録だけで、メニュー変更や外部公開はしません。','info','flask')}<div class="field mt"><label for="idea-title">企画のタイトル</label><input class="input" id="idea-title" name="title" maxlength="100" value="${esc(i?.title||defaults.title||'')}" required></div>${[['evidence','根拠・気づき'],['hypothesis','考えた仮説'],['test','小さく試すこと・確かめ方']].map(([k,t])=>`<div class="field"><label for="idea-${k}">${t}</label><textarea class="input" id="idea-${k}" name="${k}" maxlength="600" required>${esc(i?.[k]||defaults[k]||'')}</textarea></div>`).join('')}<p class="tiny muted">承認済みの企画を編集した場合も、下書きへ戻して確認し直します。</p>${foot('下書きとして保存')}</form>`);}
function reviewIdea(id){const i=S.ideas.find(i=>i.id===id);openModal('教職員・運営の確認を記録',`<form data-form="idea-review"><input type="hidden" name="id" value="${esc(id)}"><h3>${esc(i.title)}</h3><p class="small muted mt8">生徒の検証計画を確認した想定で記録します。実際の販売、発注、安全判断の承認を意味しません。</p><div class="field mt"><label for="reviewer">確認者（仮）</label><select class="input" id="reviewer" name="reviewer" required><option value="">選択してください</option><option>担当教員（デモ）</option><option>運営責任者（デモ）</option></select></div><div class="field"><label for="idea-status">確認結果</label><select class="input" id="idea-status" name="status"><option value="approved">検証計画を承認</option><option value="hold">保留・再検討</option></select></div>${foot('確認結果を記録')}</form>`);}
function safetyDialog(){const x=day(S,UI.date);openModal(x.stopped?'確認して再開':'受付・受渡を停止',`<form data-form="safety"><input type="hidden" name="resume" value="${x.stopped?'1':'0'}">${callout(x.stopped?'4項目の再確認と、担当者の記録が必要です。保存しても外部サービスに通知はされません。':'この日の予約・製造の進行・受け渡しを止めます。確認チェックは解除します。実際の緊急連絡は送信されません。',x.stopped?'info':'red','shield')}<div class="mt">${actorSelect()}</div>${!x.stopped?'<div class="field"><label for="stop-reason">停止理由（個人情報を含めない）</label><textarea class="input" id="stop-reason" name="reason" maxlength="600" placeholder="例：ラベルと予定数の照合に差異があるため" required></textarea></div>':''}${foot(x.stopped?'確認を記録して再開':'停止する')}</form>`);}
function productEdit(id){const p=findProduct(S,id);openModal(p.name+'｜仮設定',`<form data-form="product-edit"><input type="hidden" name="id" value="${id}">${callout('資料に価格・上限の指定はありません。以下はデモ設定です。価格変更は今後の予約だけに適用し、既存予約の金額は保持します。','amber')}<div class="field mt"><label for="product-price">仮価格（円）</label><input class="input" id="product-price" name="price" type="number" min="100" max="2000" value="${p.price}" required></div><div class="fieldgrid"><div class="field"><label for="capacity">前日予約枠（食）</label><input class="input" id="capacity" name="capacity" type="number" min="1" max="300" value="${p.capacity}" required></div><div class="field"><label for="morningCapacity">朝の限定枠（食）</label><input class="input" id="morningCapacity" name="morningCapacity" type="number" min="0" max="30" value="${p.morningCapacity}" required></div></div>${foot('仮設定を保存')}</form>`);}
function auditDialog(){openModal('操作履歴（この端末のデモ）',`<p class="small muted">最大160件の操作記録です。本番用の改ざん防止監査ログではありません。</p><div class="timeline mt">${S.audit.map(a=>`<div class="log"><time>${timefmt(a.at)}</time><span>${esc(a.text)}</span></div>`).join('')}</div><div class="modalfoot">${btn('閉じる','close-modal','secondary')}</div>`);}
function download(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function csvCell(v){let t=String(v??'');if(/^[\s]*[=+\-@]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';}
function exportCSV(kind){const d=UI.date,os=active(S,d),prefix='説明用デモ・架空データ';let rows,name;
 if(kind==='production'){ensure(day(S,d).lock&&!day(S,d).stopped&&allChecks(S,d),'製造指示CSVは、製造数の確定・安全確認後、停止していない状態で出力してください。');rows=[['区分','日付','商品','製造確認数','確認者'],...S.products.map(p=>[prefix,d,p.name,countProduct(os,p.id),day(S,d).lock.actor])];name='製造指示_デモ';}
 else if(kind==='classes'){rows=[['区分','日付','状態','クラス',...S.products.map(p=>p.name),'食数'],...CLASSES.map(c=>{const cs=os.filter(o=>o.cls===c);return [prefix,d,day(S,d).lock?'製造数確定':'未確定集計',c,...S.products.map(p=>countProduct(cs,p.id)),sum(cs,qty)];})];name='クラス別仕分け_デモ';}
 else if(kind==='cash'){rows=[['区分','日付','予約コード','クラス','注文状態','予約金額','現金記録','記録担当'],...S.orders.filter(o=>o.date===d).map(o=>[prefix,d,o.code,o.cls,o.status==='cancelled'?'取消':'予約',amount(o),cashText(o.cash),o.cashActor])];name='成人担当用_現金記録_デモ';}
 else if(kind==='learning'){rows=[['区分','日付','製造食数','クラス受取食数','廃棄食数','その他未配布','受け渡し分','回答数','満足回答数'],...metrics(S).reports.map(r=>[prefix,r.date,r.produced,r.distributed,r.waste,r.produced-r.distributed-r.waste,r.minutes,r.responses,r.satisfied])];name='生徒分析用_匿名集計_デモ';}
 else{rows=[['区分','日付','商品','前日予約','当日朝予約','予約食数','予約金額'],...S.products.map(p=>[prefix,d,p.name,countProduct(os.filter(o=>o.slot==='advance'),p.id),countProduct(os.filter(o=>o.slot==='morning'),p.id),countProduct(os,p.id),sum(os,o=>sum(o.items.filter(i=>i.productId===p.id),i=>i.price*i.qty))])];name='日別予約集計_デモ';}
 download(name+'_'+d+'.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSVを書き出しました。架空データであることを明記しています。');
}
function resetDialog(){openModal('デモデータを初期化',`<form data-form="reset">${callout('このアプリの追加予約・受取記録・企画を削除し、サンプルへ戻します。必要な記録は先にJSONで保存してください。他のアプリには影響しません。','red')}<div class="field mt"><label for="reset-confirm">確認のため「初期化」と入力</label><input class="input" id="reset-confirm" name="confirm" autocomplete="off" required pattern="初期化"></div>${foot('このデモを初期化')}</form>`);}
let imported=null;
async function importFile(file){
 if(!file)return;try{ensure(file.size<=2000000,'バックアップは2MB以下にしてください。');const raw=await file.text();const obj=JSON.parse(raw,(k,v)=>{if(['__proto__','prototype','constructor'].includes(k))throw new Error('許可されないキーが含まれています。');return v;});validate(obj);imported=obj;openModal('JSONバックアップを復元',`<form data-form="import-confirm"><h3>予約 ${obj.orders.length}件 ／ 企画 ${obj.ideas.length}件</h3><p class="small muted mt8">形式と数量の整合性を確認しました。現在のこのアプリのデータを置き換えます。復元操作は外部には送信しません。</p><label class="checkbox mt"><input type="checkbox" name="ack" required><span>現在のデモデータを置き換えます。</span></label>${foot('復元する')}</form>`);}catch(e){showError('復元できません：'+e.message);}finally{document.getElementById('import-file').value='';}
}
document.addEventListener('click',event=>{
 const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(['class','role','clock','check'].includes(a))return;
 if(b.tagName==='A')event.preventDefault();
 try{
  if(a==='nav')go(b.dataset.page);
  else if(a==='toggle-menu'){UI.menuOpen=!UI.menuOpen;render();}
  else if(a==='close-menu'){UI.menuOpen=false;render();}
  else if(a==='date'){if(UI.date!==b.dataset.date){UI.date=b.dataset.date;UI.cart={};UI.cashSearch='';render();toast('利用日を切り替えました。選択中のメニューはクリアしました。');}}
  else if(a==='plus'){const id=b.dataset.id,n=UI.cart[id]||0;ensure(n<3&&countCart()<5&&n<remaining(S,UI.date,id),'受付枠または1回の予約上限に達しています。');UI.cart[id]=n+1;render();}
  else if(a==='minus'){const id=b.dataset.id;UI.cart[id]=Math.max(0,(UI.cart[id]||0)-1);if(!UI.cart[id])delete UI.cart[id];render();}
  else if(a==='product')productDialog(b.dataset.id);
  else if(a==='checkout')checkout();
  else if(a==='close-modal')closeModal();
  else if(a==='cancel')cancelDialog(b.dataset.id);
  else if(a==='lock')lockDialog();
  else if(a==='progress')change(s=>progress(s,UI.date,b.dataset.step),'デモの進行を記録しました。');
  else if(a==='receive')receiveDialog(b.dataset.class);
  else if(a==='cash-filter'){UI.cashFilter=b.dataset.value;render();}
  else if(a==='cash-record')cashDialog(b.dataset.id,b.dataset.refund==='1');
  else if(a==='feedback')feedbackDialog(b.dataset.id);
  else if(a==='record-day')recordDayDialog();
  else if(a==='new-idea')ideaDialog();
  else if(a==='hint-idea')ideaDialog('',true);
  else if(a==='edit-idea')ideaDialog(b.dataset.id);
  else if(a==='idea-status')change(s=>{const i=s.ideas.find(x=>x.id===b.dataset.id);ensure(i?.status==='draft','下書きだけを確認に回せます。');i.status='review';audit(s,'改善企画「'+i.title+'」を確認待ちに変更');},'確認待ちにしました。外部への通知は送信していません。');
  else if(a==='review-idea')reviewIdea(b.dataset.id);
  else if(a==='safety-toggle')safetyDialog();
  else if(a==='edit-product')productEdit(b.dataset.id);
  else if(a==='audit')auditDialog();
  else if(a==='print')window.print();
  else if(a==='csv')exportCSV(b.dataset.kind);
  else if(a==='backup'){download('スクールフード_デモバックアップ.json',JSON.stringify(S,null,2),'application/json');toast('この端末のデモデータをJSONに保存しました。');}
  else if(a==='import')document.getElementById('import-file').click();
  else if(a==='reset')resetDialog();
  else if(a==='reload')location.reload();
 }catch(e){showError(e.message);}
});
document.addEventListener('change',event=>{
 const b=event.target,a=b.dataset.action;
 if(a==='class')UI.cls=b.value;
 else if(a==='role'){UI.role=b.value;UI.page=({user:'menu',operator:'dashboard',school:'delivery',student:'lab'})[b.value];render();window.scrollTo({top:0,behavior:'instant'});}
 else if(a==='clock'){const value=b.value;change(s=>{s.clock=value;audit(s,'デモ時計を '+timefmt(now(s))+' に変更');},'デモ時計を切り替えました。実時間ではありません。',false);}
 else if(a==='check'){const key=b.dataset.key,value=b.checked;change(s=>{ensure(Object.hasOwn(CHECKS,key),'不明な確認項目です。');s.days[UI.date].checks[key]=value;audit(s,CHECKS[key]+'：'+(value?'確認を記録':'確認を解除'));},'デモの確認状態を記録しました。',false);}
 else if(b.id==='import-file')importFile(b.files[0]);
});
document.addEventListener('submit',event=>{
 const form=event.target;if(!form.dataset.form)return;event.preventDefault();if(!form.reportValidity())return;
 const f=new FormData(form),kind=form.dataset.form;const submit=form.querySelector('[type=submit]');if(submit?.disabled)return;if(submit)submit.disabled=true;
 const val=k=>String(f.get(k)||'');
 try{
  if(kind==='reserve'){
   let o;const input={date:UI.date,cls:UI.cls,cart:clone(UI.cart),ack:f.has('ack'),token:val('token')};
   const ok=change(s=>{o=reserve(s,input);},'',true);if(ok){UI.cart={};render();openModal('デモ予約を記録しました',`<div style="text-align:center"><div class="brandmark" style="margin:0 auto 18px">${icon('check')}</div><h2>お昼の準備が、ひとつ完了。</h2><p class="small muted mt8">${datefmt(o.date)} ／ ${esc(o.cls)} ／ ${qty(o)}食</p><div class="ingredientbox mt"><span class="tiny muted">説明用の受取コード</span><p class="mono" style="font-size:34px;font-weight:700">${esc(o.code)}</p></div><p class="small muted mt">予約はこのブラウザ内に保存しました。<br>学校・事業者には送信されていません。</p><div class="row wrap mt" style="justify-content:center">${btn('受取票を見る','nav','','data-page="tickets"')}${btn('閉じる','close-modal','secondary')}</div></div>`);}
  }else if(kind==='cancel')change(s=>cancelOrder(s,val('id')),'予約を取り消しました。');
  else if(kind==='lock')change(s=>{ensure(f.has('ack'),'照合の確認が必要です。');lockProduction(s,UI.date,val('actor'));},'製造数を確定しました。実際の発注は行っていません。');
  else if(kind==='receive')change(s=>receiveClass(s,UI.date,val('cls'),Number(f.get('quantity')),Number(f.get('minutes')),f.has('ack')),'クラスの照合結果を記録しました。');
  else if(kind==='cash-record')change(s=>{ensure(f.has('ack'),'金額照合の確認が必要です。');recordCash(s,val('id'),val('actor'),val('refund')==='1');},'架空の現金記録を保存しました。');
  else if(kind==='cash-search'){UI.cashSearch=val('query').trim();render();}
  else if(kind==='feedback')change(s=>saveFeedback(s,val('id'),Number(f.get('rating')),val('size'),val('comment').trim()),'デモ回答を記録しました。');
  else if(kind==='report')change(s=>recordDay(s,UI.date,Number(f.get('waste')),Number(f.get('minutes'))),'実績を保存しました。まなびラボの集計に反映します。');
  else if(kind==='idea')change(s=>{ensure(s.ideas.length<100||val('id'),'企画は100件までです。');const data={title:val('title').trim(),evidence:val('evidence').trim(),hypothesis:val('hypothesis').trim(),test:val('test').trim(),status:'draft'};ensure(Object.values(data).every(Boolean),'空白だけの項目は保存できません。');const i=s.ideas.find(i=>i.id===val('id'));if(i)Object.assign(i,data);else s.ideas.unshift({id:'idea-'+Date.now(),createdAt:now(s),...data});audit(s,'改善企画「'+data.title+'」を下書き保存');},'改善企画を保存しました。');
  else if(kind==='idea-review')change(s=>{const i=s.ideas.find(i=>i.id===val('id'));ensure(i?.status==='review','確認待ちの企画ではありません。');ensure(['担当教員（デモ）','運営責任者（デモ）'].includes(val('reviewer'))&&['approved','hold'].includes(val('status')),'確認者・確認結果を選んでください。');i.status=val('status');audit(s,val('reviewer')+'：改善企画「'+i.title+'」を'+(i.status==='approved'?'検証承認':'保留'));},'確認結果を記録しました。販売や外部公開は行いません。');
  else if(kind==='safety')change(s=>{const x=day(s,UI.date);ensure(['運営担当A（成人・デモ）','事業者担当B（成人・デモ）'].includes(val('actor')),'成人担当者を選んでください。');if(val('resume')==='1'){ensure(allChecks(s,UI.date),'安全確認の4項目をすべて再確認してから再開してください。');x.stopped=false;audit(s,UI.date+'：'+val('actor')+'がデモ再開を確認');}else{ensure(val('reason').trim().length>0,'停止理由を入力してください。');x.stopped=true;x.reason=val('reason').trim();for(const k of Object.keys(CHECKS))x.checks[k]=false;audit(s,UI.date+'：'+val('actor')+'が停止／'+x.reason);}},val('resume')==='1'?'デモを再開しました。':'この日の受付・進行・受け渡しを停止しました。');
  else if(kind==='settings')change(s=>{const advanced=val('advanceCutoff'),morning=val('morningCutoff');if(advanced!==s.settings.advanceCutoff||morning!==s.settings.morningCutoff)ensure(!Object.values(s.days).some(d=>d.lock),'製造確定後は締切時刻を変更できません。');s.settings={advanceCutoff:advanced,morningCutoff:morning,targetStudents:Number(f.get('targetStudents'))};audit(s,'デモの実証設定を変更');},'仮設定を保存しました。',false);
  else if(kind==='product-edit')change(s=>{const p=findProduct(s,val('id'));ensure(p,'商品が見つかりません。');const cap=Number(f.get('capacity')),mcap=Number(f.get('morningCapacity'));for(const d of DATES){ensure(cap>=countProduct(active(s,d).filter(o=>o.slot==='advance'),p.id),'前日枠は既存の予約数未満にできません。');ensure(mcap>=countProduct(active(s,d).filter(o=>o.slot==='morning'),p.id),'当日朝枠は既存の予約数未満にできません。');}p.price=Number(f.get('price'));p.capacity=cap;p.morningCapacity=mcap;audit(s,p.name+'の仮価格・受付枠を変更（既存予約価格は保持）');},'新しい予約向けの仮設定を保存しました。');
  else if(kind==='reset'){
   ensure(val('confirm')==='初期化','「初期化」と入力してください。');try{localStorage.removeItem(KEY);lastStored=null;memoryOnly=false;storageWarning='';}catch(e){memoryOnly=true;storageWarning='端末保存が利用できないため、画面内のデモだけを初期化しました。';}
   saveBlocked=false;S=seed();UI.cart={};UI.date=DATES[0];UI.page='menu';UI.role='user';UI.cashSearch='';UI.cashFilter='unpaid';persist(S);closeModal();render();toast('このアプリのデモを初期化しました。');
  }else if(kind==='import-confirm'){
   ensure(imported&&f.has('ack'),'復元するデータの確認が必要です。');const next=clone(imported);next.revision=S.revision+1;persist(next);imported=null;UI.cart={};closeModal();render();toast('バックアップを復元しました。');
  }
 }catch(e){showError(e.message);}finally{if(submit?.isConnected)submit.disabled=false;}
});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.menuOpen){UI.menuOpen=false;render();}});
window.addEventListener('storage',event=>{if(event.key===KEY&&event.newValue!==lastStored){storageWarning='別のタブでデータが変更されました。続ける前に、この画面を再読み込みしてください。';render();}});
// The exported API is for transparent local verification of this sample-only app, not access control.
window.SSF={version:VERSION,seed,validate,reserve,cancelOrder,recordCash,lockProduction,progress,receiveClass,recordDay,saveFeedback,metrics,stage,remaining,qty,amount,active,signature,clone,checkKeys:Object.keys(CHECKS),dates:DATES,classes:CLASSES,getState:()=>clone(S),getUI:()=>clone(UI),storageKey:KEY};
load();render();
</script>

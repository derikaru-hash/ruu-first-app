function validNum(v,min,max){return typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max;}
function txt(v,n=1200){return typeof v==='string'?v.slice(0,n):'';}
function validateState(o){
 if(!o||o.schema!=='menu-studio.v1')throw Error('形式が違います。MENU STUDIOから書き出したJSONを選んでください。');
 const out=initial();out.rev=validNum(o.rev,1,1e7)?Math.floor(o.rev):1;
 const z=o.settings||{};for(const k of ['store','customer','story','note'])out.settings[k]=txt(z[k],500)||out.settings[k];out.settings.launch=/^\d{4}-\d{2}-\d{2}$/.test(z.launch||'')?z.launch:'';
 const limits={maxRate:[1,100],maxSec:[1,3600],batch:[1,1000],trialFixed:[0,1e7],hourly:[0,10000],tax:[0,30]};for(const [k,[lo,hi]]of Object.entries(limits))if(validNum(z[k],lo,hi))out.settings[k]=z[k];
 out.seeds=Array.isArray(o.seeds)?[...new Set(o.seeds.filter(v=>seeds.some(a=>a.id===v)))].slice(0,3):out.seeds;
 out.trialDraft={note:txt(o.trialDraft?.note,2500),who:txt(o.trialDraft?.who,100)||'店長（仮想）',sample:!!o.trialDraft?.sample};
 out.sourceNote=txt(o.sourceNote,2500);out.sourceURL=safeURL(o.sourceURL);out.selected=[0,1,2].includes(o.selected)?o.selected:null;
 if(o.recipe&&out.selected!==null){const r=o.recipe;if(!Array.isArray(r.items)||r.items.length<1||r.items.length>20||!validNum(r.price,1,100000)||!validNum(r.sec,0,3600))throw Error('レシピの数値が不正です。');out.recipe={name:txt(r.name,100)||'名称未定',catch:txt(r.catch,200),desc:txt(r.desc,700),items:r.items.map(a=>{if(!validNum(a.cost,0,100000))throw Error('材料費が不正です。');return {name:txt(a.name,100),qty:txt(a.qty,80),cost:a.cost};}),price:r.price,sec:r.sec,method:txt(r.method,1200),allergens:txt(r.allergens,300),improved:!!r.improved};}
 out.trials=Array.isArray(o.trials)?o.trials.slice(-50).filter(x=>x&&typeof x.note==='string').map(x=>({note:txt(x.note,2500),who:txt(x.who,100),date:txt(x.date,100),rev:validNum(x.rev,1,1e7)?x.rev:out.rev,sample:!!x.sample})):[];
 for(const k of Object.keys(out.checks))out.checks[k]=!!o.checks?.[k];
 if(o.approval&&validNum(o.approval.rev,1,1e7))out.approval={rev:o.approval.rev,date:txt(o.approval.date,100),who:txt(o.approval.who,100)};
 out.improvements=Array.isArray(o.improvements)?o.improvements.slice(-30).map(x=>({date:txt(x.date,100),note:txt(x.note,2500),rev:validNum(x.rev,1,1e7)?x.rev:1})):[];
 for(const k of ['x','press','staff','image'])if(o.drafts?.[k]&&typeof o.drafts[k].text==='string')out.drafts[k]={text:txt(o.drafts[k].text,12000),rev:validNum(o.drafts[k].rev,1,1e7)?o.drafts[k].rev:0,edited:!!o.drafts[k].edited};
 out.oldDrafts=Array.isArray(o.oldDrafts)?o.oldDrafts.slice(-15).map(x=>({kind:txt(x.kind,30),text:txt(x.text,12000),rev:validNum(x.rev,1,1e7)?x.rev:0,edited:!!x.edited})):[];
 out.feedback=Array.isArray(o.feedback)?o.feedback.slice(-50).map(x=>({screen:txt(x.screen,100),score:validNum(x.score,1,5)?x.score:3,note:txt(x.note,2500),date:txt(x.date,100)})):[];
 out.library=Array.isArray(o.library)?o.library.slice(-12).filter(x=>x&&x.snapshot&&x.snapshot.schema==='menu-studio.v1').map(x=>({id:txt(x.id,80),name:txt(x.name,100),date:txt(x.date,100),status:txt(x.status,100),snapshot:validateState({...x.snapshot,library:[]})})):[];
 out.photo=typeof o.photo==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(o.photo)&&o.photo.length<900000?o.photo:null;out.posterStyle=['warm','dark'].includes(o.posterStyle)?o.posterStyle:'warm';out.updatedAt=txt(o.updatedAt,100);return out;

function safeURL(v){try{const u=new URL(v);return u.protocol==='https:'?u.href.slice(0,1500):'';}catch{return '';}}
function now(){return new Date().toISOString();}
function timeLabel(v){try{return new Date(v).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return '';}}
function persist(){S.updatedAt=now();try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;$('#save-status').textContent='このブラウザに保存済み';}catch{storageOK=false;$('#save-status').textContent='保存不可・JSONで書き出してください';} }
function toast(message){$('#toast-root').innerHTML=`<div class="toast">${esc(message)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast-root').innerHTML='',4500);}
function changed(reason){S.rev++;S.approval=null;for(const k of Object.keys(S.checks))S.checks[k]=false;if(reason)S.improvements.push({date:now(),note:reason,rev:S.rev});persist();}
function yen(v){return Number.isFinite(v)?'¥'+Math.round(v).toLocaleString('ja-JP'):'—';}
function cost(r=S.recipe){return r?r.items.reduce((a,x)=>a+x.cost,0):0;}
function calc(r=S.recipe){if(!r)return null;const net=r.price/(1+S.settings.tax/100),c=cost(r),rate=c/net*100,margin=net-c,labor=r.sec/3600*S.settings.hourly,unit=margin-labor,trial=unit*S.settings.batch-S.settings.trialFixed;return {net,c,rate,margin,labor,unit,trial,be:unit>0?Math.ceil(S.settings.trialFixed/unit):null,rateOK:rate<=S.settings.maxRate,secOK:r.sec<=S.settings.maxSec};}
function approved(){return !!S.approval&&S.approval.rev===S.rev;}
function canApprove(){const c=calc();return c&&c.rateOK&&c.secOK&&Object.values(S.checks).every(Boolean)&&S.trials.some(t=>t.rev===S.rev);}

function nameSet(){const z=S.seeds;const prefix=z.includes('crack')?'割って、香る。':z.includes('finish')?'仕上げは、あなた。':z.includes('hand')?'片手で、ごちそう。':'ひと口、意外。';const a=z.includes('citrus')?'柚子':z.includes('sweet')?'甘辛':'香ばし';return [{name:`${a}チーズ南蛮カレー`,catch:prefix+'いつものカレーが、少し変わる。',desc:'カリカリのチーズ、タルタル、カレー。最後の一手で食感と香りを楽しむ、主力商品の育成案。',price:1280,sec:150,items:[['カレー・ご飯','既存1食分',180],['鶏肉','既存1食分',110],['南蛮たれ','20g（仮定）',30],['タルタル','35g（仮定）',45],['チーズのトッピング','20g（仮定）',52],['香りの仕上げ','1食分',18]],method:'既存のカレーと南蛮をベースに、チーズの食感と香りを仕上げに加える。味・温度・保持条件は店の確認済み基準を使用。',allergens:'卵・乳・小麦・大豆など。網羅情報ではないため、全材料と仕入れ仕様書を確認。'}, {name:`${a}カリとろカップ`,catch:'歩く時間も、ごちそうに。',desc:'店の人気の味をカップに。層で食感を分け、持ち帰りでも楽しめるか検証する。',price:880,sec:105,items:[['ご飯・カレー','小盛1食分',120],['鶏肉','小盛1食分',75],['タルタル','20g（仮定）',30],['チーズのトッピング','15g（仮定）',38],['香りの仕上げ','1食分',12],['容器・ふた','1組',55]],method:'カップの中で食感が保てるよう、トッピングを分ける案。移動後の品質・包装・持ち帰りの条件を別途実測。',allergens:'卵・乳・小麦・大豆など。仕入れ仕様書と包装表示を別途確認。'}, {name:`${a}追いがけディップ`,catch:'いつもの一皿に、ひとつの遊び。',desc:'既存メニューを変えず、食感と香りの小さな追加セットで反応を試す。単品・セットの売り方を確認する。',price:380,sec:55,items:[['タルタル','20g（仮定）',30],['チーズのトッピング','12g（仮定）',30],['香りの仕上げ','1食分',12],['小皿・副材料','1食分',18]],method:'既存の料理に添える小さな追加商品として検証。追加注文時の提供動線とアレルゲン案内を確認。',allergens:'卵・乳など。既存メニューとの組み合わせも含め全材料を確認。'}].map(x=>({...x,items:x.items.map(([name,qty,cost])=>({name,qty,cost})),improved:false}));}
function go(n,scroll=true){if(recording){toast('動画の書き出し中です。完了後に画面を移動できます。');return;}stopPlay();view=n;filter=filter||'すべて';$('#side').classList.remove('open');$('.mobile-menu').setAttribute('aria-expanded','false');render();if(scroll)window.scrollTo({top:0,behavior:'instant'});}
function render(){ $('#crumb').textContent=steps[view];$('#nav').innerHTML=steps.map((s,i)=>`<button data-go="${i}" class="${view===i?'active':''}" ${view===i?'aria-current="step"':''}><span class="nav-num">0${i+1}</span><span>${s}</span><span class="go">${i===view?'↗':'›'}</span></button>`).join('');$('#content').innerHTML=(!storageOK?'<div class="notice danger">この環境ではブラウザ保存が使えません。閉じる前にデータを書き出してください。 <button class="btn light small" data-act="export-json">JSON保存</button></div>':'')+[discovery,fusion,feasibility,tasting,promotion,video,knowledge][view]();$('#save-status').textContent=storageOK?'このブラウザに保存'+(S.updatedAt?'済み':''):'保存不可・JSONで書き出し';if(view===4)drawPoster();if(view===5)drawFrame(vProgress);}
function head(n,title,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow">STEP 0${n} / ${['DISCOVER','REMIX','MAKE IT WORK','TASTE & REFINE','LAUNCH','TELL THE STORY','KEEP & REUSE'][n-1]}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`;}
function requireRecipe(){return `<div class="empty"><div class="icon">＋</div><h2>まず、育てるメニューを選びましょう。</h2><p>トレンドの種を選び、掛け合わせた候補から一つ決めると、この画面につながります。</p><button class="btn primary" data-go="1">メニューの候補を見る →</button></div>`;}
function discovery(){const chosen=seeds.filter(x=>S.seeds.includes(x.id));let list=seeds.filter(x=>(filter==='すべて'||x.kind===filter)&&(!search||(x.label+x.kind+x.hint+x.query).toLowerCase().includes(search.toLowerCase())));return head(1,'次の看板メニューの、種を探す。','検索量ではなく、「自分の店に借りられる仕組み」を見つける。')+`<section class="hero"><div><div class="eyebrow">A LITTLE WILD. REALLY WORKABLE.</div><h2>ひらめきで終わらない。<br>店で出せる、一皿へ。</h2><p>海外の発想、SNSの体験、店の味。<br>小さな種を掛け合わせて、試作・販促・引継ぎまで。</p><div class="btn-group"><button class="btn primary" data-go="1">選んだ種で、はじめる →</button><button class="btn light" data-act="guide">案内を見る</button></div></div><div class="hero-visual">${svgFood()}<div class="float"><span class="eyebrow">SEED × SEED × YOUR STORE</span><b>割る体験 × 柚子 × 食感</b></div><div class="float second"><span class="tiny muted">このデモの完成地点</span><b>一品分の「発売準備パック」</b><span class="tiny muted">料理の絵はコンセプトイラスト</span></div></div></section><div class="storyline"><span>01 種を拾う</span><i>→</i><span>02 掛け合わせる</span><i>→</i><span>03 採算・手間</span><i>→</i><span>04 試す</span><i>→</i><span>05 届ける</span><i>→</i><span>06・07 残す</span></div><div class="section"><h2>発想のシードボード</h2><span class="badge gray">全6件・仮想サンプル</span></div><div class="filters">${['すべて','海外の発想','X・SNS','地元素材','お客さまの声'].map(x=>`<button class="chip ${filter===x?'active':''}" data-filter="${esc(x)}">${x}</button>`).join('')}</div><div class="searchrow"><input id="seed-search" aria-label="サンプル内を検索" placeholder="種を検索：食感、香り、片手…" value="${esc(search)}"><button class="btn light" data-act="source">自分で見つけた材料をメモ</button></div><div class="grid g3" id="seed-grid">${list.map(seedCard).join('')||'<div class="notice">一致するサンプルがありません。検索語や分類を変えてください。</div>'}</div><div class="notice">ここにあるのは発想を試すための仮想サンプルです。実際の流行・投稿数・トレンド順位ではありません。本開発では出典・取得日・確認状態を付けて取得します。</div><div class="sticky-bar"><div><b>${chosen.length} / 3 個の種を選択中</b><p>${chosen.map(x=>x.label).join(' ＋ ')||'2〜3個を選ぶと掛け合わせられます。'}</p></div><button class="btn lime" data-go="1" ${chosen.length<2?'disabled':''}>掛け合わせる →</button function feasibility(){if(!S.recipe)return head(3,'面白い。でも、店で回る？','数字と条件で、試す価値を確かめる。')+requireRecipe();const r=S.recipe,c=calc();return head(3,'面白い。でも、店で回る？','価格や材料費を変えると再計算。採算・手間と、実際の味の確認は分けます。',`<span class="badge ${c.rateOK&&c.secOK?'':'orange'}">仕様 v${S.rev}</span>`)+`<div class="split"><div><div class="card"><div class="row"><h3>${esc(r.name)}</h3><button class="text-btn" data-act="rename">名前を編集</button></div><div class="metric-grid"><div class="metric"><div class="label">1食の材料・資材費</div><b>${yen(c.c)}</b><small>入力値の合計</small></div><div class="metric ${c.rateOK?'':'danger'}"><div class="label">材料・資材原価率</div><b>${c.rate.toFixed(1)}<span>％</span></b><small>目安 ${S.settings.maxRate}％以下</small></div><div class="metric ${c.secOK?'':'danger'}"><div class="label">注文ごとの追加作業</div><b>${r.sec}<span>秒</span></b><small>上限 ${S.settings.maxSec}秒</small></div></div><div class="grid g2"><label class="field">販売価格案（税込・円）<input data-recipe="price" type="number" min="1" max="100000" value="${r.price}"></label><label class="field">追加作業（秒／食）<input data-recipe="sec" type="number" min="0" max="3600" value="${r.sec}"></label></div><div class="twrap"><table><thead><tr><th>材料・資材</th><th>1食分の使用量メモ</th><th>1食分の費用（円）</th></tr></thead><tbody>${r.items.map((x,i)=>`<tr><td>${esc(x.name)}</td><td><input aria-label="${esc(x.name)}の使用量" data-qty="${i}" value="${esc(x.qty)}" maxlength="80"></td><td><input aria-label="${esc(x.name)}の費用" type="number" min="0" max="100000" data-cost="${i}" value="${x.cost}"></td></tr>`).join('')}</tbody></table></div><div class="footnote">材料費は税抜ベースの仮置き。設定税率 ${S.settings.tax}％で税抜売上 ${yen(c.net)} を算出。使用量メモの変更だけでは費用は変わりません。費用も合わせて更新してください。</div></div><div class="card" style="margin-top:18px"><h3>小さく試すと、いくら必要？</h3><div class="metric-grid"><div class="metric"><div class="label">食材費等を引いた額／食</div><b>${yen(c.margin)}</b><small>営業利益ではありません</small></div><div class="metric"><div class="label">試行追加固定費</div><b>${yen(S.settings.trialFixed)}</b><small>店の条件で変更</small></div><div class="metric"><div class="label">固定費回収の必要数</div><b>${c.be===null?'不可':c.be}<span>${c.be===null?'':'食'}</span></b><small>この仮定の範囲のみ</small></div></div><p>${S.settings.batch}食売れた仮定で、税抜売上 − 材料・資材費 − 追加作業費 − 試行追加固定費 ＝ <b>${yen(c.trial)}</b>。<br>追加作業費は ${r.sec}秒 × 時給${yen(S.settings.hourly)} ÷ 3,600。通常人件費・家賃・光熱費・決済手数料等は含みません。</p><div class="notice warn">販売数は予測ではありません。保管・ロス・歩留まりなど未入力の費用を含む実際の利益は、別途確認が必要です。</div></div></div><div><div class="card"><span class="eyebrow orange">HUMAN CHECK, NOT A SALES SCORE</span><h3 style="margin-top:9px">試す前の、二つの関門</h3><div class="criteria"><div class="criterion ${c.rateOK?'':'fail'}"><span class="circle">${c.rateOK?'✓':'!'}</span><div>材料・資材原価率 ${c.rateOK?'条件内':'条件超過'}<small>${c.rate.toFixed(1)}％ / 目安${S.settings.maxRate}％以下</small></div></div><div class="criterion ${c.secOK?'':'fail'}"><span class="circle">${c.secOK?'✓':'!'}</span><div>追加作業 ${c.secOK?'条件内':'条件超過'}<small>${r.sec}秒 / 上限${S.settings.maxSec}秒</small></div></div><div class="criterion"><span class="circle" style="background:#eee8d4">？</span><div>おいしさ・衛生・売れ行き<small>計算では分かりません。人が実物で確認します。</small></div></div></div><div class="notice ${c.rateOK&&c.secOK?'':'warn'}">${c.rateOK&&c.secOK?'計算上は、この店の設定条件内です。次は試作して、人が確かめましょう。':'目を引いても、そのまま売りません。試作で問題を確かめ、手間・材料を見直します。'}</div><button class="btn primary wide" data-go="3">試作・追いルウへ →</button></div><div class="impact" style="margin-top:18px"><h3>「バズる」より先に、<br>ピーク時に出せるか。</h3><p>写真映えは残し、注文ごとの仕上げを減らす。<br>次の画面で「追いルウ」の前後を体験できます。</p></div><div class="notice warn">アレルゲンの要確認メモ<br>${esc(r.allergens)}<br>安全性をAIや計算だけで認定する機能はありません。</div></div></div>`;}

.date)} / ${t.sample?'仮想試食サンプル':'利用者が入力した記録'}</small></div>`).join('')||'<div class="notice">まだ試作記録はありません。「仮想の試食メモ」でも操作を体験できます。</div>'}</div></div><div><div class="card"><h3>試験販売へ進めるか、人が決める。</h3><p>これはデモ上の確認です。実店舗での安全・品質の承認に代わるものではありません。</p><div class="checks">${[['taste','味・食感を、実物で確認する想定'],['safety','衛生・アレルゲン・保管条件を確認する想定'],['operation','ピーク時の手順を確認する想定'],['price','実際の原価・価格表示を確認する想定'],['rights','画像の権利・産地・宣伝文の事実を確認する想定']].map(([k,l])=>`<label class="check"><input type="checkbox" data-check="${k}" ${S.checks[k]?'checked':''}><span>${l}</span></label>`).join('')}</div><div class="notice ${canApprove()?'':'warn'}">${!c.rateOK||!c.secOK?'店の条件を超えています。先に仕様または条件を見直してください。':!S.trials.some(t=>t.rev===S.rev)?'現在の仕様での試作記録が必要です。':!Object.values(S.checks).every(Boolean)?'確認項目を埋めると、デモ承認できます。':'デモ上の必要項目がそろいました。'}</div><button class="btn primary wide" data-act="approve" ${!canApprove()||approved()?'disabled':''}>${approved()?'✓ この仕様をデモ承認済み':'この仕様を試験販売用にデモ承認'}</button>${approved()?`<p class="tiny">${timeLabel(S.approval.date)} / ${esc(S.approval.who)}</p>`:''}<button class="btn light wide" style="margin-top:10px" data-go="4">販促の下書きを見る →</button></div><div class="impact" style="margin-top:18px"><h3>売れる確率ではなく、<br>試した根拠を残す。</h3><p>一度直したら終わりではありません。<br>別の人でもできるかが、次の確認です。</p></div></div></div>`;}

function promotion(){if(!S.recipe)return head(5,'一皿の魅力を、届ける準備。','商品を直したら、販促にもその仕様を反映する。')+requireRecipe();const d=draft(promoTab),r=S.recipe;return head(5,'一皿の魅力を、届ける準備。','プレスリリース・X・スタッフ共有・画像指示を、一つの仕様から。',`<span class="badge ${approved()?'':'orange'}">${approved()?'デモ承認済みの仕様':'開発中・社外未承認'}</span>`)+`<div class="split"><div><div class="card"><div class="tabs">${[['x','Xの投稿文'],['press','プレスリリース'],['staff','スタッフ共有'],['image','画像の指示']].map(([k,l])=>`<button data-tab="${k}" class="${promoTab===k?'active':''}">${l}</button>`).join('')}</div>${d.rev!==S.rev?'<div class="notice danger">仕様が変わっています。この下書きは旧版です。内容を確認し、最新版で作り直してください。</div>':''}<div class="row" style="margin-bottom:14px"><span class="badge gray">テンプレート下書き / v${d.rev}${d.edited?' / 編集あり':''}</span><span class="tiny muted">自由に編集できます</span></div><label class="sr-only" for="draft-text">販促の下書き</label><textarea id="draft-text" class="draft" maxlength="12000">${esc(d.text)}</textarea><div class="row" style="margin-top:8px"><span class="tiny muted" id="draft-count">${Array.from(d.text).length}文字（簡易計測）</span><button class="text-btn" data-act="regenerate">最新版で下書きを作り直す</button></div><div class="btn-group" style="margin-top:18px"><button class="btn primary" data-act="copy-draft">文章をコピー</button><button class="btn light" data-act="download-draft">テキスト保存</button></div><div class="footnote">Xへの自動投稿・プレスリリース配信はしません。公開前に価格・提供条件・権利と内容を確認してください。旧版の書き出しには注意書きを付けます。</div></div><div class="card" style="margin-top:18px"><h3>誰に、何をしてほしい？</h3><p>対象：${esc(S.settings.customer)}<br>最初の目的：試験販売への関心を確かめる。<br>確かめること：投稿反応だけでなく、実際の注文・食後の声・厨房の負担。</p><button class="text-btn" data-act="settings">店の背景・予定日を編集する</button></div></div><div><div class="card"><div class="row"><h3>販促ビジュアル</h3><span class="badge gray">AI生成なし</span></div><p>その場で描画するテンプレート。写真を入れると、同じ素材を動画コンテでも使います。</p><div class="poster-wrap" style="margin-top:17px"><canvas id="poster" width="720" height="960" aria-label="メニュー販促ポスターのプレビュー"></canvas></div><div class="btn-group" style="margin-top:16px"><button class="btn light small" data-act="photo">実物写真を入れる</button><button class="btn light small" data-act="poster-style">雰囲気を変える</button>${S.photo?'<button class="btn light small" data-act="remove-photo">写真を外す</button>':''}</div><button class="btn primary wide" style="margin-top:10px" data-act="download-poster">ポスターをPNGで保存</button><div class="footnote">写真はこのブラウザ内で処理します。権利のある画像のみ使用してください。イラスト版には実物未撮影と明示します。</div></div><button class="btn light wide" style="margin-top:18px" data-go="5">15秒の伝え方も作る →</button></div></div>`;}
function scenes(){const r=S.recipe;return [{t:'0–3秒',title:'最初に、意外な一瞬。',line:r.catch.split('。')[0]+'。',shot:'食感が伝わる手元の接写。実際の料理で撮影。',voice:'まずは、ひと割り。'},{t:'3–7秒',title:'主役の食感と、香り。',line:r.name,shot:'トッピングと仕上げを接写。量や具材を誇張しない。',voice:'いつもの味に、食感と香りを。'},{t:'7–11秒',title:'一皿の全体像を見せる。',line:'いつもの一皿に、小さな驚き。',shot:'実物を真上から撮影。提供時の盛り付けを使う。',voice:'あなたなら、どこから食べますか？'},{t:'11–15秒',title:'来店に必要な情報を、正確に。',line:yen(r.price)+' 税込｜試験販売を準備中',shot:'店舗名・価格案・販売予定日。未確定の事項は未定と記載。',voice:S.settings.store+'。試験販売を準備中。'}];}
function video(){if(!S.recipe)return head(6,'15秒で、「食べてみたい」へ。','台本と撮影指示を、商品の仕様に合わせる。')+requireRecipe();return head(6,'15秒で、「食べてみたい」へ。','台本・撮影指示・文字アニメーションを確認。生成映像や合成音声ではありません。')+`<div class="split"><div><div class="card"><div class="row"><h3>ショート動画の絵コンテ</h3><span class="badge orange">合計15秒 / 縦型</span></div>${scenes().map((s,i)=>`<div class="scene"><div class="time mono">${s.t}</div><div><b>${s.title}</b><p>テロップ：${esc(s.line)}</p><p>撮影：${esc(s.shot)}</p><p class="muted">ナレーション案：${esc(s.voice)}</p></div></div>`).join('')}<div class="btn-group" style="margin-top:20px"><button class="btn primary" data-act="script-download">台本・撮影指示を保存</button><button class="btn light" data-go="4">画像・投稿文へ戻る</button></div></div><div class="card" style="margin-top:18px"><h3>流行の「何を」借りたか</h3><p>${seeds.filter(x=>S.seeds.includes(x.id)).map(x=>esc(x.label)+'：'+esc(x.hint)).join('<br>')}</p><div class="notice">このデモは事前設計した構成を商品の情報で組み立てます。実際のXトレンド、動画の取得、流行曲の選定は行いません。BGM・人物・素材は権利確認が必要です。</div></div></div><div class="card"><div class="preview-phone"><canvas id="video" width="540" height="960" aria-label="15秒の動画コンテプレビュー"></canvas></div><div class="row" style="margin:18px 0 10px"><button id="play-button" class="btn primary" data-act="play">▶ 15秒プレビュー</button><span class="mono small" id="video-time">0.0 / 15秒</span></div><input aria-label="動画プレビューの位置" id="video-scrub" type="range" min="0" max="15" step="0.1" value="0"><button class="btn light wide" id="record-button" data-act="record" style="margin-top:14px">文字動画をWebM保存（対応ブラウザ）</button><div class="footnote">テキストとイラスト／写真の無音アニメーションです。撮影済み実写動画やAI生成動画ではありません。対応ブラウザでは15秒の再生を記録してWebMに書き出します。MP4変換は未実装。</div><div id="video-status" role="status"></div></div></div><div class="sticky-bar"><div><b>企画を、店の資産へ。</b><p>発想の種・判断・試作・販促をひとまとめに。</p></div><button class="btn lime" data-go="6">保存・引継ぎへ →</button></div>`;}
function knowledge(){return head(7,'次は、ゼロから作らない。','採用した理由も、やめた理由も。次の担当者に渡せる、店の開発記録。',`<button class="btn light small" data-act="feedback">使った感想を残す</button>`)+`<div class="notice warn">このデモの保存先は「同じ端末・同じブラウザ」です。会社の共有データベース・ログイン・権限管理は未接続。URLだけでは入力内容は共有されません。JSONを書き出して、別端末で読み込めます。</div><div class="split"><div>${S.recipe?`<div class="card"><div class="row"><span class="eyebrow orange">CURRENT PROJECT</span><span class="badge ${approved()?'':'orange'}">${approved()?'デモ承認済み':'開発メモ'} / v${S.rev}</span></div><h2 style="margin:12px 0">${esc(S.recipe.name)}</h2><p>完成していること：${S.trials.length?'試作メモあり':'試作メモは未記録'}・${S.recipe.improved?'追いルウ適用済み':'改善は未適用'}・販促下書きあり。<br>未確認：実店舗での試験販売結果、他の担当者による再現性。</p><div class="tags">${seeds.filter(x=>S.seeds.includes(x.id)).map(x=>`<span class="badge gray">${esc(x.label)}</span>`).join('')}</div><div class="divider"></div><div class="btn-group"><button class="btn primary" data-act="save-asset">この版を、店の資産に残す</button><button class="btn light" data-act="export-pack">引継ぎパックを保存</button></div><div class="footnote">未承認でも開発メモとして保存できます。正式な店舗マニュアルとしては扱いません。保存版は写真を含みません。画像はPNGと全データJSONで別に保管してください。</div></div>`:requireRecipe()}<div class="section"><h2>保存した開発レシピ</h2><span class="badge gray">${S.library.length}件</span></div>${S.library.slice().reverse().map(x=>`<article class="card savedcard"><div class="row"><span class="badge ${x.status==='デモ承認済み'?'':'orange'}">${esc(x.status)}</span><span class="tiny muted">${timeLabel(x.date)}</span></div><h3 style="margin-top:12px">${esc(x.name)}</h3><div class="summary"><div>仕様<b>v${x.snapshot.rev}</b></div><div>記録<b>${x.snapshot.trials.length}件</b></div><div>材料・資材費<b>${yen(cost(x.snapshot.recipe))}</b></div></div><div class="btn-group"><button class="btn light small" data-asset-view="${esc(x.id)}">判断・手順を見る</button><button class="btn light small" data-asset-reuse="${esc(x.id)}">複製して、再検証する</button></div></article>`).join('')||'<div class="empty"><div class="icon">↗</div><h3>経験が、次の一品の近道になる。</h3><p>上のボタンで版を残すと、ここに開発レシピが並びます。</p></div>'}</div><div><div class="card"><h3>一本の仕事から、残るもの。</h3>${[['発想の出どころ','選んだ種・材料メモ・確認状態'],['店の判断基準','原価率・追加作業・守る条件'],['試した記録','観察・修正・採否・仕様の版'],['販促の材料','X・プレスリリース・画像指示・台本'],['引継ぎと未確認','次の人が確かめること・止める条件']].map(([a,b],i)=>`<div class="step-card"><span class="mini-num">0${i+1}</span><div><b class="small">${a}</b><p>${b}</p></div></div>`).join('')}</div><div class="card" style="margin-top:18px"><h3>持ち出せる。引き継げる。</h3><p>JSONは編集を続けるためのデータ、引継ぎパックは人が読むためのテキストです。</p><div class="btn-group" style="margin-top:16px"><button class="btn light small" data-act="export-json">全データをJSON保存</button><button class="btn light small" data-act="import-json">JSONを読み込む</button></div><p class="tiny">入力内容や写真を含みます。共有前に内容を確認してください。読み込みは確認後に現在の作業を置き換えます。</p></div><div class="card" style="margin-top:18px"><h3>使いやすさの改善も、残す。</h3><p>このブラウザに記録した声：${S.feedback.length}件。<br>開発者への自動送信はありません。</p><div class="btn-group" style="margin-top:15px"><button class="btn light small" data-act="feedback">感想を残す</button><button class="btn light small" data-act="feedback-export">感想を書き出す</button></div></div><button class="text-btn" style="margin-top:18px;color:var(--red)" data-act="reset">デモを初期状態に戻す</button></div></div>`;}
function openModal(title,body,actions='',wide=false){modalReturn=document.activeElement;$('#modal-root').innerHTML=`<div class="overlay"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title">${esc(title)}</h2><button class="close" data-act="close" aria-label="閉じる">×</button></header>${body}${actions?`<div class="actions">${actions}</div>`:''}</section></div>`;document.body.style.overflow='hidden';requestAnimationFrame(()=>$('.modal .close').focus());}
function closeModal(){document.body.style.overflow='';$('#modal-root').innerHTML='';if(modalReturn?.isConnected)modalReturn.focus();}
function confirmAction(title,body,label,fn){openModal(title,body,`<button class="btn light" data-act="close">やめる</button><button class="btn primary" id="confirm-button">${esc(label)}</button>`);$('#confirm-button').onclick=()=>{closeModal();fn();};}
function guide(){openModal('この順番で、デモを体験できます。',`<p>まずは初期設定の仮想食堂で、1つのメニューを最後まで進めてください。API接続や費用は発生しません。</p>${[['3つの種を掛け合わせる','割る体験・柚子・食感から、南蛮カレーを選びます。'],['店で成立するか、数字で見る','原価率と追加作業が条件を超えていることを確認します。'],['「追いルウ」で、案を直す','試作メモ → 改善案の差分 → 改善後の再確認を体験します。'],['販促と15秒の伝え方を作る','X・プレスリリース・ポスター・動画コンテが同じ商品情報でつながります。'],['店の資産として残す','一式を書き出し、別の担当者が再利用する流れを確認します。']].map(([a,b],i)=>`<div class="guide-item"><b class="small"><span class="stepnum">${i+1}</span>${a}</b><p>${b}</p></div>`).join('')}<div class="notice">URLを受け取った人も同じデモを使えます。ただし入力内容は各自のブラウザだけに保存。APIキー・実際の顧客情報・秘密情報は入力しないでください。</div>`,`<button class="btn primary" data-act="guide-start">体験をはじめる →</button>`);}
function limits(){openModal('このデモで動くこと・未接続のこと',`<div class="grid g2"><div class="card"><span class="badge">動くこと</span><p>種の選択・候補切替<br>価格・原価・作業時間の計算<br>試作記録・改善前後<br>確認項目・デモ承認<br>販促文章の編集と保存<br>ポスターPNG・15秒プレビュー<br>対応環境でWebM保存<br>版の保存・JSONの書出し／復元</p></div><div class="card"><span class="badge orange">未接続</span><p>AIによる自由文の理解・生成<br>X・海外サイトのライブ検索<br>画像／実写動画のAI生成<br>SNS投稿・プレスリリース配信<br>POS・在庫・予約・発注<br>ログイン・会社共有DB<br>サーバー側の権限・承認<br>自動学習・実際の成果測定</p></div></div><div class="notice warn">AIらしく見せるための待ち時間や、架空の検索件数・成功確率は表示しません。計算は通常のプログラム、文章や候補は事前に設計したデモ用テンプレートです。</div><p>本開発では、出典と取得日を残す検索 → 構造化したAI出力 → 計算と安全確認 → 人の承認 → 必要に応じた外部配信へ拡張する想定です。この版はネットワーク通信を行わない設計です。</p>`,`<button class="btn primary" data-act="close">閉じる</button>`,true);}
function settings(){const s=S.settings;openModal('店の条件を仕込む',`<p>条件は採算判定と販促原稿に反映します。自由文の条件は記録のみで、AIによる解釈は行いません。</p><form id="settings-form"><div class="grid g2"><label class="field">店名<input name="store" value="${esc(s.store)}" maxlength="80" required></label><label class="field">届けたい人<input name="customer" value="${esc(s.customer)}" maxlength="160" required></label><label class="field">材料・資材原価率の上限（％）<input name="maxRate" type="number" min="1" max="100" step="0.1" value="${s.maxRate}" required></label><label class="field">追加作業の上限（秒／食）<input name="maxSec" type="number" min="1" max="3600" value="${s.maxSec}" required></label><label class="field">試行予定数（食）<input name="batch" type="number" min="1" max="1000" value="${s.batch}" required></label><label class="field">試行追加固定費（円）<input name="trialFixed" type="number" min="0" max="10000000" value="${s.trialFixed}" required></label><label class="field">追加作業の時給換算（円）<input name="hourly" type="number" min="0" max="10000" value="${s.hourly}" required></label><label class="field">計算に使う税率（％・仮定）<input name="tax" type="number" min="0" max="30" step="0.1" value="${s.tax}" required></label><label class="field">試験販売予定日（未定なら空欄）<input name="launch" type="date" value="${s.launch}"></label></div><label class="field">開発の背景<textarea name="story" rows="2" maxlength="500">${esc(s.story)}</textarea></label><label class="field">変えてはいけないこと（記録用）<textarea name="note" rows="2" maxlength="500">${esc(s.note)}</textarea></label><div class="notice warn">この税率は計算デモ用です。実際の販売方法に適用する税率は店舗で確認してください。変更すると、承認と販促下書きは再確認対象になります。</div><div class="actions"><button type="button" class="btn light" data-act="close">やめる</button><button type="submit" class="btn primary">条件を保存・再計算</button></div></form>`,'',true);$('#settings-form').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;if(!f.reportValidity())return;const d=new FormData(f),next={};for(const k of Object.keys(s))next[k]=['maxRate','maxSec','batch','trialFixed','hourly','tax'].includes(k)?Number(d.get(k)):String(d.get(k)||'').trim();if(!next.store||!next.customer){toast('店名と届けたい人を入力してください。');return;}if(JSON.stringify(next)!==JSON.stringify(s)){S.settings=next;changed('店の条件を変更。仕様と販促の再確認が必要。');}closeModal();render();toast('店の条件を反映しました。');};}
function source(){openModal('自分で見つけた、発想の材料',`<p>海外の事例やXの投稿など、権利のある情報から必要な要点を自分の言葉で残してください。URL先の自動取得はしません。</p><form id="source-form"><label class="field">出典URL（httpsのみ・任意）<input name="url" type="url" placeholder="https://…" value="${esc(S.sourceURL)}"></label><label class="field">何を借りたいか<textarea name="note" rows="5" maxlength="2500">${esc(S.sourceNote)}</textarea></label><div class="notice">この自由文は、開発レシピに記録されます。デモの候補や動画構成へのAI反映は行いません。</div><div class="actions"><button type="button" class="btn light" data-act="close">やめる</button><button class="btn primary">材料メモを保存</button></div></form>`);$('#source-form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.currentTarget),u=String(d.get('url')||'').trim();if(u&&!safeURL(u)){toast('httpsから始まる有効なURLを入力してください。');return;}S.sourceURL=safeURL(u);S.sourceNote=String(d.get('note')||'').trim();changed('発想の材料メモを更新。出典は未取得・未検証。');closeModal();render();toast('材料メモを保存しました。');};}
function selectConcept(i){if(S.seeds.length<2){toast('まず種を2〜3個選んでください。');return;}if(S.selected===i&&S.recipe){go(2);return;}const fn=()=>{S.selected=i;S.recipe=nameSet()[i];S.trials=[];S.trialDraft={note:'',who:'店長（仮想）',sample:false};S.photo=null;imageCache=null;for(const [k,d] of Object.entries(S.drafts))S.oldDrafts.push({kind:k,...d});S.drafts={};changed('育てるメニューを選択。以前の承認・試作確認は引き継がない。');go(2);toast('この一品を育てる準備ができました。');};if(S.recipe)confirmAction('育てるメニューを切り替えますか？','<p>現在の作業中レシピ・試作メモ・写真を別の候補へ切り替えます。必要な記録は先に「店の資産」に保存してください。保存済みの版は消えません。</p>','候補を切り替える',fn);else fn();}
function improve(){if(!S.recipe)return;const r=S.recipe,next=JSON.parse(JSON.stringify(r));if(r.improved){toast('改善例は適用済みです。');return;}next.items=next.items.map(x=>({...x,cost:x.name==='タルタル'?Math.max(0,x.cost-10):x.name==='チーズのトッピング'?Math.max(0,x.cost-22):x.name==='香りの仕上げ'?Math.max(0,x.cost-6):x.cost,qty:x.name==='タルタル'?'減量試作・要実測':x.name==='チーズのトッピング'?'小さなトッピング・要実測':x.name==='香りの仕上げ'?'少量仕上げ・要実測':x.qty}));next.sec=[65,60,35][S.selected];next.improved=true;next.method='店の確認済み条件で作る小さなトッピングに変更し、注文後は盛り付けと香りの仕上げに絞る。実際の使用量・費用・作業時間を実測してから採用する。';openModal('追いルウ：変える点、残す点',`<p>変える：大きな一枚の仕上げ → 小さなトッピング。タルタルと香りの量を調整。<br>残す：食感の変化、カレーの味、食べるときの一手。</p><div class="diff"><div><span class="tiny">現在</span><br><strong>${yen(cost(r))}</strong><br><span class="small">追加 ${r.sec}秒</span></div><span>→</span><div><span class="tiny">改善例</span><br><strong>${yen(cost(next))}</strong><br><span class="small">追加 ${next.sec}秒</span></div></div><div class="notice warn">これは費用と時間を置いた改善例で、実測値ではありません。独自に編集した費用にも、この差分を適用します。承認を解除し、変更後の再確認が必要になります。</div>`,`<button class="btn light" data-act="close">やめる</button><button class="btn primary" id="apply-improve">この改善例を適用する</button>`);$('#apply-improve').onclick=()=>{S.recipe=next;changed(`追いルウ改善例を適用。材料・資材費 ${yen(cost(r))} → ${yen(cost(next))}、追加作業 ${r.sec}秒 → ${next.sec}秒。いずれも仮定。`);S.trialDraft={note:'',who:'店長（仮想）',sample:false};persist();closeModal();render();toast('改善例を適用しました。変更後の試作と再確認へ進んでください。');};}
function feedback(){openModal('使ってみた声を、次の改善に。',`<p>この画面「${esc(steps[view])}」への感想を記録します。開発者への自動送信はありません。「店の資産」から書き出して共有できます。</p><form id="feedback-form"><label class="field">この仕事の進めやすさ<select name="score"><option value="5">5 とても進めやすい</option><option value="4">4 進めやすい</option><option value="3" selected>3 どちらともいえない</option><option value="2">2 迷うところがある</option><option value="1">1 仕事を進められない</option></select></label><label class="field">迷った場所／欲しかったこと<textarea name="note" rows="4" maxlength="2500" required placeholder="例：原価の入力場所がすぐ分かった。写真から材料を入れたい。"></textarea></label><div class="actions"><button type="button" class="btn light" data-act="close">やめる</button><button class="btn primary">このブラウザに記録する</button></div></form>`);$('#feedback-form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.currentTarget),note=String(d.get('note')||'').trim();if(!note)return;S.feedback.push({screen:steps[view],score:Number(d.get('score')),note,date:now()});S.feedback=S.feedback.slice(-50);persist();closeModal();if(view===6)render();toast('感想を保存しました。自動送信はされません。');};}
function download(name,content,type='text/plain;charset=utf-8'){const b=content instanceof Blob?content:new Blob([content],{type});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}
function filename(s){return String(s).replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').slice(0,70);}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('コピーしました。公開前に内容を確認してください。');}catch{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();const ok=document.execCommand('copy');a.remove();if(ok)toast('コピーしました。');else toast('コピーできませんでした。テキスト保存を使ってください。');}}
function scriptText(){return `MENU STUDIO｜ショート動画台本・撮影指示\n仮想デモ／実店舗では公開前に確認\n商品：${S.recipe.name} / 仕様v${S.rev}\n\n`+scenes().map(s=>`${s.t}　${s.title}\nテロップ：${s.line}\n撮影：${s.shot}\nナレーション案：${s.voice}`).join('\n\n')+'\n\n全15秒・縦9:16。実物写真・実写の使用と権利を確認。BGMは未選定。API生成・自動投稿は未接続。';}
function pack(s=S){const r=s.recipe;if(!r)return 'メニューは未選択です。';let net=r.price/(1+s.settings.tax/100),c=cost(r);return `MENU STUDIO｜一品の開発・発売準備パック\n仮想デモ／実店舗の正式承認ではありません\n\n商品：${r.name}\n店舗：${s.settings.store}\n仕様：v${s.rev}\n状態：${s.approval?.rev===s.rev?'デモ承認済み':'未承認・開発メモ'}\n作成日時：${new Date().toLocaleString('ja-JP')}\n\n【完成条件】\n一品の企画、採算、試作記録、販促の下書き、次の担当者への確認事項がそろうこと。実店舗での発売成功・再現性は未確認。\n\n【発想の種】\n${seeds.filter(x=>s.seeds.includes(x.id)).map(x=>x.label+'：'+x.learn+'\n確認点：'+x.risk).join('\n')}\nすべて仮想サンプル。実トレンドの取得ではない。\n追加メモ：${s.sourceNote||'なし'}\n出典メモ：${s.sourceURL||'なし'}（未取得・未検証）\n\n【誰に、何を届けるか】\n対象：${s.settings.customer}\n背景：${s.settings.story}\n${r.desc}\n${r.catch}\n\n【店の条件】\n${s.settings.note}\n材料・資材原価率：${s.settings.maxRate}％以下\n追加作業：${s.settings.maxSec}秒以下\n\n【レシピと数値の仮定】\n${r.items.map(x=>`${x.name} / ${x.qty} / ${yen(x.cost)}`).join('\n')}\n販売価格案：${yen(r.price)}（税込）\n設定税率：${s.settings.tax}％\n税抜売上：${net.toFixed(2)}円\n材料・資材費：${yen(c)}\n材料・資材原価率：${(c/net*100).toFixed(2)}％\n差額：${(net-c).toFixed(2)}円（営業利益ではない）\n追加作業：${r.sec}秒（仮定）\n通常人件費・家賃・光熱費・決済手数料等は含まない。\n\n【作業の案】\n${r.method}\n\n【試作記録】\n${s.trials.map(t=>`v${t.rev} / ${t.who} / ${t.date}\n${t.note}\n${t.sample?'仮想試食サンプル':'利用者入力'}`).join('\n\n')||'未記録'}\n\n【変更と判断の履歴】\n${s.improvements.map(t=>`v${t.rev} / ${t.date}\n${t.note}`).join('\n\n')||'なし'}\n\n【停止・確認条件】\n${r.allergens}\n不明な原材料、衛生・保管条件、権利のある画像、実物と一致しない広告は、責任者が確認するまで使用しない。\n\n【次の担当者が確認すること】\n実物試作、実際の仕入れ原価、作業時間、試験販売結果、別担当による再現性。\n他店へ移す場合は設備・技能・客層・仕入れ条件を再確認。\n\n【販促の保存原稿】\n${Object.entries(s.drafts).map(([k,d])=>`${k} / 原稿v${d.rev}${d.rev===s.rev?'':'（旧仕様・再確認）'}\n${d.text}`).join('\n\n')||'未編集。アプリの販促画面から下書きを作成してください。'}\n\n保存先：現在のブラウザ。会社の共有DB・権限・外部配信は未接続。`;}
function fullPack(){for(const k of ['x','press','staff','image'])if(!S.drafts[k])S.drafts[k]={text:makeDraft(k),rev:S.rev,edited:false};persist();return pack()+'\n\n【ショート動画台本】\n'+scriptText();}
function saveAsset(){if(!S.recipe)return;if(S.library.length>=12){toast('デモでは12件までです。JSONを書き出してから初期化してください。');return;}for(const k of ['x','press','staff','image'])if(!S.drafts[k])S.drafts[k]={text:makeDraft(k),rev:S.rev,edited:false};const snap=JSON.parse(JSON.stringify({...S,library:[],feedback:[],oldDrafts:[],photo:null}));S.library.push({id:'asset-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name:S.recipe.name,date:now(),status:approved()?'デモ承認済み':'開発メモ',snapshot:snap});persist();render();toast('この版を保存しました。古い版はそのまま残ります。');}
function reuse(id){const a=S.library.find(x=>x.id===id);if(!a)return;confirmAction('保存したレシピを複製しますか？','<p>現在の作業を複製版に切り替えます。必要な作業は先に保存してください。承認と試作記録は引き継がず、もう一度確かめる状態で開始します。</p>','複製して再検証を始める',()=>{const keep={library:S.library,feedback:S.feedback},n=validateState(a.snapshot);S={...n,...keep};S.approval=null;S.trials=[];S.trialDraft={note:'',who:'店長（仮想）',sample:false};S.photo=null;imageCache=null;S.recipe.name=(S.recipe.name+'・再検証').slice(0,100);changed(`保存レシピ「${a.name}」から複製。条件と再現性を再確認する。`);go(2);toast('再利用を開始しました。承認は引き継いでいません。');});}
function drawDish(ctx,cx,cy,scale=1,type=0){ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);ctx.shadowColor='#152f2540';ctx.shadowBlur=25;ctx.shadowOffsetY=15;ctx.fillStyle='#fffcef';ctx.beginPath();ctx.ellipse(0,0,166,129,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.fillStyle='#e9e4d3';ctx.beginPath();ctx.ellipse(0,0,142,106,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fcf7e9';ctx.beginPath();ctx.ellipse(35,-10,91,84,-.15,0,Math.PI*2);ctx.fill();ctx.fillStyle=['#a65a2a','#b85c32','#bd8041'][type]||'#a65a2a';ctx.beginPath();ctx.ellipse(-37,17,103,85,.15,0,Math.PI*2);ctx.fill();for(const [x,y,rot] of [[-50,-19,-.3],[18,-14,.3],[-23,37,.2]]){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle='#bc782f';roundRect(ctx,-33,-25,64,44,14);ctx.fill();ctx.fillStyle='#e0a250';roundRect(ctx,-30,-26,59,35,12);ctx.fill();ctx.fillStyle='#fff0c3';roundRect(ctx,-24,-21,49,18,7);ctx.fill();ctx.fillStyle='#568842';ctx.beginPath();ctx.arc(-5,-12,3,0,7);ctx.arc(11,-9,2,0,7);ctx.fill();ctx.restore();}ctx.fillStyle='#67934d';ctx.beginPath();ctx.ellipse(-12,-64,21,9,-.5,0,7);ctx.ellipse(10,-62,20,9,.35,0,7);ctx.fill();ctx.fillStyle='#ddbc3a';ctx.beginPath();ctx.arc(85,-49,25,-2.8,.5);ctx.lineTo(78,-45);ctx.fill();ctx.fillStyle='#f6e3a0';ctx.beginPath();ctx.arc(85,-49,18,-2.8,.5);ctx.lineTo(79,-45);ctx.fill();ctx.fillStyle='#d8a44a';for(const [x,y]of [[-74,50],[-33,-74],[54,48]]){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+25,y+8);ctx.lineTo(x+8,y+28);ctx.closePath();ctx.fill();}ctx.restore();}
function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}
function canvasText(c,text,x,y,width,size=28,color='#203c32',weight=700,lineHeight=1.5,maxLines=8){c.fillStyle=color;c.font=`${weight} ${size}px "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif`;c.textBaseline='top';let lines=[],line='';for(const char of String(text)){if(char==='\n'){lines.push(line);line='';continue;}if(c.measureText(line+char).width>width&&line){lines.push(line);line=char;}else line+=char;}if(line)lines.push(line);if(lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].slice(0,-1)+'…';}lines.forEach((l,i)=>c.fillText(l,x,y+i*size*lineHeight));return lines.length*size*lineHeight;}
function getPhoto(cb){if(!S.photo)return null;if(imageCache?.src===S.photo&&imageCache.complete&&imageCache.naturalWidth)return imageCache;const im=new Image();im.onload=()=>{imageCache=im;cb?.();};im.onerror=()=>toast('画像を読み込めませんでした。別の写真を選んでください。');im.src=S.photo;imageCache=im;return null;}
function cover(ctx,img,x,y,w,h){const sc=Math.max(w/img.width,h/img.height),sw=w/sc,sh=h/sc;ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h);}
function drawPoster(){const el=$('#poster');if(!el||!S.recipe)return;const c=el.getContext('2d'),dark=S.posterStyle==='dark',r=S.recipe;c.fillStyle=dark?'#183d30':'#f4edda';c.fillRect(0,0,720,960);c.strokeStyle=dark?'#bace9360':'#bca96b77';c.lineWidth=2;c.strokeRect(27,27,666,906);canvasText(c,'MENU STUDIO  /  CONCEPT',53,53,610,18,dark?'#cfdf9e':'#5b7258',600);canvasText(c,r.catch,53,105,600,40,dark?'#f9f5dd':'#214132',800,1.45,3);const im=getPhoto(()=>{if(view===4)drawPoster();});if(im){c.save();roundRect(c,70,296,580,363,18);c.clip();cover(c,im,70,296,580,363);c.restore();}else drawDish(c,357,478,1.7,S.selected||0);canvasText(c,r.name,55,677,610,37,dark?'#f4f1df':'#234332',800,1.4,2);canvasText(c,yen(r.price)+' 税込・価格案',55,793,610,35,dark?'#e8dca8':'#bb6639',700);canvasText(c,S.settings.store+'  /  試験販売を準備中',55,852,610,19,dark?'#ccd6bb':'#6e7b61',500,1.5,2);canvasText(c,S.photo?'仮想デモ・利用者提供画像・公開前に実物と権利を確認':'仮想デモ・コンセプトイラスト・実物未撮影',55,905,610,14,dark?'#cfdbbb':'#64725a',500);}
function drawFrame(t){const el=$('#video');if(!el||!S.recipe)return;const c=el.getContext('2d'),ss=scenes(),idx=t<3?0:t<7?1:t<11?2:3,s=ss[idx],start=[0,3,7,11][idx],part=Math.min(1,(t-start)/.5),fade=Math.max(.2,part);c.fillStyle='#183d30';c.fillRect(0,0,540,960);c.strokeStyle='#c9d79355';c.lineWidth=1;c.strokeRect(24,24,492,912);canvasText(c,'MENU STUDIO / STORYBOARD',42,45,456,13,'#bdd18e',600);c.save();c.globalAlpha=fade;canvasText(c,s.line,44,112-(1-part)*12,452,37,'#fff6dc',800,1.55,4);const im=getPhoto(()=>{if(view===5&&!raf)drawFrame(t);});if(im){c.save();roundRect(c,41,395,458,336,15);c.clip();cover(c,im,41,395,458,336);c.restore();}else{const scale=1.3+(Math.sin(t*.4)*.035);drawDish(c,270,570,scale,S.selected||0);}canvasText(c,idx===3?S.settings.store:'食感の先に、店の物語を。',43,785,454,23,'#dceba9',600,1.5,2);c.restore();c.fillStyle='#d6e897';c.fillRect(44,876,452*Math.min(1,t/15),4);c.fillStyle='#607952';c.fillRect(44+452*Math.min(1,t/15),876,452*(1-Math.min(1,t/15)),4);canvasText(c,'仮想デモ / '+(S.photo?'利用者提供写真':'イメージイラスト')+' / 無音',44,900,454,12,'#b5c4a1',500);if($('#video-time'))$('#video-time').textContent=t.toFixed(1)+' / 15秒';if($('#video-scrub'))$('#video-scrub').value=t;}
function animate(ts){if(!playStart)playStart=ts;vProgress=Math.min(15,(ts-playStart)/1000);drawFrame(vProgress);if(vProgress<15){raf=requestAnimationFrame(animate);}else{raf=0;$('#play-button')&&($('#play-button').textContent='▶ もう一度見る');if(recording&&recorder?.state==='recording'){recorder.stop();}}}
function startPlay(){if(raf){stopPlay();return;}vProgress=0;playStart=0;$('#play-button')&&($('#play-button').textContent='Ⅱ 停止');raf=requestAnimationFrame(animate);}
function stopPlay(){if(raf)cancelAnimationFrame(raf);raf=0;playStart=0;$('#play-button')&&($('#play-button').textContent='▶ 15秒プレビュー');}
function recordVideo(){const canvas=$('#video');if(!canvas||recording)return;if(!canvas.captureStream||!window.MediaRecorder){toast('このブラウザはWebM書き出しに未対応です。台本の保存とプレビューをご利用ください。');return;}const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime){toast('WebM保存に未対応です。別の対応ブラウザでお試しください。');return;}stopPlay();drawFrame(0);let stream;try{stream=canvas.captureStream(24);recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1600000});}catch{stream?.getTracks().forEach(t=>t.stop());toast('動画の保存を開始できません。プレビューと台本保存をご利用ください。');return;}const chunks=[];recording=true;$('#record-button').disabled=true;$('#play-button').disabled=true;$('#video-scrub').disabled=true;$('#video-status').innerHTML='<div class="notice">15秒のコンテを記録中です。この画面のまま再生します。</div>';recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onerror=()=>{recording=false;stream.getTracks().forEach(t=>t.stop());stopPlay();render();toast('動画の書き出しに失敗しました。台本保存をご利用ください。');};recorder.onstop=()=>{recording=false;stream.getTracks().forEach(t=>t.stop());$('#record-button').disabled=false;$('#play-button').disabled=false;$('#video-scrub').disabled=false;const blob=new Blob(chunks,{type:'video/webm'});if(blob.size){download(filename(S.recipe.name)+'_15秒コンテ_デモ.webm',blob);$('#video-status').innerHTML='<div class="notice">WebMを書き出しました。無音の文字アニメーション・仮想デモです。</div>';toast('15秒のWebMを保存しました。');}else toast('動画データを作成できませんでした。');};recorder.start();startPlay();}
const actions={
menu:()=>{const open=$('#side').classList.toggle('open');$('.mobile-menu').setAttribute('aria-expanded',String(open));},close:closeModal,guide,'guide-start':()=>{closeModal();go(0);},limits,settings,source,feedback,
rename:()=>{if(!S.recipe)return;openModal('商品の名前を編集',`<label class="field">メニュー名<input id="new-name" maxlength="100" value="${esc(S.recipe.name)}"></label><label class="field">伝える一文<input id="new-catch" maxlength="200" value="${esc(S.recipe.catch)}"></label>`,`<button class="btn light" data-act="close">やめる</button><button class="btn primary" id="save-name">保存する</button>`);$('#save-name').onclick=()=>{const n=$('#new-name').value.trim(),ca=$('#new-catch').value.trim();if(!n||!ca){toast('名前と伝える一文を入力してください。');return;}S.recipe.name=n;S.recipe.catch=ca;changed('商品名または伝える一文を変更。販促の再確認が必要。');closeModal();render();};},
'sample-note':()=>{if(!S.recipe)return;const note=S.recipe.improved?'【仮想の再試作記録】小さなトッピングでも食感を楽しめる想定。仕上げを減らした仕様で再検証する。原価・作業時間はまだ仮定で、実店舗での計測が必要。':'【仮想の試作記録】食感の変化は楽しい想定だが、一皿ごとの仕上げが重い。柚子の香りも強すぎる可能性。小さなトッピングと少量の仕上げへ直して、もう一度試したい。';$('#trial-note').value=note;$('#taster').value='店長（仮想）';S.trialDraft={note,who:'店長（仮想）',sample:true};persist();toast('仮想の試食メモを入れました。保存して次へ進めます。');},
'save-trial':()=>{const note=$('#trial-note').value.trim(),who=$('#taster').value.trim();if(!note||!who){toast('確認した人と試作メモを入力してください。');return;}S.trials.push({note,who,date:now(),rev:S.rev,sample:!!S.trialDraft?.sample});S.trials=S.trials.slice(-50);S.trialDraft={note:'',who,sample:false};S.approval=null;for(const k of Object.keys(S.checks))S.checks[k]=false;persist();render();toast('試作記録を保存しました。内容を踏まえ、確認項目を見直してください。');},improve,
approve:()=>{if(!canApprove()){toast('現在の仕様の試作記録と確認項目、数値条件を確認してください。');return;}S.approval={rev:S.rev,date:now(),who:'店長（仮想・デモ確認）'};persist();render();toast('デモ上で承認しました。実店舗の正式承認ではありません。');},
regenerate:()=>confirmAction('現在の仕様で作り直しますか？','<p>編集内容を含む現在の下書きを旧版として保管し、現在の仕様からテンプレートを組み直します。</p>','最新版で作り直す',()=>{S.oldDrafts.push({kind:promoTab,...draft(promoTab)});S.oldDrafts=S.oldDrafts.slice(-15);S.drafts[promoTab]={text:makeDraft(promoTab),rev:S.rev,edited:false};persist();render();toast('現在の仕様で下書きを作り直しました。');}),
'copy-draft':()=>{const d=draft(promoTab);copyText((d.rev!==S.rev?'【旧版・仕様変更あり。公開前に再確認】\n':'')+d.text);},
'download-draft':()=>{const d=draft(promoTab);download(filename(S.recipe.name)+'_'+promoTab+'_下書き.txt',(d.rev!==S.rev?'【旧版・仕様変更あり。公開前に再確認】\n':'')+d.text);toast('下書きをテキストで保存しました。');},
photo:()=>$('#imagefile').click(), 'remove-photo':()=>{S.photo=null;imageCache=null;changed('販促写真を取り外し。画像と宣伝文の再確認が必要。');render();},
'poster-style':()=>{S.posterStyle=S.posterStyle==='warm'?'dark':'warm';persist();drawPoster();},
'download-poster':()=>{const c=$('#poster');if(!c)return;c.toBlob(b=>{if(b){download(filename(S.recipe.name)+'_コンセプトポスター.png',b);toast('コンセプトポスターをPNGで保存しました。');}else toast('画像を保存できませんでした。');},'image/png');},
play:()=>{if(!recording)startPlay();},record:recordVideo,'script-download':()=>{download(filename(S.recipe.name)+'_15秒台本.txt',scriptText());toast('台本と撮影指示を保存しました。');},
'save-asset':saveAsset,'export-pack':()=>{if(S.recipe){download(filename(S.recipe.name)+'_発売準備パック.txt',fullPack());toast('企画・試作・販促・台本をまとめて保存しました。');}},
'export-json':()=>{download('MENU_STUDIO_全データ_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,2),'application/json');toast('編集用データを書き出しました。共有前に内容を確認してください。');},'import-json':()=>$('#restorefile').click(),
'feedback-export':()=>{download('MENU_STUDIO_利用者の声.txt','MENU STUDIO 利用者の声（このブラウザの記録）\n\n'+(S.feedback.map(x=>`${x.date} / ${x.screen} / 進めやすさ ${x.score}/5\n${x.note}`).join('\n\n')||'まだ記録はありません。'));},
reset:()=>confirmAction('このデモの保存データを初期化しますか？','<p>このブラウザ内の作業・保存版・感想・写真を削除します。他のアプリには影響しません。必要なデータは、先にJSONで書き出してください。</p>','このデモだけ初期化する',()=>{S=initial();imageCache=null;search='';filter='すべて';persist();go(0);toast('初期状態に戻しました。');})};
document.addEventListener('click',e=>{const el=e.target.closest('button,[data-act]');if(!el||el.disabled)return;if(el.dataset.act&&actions[el.dataset.act])return actions[el.dataset.act]();if(el.dataset.go!==undefined)return go(Number(el.dataset.go));if(el.dataset.filter){filter=el.dataset.filter;render();return;}if(el.dataset.seed){const id=el.dataset.seed;if(S.seeds.includes(id))S.seeds=S.seeds.filter(x=>x!==id);else if(S.seeds.length<3)S.seeds.push(id);else{toast('種は3つまで選べます。ひとつ外して組み替えてください。');return;}changed('発想の種を変更。既に選んだレシピは自動で書き換えない。');render();return;}if(el.dataset.seedDetail){const x=seeds.find(x=>x.id===el.dataset.seedDetail);openModal(x.label,`<span class="badge gray">仮想シード・実トレンド未取得</span><p>${esc(x.hint)}</p><h3 style="margin-top:18px">借りるもの</h3><p>${esc(x.learn)}</p><h3 style="margin-top:18px">現場で確かめるもの</h3><p>${esc(x.risk)}</p><div class="notice">本開発時の検索語の例：${esc(x.query)}<br>実投稿の無断複製や、検索結果を根拠のない人気ランキングにする設計はしません。</div>`,`<button class="btn primary" data-act="close">閉じる</button>`);return;}if(el.dataset.select!==undefined)return selectConcept(Number(el.dataset.select));if(el.dataset.tab){promoTab=el.dataset.tab;render();return;}if(el.dataset.assetView){const a=S.library.find(x=>x.id===el.dataset.assetView);if(a)openModal('保存した判断と手順',`<pre>${esc(pack(a.snapshot))}</pre>`,`<button class="btn primary" data-act="close">閉じる</button>`,true);return;}if(el.dataset.assetReuse)return reuse(el.dataset.assetReuse);});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='seed-search'){search=el.value;const a=el.selectionStart;const list=seeds.filter(x=>(filter==='すべて'||x.kind===filter)&&(!search||(x.label+x.kind+x.hint+x.query).toLowerCase().includes(search.toLowerCase())));$('#seed-grid').innerHTML=list.map(seedCard).join('')||'<div class="notice">一致するサンプルがありません。</div>';return;}if(el.id==='draft-text'){const old=draft(promoTab);S.drafts[promoTab]={text:el.value,rev:old.rev,edited:true};$('#draft-count').textContent=Array.from(el.value).length+'文字（簡易計測）';persist();return;}if(el.id==='trial-note'||el.id==='taster'){S.trialDraft={note:$('#trial-note').value,who:$('#taster').value,sample:el.id==='trial-note'?false:!!S.trialDraft?.sample};persist();return;}if(el.id==='video-scrub'){if(recording)return;stopPlay();vProgress=Number(el.value);drawFrame(vProgress);}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.recipe){if(el.value.trim()===''||!el.checkValidity()||!Number.isFinite(Number(el.value))){toast('有効な数値を入力してください。空欄はゼロに変換しません。');el.value=S.recipe[el.dataset.recipe];return;}const key=el.dataset.recipe,val=Number(el.value);if(val!==S.recipe[key]){S.recipe[key]=val;changed(key==='price'?'販売価格案を変更。販促と承認を再確認。':'追加作業の仮定を変更。現場で実測が必要。');render();}return;}if(el.dataset.cost!==undefined){const idx=Number(el.dataset.cost);if(el.value.trim()===''||!el.checkValidity()||!Number.isFinite(Number(el.value))){toast('0以上の費用を入力してください。空欄は未入力です。');el.value=S.recipe.items[idx].cost;return;}const val=Number(el.value);if(val!==S.recipe.items[idx].cost){S.recipe.items[idx].cost=val;changed('材料・資材費を変更。原価と販促を再確認。');render();}return;}if(el.dataset.qty!==undefined){S.recipe.items[Number(el.dataset.qty)].qty=el.value;changed('使用量メモを変更。費用は連動しないため別途確認。');return;}if(el.dataset.check){S.checks[el.dataset.check]=el.checked;S.approval=null;persist();render();return;}});
document.addEventListener('keydown',e=>{if(!$('.overlay'))return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const list=Array.from($('.modal').querySelectorAll('button:not(:disabled),input,textarea,select,a[href]')).filter(x=>x.offsetParent!==null);if(!list.length)return;const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}});
$('#imagefile').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>5*1024*1024){toast('JPEG・PNG・WebPの5MB以下の画像を選んでください。');return;}const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{try{const sc=Math.min(1,800/Math.max(im.width,im.height)),ca=document.createElement('canvas');ca.width=Math.round(im.width*sc);ca.height=Math.round(im.height*sc);ca.getContext('2d').drawImage(im,0,0,ca.width,ca.height);const data=ca.toDataURL('image/jpeg',.82);if(data.length>900000)throw Error('size');S.photo=data;imageCache=null;changed('利用者の写真を追加。実物との一致と掲載権利を再確認。');render();toast('写真をこのブラウザに取り込みました。外部送信していません。');}catch{toast('画像を処理できません。小さい画像でお試しください。');}finally{URL.revokeObjectURL(u);}};im.onerror=()=>{URL.revokeObjectURL(u);toast('画像を読み込めませんでした。');};im.src=u;});
$('#restorefile').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;if(f.size>4*1024*1024){toast('4MB以下のJSONファイルを選んでください。');return;}try{const out=validateState(JSON.parse(await f.text()));confirmAction('JSONの内容で作業を置き換えますか？',`<p>取り込む商品：${esc(out.recipe?.name||'未選択')}<br>保存版：${out.library.length}件<br>現在の作業は置き換わります。必要な内容は先に書き出してください。</p><div class="notice">取り込んだ承認は解除し、内容を再確認する状態にします。プログラムや外部リンクの自動実行は行いません。</div>`,'読み込んで再確認する',()=>{S=out;imageCache=null;S.approval=null;for(const k of Object.keys(S.checks))S.checks[k]=false;persist();go(S.recipe?6:0);toast('データを読み込みました。内容と承認を再確認してください。');});}catch(err){toast('読み込めません：'+(err.message||'ファイル形式を確認してください。'));}});
window.addEventListener('beforeunload',e=>{if(recording){e.preventDefault();e.returnValue='';}});
render();
</script>
</body></html>

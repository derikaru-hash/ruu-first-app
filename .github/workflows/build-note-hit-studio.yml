name: Build and verify Note Hit Studio
on:
  push:
    branches: [main]
    paths: ['note-hit-studio-build/publish.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: note-hit-studio-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore and validate the isolated application
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma, re, subprocess
          root = Path('note-hit-studio-build')
          manifest = json.loads((root / 'publish.json').read_text())
          assert manifest['parts'] == 4
          encoded = ''.join((root / ('part-%02d.b64' % i)).read_text().strip() for i in range(manifest['parts']))
          assert len(encoded) == manifest['encoded_length'], 'Encoded length mismatch'
          raw = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=128*1024*1024)
          assert len(raw) == manifest['raw_length'], 'HTML size mismatch'
          assert hashlib.sha256(raw).hexdigest() == manifest['sha256'], 'HTML checksum mismatch'
          html = raw.decode('utf-8')
          assert 'Note Hit Studio' in html and "connect-src 'none'" in html
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert len(scripts) == 1, 'Unexpected script count'
          expected_csp = 'sha256-' + base64.b64encode(hashlib.sha256(scripts[0].encode()).digest()).decode()
          assert expected_csp in html, 'CSP mismatch'
          temporary = Path('/tmp/note-hit-studio-script.js')
          temporary.write_text(scripts[0])
          subprocess.run(['node', '--check', str(temporary)], check=True)
          target = Path('note-hit-studio')
          target.mkdir(exist_ok=True)
          (target / 'index.html').write_bytes(raw)
          print('HTML verified:', len(raw), 'bytes;', manifest['sha256'])
          PY
      - name: Publish only Note Hit Studio without changing existing applications
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add note-hit-studio/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(note-hit-studio): publish editorial studio demo v1.0.0'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Verify the public release without login credentials
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, time, urllib.request
          from pathlib import Path
          expected = json.loads(Path('note-hit-studio-build/publish.json').read_text())['sha256']
          url = 'https://ruu-first-app.vercel.app/note-hit-studio/'
          result = {'url': url, 'expected_sha256': expected, 'verified': False, 'authentication': 'none'}
          for i in range(36):
              try:
                  request = urllib.request.Request(url + '?verify=' + expected[:12], headers={'User-Agent': 'Note-Hit-Studio-Public-Verification/1.0'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      raw = response.read()
                      result.update(status=response.status, final_url=response.url, sha256=hashlib.sha256(raw).hexdigest())
                  if result['status'] == 200 and result['sha256'] == expected:
                      result['verified'] = True
                      result.pop('last_error', None)
                      print('PUBLIC VERIFIED: HTTP 200, SHA256 MATCH, NO AUTH:', url)
                      break
                  print('Waiting for expected release:', result['status'])
              except Exception as e:
                  result['last_error'] = str(e)[:250]
                  print('Waiting for public release:', result['last_error'])
              time.sleep(8)
          result['checked_at_utc'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          report = json.dumps(result, indent=2)
          Path('/tmp/note-hit-studio-public-check.json').write_text(report)
          if not result['verified']:
              raise SystemExit('The expected release could not yet be verified publicly.')
          Path('note-hit-studio-build/public-check.json').write_text(report + '\n')
          PY
      - name: Record the isolated public verification report
        run: |
          git add note-hit-studio-build/public-check.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(note-hit-studio): record anonymous HTTP and release checksum verification'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: note-hit-studio-public-verification
          path: /tmp/note-hit-studio-public-check.json
          if-no-files-found: ignore
          retention-days: 7

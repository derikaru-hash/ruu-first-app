<script>/* Restaurant OS — local demonstration state and deterministic business rules.

  const KEY='ruu.restaurant-os.v1.0';

  const round=n=>Math.round((n+Number.EPSILON)*10000)/10000;
  const num=(v,label,min=0,max=100000)=>{if(v===''||v===null||typeof v==='boolean')throw Error(label+'を入力してください');let x=Number(v);if(!Number.isFinite(x)||x<min||x>max)throw Error(label+'は'+min+'〜'+max+'の数値にしてください');return round(x)};

  let savedOk=true,conflict=false,state;

  function stock(item,store=0,s=state){return round((s.openings[store]?.[item]||0)+s.ledger.filter(e=>e.item===item&&e.store===store).reduce((n,e)=>n+e.qty,0))}

  function receiptPage(){let s=S(),v=s.receipt;return head('RECEIVE → INVENTORY','届いたら、その場で確認。','数量を確定すると、在庫・原価・注文との差が同時に更新されます。')+recordNav('record/receive')+`<div class="grid2"><section class="card">${title('納品を確認する',badge(v?'検品済み・訂正可能':'確認待ち',v?'green':'orange'))}<div class="between"><div><h3>鶏もも肉</h3><p class="small muted">サンプル食材卸｜注文 PO-DEMO-001</p></div>${badge('注文 40kg')}</div><div class="divider"></div><div class="form-grid">${field('receiptQty','届いた数量',{step:.1,max:500,disabled:!!s.count,hint:s.count?'棚卸し後の過去数量訂正は対象外':'袋とkgを、共通のkgへ換算'})}<div class="field"><label for="f-receiptUnit">数量の単位</label><select id="f-receiptUnit" data-draft="receiptUnit" ${s.count?'disabled':''}><option value="bag" ${s.drafts.receiptUnit==='bag'?'selected':''}>袋（1袋 = 2kg）</option><option value="kg" ${s.drafts.receiptUnit==='kg'?'selected':''}>kg</option></select><div class="hint">1袋の規格は、食材台帳で定義。</div></div>${field('receiptPrice','今回の仕入れ価格（円 / kg）',{min:1,max:10000,hint:'税抜で統一。過去の確定売上は書き換えません。'})}<div class="field"><span class="field-label">今回の納品量</span><div class="status-card"><strong class="num" style="font-size:23px" id="receive-live-qty">${fmt(Number(s.drafts.receiptQty)*(s.drafts.receiptUnit==='bag'?2:1))} kg</strong><div class="tiny muted">確認前の試算</div></div></div><div class="field-full"><label class="photo-uploader">${s.photo?`<img class="photo-preview" src="${s.photo}" alt="このブラウザに保存した確認用写真">`:icon('camera','lg')}<strong>${s.photo?'写真を差し替える':'納品書・現物の写真を添える'}</strong><small>証拠写真として保存。AI読取りは未接続です。</small><input type="file" id="photo-file" accept="image/jpeg,image/png,image/webp" capture="environment"></label></div></div><div class="form-action"><span class="save-info">入力途中も、このブラウザに保存。</span>${button('receive',v?'訂正を記録する':'確認して在庫へ反映','btn primary','','check')}</div></section><aside class="stack"><section class="card">${title('この記録で、変わるもの')}${detail('手元の在庫（確定）',fmt(R.stock('chicken'))+' kg')}${detail('現在の基準価格',yen(s.prices.chicken)+' / kg')}${detail('南蛮カレー食材原価（現在）',yen(R.cost(R.recipe())))}${detail('価格を反映した場合の試算',`<span id="receive-live-cost">${yen(Number(s.drafts.receiptPrice)*.2+246)}</span>`)}<div class="divider"></div>${note('レシピは鶏肉200g・米80g・カレー180g・ソース30g。食材費のみで、人件費・家賃等を引いた利益ではありません。')}${v?`<div class="mt">${note(v.qty===40?'注文40kgと納品量が一致しています。':'注文40kgに対して納品'+v.qty+'kg。差額・未納品の理由を確認してください。',v.qty===40?'':'warn')}</div>`:''}</section><section class="card ruu-card"><div class="ruu-label">${icon('bowl','sm')}値段を見て終わらない</div><h3>「値上がりした」から、<br>「どの一皿に影響するか」へ。</h3><p class="ruu-desc">仕入れ価格を変えると、同じ食材を使う商品の試算も連動します。</p></section></aside></div>${v?nextPanel('record/sales','納品が、営業の材料になりました。','次は販売数を反映して、使った食材を計算します。','売上を反映する'):''}`}
  function salesPage(){let s=S(),rec=R.recipe();return head('SALES → INGREDIENTS','売れた一皿を、材料に戻す。','累計販売数を更新。前回との差だけ反映するので、二重に減りません。')+recordNav('record/sales')+`<div class="grid2"><section class="card">${title('本日の販売を反映',badge('POS未接続・手入力 / CSV'))}<div class="mini-product">${food()}<div><h3>チキン南蛮カレー</h3><p class="small muted">販売単価 1,100円（税抜・仮想）</p></div></div><div class="form-grid">${field('salesQty','当日の累計販売数（食）',{max:1000,hint:'すでに反映した数は '+(s.sales?.count||0)+'食',disabled:!!s.count})}<div class="field"><span class="field-label">鶏肉の理論使用量</span><div class="status-card"><strong class="num" id="sales-live-kg" style="font-size:24px">${fmt(Number(s.drafts.salesQty)*.2)} kg</strong><div class="tiny muted">1食200g × 販売数</div></div></div></div><div class="form-action"><span class="save-info">棚卸し前なら、累計の訂正ができます。</span>${button('sell',s.sales?'累計の訂正を反映':'販売数を在庫へ反映','btn primary',s.count?'disabled':'','check')}</div><div class="divider"></div><div class="between wrap"><span class="small muted">CSVでも入力できます。</span><div class="row">${button('sales-template','見本CSV','btn sm','','download')}<label class="btn sm">${icon('file','sm')}CSVを読む<input type="file" accept=".csv,text/csv" id="sales-csv" hidden></label></div></div><p class="tiny muted mt">対応列：商品コード,数量 ／ nanban の1行。取込みは入力補助で、反映には上の確認操作が必要です。</p></section><aside class="stack"><section class="card">${title('一皿と食材のつながり')}<div class="detail-list">${rec.map(e=>detail(R.items[e.item].name,fmt(e.qty*1000)+' g / 食')).join('')}</div><div class="divider"></div>${s.sales?`${detail('確定時の1食食材原価',yen(s.sales.unitCost))}${detail('確定販売数',s.sales.count+' 食')}${note('販売時のレシピと原価を保存済み。後から仕入れ価格を変えても、この記録は変わりません。')}`:note('数字はプログラムで計算します。AIに数量を推測させません。')}</section></aside></div>${s.sales?nextPanel('record/count','販売分の食材を反映しました。','「あるはず」と「実際にある」を棚卸しで比べます。','棚卸しへ進む'):''}`}
  function countPage(){let s=S(),c=s.count,current=R.stock('chicken');return head('COUNT → TOMORROW','「あるはず」と、実物を比べる。','差は原因未確認として残し、実際にある量から明日の仕事を組みます。')+recordNav('record/count')+`<div class="grid2"><section class="card">${title('鶏肉の棚卸し',badge(c?'確定済み':'実物を確認',c?'green':'orange'))}<div class="equation"><div class="box"><small>現在の帳簿在庫</small><strong>${fmt(current)}<small> kg</small></strong></div><span>−</span><div class="box"><small>今回記録する廃棄</small><strong id="count-live-waste">${fmt(s.drafts.wasteQty)}<small> kg</small></strong></div><span>→</span><div class="box total"><small>あるはずの量</small><strong id="count-live-expected">${fmt(current-Number(s.drafts.wasteQty))}<small> kg</small></strong></div></div><div class="form-grid">${field('wasteQty','今回記録する廃棄量（kg）',{step:.1,max:50,hint:c?'再棚卸しでは0にしてください':'廃棄は、差異と分けて記録します'})}${field('countActual','実際に数えた量（kg）',{step:.1,max:500,hint:'開封品も実測。同じ重量基準で比較。'})}${field('wasteReason','廃棄の理由',{type:'text',full:true})}</div><div class="mt">${note('写真だけでは、袋の奥や容器内の数量は確定できません。このデモでは人が確認した数量を入力します。')}</div><div class="form-action"><span class="save-info">実測へ在庫を補正し、その理由は別の仕事へ。</span>${button('count',c?'再棚卸しを記録':'棚卸しを確定','btn primary','','check')}</div></section><aside class="stack"><section class="card">${title('差を、犯人探しにしない。')}${c?`<div class="score-summary"><div class="task-dot orange">${icon('alert')}</div><div><div class="metric-number num" style="margin:0">${fmt(Math.abs(c.delta))}<span>kg</span></div><span class="small muted">記録された差異 / ${s.diffResolved?'確認済み':'原因未確認'}</span></div></div><div class="divider"></div>${detail('確定前の理論在庫',fmt(c.expected)+' kg')}${detail('棚卸し時の実在庫',fmt(c.actual)+' kg')}${detail('別に記録した廃棄',fmt(c.waste)+' kg')}<div class="mt">${note('単位の読み違い・未記録の使用・実測の誤りなどを確認します。差異を廃棄や不正と自動判定しません。','orange')}</div><div class="mt">${button('resolve-diff',s.diffResolved?'確認内容を見る':'確認した内容を残す','btn wide','','clipboard')}</div>`:`<p class="sales-note">たとえば、理論19kgに対して実物17kgなら、2kgを未確認差異として残します。</p><div class="divider"></div><div class="note-block">「原価が悪い店長」を探す前に、どこで数がずれたのかを確かめる。</div>`}</section><section class="card">${title('明日の発注へ引き継ぐ')}${detail('明日の仮置き必要量',fmt(R.orderCalc().required)+' kg')}${detail('現在の手元',fmt(current)+' kg')}${detail('入荷予定を除いた不足',fmt(R.orderCalc().need)+' kg')}<p class="tiny muted mt">予定食数は次の画面で変更できます。</p></section></aside></div>${c?nextPanel('orders','棚卸しが、発注の根拠になりました。','買い足す前に、系列店で融通できる量も確認します。','発注案を見る'):''}`}
  function inventoryPage(){let s=S(),keys=Object.keys(R.items).filter(k=>!k.startsWith('sample_')||R.stock(k)>0);return head('SHARED INGREDIENT BOOK','同じ食材を、同じ台帳で。','納品・販売・棚卸し・移動。すべての動きが、ここに戻ってきます。',button('export-stock','在庫CSV','btn','','download'))+recordNav('inventory')+`<section class="card">${title('本店の食材台帳',badge('更新 '+when(s.saved),'green'))}<div class="table-wrap"><table class="table"><thead><tr><th>食材</th><th class="numeric">手元の在庫</th><th class="numeric">基準仕入れ価格</th><th class="numeric">参考在庫金額</th><th>つながる仕事</th></tr></thead><tbody>${keys.map(k=>`<tr><td><strong>${R.items[k].name}</strong><span class="sub">${k==='chicken'?'1袋 = 2kg':k==='curry'?'仕込み済み在庫。二重消費しない':k.startsWith('sample_')?'試作候補別に在庫を分離':'基本単位で管理'}</span></td><td class="numeric"><strong>${fmt(R.stock(k))}</strong> ${R.items[k].unit}</td><td class="numeric">${yen(s.prices[k])} / ${R.items[k].unit}</td><td class="numeric">${yen(R.stock(k)*s.prices[k])}</td><td>${link(k==='chicken'?'orders':'product','確認する','text-link','chevron')}</td></tr>`).join('')}</tbody></table></div><div class="mt">${note('参考在庫金額は「数量 × 現在の基準価格」です。会計上の棚卸評価ではありません。仕込み済みカレーは完成在庫として扱い、今回のデモでは原材料からの製造振替は対象外です。')}</div></section><section class="card mt">${title('在庫の増減履歴',badge(s.ledger.length+'件'))}<div class="table-wrap"><table class="table"><thead><tr><th>時刻</th><th>店舗・区分</th><th>食材</th><th class="numeric">増減</th><th>記録</th></tr></thead><tbody>${s.ledger.slice(-40).reverse().map(e=>`<tr><td>${when(e.at)}</td><td>${R.sites[e.store]}<span class="sub">${e.type}</span></td><td>${R.items[e.item].name}</td><td class="numeric" style="color:${e.qty>0?'var(--green)':'var(--sub)'}">${e.qty>0?'+':''}${fmt(e.qty)} ${R.items[e.item].unit}</td><td>${esc(e.label)}</td></tr>`).join('')||'<tr><td colspan="5">まだ動きはありません。納品を確認すると記録が始まります。</td></tr>'}</tbody></table></div></section>`}
  function ordersPage(){const s=S(),p=s.plan,c=R.orderCalc();return head('ORDER → RECEIVE','買う前に、店の中と、他店を見る。','発注案の承認と、実際の入荷は別。受け取るまで仕事をつなぎます。')+`<div class="grid2"><section class="card">${title('明日の鶏肉を用意する',badge(p?'承認済み':'発注前の試算',p?'green':'orange'))}<div class="form-grid">${field('tomorrowQty','明日の予定食数（南蛮カレー）',{min:1,max:1000,disabled:!!p,hint:'需要予測ではなく、店長が入力する仮置きです。'})}<div class="field"><span class="field-label">必要な鶏肉</span><div class="status-card"><strong class="num" id="order-required" style="font-size:25px">${fmt(c.required)} kg</strong><div class="tiny muted">200g × 予定食数</div></div></div></div><div class="equation"><div class="box"><small>手元</small><strong>${fmt(c.onHand)}<small> kg</small></strong></div><span>＋</span><div class="box"><small>入荷予定</small><strong>${fmt(c.pending)}<small> kg</small></strong></div><span>→</span><div class="box total"><small>まだ足りない量</small><strong id="order-need">${fmt(c.need)}<small> kg</small></strong></div></div>${!p?`${checkbox('useTransfer','駅前店から融通できる在庫を先に使う','駅前店の必要在庫7kgを残し、最大3kg。品質・期限・運搬条件は受取時にも人が確認。')}<div class="detail-list">${detail('駅前店からの移動案','<span id="order-transfer">'+fmt(c.transfer)+'</span> kg')}${detail('外部への発注案','<span id="order-purchase">'+fmt(c.purchase)+'</span> kg')}${detail('外部購入の参考金額','<span id="order-amount">'+yen(c.purchase*s.prices.chicken)+'</span>')}</div><div class="form-action"><span class="save-info">承認しても、実際の注文は送信しません。</span>${button('plan','案を承認して、次へ渡す','btn primary','','check')}</div>`:`${note('この案は承認済み。二重作成はせず、下の出庫・受取を進めます。')}<div class="mt row wrap">${button('order-doc','発注書を見る','btn','','file')}${button('export-order','発注CSV','btn','','download')}</div>`}</section><aside class="stack"><section class="card ruu-card"><div class="ruu-label">${icon('bowl','sm')}会社の中で、先に助け合う</div><h3>ある店で余らせて、<br>別の店で買い足さない。</h3><p class="ruu-desc">駅前店の手元：${fmt(R.stock('chicken',1))}kg<br>同店で確保する分：7kg<br>相手の営業を止めない量だけ候補にします。</p></section><section class="card">${title('依頼しただけでは、終わらない。')}<div class="detail-list">${detail('発注書を作った','注文はまだ未送信')}${detail('移動を依頼した','在庫はまだ移さない')}${detail('出庫を確認した','輸送中として区別')}${detail('受取を確認した','ここで手元に反映')}</div></section></aside></div>${p?`<div class="grid-even mt"><section class="card">${title('店間移動｜駅前店 → 本店',badge({requested:'依頼済み',inTransit:'輸送中',received:'受取済み'}[p.transferStatus],p.transferStatus==='received'?'green':'amber'))}${detail('今回の移動量',fmt(p.transfer)+' kg')}${detail('駅前店の手元',fmt(R.stock('chicken',1))+' kg')}${detail('輸送中',fmt(p.transferStatus==='inTransit'?p.transfer:0)+' kg')}<div class="mt">${p.transferStatus!=='received'?button('transfer',p.transferStatus==='requested'?'駅前店で出庫を確認（デモ）':'本店で受取を確認（デモ）','btn wide dark','','truck'):note('受取確認まで完了。数量は本店へ一度だけ反映済みです。')}</div></section><section class="card">${title('外部購入｜追加納品',badge({draft:'発注書作成済み',sent:'発注済み状態（デモ）',received:'入荷済み'}[p.purchaseStatus],p.purchaseStatus==='received'?'green':'amber'))}${detail('今回の発注量',fmt(p.purchase)+' kg')}${detail('承認時の仕入れ価格',yen(p.price)+' / kg')}${detail('外部への実送信','未接続・送信しません')}<div class="mt">${p.purchaseStatus!=='received'?button('purchase',p.purchaseStatus==='draft'?'発注済み状態を体験':'追加入荷を検品（デモ）','btn wide dark','','check'):note('追加入荷を在庫へ反映済みです。')}</div></section></div>`:''}${p?nextPanel('product','仕入れの記録を、一皿の価値へ。','次は新メンチ。候補比較から、味見・販売・引継ぎまで体験できます。','商品を育てる'):''}`}
  function productNav(active){return `<nav class="subnav" aria-label="商品を育てる工程">${[['product','1. 仕入れ比較'],['product/taste','2. 人が味見'],['product/trial','3. 小さく売る'],['product/rollout','4. レシピ化・展開']].map(([r,t])=>link(r,t,active===r?'active':'','')).join('')}</nav>`}
  function productSummary(){const s=S(),c=R.candidate();return `<section class="card">${title('一皿のカルテ',badge('試作 v'+s.product.version,'orange'))}<div class="mini-product">${food()}<div><h3>カレーに合う、新メンチ。</h3><p class="small muted">仮想の仕入れ先変更プロジェクト</p></div></div><div class="detail-list">${detail('届けたい価値','一皿での満足感')}${detail('選択候補',c?c.name:'未選択')}${detail('試作ソース量',s.product.sauceGrams+' g')}${detail('販売中の正式版','v'+s.product.standard.version)}${detail('正式版の食材原価',yen(s.product.standard.cost))}</div><div class="divider"></div>${note('試作の変更は、販売中の正式版へ自動反映しません。試験結果を確認してから標準化します。')}</section>`}
  function productPage(){let s=S(),c=R.candidate();return head('FROM INGREDIENT TO EXPERIENCE','安い材料より、よい一皿を。','味、採算、厨房の動き。仕入れ候補を、一皿の基準で比べます。')+productNav('product')+`<section class="card">${title('メンチの仕入れ先を選ぶ',badge('3社とも仮想の比較データ'))}<div class="candidate-grid">${R.candidates.map(x=>`<button class="candidate ${c?.id===x.id?'selected':''}" data-act="choose" data-id="${x.id}" aria-pressed="${c?.id===x.id}"><span class="choice-dot"></span>${food()}${badge(x.tag,x.id==='b'?'green':'')}<h3>${x.name}</h3><div class="price num">${yen(x.cost)}<span> / 個</span></div><p>${x.grams}g・${x.supplier}<br>${esc(x.note)}</p></button>`).join('')}</div><div class="mt">${note('「おすすめ」ではなく検証の候補です。価格・供給・安全・品質はすべてデモ設定。実在の仕入れ先を評価したものではありません。')}</div></section><div class="grid2 mt"><section class="card">${title('今回、守りたい条件',badge('人が決める'))}<div class="form-grid">${field('productPrice','試験販売価格（税抜・円）',{min:100,max:10000})}${field('trialPlan','試験販売の上限（食）',{min:1,max:100})}${field('sauceGrams','一皿のソース量（g）',{min:0,max:100,hint:'候補の変更や量の変更は、味見をやり直します。'})}<div class="field"><span class="field-label">一皿の約束</span><div class="note-block">単品のうまさだけでなく、カレーと食べたときの一体感を守る。</div></div></div><div class="cost-preview"><div><small>販売中の正式版</small><div class="value num">${yen(s.product.standard.cost)}</div></div><span class="arrow">→</span><div><small>入力中の試作原価</small><div class="value num" id="product-live-cost">${c?yen(c.cost+210+Number(s.drafts.sauceGrams)*1.2):'候補を選択'}</div></div><small>食材費のみ。<br>利益ではありません。</small></div><div class="form-action"><span class="save-info">入力は自動保存。条件の適用には確認が必要です。</span>${button('conditions','条件を保存する','btn primary',!c?'disabled':'','check')}</div></section><aside class="stack">${productSummary()}<section class="card ruu-card"><div class="ruu-label">${icon('bowl','sm')}王子らしさは、判断の順番</div><h3>試作して、人が味見。<br>直して、現場で試す。</h3><p class="ruu-desc">うまくいかなかった理由も、次の人が使える知識として残します。</p></section></aside></div>${c?nextPanel('product/taste','候補を選んだだけでは、採用しません。','人の味見と、別のスタッフが再現できるかを確認します。','味見へ進む'):''}`}
  function tastePage(){let s=S(),c=R.candidate(),t=s.product.taste;return head('HUMAN TASTING & REPRODUCTION','まず人が、味見する。','一口目だけでは決めない。食べ終わり、作りやすさ、他の人の再現まで。')+productNav('product/taste')+(!c?`<div class="empty">比較する候補が未選択です。<div class="mt">${link('product','仕入れ候補を選ぶ','btn primary')}</div></div>`:`<div class="grid2"><section class="card">${title(c.name+' の確認',badge('人の評価・デモ基準'))}<div class="detail-row"><span>この候補の試験用在庫</span><strong>${fmt(R.stock('sample_'+c.id))} 個</strong></div><div class="mt">${s.sampleReceipts[c.id]?note('この候補のサンプル30個を検品済み。試験販売・廃棄で減ります。'):button('sample','サンプル30個を検品（デモ）','btn wide','','box')}</div><div class="divider"></div>${['カレーとの一体感','食べ終わりの満足','営業中の作りやすさ','別の人の再現性'].map((name,i)=>`<div class="taste-line"><label for="taste-${i+1}">${name}</label><input id="taste-${i+1}" data-draft="taste${i+1}" type="range" min="1" max="5" step="1" value="${s.drafts['taste'+(i+1)]}"><output id="out-taste${i+1}">${s.drafts['taste'+(i+1)]}</output></div>`).join('')}<p class="tiny muted">1: 要見直し / 3: 試験へ進める目安 / 5: とてもよい。数値は人が入力します。</p><div class="mt">${textarea('tasteNote','よかった点・迷った点・次に確認したいこと')}</div><div class="divider"></div>${checkbox('safety','原材料・アレルゲン・保管や調理条件を確認済みにする（デモ）','実運用では正式な資料と責任者の確認が必要。味の点数で代わりにはできません。')}${checkbox('reproduced','別のスタッフが手順だけで作れたことを確認（デモ）','「レシピを送った」ではなく、実際に作ってもらう。')}<div class="form-action"><span class="save-info">販売準備後に変える場合は、新しい試作版へ。</span>${button('taste',t?'味見記録を更新':'味見と確認を保存','btn primary',s.product.trial?'disabled':'','check')}</div></section><aside class="stack"><section class="card">${title('次へ進める条件',badge(t?'保存した評価を判定':'未保存の評価は使わない',t?'green':'amber'))}${R.gates().map(g=>`<div class="gate-row ${g.ok?'yes':''}">${icon(g.ok?'checkCircle':'circle','sm')}<span>${g.name}</span></div>`).join('')}<div class="divider"></div><p class="tiny muted">どれか一つでも未確認なら、試験販売の準備は保留します。</p></section><section class="card ruu-card"><div class="ruu-label">${icon('bowl','sm')}追いルウの前に、記録する</div><h3>「おいしい」で終わらず、<br>どこがよかったかを残す。</h3><p class="ruu-desc">感覚を無理に点数だけにせず、言葉も一緒に。再現できない点は次の改善材料です。</p></section></aside></div>${t?nextPanel('product/trial','味見の記録が、販売判断の材料になりました。','揚げ場の余力と未確認項目を確認して、小さく試します。','試験販売へ'):''}`)}
  function trialPage(){let s=S(),c=R.candidate(),cap=R.capacity(),t=s.product.trial,gates=R.gates(),all=gates.every(g=>g.ok);return head('SMALL TEST → REAL FEEDBACK','小さく売って、反応を持ち帰る。','販売前に条件を確認。売れた数と、お客様の声を同じカルテへ戻します。')+productNav('product/trial')+(!c?`<div class="empty">${link('product','先に候補を選ぶ','btn primary')}</div>`:`<div class="grid2"><section class="card">${title('販売前の厨房耐久テスト',badge('簡易試算・需要予測ではない'))}<div class="equation"><div class="box"><small>既存注文の設備使用</small><strong>40<small> 分</small></strong></div><span>＋</span><div class="box"><small>追加 ${cap.qty}食</small><strong>${cap.extra}<small> 分</small></strong></div><span>＝</span><div class="box total"><small>1時間の必要時間</small><strong style="color:${cap.total>60?'var(--red)':'var(--green)'}">${cap.total}<small> 分</small></strong></div></div><p class="sales-note">1回${cap.batch}食、1サイクル${cap.minutes}分。1台・並列なし。清掃や投入の時間は省略した試算です。実際の提供時間や安全を保証するものではありません。</p><div class="divider"></div><div class="status-card ${all?'ok':'block'}"><h3>${t?'この版の販売準備は承認済み':all?'設定した確認条件がそろいました':'まだ、販売準備へ進めません'}</h3><p>${t?'資料は同じレシピ・価格から作成。公開や外部発注は行っていません。':all?'人が最終確認して、試験販売の資料を作ります。':gates.filter(g=>!g.ok).map(g=>g.name).join(' / ')}</p></div><div class="mt row wrap">${!t?button('start-trial','確認して、試験販売を準備','btn primary',!all?'disabled':'','check'):button('promo','POP・接客・投稿文を見る','btn primary','','file')}${link('product/taste','味見を確認','btn','','')}</div>${t?`<div class="divider"></div><div class="detail-list">${detail('試作レシピの食材原価',yen(t.cost))}${detail('試験販売価格（税抜）',yen(t.price))}${detail('販売上限',t.planned+' 食')}${detail('外部公開','未接続・公開していません')}</div>`:''}</section><aside class="stack">${productSummary()}</aside></div>${t?`<div class="grid2 mt"><section class="card">${title('試験販売の結果を戻す',badge(t.result?'記録済み':'仮想結果を入力',t.result?'green':'orange'))}${!t.result?`<div class="form-grid">${field('trialSold','実際に売れた数（食）',{max:t.planned})}${field('trialWaste','完成品の廃棄数（食）',{max:t.planned})}${textarea('trialFeedback','お客様・現場の声','仮想の声です。個人を特定できる情報は入力しないでください。')}</div><div class="form-action"><span class="save-info">販売と廃棄の合計分だけ、材料在庫も減ります。</span>${button('trial-result','結果をカルテへ戻す','btn primary','','check')}</div>`:`<div class="detail-list">${detail('試験販売',t.result.sold+' 食')}${detail('完成品廃棄',t.result.waste+' 食')}${detail('売上（税抜）',yen(t.result.revenue))}${detail('使用食材費（廃棄を含む）',yen(t.result.foodCost))}</div><div class="trial-review"><small>記録された声 / 仮想事例</small><p>${esc(t.result.feedback)}</p></div><div class="mt">${note('売上 − 使用食材費は '+yen(t.result.revenue-t.result.foodCost)+'。人件費・家賃等を含む最終利益ではありません。')}</div>`}</section><aside class="stack"><section class="card ruu-card"><div class="ruu-label">${icon('bowl','sm')}次の一手は、ひとつずつ</div><h3>全部変えたら、<br>何がよかったか分からない。</h3><p class="ruu-desc">このデモの改善案は「ソースだけ10g減らして比較」。理由と変更前の結果を残し、もう一度、人が味見します。</p>${t.result?`<div class="mt">${button('revise','追いルウ改善を試す','btn wide','','refresh')}</div>`:''}<p class="tiny muted mt">固定の検証案。生成AIの分析ではありません。</p></section></aside></div>`:''}${t?.result?nextPanel('product/rollout','試験の結果まで、一皿につながりました。','結果を確認して標準化するか、条件を直して再試作するかを選びます。','レシピ化・引継ぎへ'):''}`)}
  const stageLabels=['未配信','配信済み','内容確認済み','再現テスト済み','使用開始'];
  function rolloutPage(){let s=S(),p=s.product,std=p.standard,ready=!!p.trial?.result,isCurrent=std.sourceVersion===p.version;return head('RECIPE → REPRODUCIBLE WORK','自分がいなくても、続く形に。','レシピを送っただけで完了にしない。別の人の再現と、各店の使用開始まで。')+productNav('product/rollout')+`<div class="grid2"><section class="card">${title('一皿の業務レシピ',badge('正式版 v'+std.version,'green'))}<div class="mini-product">${food()}<div><h3>${std.candidate?std.name:'新メンチは、まだ試作中'}</h3><p class="small muted">試作版と販売中の正式版を分けて管理</p></div></div>${!isCurrent?`<div class="status-card ${ready?'ok':'block'}"><h3>${ready?'試験結果を確認して、正式版へ進められます':'先に試験販売の結果を記録してください'}</h3><p>正式化しても、他店は自動で使用開始になりません。実施の責任者による確認が必要です。</p></div><div class="mt row wrap">${button('finalize','結果を確認して標準化（デモ）','btn primary',!ready?'disabled':'','check')}${link('product/trial','結果を見る','btn','','')}</div>`:`<div class="workflow-done"><div class="eyebrow">THE LOOP IS CONNECTED</div><h2>現場の経験が、店のレシピになりました。</h2><p>試作v${p.version} → 正式版v${std.version}。<br>味・採算・作業・売り方を、同じ記録から引き継ぎます。</p></div>`}<div class="divider"></div><div class="detail-list">${detail('お客様への約束','カレーと合わせた一皿の満足')}${detail('味・原価・手順',std.candidate?'正式版v'+std.version+'で固定':'試験結果待ち')}${detail('困ったときの停止','規格・資料・安全条件が不明なら保留')}${detail('完了の証拠','別の人の再現と、各店の使用開始')}</div><div class="mt row wrap">${button('recipe-doc','一枚レシピを見る','btn',!std.candidate?'disabled':'','file')}${button('case-doc','改善の記録を書き出す','btn','','download')}</div></section><aside class="stack"><section class="card">${title('全店に行き渡った状況')}<div class="score-summary"><div class="ring" style="--p:${p.rollouts.filter(x=>x===4).length*10}"><strong>${p.rollouts.filter(x=>x===4).length}<span>/10</span></strong></div><div><h3>使用開始まで確認</h3><p class="small muted">配信は、導入完了ではありません。</p></div></div><div class="divider"></div>${detail('配信以上',p.rollouts.filter(x=>x>=1).length+' 店')}${detail('再現テスト以上',p.rollouts.filter(x=>x>=3).length+' 店')}${detail('まだ未配信',p.rollouts.filter(x=>x===0).length+' 店')}</section><section class="card ruu-card"><div class="ruu-label">${icon('users','sm')}本人不在テスト</div><h3>横から教えなくても、<br>次の人が進められるか。</h3><p class="ruu-desc">迷った場所は、スタッフを責める材料ではなく、手順を直す材料にします。</p></section></aside></div><section class="card mt">${title('店舗ごとの引継ぎ',badge('操作体験・実際の権限管理は未実装'))}<div class="launch-stores">${R.sites.map((name,i)=>{let st=p.rollouts[i];return `<div class="store-card ${st===4?'selected':''}"><div class="store-head"><span class="name">${name}</span>${badge(stageLabels[st],st===4?'green':st?'amber':'')}</div><p>${i===4?'小型厨房。試作時に設備条件を再確認。':i===0?'本店の試験結果を、正式版の根拠に。':'店舗の担当者が、現物と手順で確認。'}</p><div class="mini-stages">${[1,2,3,4].map(n=>`<span class="${st>=n?'on':''}"></span>`).join('')}</div>${i===0?`<span class="tiny muted">${st===4?'標準化時に使用開始を記録':'本店で試験・標準化から開始'}</span>`:button('rollout',['配信を記録する','内容確認を記録','再現テストを記録','使用開始を記録','引継ぎ完了'][st],'btn sm wide',`data-store="${i}" ${!std.candidate||st===4?'disabled':''}`,st===4?'check':'arrow')}</div>`}).join('')}</div></section>`}
  function notesPage(){let s=S();return head('NOTICE → ACTION','現場の気づきを、次の仕事に。','賄いの工夫も、困りごとも。担当者と確認内容を付けて残します。')+recordNav('record/notes')+`<div class="grid2"><section class="card">${title('気づいたことを記録')}<div class="form-grid"><div class="field"><label for="note-type">記録の種類</label><select id="note-type" data-draft="noteType">${['引継ぎ','賄い・商品アイデア','設備・衛生の確認','お客様の声'].map(v=>`<option ${s.drafts.noteType===v?'selected':''}>${v}</option>`).join('')}</select></div>${field('noteOwner','次に対応する人',{type:'text',hint:'未定なら空欄。未割当のまま残します。'})}${textarea('noteText','気づいたこと・次にしてほしいこと','一つの仕事につき一件。機密・個人情報は入力しないでください。')}${field('noteDue','確認する日',{type:'date'})}</div><div class="pill-row">${button('note-sample','賄いの例を入れる','','data-kind="idea"')}${button('note-sample','引継ぎの例を入れる','','data-kind="handover"')}</div><div class="form-action"><span class="save-info">スマホのキーボード音声入力も使えます。自動文字起こしAPIは未接続です。</span>${button('add-note','次の担当者へ残す','btn primary','','check')}</div></section><aside class="stack"><section class="card ruu-card"><div class="ruu-label">${icon('grow','sm')}賄いも、開発の材料に</div><h3>商品開発は、<br>特別な会議だけではない。</h3><p class="ruu-desc">現場の小さな工夫を消さずに残す。試す価値があるものは「商品を育てる」へ。</p><div class="mt">${link('product','商品開発の流れを見る','btn wide')}</div></section></aside></div><section class="card mt">${title('残した仕事',badge(s.notes.length+'件'))}${s.notes.length?s.notes.map(n=>`<div class="task-row"><div class="task-dot ${n.status==='完了'?'green':''}">${icon(n.status==='完了'?'check':'clipboard')}</div><div class="task-body"><div class="row wrap">${badge(n.type)}${badge(n.status,n.status==='完了'?'green':!n.owner?'amber':'')}</div><strong style="margin-top:8px;white-space:pre-wrap">${esc(n.body)}</strong><p>${esc(n.owner||'担当者未定')} / ${esc(n.due)}${n.evidence?' / 完了確認：'+esc(n.evidence):''}</p></div>${n.status!=='完了'?button('note-work',n.owner?'完了を記録':'担当を決める','btn sm',`data-id="${n.id}"`,'chevron'):''}</div>`).join(''):'<div class="empty">まだ記録はありません。上の例から、最初の仕事を残せます。</div>'}</section>`}
  function companyPage(){let s=S(),rolls=s.product.rollouts,onhand=R.sites.reduce((n,_,i)=>n+R.stock('chicken',i),0);return head('ONE COMPANY, TEN KITCHENS','10店舗の経験を、一つの力に。','すべて仮想店舗。本店の操作と、駅前店との移動が同じ記録に連動します。',button('export-json','データを書き出す','btn','','download'))+`<div class="metrics">${metric('全店の手元鶏肉',fmt(onhand),'kg','輸送中は手元に含めません','box')}${metric('輸送中',fmt(s.plan?.transferStatus==='inTransit'?s.plan.transfer:0),'kg','出庫・受取の間を区別','truck')}${metric('新商品使用開始',rolls.filter(x=>x===4).length,'/ 10店','配信ではなく、開始まで確認','stores')}${metric('操作の記録',s.audit.length,'件','変更理由を残すデモ履歴','clipboard')}</div><div class="grid2"><section class="card">${title('本部が先に確認すること')}${tasks()}</section><section class="card ruu-card"><div class="ruu-label">${icon('bowl','sm')}売上順位だけで見ない</div><h3>店長が動けない理由を、<br>本部が取り除く。</h3><p class="ruu-desc">確認待ち、未割当、未着の食材。<br>今決めれば進む仕事から、順に見る。</p><div class="mt">${link('product/rollout','全店への引継ぎを開く','btn wide')}</div></section></div><div class="stores-grid mt">${R.sites.map((name,i)=>`<section class="store-card"><div class="store-head"><span class="name">${name}</span>${badge(i===0?'操作中':i===1?'移動連動':'比較用の仮想値',i<2?'green':'')}</div><p>${i===0?'全機能の操作は本店で体験':i===1?'本店への出庫で在庫が変化':'引継ぎの進行は操作できます'}</p><div class="store-metrics"><div><small>手元の鶏肉</small><strong class="num">${fmt(R.stock('chicken',i))}<small style="display:inline;margin-left:4px">kg</small></strong></div><div><small>新商品の導入</small><div style="margin-top:7px">${badge(stageLabels[rolls[i]],rolls[i]===4?'green':'')}</div></div></div></section>`).join('')}</div><section class="card mt">${title('会社に残った改善・判断の記録',link('history','すべての履歴','text-link','chevron'))}${auditRows(6)}</section>`}
  function historyPage(){return head('TRACEABLE WORK','なぜ変えたかも、残す。','過去の販売条件と試作の履歴は、現在の設定で書き換えません。',button('export-json','JSONを書き出す','btn','','download'))+`<div class="grid2"><section class="card">${title('操作履歴',badge(S().audit.length+'件'))}${auditRows(100)}</section><aside class="stack"><section class="card">${title('保存している試作の過去版')}${S().product.history.map(h=>`<div class="audit-row"><span class="audit-pin"></span><div><strong>試作v${h.version}</strong><p>${esc(h.reason)} / ソース${h.sauceGrams}g</p><p>${h.trial?.result?h.trial.result.sold+'食販売、食材原価'+yen(h.trial.cost):'試験販売前の版'}</p></div></div>`).join('')||note('追いルウ改善や条件変更をすると、前の版の記録がここに残ります。')}</section><section class="card">${title('デモの保存範囲')}${note('この履歴はブラウザ内の操作記録です。本番用の改ざん防止監査ログ、認証、店舗別の権限管理、バックアップは未実装です。')}<div class="mt">${link('inventory','在庫の増減明細を見る','btn wide')}</div></section></aside></div>`}
  function render(){let r=route(),view={'today':daily,'record':receiptPage,'record/receive':receiptPage,'record/sales':salesPage,'record/count':countPage,'inventory':inventoryPage,'orders':ordersPage,'product':productPage,'product/taste':tastePage,'product/trial':trialPage,'product/rollout':rolloutPage,'record/notes':notesPage,'company':companyPage,'history':historyPage}[r]||daily;$('#app').innerHTML=shell(view(),r);document.title=(r.startsWith('product')?'商品を育てる':r.startsWith('record')?'記録する':r==='company'?'全店を見る':'今日の営業')+'｜飲食経営OS';}
  function modal(titleText,desc,body,actions=''){let d=$('#dialog');d.innerHTML=`<div class="dialog-content"><div class="dialog-head"><div><h2 id="dialog-title">${titleText}</h2><p>${desc}</p></div><button class="icon-btn" data-act="close" aria-label="閉じる">${icon('close','sm')}</button></div>${body}${actions?`<div class="dialog-actions">${actions}</div>`:''}</div>`;if(!d.open)d.showModal();}
  function close(){if($('#dialog').open)$('#dialog').close()}
  function guide(){const n=R.next();modal('ひとつの記録で、仕事がつながる。','まずは8ステップ。途中で離れても、続きから体験できます。',`<div class="soft-rule orange guide-intro">ルウ王子版・飲食経営OSの操作デモです。<br>架空の本店で営業を一巡し、その後、新メンチを育てて全店へ引き継ぎます。</div><div class="guide-grid mt">${[['01','納品を確認','20袋 × 2kg。仕入れ値上がりが原価へ。','record/receive'],['02','売上を反映','100食を反映すると、材料が減る。','record/sales'],['03','棚卸し','廃棄1kg、実測17kg。差2kgを残す。','record/count'],['04','明日の発注','不足7kg → 店間移動3kg＋購入4kg。','orders'],['05','一皿を選ぶ','メンチの候補を、厨房と味で比べる。','product'],['06','人が味見','サンプル検品、味見、安全、再現を確認。','product/taste'],['07','小さく売る','素材から告知まで同じカルテ。結果を戻す。','product/trial'],['08','次の人へ残す','レシピ化し、各店の再現と開始を確認。','product/rollout']].map(([i,t,p,r])=>`<a class="guide-card" href="#/${r}" data-act="close-guide"><span class="num">${i}</span><strong>${t}</strong><p>${p}</p></a>`).join('')}</div><div class="mt tiny muted">保存はこのブラウザ内のみ。数量は計算式で処理。文章は固定テンプレートです。生成AI、実際の発注、SNS投稿、POS接続、他端末とのデータ共有は未接続です。</div>`,button('start-guide',n.step===1?'納品から体験をはじめる':'続きから体験する','btn primary',`data-route="${n.route}"`,'arrow'));}
  function settings(){modal('デモの設定と保存','実データや機密情報は入力しないでください。',`<div class="detail-list">${detail('保存先','この端末・このブラウザ')}${detail('保存状態',R.savedOk?'保存済み '+when(S().saved):'保存できていません')}${detail('データの共有','他の端末には同期しません')}${detail('生成AI','未接続・API料金は発生しません')}${detail('外部発注・SNS・POS','未接続・実行しません')}${detail('店舗別アクセス権','本番認証は未実装')}</div><div class="mt">${note('URLを共有した相手は、自分のブラウザで最初から体験します。初期化は、このデモの保存データだけが対象です。ほかのアプリのデータは変更しません。')}</div><div class="pill-row">${button('guide','体験ガイドを開く','btn sm')}${button('export-json','データをJSONで保存','btn sm','','download')}${button('export-report','体験レポートを保存','btn sm','','file')}</div>`,button('reset-confirm','このデモを最初に戻す','btn danger','','refresh'));}
  function openNavigator(){const s=S(),n=R.next();let msgs=[];if(s.count&&!s.diffResolved)msgs.push('鶏肉の差異 '+Math.abs(s.count.delta)+'kgは原因未確認です。実測・単位・未記録の使用を確認してください。');if(s.plan&&R.orderCalc().pending)msgs.push(R.orderCalc().pending+'kgは入荷予定です。受取前に手元の在庫として扱わないでください。');if(s.product.selection){let failed=R.gates().filter(g=>!g.ok);if(failed.length&&!s.product.trial)msgs.push('新メンチは「'+failed[0].name+'」が未確認です。');}msgs.push('次の仕事：'+n.button+'。');modal('現場ナビ','固定ルールで、現在の記録から確認事項を整理します。生成AIではありません。',msgs.map((m,i)=>`<div class="task-row"><span class="stepnum">${i+1}</span><div class="task-body"><strong>${esc(m)}</strong></div></div>`).join(''),button('navigate-next','次の仕事を開く','btn primary',`data-route="${n.route}"`,'arrow'));}
  function report(){const s=S(),p=s.product;return `飲食経営OS｜ルウ王子版 体験レポート\nスパイラル産業 提案デモ\n作成：${new Date().toLocaleString('ja-JP')}\n全データは仮想・ブラウザ内の操作結果です。\n\n【営業の一巡】\n納品：${s.receipt?s.receipt.qty+'kg / '+s.receipt.price+'円/kg':'未確認'}\n販売：${s.sales?s.sales.count+'食 / 食材原価'+s.sales.unitCost+'円（確定時）':'未反映'}\n手元の鶏肉：${R.stock('chicken')}kg\n棚卸し差異：${s.count?s.count.delta+'kg / '+(s.diffResolved?'確認済み':'原因未確認'):'未確認'}\n発注案：${s.plan?'移動'+s.plan.transfer+'kg / 購入'+s.plan.purchase+'kg':'未承認'}\n外部送信：なし\n\n【一皿の改善】\n選択候補：${R.candidate()?.name||'未選択'}\n試作版：v${p.version} / ソース${p.sauceGrams}g\n正式版：v${p.standard.version} / 原価${p.standard.cost}円 / 価格${p.standard.price}円\n試食メモ：${p.taste?.note||'未記録'}\n試験販売の声：${p.trial?.result?.feedback||'未記録'}\n過去試作版：${p.history.length}件保存\n\n【全店への引継ぎ】\n${R.sites.map((n,i)=>n+'：'+stageLabels[p.rollouts[i]]).join('\n')}\n\n【操作履歴】\n${s.audit.slice().reverse().map(a=>when(a.at)+' '+a.title+'\n'+a.detail).join('\n\n')}\n\n【制約】\n生成AI・外部発注・SNS・POS・認証・複数端末同期は未接続。数量は計算式、文章は固定テンプレートで処理。人件費等を含む最終利益や会計上の在庫評価ではありません。\n`;}
  function orderDoc(){let p=S().plan;if(!p)throw Error('発注案を先に承認してください');return `発注書 / ${p.id}\n状態：デモ・外部送信なし\n発注先：サンプル食材卸\n納品先：本店（仮想）\n納品希望：2026年9月6日・要確認\n\n鶏もも肉：${p.purchase}kg\n単価：${p.price}円/kg（税抜）\n参考合計：${R.round(p.purchase*p.price)}円\n\n店間移動：駅前店から別途${p.transfer}kg\n必要総量：${p.required}kg / ${p.portions}食\n\n確認事項\n数量・規格・納品日を仕入れ先と確認してください。\nこのデモからメールや注文は送信されません。\n承認と入荷は別の状態です。`;}
  function recipeDoc(){let s=S(),p=s.product,std=p.standard;if(!std.candidate)throw Error('標準化してから表示します');return `一皿の業務レシピ｜正式版v${std.version}\n新メンチカレー（仮想）\n\n【お客様への約束】\nカレーと合わせた一体感、食べ終わりまでの満足。\n\n【一皿の材料】\n${std.recipe.map(e=>R.items[e.item].name+' '+e.qty+R.items[e.item].unit+' / 確定時単価 '+e.price+'円').join('\n')}\n食材原価：${std.cost}円\n販売価格：${std.price}円（税抜）\n人件費・家賃等を含む最終利益ではありません。\n\n【作業の順番】\n1. 正式な原材料・安全条件・調理手順を確認。\n2. 一皿分の材料を計量。\n3. 食材の正式な加熱・保管条件に沿って調理。\n4. 盛付量と付属品を確認して提供。\n\n【人が味見したポイント】\n${std.taste?.note||'正式版の味見記録を参照'}\n\n【止める条件】\n資料不明、規格違い、安全条件未確認のときは提供せず責任者へ。\n\n【引継ぎの完了条件】\n配信 → 内容確認 → 別の人による再現テスト → 使用開始。\n店ごとの設備を確認して、承認された手順を使う。\n\nこれはデモ用の業務レシピです。実調理の安全手順を代替しません。`;}
  function promoDoc(){let s=S(),t=s.product.trial;if(!t)throw Error('先に試験販売準備を承認してください');return `試験販売のご案内｜試作v${t.version}\n共通カルテからの固定テンプレート / 外部公開なし\n\n【店内POP案】\nカレーと楽しむ、新しいメンチ。\n本店で、小さな試験販売を行います。\n販売価格：${t.price}円（税抜・デモ設定）\n今回の販売上限：${t.planned}食\n販売日時：責任者の確認待ち。未確定のまま公開しないでください。\n\n【スタッフの一言】\n「カレーと合わせたときの満足感を確かめながら、よりよい一皿に育てています。召し上がった感想を聞かせていただけるとうれしいです。」\n\n【SNS下書き】\nいつものカレーに、新しいメンチを。\n試作して、味見して、少しずつ一皿に。\n本店の試験販売で、皆さまの声を聞かせてください。\n日時・注文方法は、確定後にご案内します。\n\n【公開前の確認】\n販売日時、税込の掲示価格、数量、注文方法、実物と写真の一致、原材料・アレルゲン表示を責任者が確認。\n仮想データのまま公開しないでください。\n`;}
  let docBuffer='',pendingAction=null;
  function showDoc(titleText,text,filename){docBuffer=text;modal(titleText,'同じカルテから作成。コピーまたはテキストで保存できます。',`<div class="copy-area" id="doc-area">${esc(text)}</div>`,button('copy-doc','コピー','btn','','copy')+button('save-doc','保存する','btn primary',`data-name="${esc(filename)}"`,'download'));}
  function download(name,content,type='text/plain;charset=utf-8'){let b=new Blob([content],{type}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('ファイルを保存しました');}
  function csvVal(v){let t=String(v??'');if(/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'}
  function csv(rows){return '\ufeff'+rows.map(r=>r.map(csvVal).join(',')).join('\r\n')}
  function run(fn,message,redirect){try{fn();close();if(redirect)go(redirect);else render();toast(message+(R.savedOk?'':'（ブラウザ保存に失敗。書き出してください）'));}catch(e){toast(e.message||'処理できませんでした',true)}}
  function confirmAction(titleText,desc,fn){pendingAction=fn;modal(titleText,desc,note('これはデモ内の記録です。実際の外部送信や、他端末への通知は行いません。'),button('close','戻る','btn')+button('confirm-action','確認して進める','btn primary','','check'));}
  function updateLive(){let d=S().drafts;const set=(id,text)=>{let e=document.getElementById(id);if(e)e.textContent=text};set('receive-live-qty',fmt(Number(d.receiptQty)*(d.receiptUnit==='bag'?2:1))+' kg');set('receive-live-cost',yen(Number(d.receiptPrice)*.2+246));set('sales-live-kg',fmt(Number(d.salesQty)*.2)+' kg');set('count-live-waste',fmt(d.wasteQty)+' kg');set('count-live-expected',fmt(R.stock('chicken')-Number(d.wasteQty))+' kg');let c=R.orderCalc();set('order-required',fmt(c.required)+' kg');set('order-need',fmt(c.need)+' kg');set('order-transfer',fmt(c.transfer));set('order-purchase',fmt(c.purchase));set('order-amount',yen(c.purchase*S().prices.chicken));let ca=R.candidate();set('product-live-cost',ca?yen(ca.cost+210+Number(d.sauceGrams)*1.2):'候補を選択');[1,2,3,4].forEach(n=>set('out-taste'+n,d['taste'+n]));set('saved-label',(R.savedOk?'自動保存 '+when(S().saved):'未保存')+' · v1.0 / シナリオ日 2026.09.05');}
  document.addEventListener('input',e=>{const k=e.target.dataset.draft;if(k){try{R.draft(k,e.target.type==='checkbox'?e.target.checked:e.target.value);updateLive()}catch(err){toast(err.message,true)}}});
  document.addEventListener('change',e=>{const k=e.target.dataset.draft;if(k){try{R.draft(k,e.target.type==='checkbox'?e.target.checked:e.target.value);updateLive()}catch(err){toast(err.message,true)}}if(e.target.id==='photo-file'&&e.target.files[0])loadPhoto(e.target.files[0]);if(e.target.id==='sales-csv'&&e.target.files[0])loadCSV(e.target.files[0]);});
  async function loadPhoto(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('JPEG・PNG・WebPの写真を選んでください',true);return}if(file.size>15*1024*1024){toast('写真は15MB以下にしてください',true);return}let u=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{let scale=Math.min(1,900/Math.max(img.width,img.height));let canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);R.tx(s=>{s.photo=canvas.toDataURL('image/jpeg',.68);R.audit('確認用写真を添付','このブラウザに縮小保存。外部送信・AI読取りなし。',s)});render();toast('写真を確認用として保存しました')}catch(e){toast('写真を保存できませんでした',true)}finally{URL.revokeObjectURL(u)}};img.onerror=()=>{URL.revokeObjectURL(u);toast('この画像を読み込めませんでした',true)};img.src=u;}
  async function loadCSV(file){try{if(file.size>100000)throw Error('デモでは100KB以下のCSVを使ってください');const rows=(await file.text()).replace(/^\ufeff/,'').trim().split(/\r?\n/).map(x=>x.split(',').map(v=>v.trim().replace(/^"|"$/g,'')));if(rows.length!==2||rows[0][0]!=='商品コード'||rows[0][1]!=='数量'||rows[1][0]!=='nanban')throw Error('見本CSVの形式（商品コード,数量 / nanban の1行）で保存してください');const n=R.num(rows[1][1],'数量',0,1000);if(!Number.isInteger(n))throw Error('数量は整数にしてください');R.draft('salesQty',String(n));render();toast('CSVを入力欄へ読み込みました。反映は確認後です。')}catch(e){toast(e.message,true)}}
  document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;if(act!=='close-guide')e.preventDefault();try{switch(act){
    case 'guide':guide();break;
    case 'close':close();break;
    case 'close-guide':close();break;
    case 'start-guide':case 'navigate-next':R.tx(s=>{s.guideSeen=true});close();go(a.dataset.route);break;
    case 'settings':settings();break;
    case 'navigator':openNavigator();break;
    case 'receive':run(R.receive,'納品を確定。在庫と原価へ反映しました。');break;
    case 'sell':run(R.sell,'販売数を反映。レシピの材料が連動しました。');break;
    case 'count':run(R.countInventory,'棚卸しを確定。差異と明日の不足を引き継ぎました。');break;
    case 'plan':run(R.plan,'発注と移動の案を承認。まだ在庫は増えません。');break;
    case 'transfer':confirmAction(S().plan?.transferStatus==='requested'?'駅前店の出庫を記録しますか？':'本店で受取を記録しますか？','数量・期限・保管温度・運搬条件を人が確認した、という仮想の操作です。',()=>run(R.advanceTransfer,'店間移動の状態を更新しました。'));break;
    case 'purchase':confirmAction(S().plan?.purchaseStatus==='draft'?'発注済み状態を体験しますか？':'追加入荷を在庫へ反映しますか？','外部への注文は送信しません。納品操作では、数量を確認した仮想記録を残します。',()=>run(R.advancePurchase,'発注・納品の状態を更新しました。'));break;
    case 'confirm-action':if(pendingAction){let fn=pendingAction;pendingAction=null;fn()}break;
    case 'choose':{let x=a.dataset.id;if(S().product.taste||S().product.trial)confirmAction('候補を変更し、再確認に戻しますか？','過去の評価は履歴へ残し、新しい候補で味見と販売条件を確認し直します。',()=>run(()=>R.choose(x),'候補を変更。以前の評価は履歴に残しました。'));else run(()=>R.choose(x),'試作候補を選びました。次は、人が味見します。');break}
    case 'conditions':if(S().product.taste||S().product.trial)confirmAction('条件を変えて、確認を取り直しますか？','新しい価格・予定数・ソース量を適用し、味見と承認をやり直します。',()=>run(R.saveConditions,'条件を更新。新しい条件で再確認します。'));else run(R.saveConditions,'商品条件を保存しました。');break;
    case 'sample':run(R.receiveSample,'サンプル30個を、候補専用の在庫へ反映しました。');break;
    case 'taste':run(R.saveTaste,'人の味見と確認内容を保存しました。');break;
    case 'start-trial':run(R.startTrial,'試験販売の準備ができました。公開はしていません。');break;
    case 'trial-result':run(R.recordTrial,'試験結果と声を記録。材料在庫にも反映しました。');break;
    case 'revise':confirmAction('一か所だけ変えて、追いルウ改善へ。','ソースを10g減らし、次の試験は10食。改善は仮説です。過去の結果は残し、再度味見します。',()=>run(R.revise,'新しい試作版へ。もう一度、人が味見してください。','product/taste'));break;
    case 'finalize':confirmAction('今回の結果を、正式版として残しますか？','本店は使用開始。ほかの店舗は、配信・再現確認を個別に進めます。',()=>run(R.finalize,'一皿のレシピとして標準化しました。'));break;
    case 'rollout':{let i=Number(a.dataset.store),stage=S().product.rollouts[i];modal(R.sites[i]+'｜'+['配信','内容確認','再現テスト','使用開始'][stage],'一つずつ確認を残します。外部通知は送信しません。',stage===0?note('正式版v'+S().product.standard.version+'をこの店舗へ共有した状態を記録します。'): `<div class="field"><label for="proof">誰が、何を確認しましたか？</label><textarea id="proof" maxlength="600" placeholder="例：担当スタッフが手順だけで試作。盛付量と設備条件を確認。"></textarea><div class="hint">${i===4?'この店舗は小型厨房の設定。設備条件を実際に確認した記録を残してください。':'未確認のまま完了にしないでください。'}</div></div>`,button('rollout-confirm','確認を記録する','btn primary',`data-store="${i}"`,'check'));break}
    case 'rollout-confirm':run(()=>R.rollout(Number(a.dataset.store),$('#proof')?.value||''),'店舗の引継ぎを、一段進めました。');break;
    case 'resolve-diff':modal('在庫差異の確認記録','在庫は棚卸しで補正済みです。この記録では数量を変えません。',`<div class="field"><label for="proof">確認者・確認した内容・次の対応</label><textarea id="proof" maxlength="600" placeholder="例：担当者と実測を再確認。未記録の使用分は追跡中。次の納品時にも確認する。">${esc(S().diffProof||'')}</textarea></div>`,button('resolve-confirm','確認内容を保存','btn primary','','check'));break;
    case 'resolve-confirm':{const p=$('#proof').value.trim();if(!p)throw Error('確認内容を入力してください');run(()=>R.tx(s=>{s.diffResolved=true;s.diffProof=R.text(p,600);R.audit('棚卸し差異の確認内容を記録',p,s)}),'確認内容を保存。原因を自動断定していません。');break}
    case 'add-note':run(R.addNote,'気づきを、担当者と次の仕事へつなげました。');break;
    case 'note-sample':R.tx(s=>{s.drafts.noteText=a.dataset.kind==='idea'?'賄いでメンチとカレーの相性がよかった。ソースの量を変えて、次の試食で比べたい。':'明日の予約分の食材を確認する。数量と受取予定を仕入れ担当へ確認してほしい。';s.drafts.noteType=a.dataset.kind==='idea'?'賄い・商品アイデア':'引継ぎ';s.drafts.noteOwner='';});render();break;
    case 'note-work':{let n=S().notes.find(n=>n.id===a.dataset.id);if(!n)throw Error('記録が見つかりません');modal(n.owner?'完了の確認を残す':'担当者を決める','未割当の仕事を、完了扱いにはしません。',`<p class="small muted" style="white-space:pre-wrap;margin-bottom:15px">${esc(n.body)}</p><div class="field"><label for="proof">${n.owner?'確認者と完了の証拠':'担当する人の名前・役割'}</label><textarea id="proof" maxlength="600"></textarea></div>`,button('note-work-confirm','記録する','btn primary',`data-id="${n.id}"`,'check'));break}
    case 'note-work-confirm':{let id=a.dataset.id,n=S().notes.find(n=>n.id===id),proof=$('#proof').value.trim();if(!proof)throw Error('確認内容を入力してください');run(()=>n.owner?R.completeNote(id,proof):R.tx(s=>{let row=s.notes.find(n=>n.id===id);row.owner=R.text(proof,40);row.status='対応中';R.audit('引継ぎの担当者を設定',row.owner,s)}),'仕事の状態を更新しました。');break}
    case 'order-doc':showDoc('発注書のプレビュー',orderDoc(),'発注書_DEMO.txt');break;
    case 'promo':showDoc('同じカルテから、売り方まで',promoDoc(),'試験販売_販促下書き.txt');break;
    case 'recipe-doc':showDoc('一皿の業務レシピ',recipeDoc(),'一皿の業務レシピ.txt');break;
    case 'case-doc':showDoc('改善前後と引継ぎの記録',report(),'飲食経営OS_体験レポート.txt');break;
    case 'save-doc':download(a.dataset.name||'document.txt',docBuffer);break;
    case 'copy-doc':if(navigator.clipboard?.writeText)navigator.clipboard.writeText(docBuffer).then(()=>toast('コピーしました')).catch(()=>toast('コピーできません。保存ボタンをご利用ください。',true));else{let ta=document.createElement('textarea');ta.value=docBuffer;$('#dialog').append(ta);ta.select();let ok=document.execCommand('copy');ta.remove();toast(ok?'コピーしました':'コピーできません。保存をご利用ください。',!ok)}break;
    case 'sales-template':download('売上CSV見本.csv','\ufeff商品コード,数量\r\nnanban,100\r\n','text/csv;charset=utf-8');break;
    case 'export-stock':download('食材在庫_デモ.csv',csv([['店舗','食材','数量','単位','基準単価_円','参考金額_円'],...R.sites.flatMap((name,i)=>Object.keys(R.items).map(k=>[name,R.items[k].name,R.stock(k,i),R.items[k].unit,S().prices[k],R.round(R.stock(k,i)*S().prices[k])]))]),'text/csv;charset=utf-8');break;
    case 'export-order':{let p=S().plan;if(!p)throw Error('発注案を先に作ってください');download('発注案_デモ.csv',csv([['状態','納品先','仕入れ先','食材','数量_kg','単価_税抜円','合計_税抜円'],['外部送信なし','本店','サンプル食材卸','鶏もも肉',p.purchase,p.price,p.purchase*p.price],['店間移動','本店','駅前店','鶏もも肉',p.transfer,'','']]),'text/csv;charset=utf-8');break}
    case 'export-json':download('飲食経営OS_デモ記録.json',JSON.stringify(S(),null,2),'application/json');break;
    case 'export-report':download('飲食経営OS_体験レポート.txt',report());break;
    case 'reset-confirm':modal('このデモを、最初に戻しますか？','このブラウザの飲食経営OSデータだけを初期化します。',note('納品・試作・写真・引継ぎ・途中入力も初期状態に戻ります。必要な記録は先に書き出してください。','warn'),button('export-json','先にデータを保存','btn','','download')+button('reset','初期化する','btn danger','','refresh'));break;
    case 'reset':R.reset();close();go('today');render();toast('最初のシナリオに戻しました。');break;
  }}catch(err){toast(err.message||'操作できませんでした',true)}});
  window.addEventListener('hashchange',()=>{close();render();window.scrollTo({top:0,behavior:'instant'});});
  window.addEventListener('os-conflict',()=>{if($('.conflict'))return;let div=document.createElement('div');div.className='conflict';div.setAttribute('role','alert');div.innerHTML='別のタブで記録が更新されました。二重更新を避けるため、再読み込みしてください。<button class="btn sm" onclick="location.reload()">読み込む</button>';document.body.prepend(div);});
  $('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){let r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});
  render();
  window.OSDemo={render,report,go};
})();
</script></body></html>

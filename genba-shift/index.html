const factors={conservative:{adoption:-20,rate:.8,label:'慎重'},standard:{adoption:0,rate:1,label:'標準'},established:{adoption:15,rate:1.1,label:'定着後'}};
function taskCalc(t,s=state,scenario=s.scenario){
 const f=factors[scenario]||factors.standard;
 const blocked=t.risk==='high'&&!t.safe&&t.method==='ai';
 const eligible=t.selected&&t.method!=='human'&&!t.locked&&!blocked&&(t.method!=='stop'||t.stopApproved===true);
 const adopt=clamp(s.adoption+f.adoption,0,100)/100;
 const r=t.method==='stop'?1:clamp(t.rate*(t.method==='ai'?f.rate:1),0,100)/100;
 const review=t.method==='ai'?t.review:0;
 const gross=eligible?t.count*t.minutes*r*adopt/60:0;
 const checking=eligible?t.count*review*adopt/60:0;
 const baseline=t.count*t.minutes/60;
 return{baseline,gross,checking,net:gross-checking,eligible,blocked,adopt,rate:r,review,unitAfter:t.minutes*(1-r)+review};
}
function calc(s=state,scenario=s.scenario){
 const rows=s.tasks.map(t=>({...t,...taskCalc(t,s,scenario)}));
 const selected=rows.filter(t=>t.selected),effective=rows.filter(t=>t.eligible);
 const sum=(arr,k)=>arr.reduce((a,x)=>a+x[k],0);
 const baseline=sum(selected,'baseline');
 const gross=sum(effective,'gross'),review=sum(effective,'checking');
 const hasAI=effective.some(t=>t.method==='ai');
 const maintenance=hasAI?s.maintenance:0;
 const net=gross-review-maintenance;
 const cost=effective.length?s.monthlyTools+s.monthlySupport:0;
 const value=net*s.hourly;
 const benefit=value-cost;
 const cash=Math.max(0,net)*s.hourly*s.cashRate/100-cost;
 const initialTime=(s.setupHours+s.trainingHours)*s.hourly;
 const initial=s.initialCash+initialTime;
 const payback=effective.length&&benefit>0?initial/benefit:null;
 const cashPayback=effective.length&&cash>0?s.initialCash/cash:null;
 const capacity=s.employees*s.days*8;
 const ranked=effective.filter(t=>t.net>0).sort((a,b)=>(b.net/(b.effort+2)*(b.risk==='high'?.6:b.risk==='medium'?.85:1))-(a.net/(a.effort+2)*(a.risk==='high'?.6:a.risk==='medium'?.85:1)));
 return{rows,selected,effective,baseline,gross,review,maintenance,net,cost,value,benefit,cash,initial,initialTime,payback,cashPayback,annual:benefit*12-initial,annualCash:cash*12-s.initialCash,capacity,ranked,blocked:rows.filter(t=>t.selected&&t.blocked),adoption:clamp(s.adoption+(factors[scenario]||factors.standard).adoption,0,100),workloadExceeded:sum(rows,'baseline')>capacity};
}
function readSafeSnapshot(raw){
 if(!raw||typeof raw!=='object'||!Array.isArray(raw.tasks)||raw.tasks.length>60)throw Error('対応する診断ファイルではありません。');
 const s=initial(industries.some(x=>x[0]===raw.industry)?raw.industry:'general');
 const bounds={employees:[1,100000],days:[1,31],hourly:[0,100000],adoption:[0,100],monthlyTools:[0,10000000],monthlySupport:[0,10000000],initialCash:[0,100000000],setupHours:[0,100000],trainingHours:[0,100000],maintenance:[0,100000],cashRate:[0,100]};
 for(const [k,[a,b]]of Object.entries(bounds))s[k]=clamp(raw[k],a,b,s[k]);
 s.company=String(raw.company||'会社名未入力').slice(0,100);s.problem=String(raw.problem||'').slice(0,1000);s.goal=goals[raw.goal]?raw.goal:'customer';s.dataReady=['paper','mixed','digital'].includes(raw.dataReady)?raw.dataReady:'mixed';s.scenario=factors[raw.scenario]?raw.scenario:'standard';
 const ids=new Set();
 s.tasks=raw.tasks.map((r,i)=>{
  if(!r||typeof r!=='object')throw Error('業務データが不正です。');
  const id=String(r.id||`task-${i}`).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,60)||`task-${i}`;
  if(ids.has(id))throw Error('業務IDが重複しています。');ids.add(id);
  const t=task(id,String(r.name||'名称未入力').slice(0,80),String(r.category||'その他').slice(0,30),clamp(r.count,0,1000000),clamp(r.minutes,0,1440),clamp(r.rate,0,100),clamp(r.review,0,1440),String(r.desc||'').slice(0,400),String(r.tip||'').slice(0,600),['low','medium','high'].includes(r.risk)?r.risk:'medium',METHODS[r.method]?r.method:'ai',clamp(r.effort,0,10000),r.locked===true);
  t.selected=r.selected===true;t.safe=r.safe===true;t.stopApproved=r.stopApproved===true;t.source=SOURCES[r.source]?r.source:'hypothesis';if(t.locked)t.method='human';return t;
 });
 if(raw.pilot&&typeof raw.pilot==='object'){const p=raw.pilot;s.pilot.taskId=s.tasks.some(x=>x.id===p.taskId)?p.taskId:'';s.pilot.owner=String(p.owner||'現場の担当者').slice(0,80);s.pilot.date=/^\d{4}-\d{2}-\d{2}$/.test(p.date)?p.date:'';s.pilot.target=clamp(p.target,0,100);s.pilot.statuses=Array.from({length:4},(_,i)=>clamp(p.statuses?.[i],0,2));for(const k of ['before','after','count','days'])s.pilot[k]=p[k]===''?'':clamp(p[k],0,1000000);s.pilot.quality=['未確認','合格','要改善'].includes(p.quality)?p.quality:'未確認';s.pilot.minutesNote=String(p.minutesNote||'').slice(0,1000);}
 return s;
}

<div class="bottom-banner"><div><div class="eyebrow" style="margin-bottom:5px">START SMALL. MAKE IT REAL.</div><h3>全部変えなくていい。まず、ひとつ終わらせる。</h3><p>担当・合格条件・やめる基準を決めて、現場で30日間の実証へ。</p></div>${button(`最初の実証を決める ${icon('arrow')}`,'nav','primary','data-view="pilot"')}</div>
<div class="section-title"><h2>数字の先にある、3つの視点</h2><span class="tiny">ルールベースの助言 / AI会議ではありません</span></div>${experts(c)}
`;}
function experts(c){const data=state.dataReady==='paper'?'紙が中心なら、最初は情報の置き場所と入力項目を整えるところから。AI操作を仕事として増やさないことが大切です。':state.dataReady==='mixed'?'紙・Excel・チャットを全部つなぐ前に、正しい情報の置き場所を一つ決めます。入力の二度手間を増やさない順番で進めます。':'情報がデジタルでも、最新版と参照権限の整理が必要です。普段の仕事の入口から使える設計にします。';return`<div class="expert-grid"><section class="expert"><div class="expert-top"><span class="avatar">現</span><h3>現場の視点</h3></div><p>${data}</p></section><section class="expert"><div class="expert-top"><span class="avatar">経</span><h3>経営の視点</h3></div><p>${c.cash<=0?'時間が浮いても、そのまま現金が増えるわけではありません。残業支出が本当に減るか、顧客対応へ再配分できるかを別に検証します。':`支出削減への転換を ${state.cashRate}% と仮定しています。実際に減る残業費・外注費で、この仮定を裏付ける必要があります。`}</p></section><section class="expert"><div class="expert-top"><span class="avatar">守</span><h3>安全・定着の視点</h3></div><p>${c.blocked.length?`${c.blocked.length} 件は機密・個人情報の扱いが未確認です。利用環境と確認担当が決まるまで、効果には算入しません。`:'AIが作るのは下書きや整理まで。価格・安全・契約・採用などの判断は人に残し、困ったときの戻し先も決めます。'}</p></section></div>`;}
function viewTasks(){const c=calc();return`${pageHead('FIND THE RIGHT WORK','AIの前に、仕事を見よう。','「AIで補助・仕組みで削減・やめる・人が担う」を、一つずつ選ぶ。',button(`${icon('plus')}業務を追加`,'add-task','primary'))}${companyStrip()}<div class="toolbar"><div class="tabs" aria-label="業務の絞り込み">${[['all','すべて'],['selected','試算に入れる'],['ai','AIで補助'],['other','AI以外']].map(([id,label])=>`<button data-action="filter" data-filter="${id}" class="${filter===id?'active':''}">${label}</button>`).join('')}</div><div class="search">${icon('search')}<input type="text" id="task-search" placeholder="業務を検索" value="${esc(query)}" aria-label="業務を検索"></div>${button(`${icon('plus')}業務を追加`,'add-task','small')}</div><div id="task-cards">${taskCards(c)}</div><div class="assumption-bar">${icon('info')}<span>件数は「全社で月に何件」。社員数は重ねて掛けません。同じ作業を複数の業務に含めないでください。</span></div>${button(`条件を動かして、効果を比べる ${icon('arrow')}`,'nav','primary','data-view="simulation"')}`;}
function taskCards(c=calc()){const rows=c.rows.filter(t=>(filter==='all'||filter==='selected'&&t.selected||filter==='ai'&&t.method==='ai'||filter==='other'&&t.method!=='ai')&&`${t.name}${t.category}`.includes(query));return rows.length?`<div class="task-grid">${rows.map(t=>`<article class="task-card ${!t.selected?'inactive':''}"><div class="task-card-top"><span class="category">${esc(t.category)}</span><label class="task-check"><input type="checkbox" data-task-toggle="${t.id}" ${t.selected?'checked':''} aria-label="${esc(t.name)}を試算に含める"><span>試算に入れる</span></label></div><h3>${esc(t.name)}</h3><p class="description">${esc(t.desc)}</p><div class="tags"><span class="pill ${t.method!=='ai'?'gray':''}">${METHODS[t.method]}</span>${riskPill(t)}</div><div class="task-stat"><div><span class="tiny">削減見込み</span><div class="saving ${t.net<0?'negative':''}">${fmt(t.net,1)}<span>h/月</span></div></div><div class="small">${fmt(t.count)}件 × ${fmt(t.minutes)}分<br><span>${SOURCES[t.source]}</span></div></div>${button(`${icon('play')}動き・条件を見る`,'task','',`data-id="${t.id}"`)}</article>`).join('')}</div>`:'<div class="empty">該当する業務がありません。検索や絞り込みを変更してください。</div>';}
function viewSimulation(){return`${pageHead('MAKE THE IMPACT TANGIBLE','その数字、現場で実現できる？','使われる割合、確認の手間、費用。条件を動かして、期待と現実をそろえる。')}${companyStrip()}<div class="sim-layout"><aside class="card sim-controls"><div class="eyebrow">CONTROL PANEL</div><h2 style="font-size:17px">導入条件を動かす</h2><div class="slider-group"><div class="slider-head"><label for="adoption">業務で実際に使われる割合</label><output id="adoption-value">${state.adoption}%</output></div><input type="range" id="adoption" min="0" max="100" step="5" value="${state.adoption}" data-live="adoption"><div class="slider-ends"><span>まだ使われない</span><span>現場に定着</span></div></div><div class="slider-group"><div class="slider-head"><label for="maintenance">チーム全体の運用・調整</label><output id="maintenance-value">${state.maintenance}h/月</output></div><input type="range" id="maintenance" min="0" max="${Math.max(40,state.maintenance)}" step="1" value="${state.maintenance}" data-live="maintenance"><div class="slider-ends"><span>0h</span><span>${Math.max(40,state.maintenance)}h / 月</span></div></div><div class="divider"></div><div class="fields-2">${field('人件費換算単価（円/h）','hourly',state.hourly,'number','福利厚生などを含む概算でも可','min="0" max="100000" data-live="hourly"')}${field('ツール等（円/月）','monthlyTools',state.monthlyTools,'number','実契約額ではなく試算用の入力','min="0" max="10000000" data-live="monthlyTools"')}</div>${button(`${icon('sliders')}支援費・初期費用も調整`,'costs','small')}<div class="divider"></div><div class="slider-head">生まれた時間の使い道</div><div class="goal-options">${Object.entries(goals).map(([id,[label,ic]])=>`<button class="goal-option ${state.goal===id?'active':''}" data-action="goal" data-goal="${id}">${icon(ic)}<span>${label}</span></button>`).join('')}</div><div class="divider"></div><div class="slider-group no-margin"><div class="slider-head"><label for="cashRate">実際の支出削減に転換</label><output id="cashRate-value">${state.cashRate}%</output></div><input type="range" id="cashRate" min="0" max="100" step="5" value="${state.cashRate}" data-live="cashRate"><p class="tiny">原則0%。残業・外注などの支出が減る根拠がある場合にだけ設定します。</p></div></aside><div id="sim-results">${simResults()}</div></div>`;}
function simResults(){const c=calc();const max=Math.max(c.gross,c.review,c.maintenance,Math.abs(c.net),1);return`<div class="card"><div class="card-head"><div><h2>使われて初めて、効果になる。</h2><p>当月の定常稼働を想定 / 月間の純削減時間</p></div><span class="pill">${factors[state.scenario].label}</span></div><div class="mini-kpis"><div class="mini-kpi"><div class="label">月間の純削減時間</div><div class="value ${c.net<0?'negative':''}">${fmt(c.net,1)}<span class="small">h</span></div></div><div class="mini-kpi"><div class="label">時間価値 − 月額費用</div><div class="value ${c.benefit<0?'negative':''}">${man(c.benefit)}<span class="small">万円</span></div></div><div class="mini-kpi"><div class="label">現金の増減 / 月</div><div class="value ${c.cash<0?'negative':''}">${man(c.cash)}<span class="small">万円</span></div></div></div><div class="waterfall" role="img" aria-label="削減余地${fmt(c.gross,1)}時間から確認${fmt(c.review,1)}時間、運用${fmt(c.maintenance,1)}時間を引き、純削減${fmt(c.net,1)}時間">${[[c.gross,'使われる分の削減余地',''],[c.review,'− 確認・修正','loss'],[c.maintenance,'− 運用・調整','loss'],[c.net,'＝ 純削減時間','result']].map(([v,label,cls])=>`<div class="water-col"><div class="water-val ${v<0?'negative':''}">${fmt(v,1)}<small>h</small></div><div class="water-box"><div class="water-bar ${cls}" style="height:${Math.max(2,Math.abs(v)/max*130)}px"></div></div><div class="water-label">${label}</div></div>`).join('')}</div>${notice('この「削減余地」には、AIを使わない仕組み改善も含みます。確認時間はAIを使う件数分、運用時間は全体から1回だけ差し引いています。',true)}<div class="cost-line"><span>選択業務の現状工数</span><b>${fmt(c.baseline,1)}h/月</b></div><div class="cost-line"><span>導入後の人の工数（運用込み）</span><b>${fmt(c.baseline-c.net,1)}h/月</b></div><div class="cost-line"><span>全社の想定労働時間に対する削減割合</span><b>${fmt(c.net/c.capacity*100,1)}%</b></div><div class="definition">全社工数は ${fmt(state.employees)}人 × ${state.days}日 × 8時間 の仮定。勤務形態が異なる会社では目安として扱います。</div></div>
<section class="card section"><div class="card-head"><div><h2>うまく使われない場合も比べる。</h2><p>統計的な信頼区間ではなく、条件を変えた感度分析</p></div></div><div class="scenario-cards">${Object.entries(factors).map(([key,f])=>{const a=calc(state,key);return`<button class="scenario-card ${state.scenario===key?'active':''}" data-action="scenario" data-scenario="${key}"><h3>${f.label}</h3><div class="sc-number ${a.net<0?'negative':''}">${fmt(a.net,1)}<small>h/月</small></div><small>使用率 ${a.adoption}%<br>AI削減率 ${f.rate===1?'入力通り':`${f.rate}倍`}</small></button>`;}).join('')}</div><div class="inline-note">慎重：使用率 −20ポイント・AI削減率 ×0.8。定着後：使用率 ＋15ポイント・AI削減率 ×1.1（上限100%）。</div></section>
<section class="card section"><div class="card-head"><div><h2>見えないコストも、最初から。</h2><p>税抜の試算用金額 / 全シナリオで同じ費用条件</p></div>${button('調整する','costs','small')}</div><div class="cost-line"><span>取り戻す時間の価値 / 月</span><b>${money(c.value)}</b></div><div class="cost-line"><span>ツール・運用支援の支出 / 月</span><span>− ${money(c.cost)}</span></div><div class="cost-line"><span>導入・構築の初期支出</span><span>− ${money(state.initialCash)}</span></div><div class="cost-line"><span>準備・研修の人の時間（${fmt(state.setupHours+state.trainingHours)}h）</span><span>− ${money(c.initialTime)}</span></div><div class="cost-line total"><span>初年度の時間価値 − 全費用</span><span class="${c.annual<0?'negative':''}">${money(c.annual)}</span></div><div class="inline-note">月間効果 × 12か月 − 初期支出 − 準備・研修の時間価値。初月から現在の使用率が続く仮定で、立ち上がり期間は別途検証が必要です。</div><div class="divider"></div><div class="cost-line"><span>現金ベースの初年度増減</span><b class="${c.annualCash<0?'negative':''}">${money(c.annualCash)}</b></div><div class="cost-line"><span>現金ベースの初期支出回収</span><b>${c.cashPayback===null?'この条件では回収見込みなし':`${fmt(c.cashPayback,1)}か月`}</b></div></section><div class="reinvest">${icon(goals[state.goal][1])}<div><h3>${c.net>0?`月 ${fmt(c.net,1)} 時間を、${goals[state.goal][2]}。`:'まず、負担を減らせる条件を探そう。'}</h3><p>売上増や顧客満足は、自動では生まれません。次に実証する成果として決めます。</p></div></div>${button(`実証で確かめる ${icon('arrow')}`,'nav','primary section','data-view="pilot"')}`;}
function pilotTask(c=calc()){return state.pilot.taskId?(c.effective.find(t=>t.id===state.pilot.taskId)||null):(c.ranked[0]||null);}
function actualResult(){const p=state.pilot;const valid=!!state.tasks.find(x=>x.id===p.taskId)&&['before','after','count','days'].every(k=>p[k]!==''&&Number.isFinite(Number(p[k])))&&p.count>0&&p.days>0&&p.before>0;return{valid,saved:valid?(p.before-p.after)*p.count/60:0,rate:valid?(p.before-p.after)/p.before*100:0};}
function viewPilot(){const c=calc(),t=pilotTask(c),p=state.pilot,actual=actualResult();if(!p.taskId&&t)p.taskId=t.id;return`${pageHead('ONE WORKFLOW. REAL CHANGE.','まず、ひとつの仕事を変える。','30日間で「使えるか」を確認。合わなければ止めることも、成功です。')}${companyStrip()}
${!t?notice('試算に入る業務がありません。「仕事を見つける」で対象を選び、安全条件を確認してください。'):''}<section class="card"><div class="card-head"><div><h2>最初の実証テーマ</h2><p>一業務・少人数・承認付き。最初から全社へ広げません。</p></div><span class="pill">30日間の実証案</span></div><div class="plan-select"><div class="field"><label for="pilot-task">対象の仕事</label><select id="pilot-task" data-pilot="taskId"><option value="">優先候補から選ぶ</option>${c.effective.map(x=>`<option value="${x.id}" ${t?.id===x.id?'selected':''}>${esc(x.name)}（${fmt(x.net,1)}h/月の仮説）</option>`).join('')}</select><div class="hint">対象変更時は実測・進捗を初期化します。</div></div>${field('担当者・役職','pilot-owner',p.owner,'text','個人名ではなく役職でも可','maxlength="80" data-pilot="owner"')}${field('開始予定日','pilot-date',p.date,'date','','data-pilot="date"')}</div><div class="insight">${t?esc(t.tip):'現場の繰り返し作業から、月に何回あるか・1回何分かを記録して候補を探します。'}</div><div class="progress-strip" aria-label="実証ステップ完了数 ${p.statuses.filter(x=>x===2).length}/4">${p.statuses.map(x=>`<span class="progress-dot ${x===2?'done':''}"></span>`).join('')}</div><span class="tiny">完了 ${p.statuses.filter(x=>x===2).length} / 4 ステップ</span></section>
<div class="section-title"><h2>現場に入れるための、4ステップ</h2><span class="tiny">日数は進め方の提案</span></div><div class="step-list">${[
['DAY 01–07','今の仕事を測る','同じ種類の仕事で、件数と作業時間を記録。重複・やめられる作業も確認。','成果物：現状の業務地図'],['DAY 08–14','小さく試作する','匿名・ダミー情報から開始。入力・出力・人の確認ポイントを決める。','成果物：試作品と品質チェック表'],['DAY 15–21','現場で試して測る','少人数で実行し、確認・修正を含む時間と品質を測る。困ったら手作業へ戻す。','成果物：実測記録と問題点'],['DAY 22–30','続けるかを決める','時間・品質・負担で判断。使い方を一枚にまとめて、担当へ引き継ぐ。','成果物：継続／修正／停止の判断']].map(([day,title,text,foot],i)=>`<article class="step-card ${p.statuses[i]===1?'active':''}"><div class="step-num">${day}</div><h3>${title}</h3><p>${text}</p><span class="small muted">${foot}</span><select aria-label="${title}の進捗" data-status="${i}" style="margin-top:15px;font-size:11px;min-height:37px;padding:7px">${['未着手','実施中','完了'].map((v,j)=>`<option value="${j}" ${p.statuses[i]===j?'selected':''}>${v}</option>`).join('')}</select></article>`).join('')}</div>
<div class="grid-2 section"><section class="card"><div class="card-head"><div><h2>期待値と、実測を分ける。</h2><p>同じ種類の仕事・同じ集計範囲で比較</p></div><span class="pill gray">実測入力</span></div><div class="fields-2">${field('導入前 / 1件の人の工数（分）','measure-before',p.before,'number','','min="0" max="1440" step="0.1" data-measure="before"')}${field('導入後 / 1件の人の工数（分）','measure-after',p.after,'number','確認・修正・準備も含める','min="0" max="1440" step="0.1" data-measure="after"')}${field('実際に試した件数','measure-count',p.count,'number','','min="1" max="1000000" data-measure="count"')}${field('測定した営業日数','measure-days',p.days,'number','','min="1" max="366" data-measure="days"')}</div><div class="fields-2">${field('合格目標 / 工数削減率（%）','pilot-target',p.target,'number','','min="0" max="100" data-measure="target"')}<div class="field"><label for="measure-quality">品質の確認</label><select id="measure-quality" data-measure="quality">${['未確認','合格','要改善'].map(q=>`<option ${p.quality===q?'selected':''}>${q}</option>`).join('')}</select></div></div><div id="actual-result">${measurementResult()}</div><div class="field section"><label for="pilot-note">現場の気づき・判断のメモ</label><textarea id="pilot-note" rows="3" maxlength="1000" placeholder="うまくいった条件、修正が必要な点、次に確認すること" data-pilot="minutesNote">${esc(p.minutesNote)}</textarea></div></section><section class="card"><div class="card-head"><div><h2>続けるための、約束。</h2><p>導入前に現場と合意する条件</p></div>${icon('shield')}</div><div class="safety-box"><h4>合格条件</h4><p>確認・修正を含めて ${p.target}% 以上の工数削減。品質に問題がなく、担当者が再現できること。</p></div><div class="safety-box"><h4>必ず人が確認すること</h4><p>${t?esc(t.tip):'事実・金額・相手への約束・個人情報。'} AIの回答をそのまま外部へ送りません。</p></div><div class="safety-box"><h4>止める条件</h4><p>重大な誤り、情報の漏えい、確認負担の増加があった場合は停止。従来の手作業に戻し、責任者へ報告します。</p></div><div class="safety-box"><h4>引き継ぐもの</h4><p>入力の例、完成見本、確認表、困ったときの連絡先、通常業務へ戻す手順を一枚にまとめます。</p></div>${button(`提案書にまとめる ${icon('arrow')}`,'nav','primary','data-view="report"')}</section></div>`;}
function measurementResult(){const p=state.pilot,a=actualResult();if(!a.valid)return'<div class="empty">実測値を入力すると、仮説とは別に結果を表示します。</div>';const pass=p.target!==''&&a.rate>=p.target&&p.quality==='合格';return`<div class="equation"><span class="pill ${pass?'':p.quality==='要改善'?'red':'warn'}">${pass?'数値・品質条件を達成（入力ベース）':p.quality==='未確認'?'品質確認待ち':'要改善・再検証'}</span><div class="metrics-inline"><div><b>${fmt(a.saved,1)}h</b>測定期間内の純削減</div><div><b>${fmt(a.rate,1)}%</b>1件あたりの工数削減</div><div><b>${fmt(p.count)}件</b>${fmt(p.days)}営業日の実績</div></div><div class="inline-note">実測は${esc(p.days)}営業日のサンプルです。月間・全社への外挿はしません。品質や担当者の負担は人が最終判断します。</div></div>`;}
function viewReport(){const c=calc(),t=pilotTask(c),a=actualResult();const date=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo'}).format(new Date());return`${pageHead('FROM CONVERSATION TO ACTION','「やってみたい」を、次の一歩へ。','この提案書を印刷、または診断データとして保存できます。',button(`${icon('printer')}印刷・PDF保存`,'print','primary'))}<div class="head-actions no-print" style="margin-bottom:20px">${button(`${icon('printer')}印刷・PDF保存`,'print','primary')}${button(`${icon('download')}診断データ`,'export')}${button(`${icon('link')}デモURLをコピー`,'copy-url')}</div><article class="report-sheet"><header class="report-header"><div><div class="report-label">GENBA SHIFT / IMPLEMENTATION BRIEF</div><h2>AI導入・業務改善<br>ファーストステップ提案</h2></div><div style="text-align:right"><span class="pill gray">仮説シミュレーション</span><p class="tiny" style="margin-top:10px">作成日 ${date}<br>税抜・概算 / v${VERSION}</p></div></header><div class="report-company">${esc(state.company)} 様</div><p class="small muted">${industryName(state.industry)} / ${fmt(state.employees)}人 / 月${state.days}日 / 人件費換算 ${money(state.hourly)}/h</p><div class="report-kpis"><div><small>月間の純削減時間</small><b>${fmt(c.net,1)}<small> h</small></b></div><div><small>取り戻す時間の価値 / 月</small><b>${man(c.value)}<small> 万円</small></b></div><div><small>初年度の時間価値 − 費用</small><b>${man(c.annual)}<small> 万円</small></b></div></div><p class="definition">すべて入力条件からの試算です。時間価値は利益・現金削減額ではありません。確認・修正・運用の時間、初期費用と教育時間を計上しています。</p><section class="report-section"><h3>01　何を変えるか</h3><p>「${goals[state.goal][2]}」ことを目標に、${t?`まず「${esc(t.name)}」を小さく検証します。`:'まず改善候補の業務を選び、現状を測定します。'} AIの利用自体を目的にせず、現場の仕事を一つ、使える状態にすることを優先します。</p>${state.problem?`<p style="margin-top:10px">ヒアリングメモ：${esc(state.problem)}</p>`:''}</section><section class="report-section"><h3>02　検証する優先候補</h3><div class="table-wrap"><table class="board-table"><thead><tr><th>業務・進め方</th><th>現状工数</th><th>削減見込み</th><th>入力の根拠</th></tr></thead><tbody>${c.ranked.slice(0,3).map(x=>`<tr><td>${esc(x.name)}<br><span class="tiny">${METHODS[x.method]}</span></td><td>${fmt(x.baseline,1)}h/月</td><td>${fmt(x.net,1)}h/月</td><td>${SOURCES[x.source]}</td></tr>`).join('')||'<tr><td colspan="4">対象が未選択です。</td></tr>'}</tbody></table></div><p class="tiny" style="margin-top:8px">上位候補のみ掲載。総削減時間には、選択中の対象業務すべてと運用工数を含みます。</p></section><section class="report-section"><h3>03　費用と計算条件</h3><div class="cost-line"><span>対象 ${c.selected.length} 業務 / 実際に使われる割合</span><b>${c.adoption}%（${factors[state.scenario].label}）</b></div><div class="cost-line"><span>確認・修正 ＋ 運用・調整</span><span>${fmt(c.review,1)}h ＋ ${fmt(c.maintenance,1)}h/月</span></div><div class="cost-line"><span>ツール・支援の月額支出</span><span>${money(c.cost)}/月</span></div><div class="cost-line"><span>初期支出 ＋ 準備・研修の時間価値</span><span>${money(state.initialCash)} ＋ ${money(c.initialTime)}</span></div><div class="cost-line"><span>時間価値ベースの回収目安</span><span>${c.payback===null?'回収見込みなし':`${fmt(c.payback,1)}か月`}</span></div><div class="cost-line"><span>現金ベースの初年度増減（転換率 ${state.cashRate}%）</span><span>${money(c.annualCash)}</span></div><p class="tiny">初月から現在の使用率が12か月続く仮定です。立ち上がり・繁閑差を実証で確認します。業種別の初期値は実績や研究値ではありません。</p></section><section class="report-section"><h3>04　30日間の実証と判断条件</h3><p>担当：${esc(state.pilot.owner||'未設定')}　/　開始予定：${esc(state.pilot.date||'未設定')}<br>1週目：現状を測る → 2週目：試作 → 3週目：現場で計測 → 4週目：継続・修正・停止の判断。<br>合格条件：確認込みの工数 ${state.pilot.target}% 以上削減、品質合格、現場で再現可能。<br>停止条件：重大な誤り、情報漏えい、確認負担増。従来の手順に戻します。</p></section><section class="report-section"><h3>05　守ること・まだ確認していないこと</h3><p>${t?esc(t.tip):'最終判断・外部送信・機密情報の扱いは人が確認します。'}<br>未確認：対象業務の実測値、AI出力の品質、利用環境・情報管理、担当者の定着、実際の支出削減。${c.blocked.length?`安全条件が未確認の ${c.blocked.length} 業務は効果に算入していません。`:''}</p></section>${a.valid?`<section class="report-section"><h3>06　入力済みの実測記録（仮説と分離）</h3><p>${esc(state.pilot.days)}営業日・${fmt(state.pilot.count)}件の測定。期間内の削減 ${fmt(a.saved,1)}h、1件あたり ${fmt(a.rate,1)}% 削減。品質：${esc(state.pilot.quality)}。</p>${state.pilot.minutesNote?`<p>${esc(state.pilot.minutesNote)}</p>`:''}</section>`:''}<footer class="report-foot">ルウ王子 × 一般社団法人 宮崎AIギルウド<br>GENBA SHIFT｜「AIを入れる」から「現場の仕事が変わる」へ。<br>このデモは外部AI未接続のルールベース試算です。正式な見積・成果保証・法的または専門的判断ではありません。</footer></article>`;}

let modalKind='',taskTab='flow',flowMode='after',selectedIndustry=state.industry;
function toast(text){const r=document.getElementById('toast-root');r.innerHTML=`<div class="toast">${esc(text)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>r.innerHTML='',4200);}
function openModal(title,body,foot='',wide=false){lastFocus=document.activeElement;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close" aria-label="閉じる">${icon('close')}</button></header><div class="modal-body">${body}</div>${foot?`<footer class="modal-foot">${foot}</footer>`:''}</section></div>`;document.body.style.overflow='hidden';document.querySelector('.modal-head button')?.focus();}
function closeModal(){document.getElementById('modal-root').innerHTML='';document.body.style.overflow='';modalKind='';editingTask=null;if(lastFocus?.isConnected)lastFocus.focus();}
function openCompany(){modalKind='company';openModal('会社のリアルを、ここから。',`<p class="small muted" style="margin-bottom:22px">会社情報と、現場の状況を入力します。顧客名・個人情報・秘密情報は入れないでください。</p><form id="company-form">${field('会社名・表示名','company-name',state.company,'text','','required maxlength="100"')}<div class="fields-2"><div class="field"><label for="company-industry">業種</label><select id="company-industry">${industries.map(([id,name])=>`<option value="${id}" ${state.industry===id?'selected':''}>${name}</option>`).join('')}</select></div>${field('従業員数（人）','company-employees',state.employees,'number','','required min="1" max="100000"')}${field('月の営業・稼働日数','company-days',state.days,'number','','required min="1" max="31"')}${field('1時間の人件費換算単価（円）','company-hourly',state.hourly,'number','実際の給与を入力する必要はありません','required min="0" max="100000"')}</div><div class="field"><label for="company-ready">現在の情報・仕事の置き場所</label><select id="company-ready"><option value="paper" ${state.dataReady==='paper'?'selected':''}>紙・口頭が中心</option><option value="mixed" ${state.dataReady==='mixed'?'selected':''}>紙・Excel・チャットが混在</option><option value="digital" ${state.dataReady==='digital'?'selected':''}>デジタル情報にまとまっている</option></select><div class="hint">改善の進め方に反映。これだけで削減時間は増減しません。</div></div><div class="field"><label for="company-problem">社長・現場が困っていること</label><textarea id="company-problem" rows="3" maxlength="1000" placeholder="例：現場のあとに書類作業が残り、ベテランに確認が集中している。">${esc(state.problem||'')}</textarea><div class="hint">提案レポートのヒアリングメモに反映。自由文から数値は推測しません。</div></div><label class="checkline"><input type="checkbox" id="replace-tasks" checked><span>業種を変えた場合、現在の業務を業種別の初期例に入れ替える</span></label>${notice('社員数を変えても業務量は自動で倍増させません。次の画面で「全社の月間件数」と「1件の分数」を確認します。',true)}<div id="company-error" class="field-error" role="alert"></div></form>`,`${button('キャンセル','close')}<div class="right"><button class="btn primary" type="submit" form="company-form">この会社で試算する ${icon('arrow')}</button></div>`);}
function openPresets(){modalKind='presets';selectedIndustry=state.industry;openModal('業種に合わせて、体験する。',`<p class="small muted" style="margin-bottom:18px">業種ごとの仕事を初期値として読み込みます。金額・時間・社員数は説明用の仮説で、平均値や導入実績ではありません。</p><div class="preset-grid" id="preset-grid">${presetGrid()}</div>${notice('「この業種で体験する」を押すと、現在の入力・実証記録を初期化します。残す場合は先に「保存」を使ってください。')}`,`${button('キャンセル','close')}<div class="right">${button('この業種で体験する','load-preset','primary')}</div>`);}
function presetGrid(){return industries.map(([id,name,ic])=>`<button class="preset-btn ${id===selectedIndustry?'selected':''}" data-action="select-preset" data-industry="${id}">${icon(ic)}${name}</button>`).join('');}
function openCosts(){modalKind='costs';openModal('導入・運用の費用を、正直に。',`<p class="small muted" style="margin-bottom:21px">金額は税抜の試算用です。実際の見積額やサービス価格ではありません。</p><form id="cost-form"><div class="section-label">毎月かかる費用</div><div class="fields-2">${field('ツール・API費用（円/月）','cost-tools',state.monthlyTools,'number','','required min="0" max="10000000"')}${field('運用支援費用（円/月）','cost-support',state.monthlySupport,'number','','required min="0" max="10000000"')}${field('チームの運用・調整（h/月）','cost-maintenance',state.maintenance,'number','AI業務がある場合に全体から一度控除','required min="0" max="100000" step="0.5"')}</div><div class="section-label">最初にかかる費用と、人の時間</div><div class="fields-2">${field('導入・構築の支出（円）','cost-initial',state.initialCash,'number','','required min="0" max="100000000"')}${field('情報整理・準備（全員合計h）','cost-setup',state.setupHours,'number','','required min="0" max="100000" step="0.5"')}${field('研修・習得（全員合計h）','cost-training',state.trainingHours,'number','参加人数 × 1人の研修時間で入力','required min="0" max="100000" step="0.5"')}</div>${notice('業務カードの「準備時間」は優先順位比較用です。費用計算にはこの画面の全体準備時間だけを使い、二重計上しません。',true)}<p class="definition">試算対象が0件なら月額費用は0円。初期費用は計画上の支出として残します。開始しない場合は初期費用も0円へ変更してください。</p></form>`,`${button('キャンセル','close')}<div class="right"><button class="btn primary" form="cost-form" type="submit">費用を反映する</button></div>`);}
function openTask(id,newTask=false){const original=state.tasks.find(t=>t.id===id);editingTask=original?clone(original):task(`custom-${Date.now()}`,'新しい業務','その他',20,20,50,4,'今、現場で繰り返している仕事。','完成条件と人の確認担当を決めて、小さく試します。','medium');editingTask.isNew=newTask;taskTab=newTask?'settings':'flow';flowMode='after';modalKind='task';drawTaskModal();}
function drawTaskModal(){const t=editingTask;openModal(`${esc(t.name)}`,`<div class="toolbar"><div class="tabs"><button data-action="task-tab" data-tab="flow" class="${taskTab==='flow'?'active':''}">仕事の変化を見る</button><button data-action="task-tab" data-tab="settings" class="${taskTab==='settings'?'active':''}">時間・条件を調整</button></div><span class="pill gray">${SOURCES[t.source]}</span></div><div id="task-modal-content">${taskTab==='flow'?taskFlow():taskSettings()}</div>`,`${!t.isNew?button('削除','delete-task','ghost danger small'):''}<div class="right">${button('閉じる','close')}${button('この条件で反映する','save-task','primary')}</div>`,true);modalKind='task';}
function taskFlow(){const t=editingTask,c=taskCalc(t),rate=c.rate;const improved=t.method!=='human'&&!t.locked;const after=improved?c.unitAfter:t.minutes;const beforeNodes=[[t.minutes*.2,'資料を探す・準備',''],[t.minutes*.6,'書く・転記・整理',''],[t.minutes*.2,'見直し・仕上げ','human']];const afterNodes=t.method==='stop'?[[0,'作業をやめる','ai'],[0,'影響の確認','human']]:t.method==='human'||t.locked?[[t.minutes*.3,'状況を整理する',''],[t.minutes*.7,'人が判断・対話する','human']]:[[t.minutes*(1-rate)*.3,'入力・準備',''],[t.minutes*(1-rate)*.7,t.method==='ai'?'原案の編集・残る作業':'改善後に残る作業','ai'],[c.review,'確認・修正','human']];const nodes=flowMode==='before'?beforeNodes:afterNodes;return`<div class="tabs" style="margin-bottom:18px"><button data-action="flow" data-mode="before" class="${flowMode==='before'?'active':''}">今の仕事</button><button data-action="flow" data-mode="after" class="${flowMode==='after'?'active':''}">改善後の仕事</button></div><div class="summary-grid"><div><span class="tiny">人の工数 / 1回</span><div class="result-large">${fmt(flowMode==='before'?t.minutes:after,1)}<span class="small"> 分</span></div></div><div><span class="tiny">月間の削減見込み（使用率 ${Math.round(c.adopt*100)}%）</span><div class="result-large ${c.net<0?'negative':''}">${fmt(c.net,1)}<span class="small"> 時間</span></div></div></div><div class="flow">${nodes.map(([v,label,cls],i)=>`${i?'<span class="arrow">→</span>':''}<div class="flow-node ${cls}">${label}<b>${fmt(v,1)}<small>分</small></b></div>`).join('')}</div><p class="tiny">工程配分は説明用の例です。「改善後の1回」は利用した1件の人の工数。AIの待機時間は未測定で含めていません。</p><div class="flow-note section"><span class="pill">現場を知るから、ここを残す。</span><p style="margin-top:9px">${esc(t.tip)}</p></div>${c.blocked?notice('この業務は機密・個人情報の安全条件が未確認です。1回あたりの改善例は表示しますが、月間削減効果には算入しません。'):''}${t.locked?notice('重要な判断・対人対応を、自動で代替する対象にしていません。'):''}<div class="section"><h3 style="font-size:13px;margin-bottom:9px">この仕事の任せ方</h3><div class="readiness-items"><span>入口：${state.dataReady==='paper'?'紙の情報を整理してから':'既存資料・箇条書きから'}</span><span>出力：${t.method==='human'?'人による判断・説明':'確認できる下書き・整理結果'}</span><span>最後：担当者が承認</span></div></div><div class="equation section"><b>見込みの根拠</b><br>${fmt(t.count)}件/月 ×（${fmt(t.minutes)}分 × ${fmt(c.rate*100,1)}% − 確認${fmt(c.review)}分）× ${Math.round(c.adopt*100)}% ÷ 60<br>＝ ${c.eligible?fmt(c.net,1):'0.0'}時間/月${!c.eligible?'（未選択・人が担う仕事・安全条件待ちは0計上）':''}<br><span class="tiny">チーム全体の運用・調整は、合計から別に1回だけ差し引きます。</span></div>${button(`${icon('edit')}自社の時間・回数に直す`,'task-tab','section','data-tab="settings"')}`;}
function taskSettings(){const t=editingTask;return`<form id="task-form">${field('業務名','task-name',t.name,'text','','required maxlength="80"')}<div class="fields-2">${field('部門・分類','task-category',t.category,'text','','maxlength="30"')}<div class="field"><label for="task-source">現状値の根拠</label><select id="task-source">${Object.entries(SOURCES).map(([id,v])=>`<option value="${id}" ${t.source===id?'selected':''}>${v}</option>`).join('')}</select><div class="hint">実測の現状値でも「削減率」は仮説です。</div></div></div><div class="section-label">どの方法で、この仕事を変える？</div><div class="method-options">${Object.entries(METHODS).map(([id,v])=>`<button type="button" class="method-btn ${t.method===id?'active':''}" data-action="method" data-method="${id}" ${t.locked&&id!=='human'?'disabled':''}>${v}</button>`).join('')}</div><div class="fields-2">${field('全社の月間件数（件/月）','task-count',t.count,'number','1人あたりではなく、会社全体の件数','required min="0" max="1000000"')}${field('現状 / 1件の人の工数（分）','task-minutes',t.minutes,'number','','required min="0" max="1440" step="0.1"')}${field('確認前の作業削減率（%）','task-rate',t.method==='stop'?100:t.method==='human'?0:t.rate,'number','初期値は仮説。実証で確認します',`required min="0" max="100" ${['stop','human'].includes(t.method)?'readonly':''}`)}${field('AI利用時 / 1件の確認・修正（分）','task-review',t.method==='ai'?t.review:0,'number','削減率とは別に差し引きます',`required min="0" max="1440" step="0.1" ${t.method!=='ai'?'readonly':''}`)}${field('準備の手間（h） / 優先順比較用','task-effort',t.effort,'number','全体費用には自動で足しません','required min="0" max="10000" step="0.5"')}<div class="field"><label for="task-risk">扱う情報・業務のリスク</label><select id="task-risk" ${t.locked?'disabled':''}><option value="low" ${t.risk==='low'?'selected':''}>低：公開情報・一般的な文章</option><option value="medium" ${t.risk==='medium'?'selected':''}>中：人の承認・照合が必要</option><option value="high" ${t.risk==='high'?'selected':''}>高：機密・個人情報を含みうる</option></select></div></div><div class="field"><label for="task-desc">現場で起きていること</label><textarea id="task-desc" rows="2" maxlength="400">${esc(t.desc)}</textarea></div><div class="field"><label for="task-tip">AIに任せない部分・確認担当</label><textarea id="task-tip" rows="2" maxlength="600">${esc(t.tip)}</textarea></div><label class="checkline"><input type="checkbox" id="task-selected" ${t.selected?'checked':''}><span>この業務を全体の試算に含める</span></label>${t.method==='stop'?`<label class="checkline"><input type="checkbox" id="task-stop-approved" ${t.stopApproved?'checked':''}><span>この仕事をやめても支障がないと、関係者で合意できた</span></label>`:''}<label class="checkline"><input type="checkbox" id="task-safe" ${t.safe?'checked':''}><span>匿名化・利用環境と権限・確認担当を合意済み<br><span class="tiny">高リスク業務を効果に含めるための条件。チェックだけで安全を保証するものではありません。</span></span></label><div id="task-error" class="field-error" role="alert"></div></form>`;}
function syncTaskForm(){const form=document.getElementById('task-form');if(!form)return true;if(!form.reportValidity())return false;const t=editingTask;for(const k of ['name','category','desc','tip'])t[k]=document.getElementById(`task-${k}`).value.trim();for(const k of ['count','minutes','rate','review','effort'])t[k]=Number(document.getElementById(`task-${k}`).value);t.source=document.getElementById('task-source').value;t.risk=t.locked?'high':document.getElementById('task-risk').value;t.selected=document.getElementById('task-selected').checked;t.safe=document.getElementById('task-safe').checked;t.stopApproved=document.getElementById('task-stop-approved')?.checked||false;return true;}
function openHelp(){modalKind='help';openModal('計算根拠と、このデモの守備範囲。',`<div class="section-label">これは「診断結果の断定」ではなく、仮説を一緒に作るデモです</div><p class="small muted">外部AIや企業データベースには接続していません。会社名から実態を検索したり、AIが成功確率を判断したりする機能はありません。業種別の初期例と入力値を使う、ルールベースの計算です。</p><div class="equation section">月間の純削減時間<br>＝ Σ［全社月間件数 ×（1件の現状分数 × 削減率 − 確認分数）× 使用率 ÷ 60］<br>− チーム全体の運用・調整時間<br><span class="tiny">AI以外の改善では確認分数0。「人が担う」、未選択、安全条件待ちは削減0。マイナスの効果もそのまま表示します。</span></div><table class="help-table section"><tbody><tr><td>初期値の性質</td><td>すべて説明用の仮説。業種平均・実績・効果保証ではありません。</td></tr><tr><td>社員数</td><td>1人あたりの時間と全社の参考容量に使用。月間件数へ重ねて掛けません。</td></tr><tr><td>時間価値</td><td>純削減時間 × 人件費換算単価。利益や現金ではありません。</td></tr><tr><td>経済回収</td><td>（初期支出 ＋ 準備・研修の時間価値）÷（月間時間価値 − 月額支出）。正の効果がなければ回収見込みなし。</td></tr><tr><td>現金の増減</td><td>正の純削減時間 × 単価 × 支出削減転換率 − 月額支出。転換率は初期値0%。</td></tr><tr><td>優先順位</td><td>正の削減時間 ÷（準備時間 ＋ 2）× リスク係数（低1・中0.85・高0.6）。比較用の設計ルールで、成功確率ではありません。</td></tr><tr><td>期間と範囲</td><td>年間値は12か月定常稼働の仮定。AI待機時間、通信停止、売上増、品質損失などは未算入。初期費用・教育時間は算入します。</td></tr></tbody></table><div class="section-label section">入力・保存・共有について</div><p class="definition">入力内容はブラウザ内だけで処理し、アプリから外部へ送信しません。自動保存はしません。「この端末に保存」を押した場合だけ、このブラウザに保存します。端末共有時は次の人に見られる可能性があるため、終了時に保存を削除してください。URLをコピーしても会社情報は含まれません。ホスティング側の通常のアクセスログは別です。JSONファイルや印刷物には入力内容が含まれます。</p><div class="section-label section">研究から採るのは、率ではなく「検証する姿勢」</div><p class="definition">Brynjolfsson・Li・Raymond「Generative AI at Work」は、特定の顧客サポート現場で効果が経験等により異なることを報告しています。研究の効果率をこのデモへ転用していません。<br><a href="https://arxiv.org/abs/2304.11771" target="_blank" rel="noopener noreferrer">原論文（arXiv・2024年改訂版）</a></p>${notice('本番化には、ログイン・会社ごとの権限、APIキー保護、送信前承認、監査ログ、費用上限、保存・削除の運用設計が別途必要です。')}`,`<div class="right">${button('確認した','close','primary')}</div>`,true);}
function openStorage(){modalKind='storage';let exists=false;try{exists=!!localStorage.getItem(KEY)}catch{}openModal('診断を、手元に残す。',`<p class="small muted">通常はこの画面を閉じると入力が消えます。残す方法を選んでください。</p><div class="section"><h3 style="font-size:14px">このブラウザで再開する</h3><p class="definition" style="margin:8px 0 13px">この端末のブラウザに1件だけ保存します。共有端末では実際の機密情報を保存しないでください。</p><div class="mini-buttons">${button(`${icon('save')}この端末に保存`,'local-save','primary')}${button('端末の保存を読み込む','local-load','',exists?'':'disabled')}${button('端末の保存を削除','local-delete','danger',exists?'':'disabled')}</div></div><div class="divider"></div><h3 style="font-size:14px">ファイルとして持ち運ぶ</h3><p class="definition" style="margin:8px 0 13px">診断ファイルには会社名や入力値が入ります。送付先・保管先を確認してください。</p><div class="mini-buttons">${button(`${icon('download')}診断JSONを保存`,'export')}${button('診断JSONを読み込む','import')}</div><div class="divider"></div><h3 style="font-size:14px">次の商談へ</h3><p class="definition" style="margin:8px 0 13px">現在の入力・実証記録を初期化します。端末に保存した内容は別途削除してください。</p>${button(`${icon('reset')}業種を選んで初期化`,'presets','')}`,`<div class="right">${button('閉じる','close')}</div>`);}
function exportSnapshot(){const blob=new Blob([JSON.stringify({...state,version:VERSION,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`GENBA-SHIFT_診断_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('診断ファイルを保存しました。会社情報の扱いにご注意ください。');}
function navigate(view){if(!navigation.some(x=>x[0]===view))return;currentView=view;query='';render();window.scrollTo(0,0);}
function updateSim(){if(currentView==='simulation')document.getElementById('sim-results').innerHTML=simResults();}
function saveTask(){if(!syncTaskForm())return;const t=editingTask;if(t.method==='stop'&&!t.stopApproved){const el=document.getElementById('task-error');if(el)el.textContent='作業をやめる前に、関係者との合意を確認してください。';else{taskTab='settings';drawTaskModal();toast('やめる仕事の合意チェックを確認してください。');}return;}delete t.isNew;const index=state.tasks.findIndex(x=>x.id===t.id);if(index>=0)state.tasks[index]=clone(t);else if(state.tasks.length<60)state.tasks.push(clone(t));else{toast('業務は60件までです。');return;}closeModal();render();toast('業務の条件を反映しました。');}
document.addEventListener('click',async e=>{
 if(e.target.classList.contains('modal-backdrop')){closeModal();return;}
 const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;
 if(a==='nav'){navigate(el.dataset.view);return;}
 if(a==='close'){closeModal();return;}
 if(a==='company'){openCompany();return;}
 if(a==='presets'){openPresets();return;}
 if(a==='select-preset'){selectedIndustry=el.dataset.industry;document.getElementById('preset-grid').innerHTML=presetGrid();return;}
 if(a==='load-preset'){state=initial(selectedIndustry);filter='all';query='';closeModal();navigate('overview');toast(`${industryName(selectedIndustry)}の仮説デモに切り替えました。`);return;}
 if(a==='task'){openTask(el.dataset.id);return;}
 if(a==='add-task'){openTask('',true);return;}
 if(a==='task-tab'){if(!syncTaskForm())return;taskTab=el.dataset.tab;drawTaskModal();return;}
 if(a==='flow'){flowMode=el.dataset.mode;document.getElementById('task-modal-content').innerHTML=taskFlow();return;}
 if(a==='method'){if(!syncTaskForm())return;const m=el.dataset.method;if(editingTask.locked&&m!=='human')return;editingTask.method=m;if(m==='ai'){editingTask.rate=60;editingTask.review=4;}if(m==='simplify'){editingTask.rate=35;editingTask.review=0;}if(m==='stop'){editingTask.rate=100;editingTask.review=0;}if(m==='human'){editingTask.rate=0;editingTask.review=0;}document.getElementById('task-modal-content').innerHTML=taskSettings();return;}
 if(a==='save-task'){saveTask();return;}
 if(a==='delete-task'){const id=editingTask?.id;if(!id)return;openModal('この業務を削除しますか？',`<p>「${esc(editingTask.name)}」を診断から削除します。元に戻せません。</p>`,`${button('戻る','task-back')}<div class="right">${button('削除する','confirm-delete','danger')}</div>`);return;}
 if(a==='task-back'){drawTaskModal();return;}
 if(a==='confirm-delete'){if(state.pilot.taskId===editingTask?.id)state.pilot=initial().pilot;state.tasks=state.tasks.filter(t=>t.id!==editingTask?.id);closeModal();render();toast('業務を削除しました。');return;}
 if(a==='filter'){filter=el.dataset.filter;const scroll=window.scrollY;render();window.scrollTo(0,scroll);return;}
 if(a==='scenario'){state.scenario=el.dataset.scenario;updateSim();return;}
 if(a==='goal'){state.goal=el.dataset.goal;document.querySelectorAll('.goal-option').forEach(x=>x.classList.toggle('active',x.dataset.goal===state.goal));updateSim();return;}
 if(a==='costs'){openCosts();return;}
 if(a==='help'){openHelp();return;}
 if(a==='storage'){openStorage();return;}
 if(a==='present'){presenting=!presenting;document.body.classList.toggle('presenting',presenting);document.getElementById('present-btn').innerHTML=`${icon('expand')}${presenting?'通常表示':'商談モード'}`;toast(presenting?'商談用のワイド表示に切り替えました。':'通常表示に戻しました。');return;}
 if(a==='print'){if(currentView!=='report')navigate('report');window.print();return;}
 if(a==='export'){exportSnapshot();return;}
 if(a==='import'){document.getElementById('import-file').click();return;}
 if(a==='local-save'){try{localStorage.setItem(KEY,JSON.stringify(state));toast('このブラウザに保存しました。自動更新はされません。');openStorage();}catch{toast('端末保存が使えません。診断JSONの保存をご利用ください。');}return;}
 if(a==='local-load'){try{const raw=localStorage.getItem(KEY);if(!raw)throw Error('保存がありません');state=readSafeSnapshot(JSON.parse(raw));closeModal();render();toast('保存した診断を読み込みました。現在の入力は置き換わりました。');}catch{toast('保存を読み込めませんでした。');}return;}
 if(a==='local-delete'){try{localStorage.removeItem(KEY);toast('この端末の保存を削除しました。開いている診断は残っています。');openStorage();}catch{toast('端末の保存を削除できませんでした。');}return;}
 if(a==='copy-url'){if(location.protocol==='file:'){toast('公開サイトで開いたときに共有URLをコピーできます。');return;}const url=location.origin+location.pathname;try{await navigator.clipboard.writeText(url);toast('会社情報を含まないデモURLをコピーしました。');}catch{openModal('デモの共有URL',`<p class="small muted" style="margin-bottom:15px">このURLに会社情報は含まれません。</p><input type="text" readonly value="${esc(url)}" aria-label="共有URL">`,button('閉じる','close'));}return;}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='company-form'){e.preventDefault();const form=e.target;if(!form.reportValidity())return;const industry=document.getElementById('company-industry').value;if(industry!==state.industry&&document.getElementById('replace-tasks').checked){state.tasks=makeTasks(industry);state.pilot=initial().pilot;}state.company=document.getElementById('company-name').value.trim()||'会社名未入力';state.industry=industry;state.employees=clamp(document.getElementById('company-employees').value,1,100000);state.days=clamp(document.getElementById('company-days').value,1,31);state.hourly=clamp(document.getElementById('company-hourly').value,0,100000);state.dataReady=document.getElementById('company-ready').value;state.problem=document.getElementById('company-problem').value.trim();closeModal();render();toast('会社情報を反映しました。業務の件数・時間もご確認ください。');}
 if(e.target.id==='cost-form'){e.preventDefault();if(!e.target.reportValidity())return;for(const [id,k]of [['tools','monthlyTools'],['support','monthlySupport'],['initial','initialCash'],['setup','setupHours'],['training','trainingHours'],['maintenance','maintenance']])state[k]=Number(document.getElementById(`cost-${id}`).value);closeModal();render();toast('初期・月額・人の時間の費用を反映しました。');}
 if(e.target.id==='task-form'){e.preventDefault();saveTask();}
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='task-search'){query=el.value;document.getElementById('task-cards').innerHTML=taskCards();return;}
 if(el.dataset.live){const k=el.dataset.live;if(el.value===''||!el.validity.valid)return;const bounds={adoption:[0,100],maintenance:[0,100000],hourly:[0,100000],monthlyTools:[0,10000000],cashRate:[0,100]};state[k]=clamp(el.value,...bounds[k]);const out=document.getElementById(`${k}-value`);if(out)out.textContent=`${state[k]}${k==='maintenance'?'h/月':'%'}`;updateSim();return;}
 if(el.dataset.pilot&&el.dataset.pilot!=='taskId'){state.pilot[el.dataset.pilot]=el.value;return;}
 if(el.dataset.measure){const k=el.dataset.measure;if(el.type==='number'&&el.value!==''&&!el.validity.valid)return;state.pilot[k]=el.type==='number'?(el.value===''?'':Number(el.value)):el.value;document.getElementById('actual-result').innerHTML=measurementResult();if(k==='target'){const boxes=document.querySelectorAll('.safety-box p');if(boxes[0])boxes[0].textContent=`確認・修正を含めて ${state.pilot.target}% 以上の工数削減。品質に問題がなく、担当者が再現できること。`;}return;}
});
document.addEventListener('change',async e=>{
 const el=e.target;
 if(el.dataset.taskToggle){const t=state.tasks.find(x=>x.id===el.dataset.taskToggle);if(t){t.selected=el.checked;document.getElementById('task-cards').innerHTML=taskCards();}return;}
 if(el.dataset.status!==undefined){state.pilot.statuses[Number(el.dataset.status)]=Number(el.value);render();return;}
 if(el.dataset.pilot==='taskId'){if(el.value!==state.pilot.taskId){state.pilot.taskId=el.value;for(const k of ['before','after','count','days'])state.pilot[k]='';state.pilot.quality='未確認';state.pilot.minutesNote='';state.pilot.statuses=[0,0,0,0];}render();return;}
 if(el.id==='import-file'){const file=el.files?.[0];if(!file)return;try{if(file.size>500000)throw Error('ファイルが大きすぎます。500KB以下の診断JSONを指定してください。');const parsed=JSON.parse(await file.text());const next=readSafeSnapshot(parsed);state=next;closeModal();render();toast('診断ファイルを読み込みました。現在の入力を置き換えました。');}catch(err){toast(err.message||'ファイルを読み込めませんでした。');}finally{el.value='';}return;}
});
document.addEventListener('keydown',e=>{
 const modal=document.querySelector('.modal');if(!modal)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const els=[...modal.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea,a[href]')].filter(x=>x.offsetParent!==null);const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
});

function historyHTML(){if(!store.results.length)return '';return `<section class="section"><div class="sectionhead"><h2>この端末の診断履歴</h2><span class="small muted">他の端末とは同期しません</span></div><div class="tablewrap"><table><thead><tr><th>診断日</th><th>業種・立場</th><th>会社コード</th><th></th></tr></thead><tbody>${store.results.slice().reverse().slice(0,20).map(r=>`<tr><td>${dateText(r.createdAt)}</td><td>${INDUSTRIES[r.industry].name} / ${roleName(r.industry,r.role)}</td><td>${esc(r.company||'個人診断')}</td><td>${button('結果を開く','open-result','secondary smallbtn',`data-id="${esc(r.id)}"`)}</td></tr>`).join('')}</tbody></table></div></section>`;}
function resultStateText(e){if(!e.items.length)return ['今は、無理に変えなくて大丈夫。','新しい道具を増やすより、うまく回っている仕事を続けましょう。'];if(!e.top.length&&e.unknown)return ['まずは、仕事の負担を確かめるところから。','分からないことがあるのは自然です。1週間だけ記録すると、次の判断がしやすくなります。'];if(!e.top.length)return ['今のやり方に、良いところがあります。','今回の回答では、新しいAIやシステムを急いで導入する必要はありません。'];if(e.top.every(x=>x.cat==='human'))return ['人が判断できる体制を、先に整えましょう。','AIで置き換えるのではなく、相談先と確認手順を整えることから始めます。'];return [`まずは${e.top.length}つ。仕事の進め方を見直しましょう。`,'全部を変える必要はありません。負担の大きさと確認のしやすさから、最初の候補を整理しました。'];}
function itemWorkflow(item){if(item.cat==='ai')return [['材料を集める','一から文章をつくる','修正・確認を繰り返す','正式版を保存・共有'],['伝える事実を箇条書き','AIが下書き・整理','人が事実・表現を修正','責任者が確認 → 正式保存・共有']];if(item.cat==='ict')return [['複数の紙・画面に入力','手作業で転記・照合','担当者が集計','別の人へ共有'],['正本にする入力先を決める','既存機能で集計・共有','担当者が例外を確認','記録を保存して次の担当へ']];if(item.cat==='human')return [['担当者が状況を把握','1人で判断に迷うことがある','関係者へ確認・連絡'],['相談先・責任者を確認','人が状況と事実を確認','必要な専門職と判断','対応経緯を記録・引き継ぎ']];return [['今の道具・手順で対応','担当者が確認して完了'],[item.unknown?'1週間だけ時間と負担を記録':'今の方法を続ける','変化や困りごとが出たら再診断']];}
function workcard(item,r){const flow=itemWorkflow(item),decision=r.decisions?.[item.id]||'consider';return `<details class="workcard" data-work="${item.id}"><summary><span class="workname">${esc(taskName(r.industry,item.id))}</span><span class="tag ${item.cat}">${CATS[item.cat].label}</span><span class="tag ${item.priority==='next'?'next':'outline'}">${PRIOR[item.priority]}</span></summary><div class="detailsbody"><div class="sourcelabel">回答した内容：負担 ${BURDENS[item.burden===null?'unknown':item.burden]} / ${MODES[item.mode]} / 週 ${fmtMinutes(item.minutes)} / ${OWNERS[item.owner]}</div><div class="dlgrid"><div><h4>なぜ、この判断？</h4><p>${item.reason}</p></div><div><h4>何を、どう変える？</h4><p>${item.action}</p></div><div><h4>何が良くなることを目指す？</h4><p>${item.benefit}</p></div><div><h4>次は誰が進める？</h4><p>${item.route==='self'?'自分たちで、小さく試せることから。':item.route==='system'?'既存ツールの担当者へ確認。必要な機能がないときだけ導入を比較。':'責任者・専門家と、使う範囲や確認のルールを決める。'}</p></div></div><div class="workflow"><div><h4>今までの進め方の例</h4><ol>${flow[0].map(x=>`<li>${x}</li>`).join('')}</ol></div><div><h4>これからの進め方の例</h4><ol>${flow[1].map(x=>`<li>${x}</li>`).join('')}</ol></div></div>${item.risk?`<div class="note warn p12">実在の個人情報や健康情報は無料デモに入れません。安全・専門判断をAIに任せないことを前提に、確認・保存のルールから相談してください。</div>`:''}<div class="decision"><label for="decision-${item.id}">あなたの判断</label><select id="decision-${item.id}" data-decision="${item.id}">${optionList({consider:'検討する',adopt:'試してみる',hold:'いったん保留',skip:'今回は不要'},decision)}</select><span class="muted small">採否を変えても、元の回答と分類は残します。</span></div></div></details>`;}
function effectHTML(r,e){const gain=Math.round(e.eligibleMinutes*ratio/100),ind=INDUSTRIES[r.industry],target=GOALS[r.goal];return `<section class="section"><div class="sectionhead"><div><div class="eyebrow">TIME FOR WHAT MATTERS</div><h2>減らした時間を、何に使う？</h2></div><span class="tag sample">仮定のシミュレーション</span></div><div class="split"><div class="card"><span class="small muted">AI・ICT候補の作業が、確認・修正を含めて</span><h3 class="p8"><span id="ratioLabel">${ratio}</span>％短くできたと仮定すると</h3><input class="range" id="ratio" aria-label="短縮率の仮定" type="range" min="0" max="40" step="5" value="${ratio}"><div class="effect-number" id="gainValue">${gain}<span>分 / 週・あなた1人</span></div><p class="small muted p8">対象の入力時間：${fmtMinutes(e.eligibleMinutes)} / 週。<br>計算：対象時間 × 仮定の短縮率。人の判断・現状維持・時間不明は計算から除外。</p><div class="note warn p12">実際の削減時間ではありません。人件費の削減や売上増加を示す数値でもありません。実導入後に測り直します。</div></div><div class="card"><div class="iconbox">${ico('heart')}</div><div class="eyebrow">あなたが選んだ使い道</div><h3>${esc(target?.label||'大切な仕事へ戻す')}</h3><p class="muted small p12">${esc(target?.desc||'目的を確認することから始めます。')}</p><div class="p20"><div class="barlabel"><span>生まれた時間の使い道</span><span>目標</span></div><div class="bartrack"><div class="bar" style="width:100%"></div></div><p class="small muted p8">試算の時間を3者に重複して足しません。何に使えたかを再診断で確かめます。</p></div></div></div><div class="valuecards p20"><div class="valuecard">${ico('leaf')}<b>働く人に</b><p>無駄な転記や書き始めの負担を減らし、残業や持ち帰りを見直す。</p></div><div class="valuecard">${ico('heart')}<b>${esc(ind.people)}に</b><p>話を聴く、関わる、丁寧に対応する時間を増やし、サービスの質を支える。</p></div><div class="valuecard">${ico('path')}<b>経営する人に</b><p>確認に追われる時間を見直し、人材育成や運営・売上づくりに向き合う。</p></div></div><p class="subline">目指す循環：働く人の余裕 → 丁寧な対応 → サービス品質 → 続けられる経営。現時点で効果が実証されたという意味ではありません。</p></section>`;}
let resultDirty=false;
function resultsView(){if(!current)return emptyResult();const r=current,e=evaluate(r),headline=resultStateText(e),saved=store.results.some(x=>x.id===r.id)&&!resultDirty;const shown=e.items.filter(x=>filter==='all'||x.cat===filter);return title('YOUR RESULTS','あなたの仕事の、次の一歩。',`${INDUSTRIES[r.industry].name} / ${roleName(r.industry,r.role)} · ${r.source==='sample'?'架空のサンプル回答':'あなたが入力した回答'} · 判断ルール ${RULE_VERSION}`,button(ico('download')+' CSV出力','export-result','secondary')+button('回答を見直す','edit-current','secondary'))+`<div class="summaryhero"><div><span class="tag ${r.source==='sample'?'sample':'outline'}">${r.source==='sample'?'サンプル / 実績ではありません':saved?'この端末に保存済み':'結果を表示中 / 未保存'}</span><h2 class="p12">${headline[0]}</h2><p>${headline[1]}</p></div><div class="resultstat"><div><div class="statvalue">${e.top.length}<span class="small"> つ</span></div><div class="statlabel">改善の候補</div></div><div><div class="statvalue">${e.keep}<span class="small"> 件</span></div><div class="statlabel">変えなくてよい仕事</div></div><div><div class="statvalue">${e.unknown}<span class="small"> 件</span></div><div class="statlabel">まず確認する仕事</div></div></div></div><section class="section"><div class="sectionhead"><div><div class="eyebrow">FIRST THREE</div><h2>まず取り組む、3つまで。</h2><p>負担・担当の偏り・確認のしやすさで並べています。必要がなければ3つに増やしません。</p></div></div><div class="priorities">${[0,1,2].map(i=>{const t=e.top[i];return t?`<div class="priority"><div class="rank">0${i+1} <span class="tag ${t.priority==='next'?'next':'outline'}">${PRIOR[t.priority]}</span></div><h3>${esc(taskName(r.industry,t.id))}</h3><span class="tag ${t.cat}">${CATS[t.cat].short}</span><p class="p12">${t.action}</p><div class="reasonshort">負担：${BURDENS[t.burden]}${t.owner==='one'?' / 特定の1人に集中':''}</div>${button('具体的な進め方を見る','detail','ghost',`data-id="${t.id}"`)}</div>`:`<div class="priority empty"><div class="rank">0${i+1}</div><h3>${e.unknown?'まずは、確認から。':'無理に増やさなくて大丈夫。'}</h3><p>${e.unknown?'負担が分からない仕事は、測ってから考えます。':'必要な改善だけに絞ります。今の良いところも、そのまま大切に。'}</p></div>`}).join('')}</div></section><section class="section"><div class="sectionhead"><div><h2>変える仕事・変えない仕事</h2><p>仕事を開くと、理由・改善方法・期待する変化・人の役割が見られます。</p></div></div><div class="filters">${[['all','すべて'],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,v])=>`<button class="filter ${filter===k?'active':''}" data-filter="${k}">${v} ${k==='all'?e.items.length:e.items.filter(x=>x.cat===k).length}</button>`).join('')}</div>${shown.length?shown.map(x=>workcard(x,r)).join(''):'<div class="emptybox">この分類に当てはまる仕事はありません。</div>'}</section>${effectHTML(r,e)}<section class="section card"><div class="sectionhead"><div><h2>小さく試して、変化を確かめる。</h2><p>自分たちでできることは自分たちで。支援が必要なところだけ、相談へ。</p></div></div><div class="btnrow">${button('改善プランをつくる '+ico('arrow'),'to-plan','primary')}${button('相談したい','to-consult','secondary')}${button('会社全体で診断する','to-team','secondary')}${r.source==='device'?button(saved?'この端末に保存済み':'結果をこの端末に保存','save-result','light',saved?'disabled':''):''}</div></section>${historyHTML()}`;}
function planFingerprint(r,p){return JSON.stringify({industry:r.industry,role:r.role,rule:r.ruleVersion,selected:r.selected,answers:r.answers,decisions:r.decisions||{},entries:p.entries});}
function activePlan(){if(!current)return null;const id=current.id;if(!planState[id]){const old=store.plans.find(x=>x.resultId===id);planState[id]=old?copy(old):{resultId:id,entries:{},approvedAt:null,dirty:true,source:current.source};}const p=planState[id];evaluate(current).items.filter(x=>x.cat!=='keep'&&!['skip','hold'].includes(current.decisions?.[x.id])).forEach(x=>{if(!p.entries[x.id])p.entries[x.id]={owner:current.role,status:'planned'};});if(p.approvedAt&&p.approvalFingerprint!==planFingerprint(current,p)){p.approvedAt=null;p.dirty=true;}return p;}
function planView(){if(!current)return title('ACTION PLAN','改善プラン','診断を、次の仕事につなげます。')+`<div class="card emptybox"><h3>まず結果を見て、取り組む仕事を決めましょう。</h3><p>サンプルでも、採否・担当・進め方を確認できます。</p><div class="btnrow" style="justify-content:center">${button('診断をはじめる','start','primary')}${button('サンプル結果を見る','sample')}</div></div>`;const r=current,e=evaluate(r),p=activePlan(),items=e.items.filter(x=>x.cat!=='keep'&&!['skip','hold'].includes(r.decisions?.[x.id]));const saved=!!p.approvedAt&&!p.dirty;return title('ACTION PLAN','最初の一歩を、仕事の形に。','採否を決め、担当と確認方法をそろえる。大きく変える前に、小さく試します。',button('診断結果に戻る','to-results','secondary'))+`<div class="note ${r.source==='sample'?'warn':'info'}">${r.source==='sample'?'架空回答のプラン体験です。実在の会社へ指示・送信はしません。':'この端末だけの計画メモです。担当者への通知や、会社内での共有は行いません。'}</div><div class="roadmap p20"><div class="roadstep"><span class="week">STEP 01 / まず確かめる</span><h3>今の負担を1週間記録。</h3><p>作業・確認・修正の時間を合わせて記録。個人情報を使わない例を用意します。</p></div><div class="roadstep"><span class="week">STEP 02 / 小さく試す</span><h3>1つの仕事で、使ってみる。</h3><p>誰が入力し、誰が確認し、どこに正式保存するかを決め、実際の手順で試します。</p></div><div class="roadstep"><span class="week">STEP 03 / 続けるか決める</span><h3>負担と品質を再診断。</h3><p>速さだけでなく、ミス・確認の手間・人と向き合う時間を確認。合わなければ戻します。</p></div></div><section class="section"><div class="sectionhead"><h2>次は、誰に相談する？</h2></div><div class="grid three">${[['self','自分たちでできること','テンプレートの共通化、公開情報での下書きなど。'],['expert','専門家と進めること','個人情報・安全・判断のルールづくり、研修など。'],['system','ツール担当者と確認すること','既存ツールの設定・連携・共有権限。足りない機能だけ導入を検討。']].map(([key,label,desc])=>`<div class="card"><span class="tag outline">${items.filter(x=>x.route===key).length}件</span><h3 class="p12">${label}</h3><p class="small muted p8">${desc}</p><p class="small p12">${items.filter(x=>x.route===key).map(x=>esc(taskName(r.industry,x.id))).join('<br>')||'今回は該当なし'}</p></div>`).join('')}</div></section><section class="section card"><div class="sectionhead"><div><h2>担当と進み具合を決める</h2><p>結果画面で「保留」「今回は不要」にした仕事は、計画から外しています。</p></div><span data-plan-state class="tag ${saved?'ai':'next'}">${saved?(r.source==='sample'?'確認済み・ページ内のみ':'確認済み・端末保存済み'):'確認前のプラン'}</span></div>${items.length?items.map(x=>`<div class="planrow"><div><b>${esc(taskName(r.industry,x.id))}</b><br><span class="small muted">${CATS[x.cat].short}</span></div><div class="field"><label for="plan-owner-${x.id}">担当する役割</label><select id="plan-owner-${x.id}" data-plan="${x.id}" data-key="owner">${optionList(Object.fromEntries(ROLES.map((role,i)=>[role,INDUSTRIES[r.industry].role[i]])),p.entries[x.id].owner)}</select></div><div class="field"><label for="plan-status-${x.id}">進み具合（自己申告）</label><select id="plan-status-${x.id}" data-plan="${x.id}" data-key="status">${optionList({planned:'未着手',trying:'試している',reviewing:'効果を確認中',done:'継続を決定',stopped:'中止・元に戻す'},p.entries[x.id].status)}</select></div></div>`).join(''):'<div class="emptybox">今回の回答では、新しく始める改善はありません。必要が出たら再診断してください。</div>'}<label class="checkline"><input type="checkbox" id="planConfirm">内容・担当・確認方法を見直しました</label><p class="small muted p8">内容を変えたら、もう一度確認が必要です。保存するだけでAIが学習する仕組みではありません。</p><div class="btnrow p20">${button('確認して端末に保存','save-plan','primary',items.length?'':'disabled')}${button('プランをCSV出力','export-plan','secondary')}${button('再診断・効果測定へ','to-measure','secondary')}</div><div class="plan-status">${saved?'最終確認：'+dateText(p.approvedAt):'未保存の変更は、ページを閉じると失われます。'}</div></section><section class="section"><div class="sectionhead"><h2>必要な支援だけ、相談できます。</h2></div><div class="btnrow">${button('業務改善を相談','consult-kind','light','data-kind="consult"')}${button('詳しい改善提案を受けたい','consult-kind','secondary','data-kind="proposal"')}${button('研修・導入・継続支援を相談','consult-kind','secondary','data-kind="support"')}</div></section>`;}
function companyData(){const companies=teamSource==='sample'?sampleCompanies:store.companies;let c=companies.find(x=>x.code===teamCode)||companies[0];if(!c&&current?.company&&current.source==='device')c={code:current.company,name:'会社コードの診断',industry:current.industry};if(c)teamCode=c.code;const records=(teamSource==='sample'?sampleResponses:store.results).filter(x=>c&&x.company===c.code&&x.industry===c.industry);return {companies,c,records};}
function aggregate(records){return IDS.map(id=>{const entries=records.filter(r=>r.selected.includes(id));const known=entries.filter(r=>r.answers[id].burden!=='unknown');const heavy=known.filter(r=>Number(r.answers[id].burden)>=2);const one=entries.filter(r=>r.answers[id].owner==='one');const ownersKnown=entries.filter(r=>r.answers[id].owner!=='unknown');const hopeKnown=entries.filter(r=>['yes','no'].includes(r.answers[id].hope));const hopeYes=hopeKnown.filter(r=>r.answers[id].hope==='yes');const mg=known.filter(r=>['owner','manager'].includes(r.role)),field=known.filter(r=>['office','staff'].includes(r.role));const mrate=mg.length?Math.round(100*mg.filter(r=>Number(r.answers[id].burden)>=2).length/mg.length):null,frate=field.length?Math.round(100*field.filter(r=>Number(r.answers[id].burden)>=2).length/field.length):null;return {id,n:entries.length,known:known.length,heavy:heavy.length,rate:known.length?Math.round(100*heavy.length/known.length):null,one:one.length,ownersKnown:ownersKnown.length,mgN:mg.length,fieldN:field.length,mrate,frate,gap:mg.length>=MIN_GROUP&&field.length>=MIN_GROUP?frate-mrate:null,hope:hopeYes.length,hopeKnown:hopeKnown.length};}).sort((a,b)=>b.heavy-a.heavy||b.one-a.one||IDS.indexOf(a.id)-IDS.indexOf(b.id));}
function segmented(value,name){return `<div class="segmented" aria-label="データの切り替え"><button class="${value==='sample'?'active':''}" data-source="${name}" data-value="sample">サンプルデータ</button><button class="${value==='device'?'active':''}" data-source="${name}" data-value="device">この端末の回答</button></div>`;}
function teamView(){const {companies,c,records}=companyData(),agg=aggregate(records),canShow=records.length>=MIN_GROUP;const oneCount=canShow?agg.filter(x=>x.one>=Math.ceil(records.length*.4)).length:0;const gaps=agg.filter(x=>x.gap!==null).sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));return title('TEAM INSIGHT','現場の声を重ねて、会社を見渡す。','責任者と現場の見え方の違いを、対話のきっかけに。個人の評価には使いません。',button('会社コード・URLをつくる','create-company','primary'))+`<div class="toolbar">${segmented(teamSource,'team')}${companies.length?`<select class="compact-select" id="companySelect" aria-label="会社の選択">${companies.map(x=>`<option value="${x.code}" ${c?.code===x.code?'selected':''}>${esc(x.name)}${teamSource==='sample'?'（架空）':''}</option>`).join('')}</select>`:''}</div><div class="note ${teamSource==='sample'?'warn':'info'}">${teamSource==='sample'?'この画面の会社・回答・割合は、動きを説明するための架空データです。実績・業界平均ではありません。':'このブラウザで保存した回答だけです。共通URLを別端末で開いても、まだ自動集計されません。企業ごとのログイン・共有データベースは本番で接続します。'}</div>${!c?`<div class="card emptybox p20"><h3>会社コードをつくって、集計の流れを試す。</h3><p>会社名は仮名でOK。同じ端末で役割を変えて回答すると、集計に反映されます。</p>${button('コードをつくる','create-company','primary')}</div>`:`<section class="p20"><div class="sectionhead"><div><h2>${esc(c.name)}${teamSource==='sample'?' <span class="tag sample">架空の会社</span>':''}</h2><p>会社コード ${esc(c.code)} / ${INDUSTRIES[c.industry].name}</p></div>${teamSource==='device'?button('この会社として回答','respond-company','secondary'):''}</div><div class="grid four"><div class="kpi"><span class="statlabel">${teamSource==='sample'?'サンプル':'端末保存済み'}回答数</span><b>${records.length}<span class="small">件</span></b><small>回答件数。実人数とは限りません。</small></div><div class="kpi"><span class="statlabel">負担を感じる仕事</span><b>${canShow?agg.filter(x=>x.heavy>0).length:'—'}<span class="small">業務</span></b><small>「負担が大きい」以上の回答がある業務</small></div><div class="kpi"><span class="statlabel">1人への集中が目立つ仕事</span><b>${canShow?oneCount:'—'}<span class="small">業務</span></b><small>全回答の40％以上が「1人に集中」</small></div><div class="kpi"><span class="statlabel">認識差を比較できる業務</sp function compareRecords(before,after){if(before.industry!==after.industry||before.role!==after.role||before.ruleVersion!==after.ruleVersion)return {valid:false,reason:'業種・立場・判断ルールが異なるため比較しません。'};const common=before.selected.filter(id=>after.selected.includes(id)&&before.answers[id].minutes!=='unknown'&&after.answers[id].minutes!=='unknown');const b=common.reduce((s,id)=>s+Number(before.answers[id].minutes),0),a=common.reduce((s,id)=>s+Number(after.answers[id].minutes),0);return {valid:true,common,before:b,after:a,delta:b-a};}
function comparisonBlock(before,after,label){const v=compareRecords(before,after);if(!v.valid)return `<div class="note warn">${v.reason}</div>`;if(!v.common.length)return '<div class="note info">両方の診断で時間が分かっている同じ業務がないため、数値比較はしません。</div>';return `<div class="sourcelabel">${label} · 同じ立場 / 共通 ${v.common.length}業務 / 1人・1週間分</div><div class="grid three"><div class="kpi"><span class="statlabel">改善前の入力時間</span><b>${v.before}<span class="small">分</span></b><small>${dateText(before.createdAt)}</small></div><div class="kpi"><span class="statlabel">改善後の入力時間</span><b>${v.after}<span class="small">分</span></b><small>${dateText(after.createdAt)}</small></div><div class="kpi"><span class="statlabel">自己申告時間の差</span><b>${v.delta>0?'−':v.delta<0?'＋':''}${Math.abs(v.delta)}<span class="small">分</span></b><small>${v.delta>0?'短くなった':v.delta<0?'長くなった':'変化なし'}という回答</small></div></div><div class="tablewrap p20"><table><thead><tr><th>同じ業務で比較</th><th>前</th><th>後</th><th>時間差</th></tr></thead><tbody>${v.common.map(id=>`<tr><td>${esc(taskName(before.industry,id))}</td><td>${fmtMinutes(Number(before.answers[id].minutes))}</td><td>${fmtMinutes(Number(after.answers[id].minutes))}</td><td>${Number(after.answers[id].minutes)-Number(before.answers[id].minutes)}分</td></tr>`).join('')}</tbody></table></div><p class="subline">仕事量・担当・行事などの違いでも時間は変わります。AI導入による因果的な効果や、費用削減を証明する比較ではありません。</p>`;}

d><td class="wrapcell">${esc(KIND[l.kind]||KIND.consult)}</td><td><select class="compact-select" data-lead-status="${esc(l.id)}" aria-label="${esc(l.companyName)}の相談状態">${optionList({new:'未対応',reviewing:'確認中',contacted:'対応済み',closed:'完了'},leadStatusSample[l.id]||l.status||'new')}</select></td><td>${button('内容を見る','view-lead','secondary smallbtn',`data-id="${esc(l.id)}"`)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="emptybox">まだ相談希望はありません。「相談する」からデモ受付を保存すると、ここへ反映されます。</div>'}</section><section class="section card"><div class="sectionhead"><div><h2>回答・診断履歴</h2><p>サンプルとこの端末の回答は別集計です。会社の個別回答を外部へ共有しません。</p></div>${button('回答CSVを出力','export-answers','secondary smallbtn',subset.length?'':'disabled')}</div><div class="toolbar"><div class="field"><label for="adminSearch">会社名・コードで絞る</label><input id="adminSearch" maxlength="60" value="${esc(adminQuery)}" placeholder="会社名・コード"></div><select class="compact-select" id="adminRole" aria-label="立場で絞り込み">${optionList({all:'すべての立場',owner:'経営者',manager:'管理職',office:'事務',staff:'現場スタッフ'},adminRole)}</select>${button('絞り込み','filter-admin','light smallbtn')}</div><p class="small muted p12">${subset.length}件 / ${records.length}件を表示対象</p>${subset.length?`<div class="tablewrap p12"><table><thead><tr><th>診断日</th><th>会社・施設</th><th>立場</th><th>業務</th><th></th></tr></thead><tbody>${subset.slice().reverse().slice(0,30).map(r=>`<tr><td>${dateText(r.createdAt)}</td><td>${esc(companies.find(c=>c.code===r.company)?.name||'個人診断')}${sample?'（架空）':''}</td><td>${roleName(r.industry,r.role)}</td><td>${r.selected.length}件</td><td>${button('結果','open-result','secondary smallbtn',`data-id="${esc(r.id)}"`)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="emptybox p12">該当する診断がありません。</div>'}</section><section class="section card"><div class="sectionhead"><div><h2>会社ごとの管理</h2><p>共通コード、集計、再診断をつなげる入口です。</p></div>${button('コードを発行','create-company','secondary smallbtn')}</div>${companies.length?`<div class="tablewrap"><table><thead><tr><th>会社・施設</th><th>業種</th><th>回答数</th><th>集計</th></tr></thead><tbody>${companies.map(c=>`<tr><td>${esc(c.name)}${sample?'（架空）':''}</td><td>${INDUSTRIES[c.industry].name}</td><td>${records.filter(r=>r.company===c.code).length}件</td><td>${button('会社の結果へ','open-company','secondary smallbtn',`data-id="${c.code}" data-from="${sample?'sample':'device'}"`)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">この端末で発行した会社コードはありません。</p>'}</section><div class="btnrow section no-print">${button('このデモの端末データを消去','reset-data','danger smallbtn')}<span class="small muted">他のアプリの保存データには触れません。</span></div>`;}
function openModal(heading,body){returnFocus=document.activeElement;$('#modalroot').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">${heading}</h2><button class="close" data-action="close-modal" aria-label="閉じる">×</button></div>${body}</section></div>`;const f=$('.modal input,.modal select,.modal button');f?.focus();}

function privacyModal(){openModal('このデモで、できること・できないこと',`<div class="stack"><div class="note">診断・分類・試算・画面の切り替えは、通常のコードで動きます。AI APIは呼び出しません。</div><div><h3>回答と保存</h3><p class="p8">診断に氏名・メールアドレスは不要です。保存を選んだ場合だけ、このブラウザの保存領域に記録します。別端末には同期せず、共有端末の他の利用者が見られる可能性があります。</p><p class="p8">消去は「L CREW管理」から。このアプリのデータだけを消します。保存上限は診断150件・会社80件・相談100件。読み込み・保存に失敗したときは、その旨を表示します。</p></div><div><h3>会社コードと管理画面</h3><p class="p8">会社コードはデモの回答グループを識別するものです。認証や権限を付与する機能ではありません。管理画面は公開された体験画面で、本番用ログインはありません。実情報は扱わないでください。</p></div><div><h3>外部への送信</h3><p class="p8">診断入力を外部へ送信する処理はありません。相談もデモ受付の端末保存までです。サイトの表示にはVercelへの通信が発生し、ホスティング側でアクセスログが記録される場合があります。</p></div><div><h3>数値の意味</h3><p class="p8">表示を「あなたの入力」「架空サンプル」「仮定の試算」に分けています。無根拠なAI点数は出しません。時間の短縮率は利用者が動かす仮定で、営業成果・導入効果の実績ではありません。</p></div><div><h3>本運用で接続するもの</h3><p class="p8">組織別認証・権限、共有データベース、相談受付と通知、保存・削除ルール、必要な部分の実AI接続です。本番で複数人が回答するには、これらの実装と検証が必要です。</p></div></div>`);}
function createCompanyModal(){openModal('会社全体診断をつくる',`<p>まずは仮名で。共通コードと、回答画面のURLを発行します。</p><div class="note warn p12">別端末からの回答は合流しません。同じブラウザ内で集計を体験するデモです。</div><form id="companyForm" class="stack p20"><div class="field"><label for="companyNickname">会社の仮名</label><input id="companyNickname" name="name" maxlength="60" required placeholder="例：テスト保育園" autocomplete="off"></div><div class="field"><label for="companyIndustry">業種</label><select id="companyIndustry" name="industry">${optionList(Object.fromEntries(Object.entries(INDUSTRIES).map(([k,v])=>[k,v.name])),current?.industry||'hoiku')}</select></div><label class="checkline"><input type="checkbox" name="consent" required><span>仮名とコードをこの端末に保存することを確認しました。</span></label><button class="btn primary" type="submit">コードとURLを発行する</button></form>`);}
function showCompanyLink(c){const url='https://ruu-first-app.vercel.app/hoiku-ai-check/?company='+c.code+'&industry='+c.industry+'#diagnosis';openModal('会社コードと回答URL',`<span class="tag outline">${esc(c.name)} / この端末のデモ</span><div class="codebox">${esc(c.code)}</div><p class="small muted">同じ端末で複数回回答すると、このコードで集計されます。コードはログイン用の秘密情報ではありません。</p><div class="field p20"><label for="companyURL">回答画面の共有URL</label><input id="companyURL" class="urlbox" value="${esc(url)}" readonly></div><div class="note warn p12">URLは相手に送れますが、相手の端末で保存した回答は、まだあなたの画面へ集まりません。共有集計は本番で接続します。</div><div class="btnrow p20">${button('URLをコピー','copy-company','primary')}${button('この会社として回答する','start-company','secondary',`data-id="${c.code}"`)}</div>`);}
async function clipboard(text,input){try{if(!navigator.clipboard?.writeText)throw Error('unsupported');await navigator.clipboard.writeText(text);toast('URLをコピーしました。');}catch(e){input?.focus();input?.select();toast('自動コピーできませんでした。選択されたURLをコピーしてください。',true);}}
function csvCell(v){let s=String(v??'');if(/^[\s\uFEFF]*[=+@\-]/.test(s)||/^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function csvText(rows){return '\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');}
function download(name,text,type='text/csv;charset=utf-8'){try{const blob=new Blob([text],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('ダウンロードを開始しました。端末の保存先をご確認ください。');}catch(e){toast('ダウンロードを開始できませんでした。',true)}}
function resultRows(r){const e=evaluate(r);return [['データ区分','診断ID','診断日','業種','立場','会社コード','業務','週の分数','負担','現状','担当','改善希望','分類','優先度','理由','改善方法','良くしたいこと','利用者の採否','判断ルール'],...e.items.map(x=>[r.source==='sample'?'架空サンプル':'この端末の入力',r.id,r.createdAt,INDUSTRIES[r.industry].name,roleName(r.industry,r.role),r.company,taskName(r.industry,x.id),x.minutes===null?'未確認':x.minutes,BURDENS[x.burden===null?'unknown':x.burden],MODES[x.mode],OWNERS[x.owner],HOPES[r.answers[x.id].hope||'unknown'],CATS[x.cat].label,PRIOR[x.priority],x.reason,x.action,x.benefit,r.decisions?.[x.id]||'consider',RULE_VERSION])];}
function startRecheck(r){draft=copy(r);draft.id=uid();draft.baselineId=r.id;draft.source='device';draft.createdAt=new Date().toISOString();draft.decisions={};draft.save=false;delete draft.savedAt;draft.selected.forEach(id=>{draft.answers[id]={...draft.answers[id],minutes:'unknown',burden:'unknown',hope:'unknown'}});current=null;wstep=3;go('diagnosis');toast('同じ仕事の現在の時間・負担を、もう一度回答してください。');}
function recheck(){const r=current?.source==='device'?current:store.results[store.results.length-1];if(!r){openModal('まずは、初回の診断から',`<p>架空のサンプルでは実際の効果測定はできません。あなたの回答を保存してから、同じ仕事で再診断できます。</p><div class="btnrow p20">${button('診断をはじめる','start','primary')}${button('閉じる','close-modal','secondary')}</div>`);return}if(!store.results.some(x=>x.id===r.id)){openModal('初回の結果を保存して再診断',`<p>前後を比較するため、この端末に初回の診断結果を保存します。外部には送信しません。</p><div class="btnrow p20">${button('保存に同意して再診断する','save-before-recheck','primary')}${button('やめる','close-modal','secondary')}</div>`);return}startRecheck(r);}
function savePlan(){if(!current||!$('#planConfirm')?.checked){toast('内容・担当・確認方法を見直したチェックを入れてください。',true);return}const p=copy(activePlan());p.approvedAt=new Date().toISOString();p.dirty=false;p.approvalFingerprint=planFingerprint(current,p);if(current.source==='sample'){planState[current.id]=p;render();toast('サンプル計画を確認済みにしました。このページ内だけの体験です。');return}const next=copy(store);const ri=next.results.findIndex(r=>r.id===current.id);const rec={...copy(current),savedAt:new Date().toISOString()};if(ri<0)next.results.push(rec);else next.results[ri]=rec;const pi=next.plans.findIndex(x=>x.resultId===p.resultId);if(pi<0)next.plans.push(p);else next.plans[pi]=p;if(persist(next)){planState[current.id]=p;resultDirty=false;render();toast('確認した計画と診断結果をこの端末に保存しました。');}}
function openLead(id){const l=(adminSource==='sample'?sampleLeads:store.leads).find(x=>x.id===id);if(!l)return;const link=store.results.find(x=>x.id===l.resultId)||sampleResponses.find(x=>x.id===l.resultId);openModal('相談内容 / デモ受付',`<span class="tag sample">${adminSource==='sample'?'架空のサンプル':'この端末の控え / 未送信'}</span><div class="contact-review"><b>会社・施設 / 担当者</b><p>${esc(l.companyName)} / ${esc(l.name)}</p><b>連絡先</b><p>${esc(l.email)}</p><b>相談したいこと</b><p>${esc(KIND[l.kind]||KIND.consult)}</p><b>メモ</b><p>${esc(l.note||'記入なし')}</p><b>保存同意</b><p>${l.consent?'確認済み':'未確認'}</p></div><div class="note">外部へのメール送信や担当者への通知は行っていません。管理者用の認証と実受付は本番で接続します。</div>${link?`<div class="btnrow p20">${button('紐付いた診断を見る','open-result','secondary',`data-id="${esc(link.id)}"`)}</div>`:'<p class="small muted p12">紐付け先の診断が未保存、またはサンプルのため、実データの添付はありません。</p>'}`);}

function exportTeam(){const {c,records}=companyData();if(!c||records.length<MIN_GROUP){toast('5件未満のため詳細集計を出力しません。',true);return}const rows=[['データ区分','会社の仮名','業種','会社コード','業務','選択回答数','負担の有効回答','負担が大きい回答数','1人に集中','担当の有効回答','改善希望あり','改善希望の有効回答','経営管理の有効回答','現場事務の有効回答','認識差pt'],...aggregate(records).map(x=>[teamSource==='sample'?'架空サンプル':'この端末の入力',c.name,INDUSTRIES[c.industry].name,c.code,taskName(c.industry,x.id),x.n,x.known,x.heavy,x.one,x.ownersKnown,x.hope,x.hopeKnown,x.mgN>=MIN_GROUP?x.mgN:'非表示',x.fieldN>=MIN_GROUP?x.fieldN:'非表示',x.gap===null?'少人数のため非表示':x.gap])];download(`hoiku-company-${teamSource}.csv`,csvText(rows));}
function exportAnswers(){const records=adminSource==='sample'?sampleResponses:store.results,companies=adminSource==='sample'?sampleCompanies:store.companies;const list=records.filter(r=>(adminRole==='all'||r.role===adminRole)&&(!adminQuery||(companies.find(c=>c.code===r.company)?.name||'個人診断').toLowerCase().includes(adminQuery.toLowerCase())||r.company.toLowerCase().includes(adminQuery.toLowerCase())));if(!list.length){toast('出力する回答がありません。',true);return}const rows=resultRows(list[0]).slice(0,1);list.forEach(r=>rows.push(...resultRows(r).slice(1)));download('hoiku-answers-'+adminSource+'.csv',csvText(rows));}

 else if(a==='export-team')exportTeam();
 else if(a==='export-answers')exportAnswers();
 else if(a==='export-leads'){const ls=adminSource==='sample'?sampleLeads:store.leads;download('hoiku-consultations-'+adminSource+'.csv',csvText([['区分','保存日時','会社の仮名','担当者の仮名','デモ連絡先','相談希望','メモ','状態','保存同意','実送信'],...ls.map(l=>[adminSource==='sample'?'架空サンプル':'この端末の控え',l.createdAt,l.companyName,l.name,l.email,KIND[l.kind],l.note,leadStatusSample[l.id]||l.status,l.consent?'あり':'なし','未送信'])]));}
 else if(a==='export-plan'&&current){const p=activePlan();const items=evaluate(current).items.filter(x=>x.cat!=='keep'&&!['skip','hold'].includes(current.decisions?.[x.id]));download('hoiku-plan-'+current.source+'.csv',csvText([['区分','診断ID','業務','取り組むこと','担当する役割','状態（自己申告）','最終確認','保存状態'],...items.map(x=>[current.source,current.id,taskName(current.industry,x.id),x.action,roleName(current.industry,p.entries[x.id].owner),p.entries[x.id].status,p.approvedAt||'未確認',p.dirty?'未保存':current.source==='sample'?'ページ内のみ':'端末保存'])]));}
 else if(a==='export-reflection'){download('hoiku-reflection.csv',csvText([['項目','振り返り（自己申告）','記録日時','診断ID'],...['burden','people','quality','business'].map(k=>[{burden:'負担・残業',people:'人と向き合う時間',quality:'ミス・修正・品質',business:'経営・売上づくりの時間'}[k],$(`#m-${k}`).selectedOptions[0].textContent,new Date().toISOString(),current?.id||'紐付けなし'])]));}
 else if(a==='reset-data'){openModal('この端末のデモデータを消去しますか？',`<p>このアプリの診断 ${store.results.length}件、会社コード ${store.companies.length}件、相談控え ${store.leads.length}件と計画を削除します。必要なものは先にCSVで出力してください。</p><div class="note warn p12">削除後はこの画面から復元できません。他のアプリのデータには触れません。</div><div class="btnrow p20">${button('やめる','close-modal','secondary')}${button('このデモのデータを削除する','confirm-reset','danger')}</div>`);}
 else if(a==='confirm-reset'){try{localStorage.removeItem(KEY);if(localStorage.getItem(KEY)!==null)throw Error('失敗');store={version:2,results:[],companies:[],leads:[],plans:[]};current=null;draft=null;planState={};consultPreview=null;consultDraft=null;storeError='';storageCorrupt=false;initialRaw='';closeModal();render();toast('このデモの端末データを削除しました。');}catch(err){toast('削除できませんでした。ブラウザの保存設定をご確認ください。',true);}}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.field&&draft){if(t.dataset.field==='industry'&&Object.hasOwn(INDUSTRIES,t.value)){draft.industry=t.value;draft.role='';draft.selected=[];draft.answers={};draft.noConcern=false;render();}else if(t.dataset.field==='role'&&ROLES.includes(t.value))draft.role=t.value;}
 if(t.name==='tasks'&&draft){if(t.checked&&draft.selected.length>=5){t.checked=false;toast('最大5つまで選べます。まず気になる仕事に絞りましょう。',true);return}draft.selected=$$('input[name="tasks"]:checked').map(x=>x.value);draft.selected.forEach(id=>{if(!draft.answers[id])draft.answers[id]=unknownAnswer()});if(draft.selected.length){draft.noConcern=false;$('#noConcern').checked=false;}$('#selectionCount').textContent=draft.selected.length+' / 5 業務を選択';}
 if(t.id==='noConcern'&&draft){draft.noConcern=t.checked;if(t.checked){draft.selected=[];draft.answers={};$$('input[name="tasks"]').forEach(x=>x.checked=false);$('#selectionCount').textContent='0 / 5 業務を選択';}}
 if(t.dataset.answer&&draft&&IDS.includes(t.dataset.answer)){draft.answers[t.dataset.answer][t.dataset.key]=t.value;}
 if(t.name==='goal'&&draft&&Object.hasOwn(GOALS,t.value))draft.goal=t.value;
 if(t.id==='saveConsent'&&draft)draft.save=t.checked;
 if(t.dataset.decision&&current){current.decisions=current.decisions||{};current.decisions[t.dataset.decision]=t.value;resultDirty=true;if(planState[current.id]){planState[current.id].dirty=true;planState[current.id].approvedAt=null;}const open=$$('details.workcard[open]').map(x=>x.dataset.work);const sy=window.scrollY;render();open.forEach(id=>{const node=$(`[data-work="${id}"]`);if(node)node.open=true});window.scrollTo(0,sy);toast('採否を変更しました。必要に応じて結果・計画を保存してください。');}
 if(t.dataset.plan&&current){const p=activePlan();p.entries[t.dataset.plan][t.dataset.key]=t.value;p.dirty=true;p.approvedAt=null;$('#planConfirm').checked=false;const badge=$('[data-plan-state]');if(badge){badge.textContent='変更あり・再確認が必要';badge.className='tag next';}$('.plan-status').textContent='変更した内容は未保存です。再確認して保存してください。';}
 if(t.id==='companySelect'){teamCode=t.value;render();}
 if(t.dataset.leadStatus){const id=t.dataset.leadStatus;if(adminSource==='sample'){leadStatusSample[id]=t.value;render();toast('サンプルの対応状態を変更しました。');}else{const next=copy(store),l=next.leads.find(x=>x.id===id);if(l){l.status=t.value;if(persist(next)){render();toast('対応状態を端末に保存しました。');}else render();}}}
});
document.addEventListener('input',e=>{if(e.target.id==='ratio'&&current){ratio=Math.max(0,Math.min(40,Number(e.target.value)||0));$('#ratioLabel').textContent=ratio;$('#gainValue').innerHTML=Math.round(evaluate(current).eligibleMinutes*ratio/100)+'<span>分 / 週・あなた1人</span>';}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='companyForm'){const f=e.target;if(!f.reportValidity())return;const data=new FormData(f),name=String(data.get('name')).trim(),industry=String(data.get('industry'));if(!name||name.length>60||!Object.hasOwn(INDUSTRIES,industry)){toast('仮名と業種を確認してください。',true);return}const code=uid('C').toUpperCase();const c={code,name,industry,createdAt:new Date().toISOString()};const next=copy(store);if(next.companies.some(x=>x.code===code)){toast('コードを再発行してください。',true);return}next.companies.push(c);if(persist(next)){teamSource='device';teamCode=code;render();showCompanyLink(c);}}
 if(e.target.id==='consultForm'){const f=e.target;if(!f.reportValidity())return;const d=new FormData(f);const lead={id:uid('lead'),companyName:String(d.get('companyName')).trim(),name:String(d.get('name')).trim(),email:String(d.get('email')).trim(),note:String(d.get('note')||'').trim(),kind:String(d.get('kind')),consent:$('#contact-consent').checked,resultId:current?.id||null};if(!lead.companyName||!lead.name||!lead.email||!lead.consent||!Object.hasOwn(KIND,lead.kind)||lead.companyName.length>80||lead.name.length>80||lead.note.length>600||lead.email.length>160){toast('必須項目と同意を確認してください。',true);return}consultDraft=copy(lead);consultPreview=Object.freeze(copy(lead));render();window.scrollTo(0,0);}});
document.addEventListener('keydown',e=>{if(!$('.modal'))return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const nodes=$$('.modal button,.modal input,.modal select,.modal textarea,.modal a[href]').filter(x=>!x.disabled),first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
$('#modalroot').addEventListener('click',e=>{if(e.target.classList.contains('modalback'))closeModal()});
$('#menuToggle').addEventListener('click',()=>{const open=$('#rail').classList.toggle('mobileopen');$('#menuToggle').setAttribute('aria-expanded',String(open));$('#menuToggle').setAttribute('aria-label',open?'メニューを閉じる':'メニューを開く')});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);$('#view').focus({preventScroll:true});});
window.addEventListener('storage',e=>{if(e.key===KEY){try{store=e.newValue?cleanStore(JSON.parse(e.newValue)):{version:2,results:[],companies:[],leads:[],plans:[]};toast('同じブラウザの別タブで保存内容が更新されました。再読み込みで確認してください。');}catch(err){toast('別タブの保存内容を読み込めませんでした。',true)}}});
window.HoikuDemoTest=Object.freeze({evaluate,classify,aggregate,compareRecords,csvText,validRecord,sampleRecord,unknownAnswer,industries:INDUSTRIES,samples:()=>copy(sampleResponses),version:VERSION});
render();if(joinedCode){draft=freshDraft();wstep=1;if(!location.hash)go('diagnosis');}if(urlCode&&!joinedCode)toast('会社コードの形式を確認できないため、個人診断として開いています。',true);
})();
</script></body></html>

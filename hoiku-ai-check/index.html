 if(wstep===1){body=`<h2>あなたの仕事について教えてください。</h2><p class="intro">業種と立場に合わせて、質問の言葉と順番が変わります。</p><div class="grid two"><div class="field"><label for="industry">業種</label><select id="industry" data-field="industry">${optionList(Object.fromEntries(Object.entries(INDUSTRIES).map(([k,v])=>[k,v.name])),d.industry)}</select></div><div class="field"><label for="role">あなたの立場</label><select id="role" data-field="role"><option value="">選んでください</option>${optionList(Object.fromEntries(ROLES.map((r,i)=>[r,ind.role[i]])),d.role)}</select></div></div><div class="note p20">${ico('shield')} この段階では、${ind.noun}の名前・お名前・メールアドレスは聞きません。個人が分かる情報や、実際の相談記録も不要です。</div><div class="note p20"><b>はじめに、AIとICTの違い。</b><br>AI：文章の下書き・要約などを助けるもの。最後は人が確認します。<br>ICT：記録・計算・共有の道具。まず、今ある道具でできないかを考えます。<br><span class="muted">AIもICTの一部ですが、この診断では得意な仕事を分けて整理します。</span></div>${d.company?`<div class="note info p20">会社コード付き回答：${esc(d.company)}<br>集計はこのブラウザ内だけです。他の人や端末には送信されません。</div>`:''}`;}
 if(wstep===2){const order=ROLE_ORDER[d.role]||IDS;body=`<h2>あなたが関わっている仕事は？</h2><p class="intro">${esc(ROLE_QUESTION[d.role]||'気になる仕事を選んでください。')}<br>まずは気になる仕事を3つ程度。最大5つまで選べます。うまく回っている仕事も選べます。</p><div class="selectgrid">${order.map(id=>`<label class="option"><input type="checkbox" name="tasks" value="${id}" ${d.selected.includes(id)?'checked':''}><span><b>${esc(taskName(d.industry,id))}</b><small>${esc(ind.examples[IDS.indexOf(id)])}</small></span></label>`).join('')}</div><div class="p12 small muted" id="selectionCount">${d.selected.length} / 5 業務を選択</div><label class="checkline"><input id="noConcern" type="checkbox" ${d.noConcern?'checked':''}>今は特に困っている仕事がない</label>`;}
 if(wstep===3){body=`<h2>今の負担と、変えたい気持ちを教えてください。</h2><p class="intro">まずは各業務の3項目だけ。分からないところは、そのままで大丈夫です。<br>時間や担当の偏りは、下の「詳しく答える」から任意で追加できます。</p>${d.selected.length?d.selected.map(id=>{const a=d.answers[id]||unknownAnswer();const more=d.baselineId||a.minutes!=='unknown'||a.owner!=='unknown';return `<div class="taskedit"><div class="taskedit-head"><h3>${esc(taskName(d.industry,id))}</h3><span class="tag outline">あなたの実感で</span></div><div class="taskfields quickfields"><div class="field"><label for="a-${id}-burden">負担は、どれくらい？</label><select id="a-${id}-burden" data-answer="${id}" data-key="burden">${optionList(BURDENS,a.burden)}</select></div><div class="field"><label for="a-${id}-mode">今は、どう進めている？</label><select id="a-${id}-mode" data-answer="${id}" data-key="mode">${optionList(MODES,a.mode)}</select></div><div class="field"><label for="a-${id}-hope">今、改善したい？</label><select id="a-${id}-hope" data-answer="${id}" data-key="hope">${optionList(HOPES,a.hope||'unknown')}</select></div></div><details class="optional-questions" ${more?'open':''}><summary>詳しく答える：時間・担当の偏り（任意）</summary><p class="small muted p12">時間は、あなた1人分・1週間の合計です。確認や修正も含めます。不明は0分として計算しません。</p><div class="taskfields optionfields p12"><div class="field"><label for="a-${id}-minutes">合計の作業時間</label><select id="a-${id}-minutes" data-answer="${id}" data-key="minutes">${optionList({unknown:'まだ分からない',0:'0分（していない）',15:'15分',30:'30分',60:'1時間',120:'2時間',240:'4時間',480:'8時間',960:'16時間'},a.minutes)}</select></div><div class="field"><label for="a-${id}-owner">担当の偏り</label><select id="a-${id}-owner" data-answer="${id}" data-key="owner">${optionList(OWNERS,a.owner)}</select></div></div></details></div>`}).join(''):`<div class="note">困っている仕事がない場合は、この質問を省略できます。</div>`}`;}
 if(wstep===4){body=`<h2>増やしたいのは、どんな時間ですか？</h2><p class="intro">効率化はゴールではありません。生まれた時間の使い道を1つ選んでください。</p><div class="selectgrid">${Object.entries(GOALS).map(([id,g])=>`<label class="option"><input type="radio" name="goal" value="${id}" ${d.goal===id?'checked':''}><span><b>${esc(g.label)}</b><small>${esc(g.desc)}</small></span></label>`).join('')}</div>`;}
 if(wstep===5){body=`<h2>この内容で、改善の一歩を見つけます。</h2><p class="intro">答えにくい質問は「分からない」のままでも結果を見られます。</p><dl class="reviewlist"><dt>業種</dt><dd>${ind.name}</dd><dt>立場</dt><dd>${roleName(d.industry,d.role)}</dd><dt>仕事</dt><dd>${d.selected.length?d.selected.map(id=>esc(taskName(d.industry,id))).join('<br>'):'今は特に困っていない'}</dd><dt>目的</dt><dd>${esc(GOALS[d.goal]?.label)}</dd><dt>回答の保存</dt><dd>選んだ場合のみ、この端末に保存。外部送信なし。</dd></dl><label class="checkline"><input type="checkbox" id="saveConsent" ${d.save?'checked':''}>この端末に回答と結果を保存して、あとで見返す</label><p class="small muted p8">共有端末では保存しないでください。保存なしでも結果を見て、CSVを出力できます。会社集計にはこの端末で保存した回答だけを使います。</p><div class="note p20">回答をもとに固定の判断ルールで整理します。実AIは未接続です。時間の試算は効果の保証ではありません。</div>`;}
 return title('PERSONAL CHECK','かんたん業務チェック','3〜5分を目安に。分かるところだけ、あなたの言葉で。')+`<div class="question"><div class="stepper" aria-label="診断の進み具合">${names.map((n,i)=>`<div class="stepitem ${i+1===wstep?'active':i+1<wstep?'done':''}" ${i+1===wstep?'aria-current="step"':''}><span>0${i+1}</span>${n}</div>`).join('')}</div><section class="card">${body}<p class="q-error" id="qError" role="alert"></p><div class="question-nav">${button(wstep===1?'ホームへ戻る':'戻る','back','secondary')}${button(wstep===5?'結果を見る '+ico('arrow'):'次へ '+ico('arrow'),'next','primary')}</div></section><div class="privacyrow">${ico('shield')}<span>AIに任せない方がよい仕事も表示します。途中で画面を移動しても、ページを閉じるまでは続きから回答できます。</span></div></div>`;}
function wizardNext(){const error=$('#qError');if(wstep===1&&!ROLES.includes(draft.role)){error.textContent='あなたの立場を選んでください。';$('#role').focus();return}if(wstep===2&&!draft.selected.length&&!draft.noConcern){error.textContent='仕事を1つ以上選ぶか、「今は特に困っている仕事がない」を選んでください。';return}if(wstep===3){for(const id of draft.selected){const a=draft.answers[id];if(a.minutes==='0'&&Number(a.burden)>=2){error.textContent=`「${taskName(draft.industry,id)}」は作業時間0分で負担が大きい回答です。時間が分からない場合は「まだ分からない」を選んでください。`;return}}}if(wstep===4&&!draft.goal){error.textContent='増やしたい時間を1つ選んでください。';return}if(wstep<5){wstep+=(wstep===2&&draft.noConcern?2:1);render();window.scrollTo(0,0);return}const r=copy(draft);r.createdAt=new Date().toISOString();r.elapsedSeconds=Number.isFinite(r.startedAt)?Math.max(0,Math.round((Date.now()-r.startedAt)/1000)):null;delete r.startedAt;r.ruleVersion=RULE_VERSION;r.version=VERSION;delete r.save;current=r;filter='all';if(draft.save){if(upsertResult(r))toast('回答と結果をこの端末に保存しました。外部には送信していません。');}draft=null;go('results');}
function emptyResult(){return title('YOUR RESULTS','診断結果','今の状態と、最初に取り組むことを整理します。')+`<div class="card"><div class="emptybox">${ico('chart')}<h3>まずは診断するか、サンプルで体験。</h3><p>サンプルは架空の回答です。実際の利用実績ではありません。</p><div class="btnrow" style="justify-content:center">${button('診断をはじめる','start','primary')}${button('サンプルを見る','sample')}</div></div></div>${historyHTML()}`;}
function historyHTML(){if(!store.results.length)return '';return `<section class="section"><div class="sectionhead"><h2>この端末の診断履歴</h2><span class="small muted">他の端末とは同期しません</span></div><div class="tablewrap"><table><thead><tr><th>診断日</th><th>業種・立場</th><th>会社コード</th><th></th></tr></thead><tbody>${store.results.slice().reverse().slice(0,20).map(r=>`<tr><td>${dateText(r.createdAt)}</td><td>${INDUSTRIES[r.industry].name} / ${roleName(r.industry,r.role)}</td><td>${esc(r.company||'個人診断')}</td><td>${button('結果を開く','open-result','secondary smallbtn',`data-id="${esc(r.id)}"`)}</td></tr>`).join('')}</tbody></table></div></section>`;}
function resultStateText(e){if(e.items.length&&!e.top.length&&e.deferred)return ['今回は、着手を見送る選択です。','保留・不要にした仕事は、改善候補と時間の試算から外しています。負担の回答は残し、希望が変われば見直せます。'];if(!e.items.length)return ['今は、無理に変えなくて大丈夫。','新しい道具を増やすより、うまく回っている仕事を続けましょう。'];if(!e.top.length&&e.unknown)return ['まずは、仕事の状態を確かめるところから。','分からないことがあるのは自然です。1週間だけ記録すると、次の判断がしやすくなります。'];if(!e.top.length)return ['今のやり方に、良いところがあります。','今回の回答では、新しいAIやシステムを急いで導入する必要はありません。'];if(e.top.every(x=>x.cat==='human'))return ['人が判断できる体制を、先に整えましょう。','AIで置き換えるのではなく、相談先と確認手順を整えることから始めます。'];return [`まずは${e.top.length}つ。仕事の進め方を見直しましょう。`,'全部を変える必要はありません。負担の大きさと確認のしやすさから、最初の候補を整理しました。'];}
function itemWorkflow(item){if(item.cat==='ai')return [['材料を集める','一から文章をつくる','修正・確認を繰り返す','正式版を保存・共有'],['伝える事実を箇条書き','AIが下書き・整理','人が事実・表現を修正','責任者が確認 → 正式保存・共有']];if(item.cat==='ict')return [['複数の紙・画面に入力','手作業で転記・照合','担当者が集計','別の人へ共有'],['正本にする入力先を決める','既存機能で集計・共有','担当者が例外を確認','記録を保存して次の担当へ']];if(item.cat==='human')return [['担当者が状況を把握','1人で判断に迷うことがある','関係者へ確認・連絡'],['相談先・責任者を確認','人が状況と事実を確認','必要な専門職と判断','対応経緯を記録・引き継ぎ']];return [['今の道具・手順で対応','担当者が確認して完了'],[item.unknown?'1週間だけ時間と負担を記録':'今の方法を続ける','変化や困りごとが出たら再診断']];}
function workcard(item,r){const flow=itemWorkflow(item),decision=r.decisions?.[item.id]||'consider';return `<details class="workcard" data-work="${item.id}"><summary><span class="workname">${esc(taskName(r.industry,item.id))}</span><span class="tag ${item.cat}">${CATS[item.cat].label}</span><span class="tag ${item.priority==='next'?'next':'outline'}">${PRIOR[item.priority]}</span></summary><div class="detailsbody"><div class="sourcelabel">回答した内容：負担 ${BURDENS[item.burden===null?'unknown':item.burden]} / ${MODES[item.mode]} / 週 ${fmtMinutes(item.minutes)} / ${OWNERS[item.owner]}</div><div class="dlgrid"><div><h4>なぜ、この判断？</h4><p>${item.reason}</p></div><div><h4>何を、どう変える？</h4><p>${item.action}</p></div><div><h4>何が良くなることを目指す？</h4><p>${item.benefit}</p></div><div><h4>次は誰が進める？</h4><p>${item.route==='self'?'自分たちで、小さく試せることから。':item.route==='system'?'既存ツールの担当者へ確認。必要な機能がないときだけ導入を比較。':'責任者・専門家と、使う範囲や確認のルールを決める。'}</p></div></div><div class="workflow"><div><h4>今までの進め方の例</h4><ol>${flow[0].map(x=>`<li>${x}</li>`).join('')}</ol></div><div><h4>これからの進め方の例</h4><ol>${flow[1].map(x=>`<li>${x}</li>`).join('')}</ol></div></div>${item.risk?`<div class="note warn p12">実在の個人情報や健康情報は無料デモに入れません。安全・専門判断をAIに任せないことを前提に、確認・保存のルールから相談してください。</div>`:''}<div class="decision"><label for="decision-${item.id}">あなたの判断</label><select id="decision-${item.id}" data-decision="${item.id}">${optionList({consider:'検討する',adopt:'試してみる',hold:'いったん保留',skip:'今回は不要'},decision)}</select><span class="muted small">元の回答と分類は残し、改善候補と試算には採否を反映します。</span></div></div></details>`;}
function effectHTML(r,e){const gain=Math.round(e.eligibleMinutes*ratio/100),ind=INDUSTRIES[r.industry],target=GOALS[r.goal];return `<section class="section"><div class="sectionhead"><div><div class="eyebrow">TIME FOR WHAT MATTERS</div><h2>減らした時間を、何に使う？</h2></div><span class="tag sample">仮定のシミュレーション</span></div><div class="split"><div class="card"><span class="small muted">AI・ICT候補の作業が、確認・修正を含めて</span><h3 class="p8"><span id="ratioLabel">${ratio}</span>％短くできたと仮定すると</h3><input class="range" id="ratio" aria-label="短縮率の仮定" type="range" min="0" max="40" step="5" value="${ratio}"><div class="effect-number" id="gainValue">${e.eligibleKnownCount?gain:'未計算'}<span>分 / 週・あなた1人</span></div><p class="small muted p8">対象の入力時間：${fmtMinutes(e.eligibleKnownCount?e.eligibleMinutes:null)} / 週。<br>計算：対象時間 × 仮定の短縮率。人の判断・現状維持・時間不明・保留・不要は計算から除外。時間を入力していない場合は未計算です。</p><div class="note warn p12">実際の削減時間ではありません。人件費の削減や売上増加を示す数値でもありません。実導入後に測り直します。</div></div><div class="card"><div class="iconbox">${ico('heart')}</div><div class="eyebrow">あなたが選んだ使い道</div><h3>${esc(target?.label||'大切な仕事へ戻す')}</h3><p class="muted small p12">${esc(target?.desc||'目的を確認することから始めます。')}</p><div class="p20"><div class="barlabel"><span>生まれた時間の使い道</span><span>目標</span></div><div class="bartrack"><div class="bar" style="width:100%"></div></div><p class="small muted p8">試算の時間を3者に重複して足しません。何に使えたかを再診断で確かめます。</p></div></div></div><div class="valuecards p20"><div class="valuecard">${ico('leaf')}<b>働く人に</b><p>無駄な転記や書き始めの負担を減らし、残業や持ち帰りを見直す。</p></div><div class="valuecard">${ico('heart')}<b>${esc(ind.people)}に</b><p>話を聴く、関わる、丁寧に対応する時間を増やし、サービスの質を支える。</p></div><div class="valuecard">${ico('path')}<b>経営する人に</b><p>確認に追われる時間を見直し、人材育成や運営・売上づくりに向き合う。</p></div></div><p class="subline">目指す循環：働く人の余裕 → 丁寧な対応 → サービス品質 → 続けられる経営。現時点で効果が実証されたという意味ではありません。</p></section>`;}
let resultDirty=false;
function nextStepsHTML(r,e){return `<section class="section" id="next-steps"><div class="sectionhead"><div><div class="eyebrow">CHOOSE YOUR NEXT STEP</div><h2>次に進む道を、分けて考える。</h2><p>候補に残した仕事だけを表示しています。すべてを外部に頼む必要はありません。</p></div></div><div class="grid three">${[['self','自分たちで改善する','共通の書式や、公開情報での下書きから小さく試します。'],['expert','専門家と確かめる','安全・個人情報・判断の範囲を確認。必要に応じて研修や支援へ。'],['system','道具の設定・導入を検討','まず今のツールでできるか確認。足りない機能だけ導入を比べます。']].map(([key,name,desc])=>{const items=e.actionable.filter(x=>x.route===key);return `<div class="card next-route"><span class="tag outline">${items.length}件</span><h3 class="p12">${name}</h3><p class="small muted p8">${desc}</p><p class="small p12">${items.map(x=>esc(taskName(r.industry,x.id))).join('<br>')||'今回は該当なし'}</p></div>`}).join('')}</div></section>`;}
function resultsView(){if(!current)return emptyResult();const r=current,e=evaluate(r),headline=resultStateText(e),saved=store.results.some(x=>x.id===r.id)&&!resultDirty;const shown=e.items.filter(x=>filter==='all'||x.cat===filter);return title('YOUR RESULTS','あなたの仕事の、次の一歩。',`${INDUSTRIES[r.industry].name} / ${roleName(r.industry,r.role)} · ${r.source==='sample'?'架空のサンプル回答':'あなたが入力した回答'} · 判断ルール ${RULE_VERSION}`,button(ico('download')+' CSV出力','export-result','secondary')+button('回答を見直す','edit-current','secondary'))+`${r.ruleVersion!==RULE_VERSION?'<div class="note info p20">過去の回答を、現在の判断ルールで再整理して表示しています。保存した回答自体は変更していません。</div>':''}<div class="summaryhero"><div><span class="tag ${r.source==='sample'?'sample':'outline'}">${r.source==='sample'?'サンプル / 実績ではありません':saved?'この端末に保存済み':'結果を表示中 / 未保存'}</span><h2 class="p12">${headline[0]}</h2><p>${headline[1]}</p></div><div class="resultstat"><div><div class="statvalue">${e.top.length}<span class="small"> つ</span></div><div class="statlabel">改善の候補</div></div><div><div class="statvalue">${e.keep}<span class="small"> 件</span></div><div class="statlabel">今は着手しない仕事</div></div><div><div class="statvalue">${e.unknown}<span class="small"> 件</span></div><div class="statlabel">まず確認する仕事</div></div></div></div><section class="section"><div class="sectionhead"><div><div class="eyebrow">FIRST THREE</div><h2>まず取り組む、3つまで。</h2><p>負担・担当の偏り・確認のしやすさで並べています。必要がなければ3つに増やしません。</p></div></div><div class="priorities">${[0,1,2].map(i=>{const t=e.top[i];return t?`<div class="priority"><div class="rank">0${i+1} <span class="tag ${t.priority==='next'?'next':'outline'}">${PRIOR[t.priority]}</span></div><h3>${esc(taskName(r.industry,t.id))}</h3><span class="tag ${t.cat}">${CATS[t.cat].short}</span><p class="p12">${t.action}</p><div class="reasonshort">負担：${BURDENS[t.burden]}${t.owner==='one'?' / 特定の1人に集中':''}</div>${button('具体的な進め方を見る','detail','ghost',`data-id="${t.id}"`)}</div>`:`<div class="priority empty"><div class="rank">0${i+1}</div><h3>${e.unknown?'まずは、確認から。':'無理に増やさなくて大丈夫。'}</h3><p>${e.unknown?'未確認の項目は、今の状態を確かめてから考えます。':'必要な改善だけに絞ります。今の良いところも、そのまま大切に。'}</p></div>`}).join('')}</div></section><section class="section"><div class="sectionhead"><div><h2>変える仕事・変えない仕事</h2><p>仕事を開くと、理由・改善方法・期待する変化・人の役割が見られます。</p></div></div><div class="filters">${[['all','すべて'],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,v])=>`<button class="filter ${filter===k?'active':''}" data-filter="${k}">${v} ${k==='all'?e.items.length:e.items.filter(x=>x.cat===k).length}</button>`).join('')}</div>${shown.length?shown.map(x=>workcard(x,r)).join(''):'<div class="emptybox">この分類に当てはまる仕事はありません。</div>'}</section>${effectHTML(r,e)}${nextStepsHTML(r,e)}<section class="section card"><div class="sectionhead"><div><h2>小さく試して、変化を確かめる。</h2><p>自分たちでできることは自分たちで。支援が必要なところだけ、相談へ。</p></div></div><div class="btnrow">${button('改善プランをつくる '+ico('arrow'),'to-plan','primary')}${button('相談したい','to-consult','secondary')}${button('詳しい改善提案を受けたい','consult-kind','secondary','data-kind="proposal"')}${button('会社全体で診断する','to-team','secondary')}${r.source==='device'?button(saved?'この端末に保存済み':'結果をこの端末に保存','save-result','light',saved?'disabled':''):''}</div></section>${historyHTML()}`;}
function planFingerprint(r,p){return JSON.stringify({industry:r.industry,role:r.role,rule:RULE_VERSION,recordRule:r.ruleVersion,goal:r.goal,selected:r.selected,answers:r.answers,decisions:r.decisions||{},entries:p.entries});}
function activePlan(){if(!current)return null;const id=current.id;if(!planState[id]){const old=store.plans.find(x=>x.resultId===id);planState[id]=old?copy(old):{resultId:id,entries:{},approvedAt:null,dirty:true,source:current.source};}const p=planState[id];evaluate(current).actionable.forEach(x=>{if(!p.entries[x.id])p.entries[x.id]={owner:current.role,status:'planned'};});if(p.approvedAt&&p.approvalFingerprint!==planFingerprint(current,p)){p.approvedAt=null;p.dirty=true;}return p;}
function planView(){if(!current)return title('ACTION PLAN','改善プラン','診断を、次の仕事につなげます。')+`<div class="card emptybox"><h3>まず結果を見て、取り組む仕事を決めましょう。</h3><p>サンプルでも、採否・担当・進め方を確認できます。</p><div class="btnrow" style="justify-content:center">${button('診断をはじめる','start','primary')}${button('サンプル結果を見る','sample')}</div></div>`;const r=current,e=evaluate(r),p=activePlan(),items=e.actionable;const saved=!!p.approvedAt&&!p.dirty;return title('ACTION PLAN','最初の一歩を、仕事の形に。','採否を決め、担当と確認方法をそろえる。大きく変える前に、小さく試します。',button('診断結果に戻る','to-results','secondary'))+`<div class="note ${r.source==='sample'?'warn':'info'}">${r.source==='sample'?'架空回答のプラン体験です。実在の会社へ指示・送信はしません。':'この端末だけの計画メモです。担当者への通知や、会社内での共有は行いません。'}</div><div class="roadmap p20"><div class="roadstep"><span class="week">STEP 01 / まず確かめる</span><h3>今の負担を1週間記録。</h3><p>作業・確認・修正の時間を合わせて記録。個人情報を使わない例を用意します。</p></div><div class="roadstep"><span class="week">STEP 02 / 小さく試す</span><h3>1つの仕事で、使ってみる。</h3><p>誰が入力し、誰が確認し、どこに正式保存するかを決め、実際の手順で試します。</p></div><div class="roadstep"><span class="week">STEP 03 / 続けるか決める</span><h3>負担と品質を再診断。</h3><p>速さだけでなく、ミス・確認の手間・人と向き合う時間を確認。合わなければ戻します。</p></div></div><section class="section"><div class="sectionhead"><h2>次は、誰に相談する？</h2></div><div class="grid three">${[['self','自分たちでできること','テンプレートの共通化、公開情報での下書きなど。'],['expert','専門家と進めること','個人情報・安全・判断のルールづくり、研修など。'],['system','ツール担当者と確認すること','既存ツールの設定・連携・共有権限。足りない機能だけ導入を検討。']].map(([key,label,desc])=>`<div class="card"><span class="tag outline">${items.filter(x=>x.route===key).length}件</span><h3 class="p12">${label}</h3><p class="small muted p8">${desc}</p><p class="small p12">${items.filter(x=>x.route===key).map(x=>esc(taskName(r.industry,x.id))).join('<br>')||'今回は該当なし'}</p></div>`).join('')}</div></section><section class="section card"><div class="sectionhead"><div><h2>担当と進み具合を決める</h2><p>結果画面で「保留」「今回は不要」にした仕事は、計画から外しています。</p></div><span data-plan-state class="tag ${saved?'ai':'next'}">${saved?(r.source==='sample'?'確認済み・ページ内のみ':'確認済み・端末保存済み'):'確認前のプラン'}</span></div>${items.length?items.map(x=>`<div class="planrow"><div><b>${esc(taskName(r.industry,x.id))}</b><br><span class="small muted">${esc(x.methodName||CATS[x.cat].short)}</span></div><div class="field"><label for="plan-owner-${x.id}">担当する役割</label><select id="plan-owner-${x.id}" data-plan="${x.id}" data-key="owner">${optionList(Object.fromEntries(ROLES.map((role,i)=>[role,INDUSTRIES[r.industry].role[i]])),p.entries[x.id].owner)}</select></div><div class="field"><label for="plan-status-${x.id}">進み具合（自己申告）</label><select id="plan-status-${x.id}" data-plan="${x.id}" data-key="status">${optionList({planned:'未着手',trying:'試している',reviewing:'効果を確認中',done:'継続を決定',stopped:'中止・元に戻す'},p.entries[x.id].status)}</select></div></div>`).join(''):'<div class="emptybox">今回の回答では、新しく始める改善はありません。必要が出たら再診断してください。</div>'}<label class="checkline"><input type="checkbox" id="planConfirm">内容・担当・確認方法を見直しました</label><p class="small muted p8">内容を変えたら、もう一度確認が必要です。保存するだけでAIが学習する仕組みではありません。</p><div class="btnrow p20">${button('確認して端末に保存','save-plan','primary',items.length?'':'disabled')}${button('プランをCSV出力','export-plan','secondary')}${button('再診断・効果測定へ','to-measure','secondary')}</div><div class="plan-status">${saved?'最終確認：'+dateText(p.approvedAt):'未保存の変更は、ページを閉じると失われます。'}</div></section><section class="section"><div class="sectionhead"><h2>必要な支援だけ、相談できます。</h2></div><div class="btnrow">${button('業務改善を相談','consult-kind','light','data-kind="consult"')}${button('詳しい改善提案を受けたい','consult-kind','secondary','data-kind="proposal"')}${button('研修・導入・継続支援を相談','consult-kind','secondary','data-kind="support"')}</div></section>`;}
function companyData(){const companies=teamSource==='sample'?sampleCompanies:store.companies;let c=companies.find(x=>x.code===teamCode)||companies[0];if(!c&&current?.company&&current.source==='device')c={code:current.company,name:'会社コードの診断',industry:current.industry};if(c)teamCode=c.code;const records=(teamSource==='sample'?sampleResponses:store.results).filter(x=>c&&x.company===c.code&&x.industry===c.industry);return {companies,c,records};}
function aggregate(records){return IDS.map(id=>{const entries=records.filter(r=>r.selected.includes(id));const known=entries.filter(r=>r.answers[id].burden!=='unknown');const heavy=known.filter(r=>Number(r.answers[id].burden)>=2);const one=entries.filter(r=>r.answers[id].owner==='one');const ownersKnown=entries.filter(r=>r.answers[id].owner!=='unknown');const hopeKnown=entries.filter(r=>['yes','no'].includes(r.answers[id].hope));const hopeYes=hopeKnown.filter(r=>r.answers[id].hope==='yes');const mg=known.filter(r=>['owner','manager'].includes(r.role)),field=known.filter(r=>['office','staff'].includes(r.role));const mrate=mg.length?Math.round(100*mg.filter(r=>Number(r.answers[id].burden)>=2).length/mg.length):null,frate=field.length?Math.round(100*field.filter(r=>Number(r.answers[id].burden)>=2).length/field.length):null;return {id,n:entries.length,known:known.length,heavy:heavy.length,rate:known.length?Math.round(100*heavy.length/known.length):null,one:one.length,ownersKnown:ownersKnown.length,mgN:mg.length,fieldN:field.length,mrate,frate,gap:mg.length>=MIN_GROUP&&field.length>=MIN_GROUP?frate-mrate:null,hope:hopeYes.length,hopeKnown:hopeKnown.length};}).sort((a,b)=>b.heavy-a.heavy||b.one-a.one||IDS.indexOf(a.id)-IDS.indexOf(b.id));}
function segmented(value,name){return `<div class="segmented" aria-label="データの切り替え"><button class="${value==='sample'?'active':''}" data-source="${name}" data-value="sample">サンプルデータ</button><button class="${value==='device'?'active':''}" data-source="${name}" data-value="device">この端末の回答</button></div>`;}
function teamView(){const {companies,c,records}=companyData(),agg=aggregate(records),canShow=records.length>=MIN_GROUP;const oneCount=canShow?agg.filter(x=>x.one>=Math.ceil(records.length*.4)).length:0;const gaps=agg.filter(x=>x.gap!==null).sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));return title('TEAM INSIGHT','現場の声を重ねて、会社を見渡す。','責任者と現場の見え方の違いを、対話のきっかけに。個人の評価には使いません。',button('会社コード・URLをつくる','create-company','primary'))+`<div class="toolbar">${segmented(teamSource,'team')}${companies.length?`<select class="compact-select" id="companySelect" aria-label="会社の選択">${companies.map(x=>`<option value="${x.code}" ${c?.code===x.code?'selected':''}>${esc(x.name)}${teamSource==='sample'?'（架空）':''}</option>`).join('')}</select>`:''}</div><div class="note ${teamSource==='sample'?'warn':'info'}">${teamSource==='sample'?'この画面の会社・回答・割合は、動きを説明するための架空データです。実績・業界平均ではありません。':'このブラウザで保存した回答だけです。共通URLを別端末で開いても、まだ自動集計されません。企業ごとのログイン・共有データベースは本番で接続します。'}</div>${!c?`<div class="card emptybox p20"><h3>会社コードをつくって、集計の流れを試す。</h3><p>会社名は仮名でOK。同じ端末で役割を変えて回答すると、集計に反映されます。</p>${button('コードをつくる','create-company','primary')}</div>`:`<section class="p20"><div class="sectionhead"><div><h2>${esc(c.name)}${teamSource==='sample'?' <span class="tag sample">架空の会社</span>':''}</h2><p>会社コード ${esc(c.code)} / ${INDUSTRIES[c.industry].name}</p></div>${teamSource==='device'?button('この会社として回答','respond-company','secondary'):''}</div><div class="grid four"><div class="kpi"><span class="statlabel">${teamSource==='sample'?'サンプル':'端末保存済み'}回答数</span><b>${records.length}<span class="small">件</span></b><small>回答件数。実人数とは限りません。</small></div><div class="kpi"><span class="statlabel">負担を感じる仕事</span><b>${canShow?agg.filter(x=>x.heavy>0).length:'—'}<span class="small">業務</span></b><small>「負担が大きい」以上の回答がある業務</small></div><div class="kpi"><span class="statlabel">1人への集中が目立つ仕事</span><b>${canShow?oneCount:'—'}<span class="small">業務</span></b><small>全回答の40％以上が「1人に集中」</small></div><div class="kpi"><span class="statlabel">認識差を比較できる業務</span><b>${gaps.length}<span class="small">業務</span></b><small>各役割群の有効回答が5件以上</small></div></div><div class="split section"><div class="card"><div class="sectionhead"><div><h3>負担が大きい仕事</h3><p>人数でなく、匿名の回答件数で表示</p></div><span class="tag outline">RANKING</span></div>${canShow?agg.filter(x=>x.n).slice(0,5).map((x,i)=>`<div class="rankrow"><span class="rn">0${i+1}</span><div><b>${esc(taskName(c.industry,x.id))}</b><div class="bartrack"><div class="bar" style="width:${x.rate??0}%"></div></div><small>${x.known}件の負担回答中 ${x.rate===null?'不明':x.rate+'％'} / 不明 ${x.n-x.known}件</small></div><span class="count">${x.heavy}<small>件</small></span></div>`).join(''):`<div class="emptybox">5件以上の回答が集まると表示します。少人数から個人が推測されることを避けます。</div>`}</div><div class="card"><div class="sectionhead"><div><h3>経営・管理と現場の認識差</h3><p>「負担が大きい」以上の回答割合</p></div></div>${gaps.length?gaps.slice(0,3).map(x=>`<div class="comparisonrow"><div class="barlabel"><b>${esc(taskName(c.industry,x.id))}</b><span class="tag ${Math.abs(x.gap)>=20?'next':'outline'}">差 ${Math.abs(x.gap)}pt</span></div><div class="bars"><div class="rowbar"><span>経営・管理</span><div class="bartrack"><div class="bar" style="width:${x.mrate}%"></div></div><span>${x.mrate}% / ${x.mgN}件</span></div><div class="rowbar"><span>事務・現場</span><div class="bartrack"><div class="bar orange" style="width:${x.frate}%"></div></div><span>${x.frate}% / ${x.fieldN}件</span></div></div></div>`).join(''):`<div class="emptybox">役割別の比較はまだ表示しません。<br>経営・管理、事務・現場で、それぞれ同じ業務の有効回答が5件以上必要です。</div>`}<p class="subline">認識差は「どちらかが間違い」という意味ではありません。担当業務や回答者構成の違いも含みます。</p></div></div><section class="section card"><div class="sectionhead"><div><h3>改善希望ランキングと、引き継ぎの課題</h3><p>「改善したい」と答えた件数で順位づけ。未回答・判断保留は分母に含めません。</p></div>${button('会社集計をCSV出力','export-team','secondary smallbtn',canShow?'':'disabled')}</div>${canShow?`<div class="tablewrap"><table><thead><tr><th>業務</th><th>改善希望</th><th>負担あり</th><th>1人に集中</th><th>次の対話</th></tr></thead><tbody>${agg.filter(x=>x.n).sort((a,b)=>b.hope-a.hope||b.heavy- function beliefList(r){const a=Array.isArray(r.aiBelief)?r.aiBelief:[];return a.filter(x=>r.selected.includes(x)||['none','unsure'].includes(x));}
function potential(r){
 const process={paper:20,sheet:20,double:40,tool:0};
 const rows=r.selected.map(id=>{const a=r.answers[id]||unknownAnswer();if(!Object.hasOwn(BURDENS,a.burden)||a.burden==='unknown'||!Object.hasOwn(process,a.mode))return {id,score:null};
 const b=Number(a.burden);return {id,burdenPoints:60*b/3,processPoints:b===0?0:process[a.mode],score:60*b/3+(b===0?0:process[a.mode])};});
 const known=rows.filter(x=>x.score!==null);const value=known.length?Math.round(known.reduce((s,x)=>s+x.score,0)/known.length):null;
 return {value,known:known.length,total:rows.length,coverage:rows.length?Math.round(100*known.length/rows.length):0,rows,rule:SCORE_RULE};
}
const classify21=classify;
classify=function(id,a,goal){
 const x=classify21(id,a,goal);const text=TEXT_TASKS.includes(id);const active=!x.deferred&&x.burden!==0&&a.hope!=='no'&&!x.unknown;
 x.hybrid=false;x.aiUse=x.cat==='ai';x.aiNote='';
 if(id==='safety'){x.aiUse=false;if(x.burden===null)x.unknown=true;}
 if(text&&active&&['tool','double'].includes(a.mode)){
  x.cat='ict';x.route=['record','handover'].includes(id)?'expert':'system';x.risk=['record','handover'].includes(id);
  x.priority=x.risk?'next':x.burden>=2?'now':'next';
  x.hybrid=a.assist==='yes';x.aiUse=x.hybrid;
  x.reason=a.mode==='double'?'同じ情報の転記があるため、まず入力先と共有方法をそろえます。':'今のツールを残し、設定・書式・使い方の見直しから始めます。';
  x.reason+=x.hybrid?' 文章づくり・要約にも負担が残るという回答なので、その部分だけAIを補助に使う候補です。':' AIが必要な文章作業かは、この回答だけでは確定しません。';
  x.action=x.hybrid?'正本にする入力先を1つにする → 文章だけAIで下書き → 担当者が事実と表現を確認 → 今のツールへ正式保存する。':'今のツールの入力・共有・書式を点検する。改善できない箇所を具体化してから追加機能を比べる。';
  x.aiNote=x.hybrid?'AIは文章の下書き・要約だけ。計算・権限・正式更新は通常の仕組み、人が最終確認。':a.assist==='no'?'文章の負担はないため、今回はAIを追加しません。':'文章の負担が残るか未確認です。残ると分かった場合だけAIを再検討します。';
  x.benefit=x.hybrid?'転記と書き始めの負担を分けて見直し、確認や休憩のための余白を確保することを目指します。':'新しい道具を増やす前に、転記・探す・確認し直す作業を減らすことを目指します。';
 }
 if(x.cat==='keep'){x.aiUse=false;x.hybrid=false;x.aiNote=x.unknown?'材料が足りないため、AIの必要性は保留です。':'今回はAIを勧めません。今の方法と本人の意向を大切にします。';}
 x.methodName=x.hybrid?'ICT＋一部AI活用':x.cat==='ai'?'AIで下書き＋人の確認':x.cat==='ict'?'今のICT・手順を見直す':x.cat==='human'?'人の対応＋相談手順の整備':x.unknown?'まず今の状況を確認':x.deferred?'現状維持・着手を保留':'今の良い方法を続ける';
 x.firstStep=x.cat==='human'?'責任者と、迷ったときの連絡・相談手順を確認する。':x.cat==='keep'?x.action:x.hybrid?({comm:'案内文',meeting:'会議メモ',record:'架空の記録',recruit:'求人原稿',handover:'引き継ぎメモ'}[id]+'を1件選び、入力・下書き・確認・保存の担当を決める。'):x.cat==='ict'?'今のツール担当者と、1件分の入力から保存までを一緒にたどる。':'個人情報を含まない架空の1件を使い、下書きと人の修正を比べる。';
 x.rank=(x.priority==='now'?100:x.priority==='next'?40:0)+(x.burden??0)*10+(a.owner==='one'?8:0)+Math.min((x.minutes??0)/60,8)+(a.hope==='yes'?5:0)+((goal==='team'&&a.owner==='one')?6:0)+((goal==='business'&&['recruit','billing'].includes(id))?5:0);
 return x;
};
function beliefHTML(r,e){const belief=beliefList(r);if(!belief.length)return '<p class="small muted">AIが必要だと思う仕事：未回答。比較はしていません。</p>';
 if(belief.includes('unsure'))return '<p class="small muted">AIが必要な場所は「まだ分からない」という回答です。診断方法を、判断の材料にしてください。</p>';
 const ai=e.items.filter(x=>x.aiUse&&!x.deferred&&!x.unknown);const wanted=belief.filter(x=>IDS.includes(x));
 const found=ai.filter(x=>!wanted.includes(x.id)),other=e.items.filter(x=>wanted.includes(x.id)&&!x.aiUse);
 return `<div class="belief-summary"><p class="small"><b>あなたの予想：</b>${belief.includes('none')?'今はAIは不要だと思う':wanted.map(id=>esc(taskName(r.industry,id))).join('、')}</p>${found.length?`<p class="small p8"><b>新しい検討候補：</b>${found.map(x=>esc(taskName(r.industry,x.id))).join('、')}。AIは一部の補助として検討できます。</p>`:''}${other.length?`<p class="small p8"><b>先に別の方法を確認：</b>${other.map(x=>esc(taskName(r.industry,x.id))).join('、')}。${other.some(x=>x.cat==='human')?'安全・専門判断は人が担います。':''}理由は業務ごとの詳細をご覧ください。</p>`:''}${!found.length&&!other.length?'<p class="small p8">現時点の見立ては、おおむね重なっています。</p>':''}<p class="tiny muted p12">予想の正誤を採点するものではありません。本人の予想は、スコア・分類・順位の計算に使っていません。固定ルールによる仮説であり、現場確認で見直します。</p></div>`;
}
function scoreHTML(r){const p=potential(r);return `<section class="score-panel" data-result-section="2"><div class="potential-score"><div class="score-dial" style="--score-angle:${(p.value??0)*3.6}deg" aria-label="業務改善ポテンシャル ${p.value===null?'未算出':p.value+'点 / 100点'}"><div><b id="potentialScore">${p.value??'—'}</b><span>/ 100</span></div></div><div><div class="eyebrow">02 / IMPROVEMENT POTENTIAL</div><h2>業務改善ポテンシャル</h2><p>${p.value===null?'分かる項目がそろってから、数値を表示します。':p.value>=70?'まず負担の大きい作業から、改善方法を確かめましょう。':p.value>=40?'見直せる作業があります。小さな一歩から始めましょう。':'今の良い方法を残し、必要なところだけ見直しましょう。'}</p><span class="tag outline p12">回答から計算した参考指標</span> <span class="tiny muted">算出対象 ${p.known} / ${p.total}業務</span></div></div><details class="score-explanation"><summary>スコアの意味と計算方法を見る</summary><p class="small p12">高いほど「現場で改善方法を確かめたい状態」の目安です。会社や職員の成績、AI導入率、時間削減率ではありません。科学的に検証済みの指標ではなく、3〜5社の試行で分かりやすさと判定を検証します。</p><p class="small p8">業務ごとに、負担 0〜3を0〜60点に換算し、進め方を最大40点で加算します。二重入力40点、紙・手作業20点、ツール利用0点。負担なしは合計0点。負担と進め方の両方が分かる業務だけを単純平均し、四捨五入します。</p><p class="small p8">時間・AIへの期待・改善希望・採否はスコアに含めません。保留にしても元の負担は変わらず、未確認を0点にはしません。紙だから悪い、ツールがあるから良いという確定判断でもありません。</p><div class="score-breakdown p12">${p.rows.map(x=>`<span>${esc(taskName(r.industry,x.id))}</span><b>${x.score===null?'未算出':x.score+'点'}</b>`).join('')}</div><p class="tiny muted p12">ルール ${p.rule}。対象業務や回答条件が異なる会社同士の優劣比較には使いません。</p></details></section>`;}
const wizard21=wizardView;

adminView=function(){return admin21()+`<section class="section card"><div class="eyebrow">PILOT / 3〜5社で検証</div><h2>機能を増やす前に、現場で確かめる。</h2><p class="small muted p12">3〜5分で終わったか、TOP3の理由が伝わるか、休憩などの時間を増やせたかを記録。重大な誤提案は平均点で相殺しません。</p><div class="pilot-checks"><p>① 初見で回答し、実際の所要時間を測る</p><p>② 結果を見て「今・何から・何が良くなる・次」を本人の言葉で説明する</p><p>③ 不要なAI提案・誤分類・安全の問題をL CREWと確認する</p><p>④ 1業務だけ試し、休憩・負担・品質の変化を再診断する</p></div><button class="btn secondary p20" data-v22="pilot-sheet">試行記録のひな形をCSV出力</button><p class="tiny muted p12">今回のデモは端末内の体験です。実際に複数社の回答を回収する前に、認証・企業別権限・共有保存・相談通知を接続して検証します。</p></section>`;};
const valid21=validRecord;
validRecord=function(r){return valid21(r)&&(!r.aiBelief||(Array.isArray(r.aiBelief)&&r.aiBelief.length<=8&&r.aiBelief.every(x=>IDS.includes(x)||['none','unsure'].includes(x))))&&r.selected.every(id=>!r.answers[id].assist||Object.hasOwn(ASSIST,r.answers[id].assist));};
// Early change listener keeps conditional helper input synchronized without resetting answers.
document.addEventListener('change',e=>{const t=e.target;
 if(t.name==='ai-belief'&&draft){let list=beliefList(draft);if(t.checked){if(['none','unsure'].includes(t.value))list=[t.value];else list=[...list.filter(x=>!['none','unsure'].includes(x)),t.value];}else list=list.filter(x=>x!==t.value);draft.aiBelief=[...new Set(list)];$$('input[name="ai-belief"]').forEach(n=>n.checked=draft.aiBelief.includes(n.value));}
 if(t.dataset.key==='mode'&&t.dataset.answer&&draft){draft.answers[t.dataset.answer].mode=t.value;draft.answers[t.dataset.answer].assist='unknown';const pos=window.scrollY;render();window.scrollTo(0,pos);$(`#a-${t.dataset.answer}-mode`)?.focus({preventScroll:true});}
 if(t.dataset.field==='industry'&&draft)draft.aiBelief=[];
});
document.addEventListener('click',e=>{if(e.target.closest('[data-v22="pilot-sheet"]'))download('hoiku-pilot-sheet.csv',csvText([['会社の仮名','実施日','回答所要秒','今の状態を説明できた','TOP3の理由が分かった','増やしたい時間','複合判定は妥当か','不要なAI提案・安全問題','次の行動を選べた','実施後の休憩','負担・品質の変化','確認担当','修正と再検証'],['','','','','','','','','','','','','']]));});

document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-route],[data-filter],[data-source]');if(!el)return;if(el.dataset.route){go(el.dataset.route);return}if(el.dataset.filter){filter=el.dataset.filter;const sy=window.scrollY;render();window.scrollTo(0,sy);return}if(el.dataset.source){const v=el.dataset.value==='device'?'device':'sample';if(el.dataset.source==='team'){teamSource=v;teamCode='';}if(el.dataset.source==='admin'){adminSource=v;adminQuery='';adminRole='all';}if(el.dataset.source==='measure')measureSource=v;render();return}const a=el.dataset.action;
 if(a==='start'){closeModal();draft=freshDraft();wstep=1;go('diagnosis');}
 else if(a==='sample'){current=sampleRecord();filter='all';resultDirty=false;go('results');}
 else if(a==='back'){if(wstep===1)go('home');else{wstep-=(wstep===4&&draft?.noConcern?2:1);render();window.scrollTo(0,0)}}
 else if(a==='next')wizardNext();
 else if(a==='privacy')privacyModal();
 else if(a==='close-modal')closeModal();
 else if(a==='detail'){filter='all';render();const detail=$(`[data-work="${el.dataset.id}"]`);if(detail){detail.open=true;detail.scrollIntoView({behavior:'smooth',block:'start'});$('summary',detail).focus({preventScroll:true});}}
 else if(a==='edit-current'&&current){draft=copy(current);draft.id=uid();draft.source='device';draft.company=current.source==='sample'?'':current.company;draft.createdAt=new Date().toISOString();draft.selected=draft.selected.slice(0,5);draft.save=false;draft.decisions={};delete draft.savedAt;wstep=1;go('diagnosis');}
 else if(a==='save-result'&&current){if(current.source==='sample'){toast('架空サンプルは実回答として保存しません。');return}if(upsertResult(current)){resultDirty=false;render();toast('回答と結果をこの端末に保存しました。');}}
 else if(a==='open-result'){const r=store.results.find(x=>x.id===el.dataset.id)||sampleResponses.find(x=>x.id===el.dataset.id);if(r){closeModal();current=copy(r);resultDirty=false;filter='all';go('results')}}
 else if(a==='to-plan')go('plan');else if(a==='to-results')go('results');else if(a==='to-consult'){consultKind='consult';consultPreview=null;consultDraft=null;go('consult');}else if(a==='to-team')go('team');else if(a==='to-measure')go('measure');
 else if(a==='consult-kind'){consultKind=Object.hasOwn(KIND,el.dataset.kind)?el.dataset.kind:'consult';consultDraft=null;consultPreview=null;go('consult');}
 else if(a==='create-company')createCompanyModal();
 else if(a==='copy-company'){const inp=$('#companyURL');if(inp)clipboard(inp.value,inp);}
 else if(a==='start-company'){const c=store.companies.find(x=>x.code===el.dataset.id);if(c){draft=freshDraft(c.industry,'',c.code);wstep=1;closeModal();go('diagnosis');}}
 else if(a==='respond-company'){const {c}=companyData();if(c){draft=freshDraft(c.industry,'',c.code);wstep=1;go('diagnosis');}}
 else if(a==='open-company'){teamSource=el.dataset.from==='device'?'device':'sample';teamCode=el.dataset.id;go('team');}
 else if(a==='save-plan')savePlan();
 else if(a==='recheck')recheck();
 else if(a==='save-before-recheck'){if(current?.source==='device'&&upsertResult(current)){const r=copy(current);closeModal();startRecheck(r)}}
 else if(a==='fill-consult'){consultDraft={companyName:'テスト保育園',name:'担当者A',email:'demo@example.invalid',note:'引き継ぎや記録の負担を見直したいです。',kind:$('#contact-kind')?.value||consultKind};render();}
 else if(a==='edit-consult'){consultDraft=copy(consultPreview);consultPreview=null;render();}
 else if(a==='save-consult')saveConsult();
 else if(a==='view-lead')openLead(el.dataset.id);
 else if(a==='filter-admin'){adminQuery=$('#adminSearch').value.trim().slice(0,60);adminRole=$('#adminRole').value;render();}
 else if(a==='export-result'&&current)download('hoiku-result-'+current.source+'.csv',csvText(resultRows(current)));
 else if(a==='export-team')exportTeam();
 else if(a==='export-answers')exportAnswers();
 else if(a==='export-leads'){const ls=adminSource==='sample'?sampleLeads:store.leads;download('hoiku-consultations-'+adminSource+'.csv',csvText([['区分','保存日時','会社の仮名','担当者の仮名','デモ連絡先','相談希望','メモ','状態','保存同意','実送信'],...ls.map(l=>[adminSource==='sample'?'架空サンプル':'この端末の控え',l.createdAt,l.companyName,l.name,l.email,KIND[l.kind],l.note,leadStatusSample[l.id]||l.status,l.consent?'あり':'なし','未送信'])]));}
 else if(a==='export-plan'&&current){const p=activePlan();const items=evaluate(current).actionable;download('hoiku-plan-'+current.source+'.csv',csvText([['区分','診断ID','業務','取り組むこと','担当する役割','状態（自己申告）','最終確認','保存状態'],...items.map(x=>[current.source,current.id,taskName(current.industry,x.id),x.action,roleName(current.industry,p.entries[x.id].owner),p.entries[x.id].status,p.approvedAt||'未確認',p.dirty?'未保存':current.source==='sample'?'ページ内のみ':'端末保存'])]));}
 else if(a==='export-reflection'){download('hoiku-reflection.csv',csvText([['項目','振り返り（自己申告）','記録日時','診断ID'],...['burden','people','quality','business','breaks'].map(k=>[{burden:'負担・残業',people:'人と向き合う時間',quality:'ミス・修正・品質',business:'経営・売上づくりの時間',breaks:'休憩時間'}[k],$(`#m-${k}`).selectedOptions[0].textContent,new Date().toISOString(),current?.id||'紐付けなし'])]));}
 else if(a==='reset-data'){openModal('この端末のデモデータを消去しますか？',`<p>このアプリの診断 ${store.results.length}件、会社コード ${store.companies.length}件、相談控え ${store.leads.length}件と計画を削除します。必要なものは先にCSVで出力してください。</p><div class="note warn p12">削除後はこの画面から復元できません。他のアプリのデータには触れません。</div><div class="btnrow p20">${button('やめる','close-modal','secondary')}${button('このデモのデータを削除する','confirm-reset','danger')}</div>`);}
 else if(a==='confirm-reset'){try{localStorage.removeItem(KEY);if(localStorage.getItem(KEY)!==null)throw Error('失敗');store={version:2,results:[],companies:[],leads:[],plans:[]};current=null;draft=null;planState={};consultPreview=null;consultDraft=null;storeError='';storageCorrupt=false;initialRaw='';closeModal();render();toast('このデモの端末データを削除しました。');}catch(err){toast('削除できませんでした。ブラウザの保存設定をご確認ください。',true);}}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.field&&draft){if(t.dataset.field==='industry'&&Object.hasOwn(INDUSTRIES,t.value)){draft.industry=t.value;draft.role='';draft.selected=[];draft.answers={};draft.noConcern=false;render();}else if(t.dataset.field==='role'&&ROLES.includes(t.value))draft.role=t.value;}
 if(t.name==='tasks'&&draft){if(t.checked&&draft.selected.length>=5){t.checked=false;toast('最大5つまで選べます。まず気になる仕事に絞りましょう。',true);return}draft.selected=$$('input[name="tasks"]:checked').map(x=>x.value);draft.selected.forEach(id=>{if(!draft.answers[id])draft.answers[id]=unknownAnswer()});if(draft.selected.length){draft.noConcern=false;$('#noConcern').checked=false;}$('#selectionCount').textContent=draft.selected.length+' / 5 業務を選択';}
 if(t.id==='noConcern'&&draft){draft.noConcern=t.checked;if(t.checked){draft.selected=[];draft.answers={};$$('input[name="tasks"]').forEach(x=>x.checked=false);$('#selectionCount').textContent='0 / 5 業務を選択';}}
 if(t.dataset.answer&&draft&&IDS.includes(t.dataset.answer)){draft.answers[t.dataset.answer][t.dataset.key]=t.value;}
 if(t.name==='goal'&&draft&&Object.hasOwn(GOALS,t.value))draft.goal=t.value;
 if(t.id==='saveConsent'&&draft)draft.save=t.checked;
 if(t.dataset.decision&&current){current.decisions=current.decisions||{};current.decisions[t.dataset.decision]=t.value;resultDirty=true;if(planState[current.id]){planState[current.id].dirty=true;planState[current.id].approvedAt=null;}const open=$$('details.workcard[open]').map(x=>x.dataset.work);const sy=window.scrollY;render();open.forEach(id=>{const node=$(`[data-work="${id}"]`);if(node)node.open=true});window.scrollTo(0,sy);toast('採否を変更しました。必要に応じて結果・計画を保存してください。');}
 if(t.dataset.plan&&current){const p=activePlan();p.entries[t.dataset.plan][t.dataset.key]=t.value;p.dirty=true;p.approvedAt=null;$('#planConfirm').checked=false;const badge=$('[data-plan-state]');if(badge){badge.textContent='変更あり・再確認が必要';badge.className='tag next';}$('.plan-status').textContent='変更した内容は未保存です。再確認して保存してください。';}
 if(t.id==='companySelect'){teamCode=t.value;render();}
 if(t.dataset.leadStatus){const id=t.dataset.leadStatus;if(adminSource==='sample'){leadStatusSample[id]=t.value;render();toast('サンプルの対応状態を変更しました。');}else{const next=copy(store),l=next.leads.find(x=>x.id===id);if(l){l.status=t.value;if(persist(next)){render();toast('対応状態を端末に保存しました。');}else render();}}}
});
document.addEventListener('input',e=>{if(e.target.id==='ratio'&&current){ratio=Math.max(0,Math.min(40,Number(e.target.value)||0));$('#ratioLabel').textContent=ratio;const summary=evaluate(current);$('#gainValue').innerHTML=(summary.eligibleKnownCount?Math.round(summary.eligibleMinutes*ratio/100):'未計算')+'<span>分 / 週・あなた1人</span>';}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='companyForm'){const f=e.target;if(!f.reportValidity())return;const data=new FormData(f),name=String(data.get('name')).trim(),industry=String(data.get('industry'));if(!name||name.length>60||!Object.hasOwn(INDUSTRIES,industry)){toast('仮名と業種を確認してください。',true);return}const code=uid('C').toUpperCase();const c={code,name,industry,createdAt:new Date().toISOString()};const next=copy(store);if(next.companies.some(x=>x.code===code)){toast('コードを再発行してください。',true);return}next.companies.push(c);if(persist(next)){teamSource='device';teamCode=code;render();showCompanyLink(c);}}
 if(e.target.id==='consultForm'){const f=e.target;if(!f.reportValidity())return;const d=new FormData(f);const lead={id:uid('lead'),companyName:String(d.get('companyName')).trim(),name:String(d.get('name')).trim(),email:String(d.get('email')).trim(),note:String(d.get('note')||'').trim(),kind:String(d.get('kind')),consent:$('#contact-consent').checked,resultId:current?.id||null};if(!lead.companyName||!lead.name||!lead.email||!lead.consent||!Object.hasOwn(KIND,lead.kind)||lead.companyName.length>80||lead.name.length>80||lead.note.length>600||lead.email.length>160){toast('必須項目と同意を確認してください。',true);return}consultDraft=copy(lead);consultPreview=Object.freeze(copy(lead));render();window.scrollTo(0,0);}});
document.addEventListener('keydown',e=>{if(!$('.modal'))return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const nodes=$$('.modal button,.modal input,.modal select,.modal textarea,.modal a[href]').filter(x=>!x.disabled),first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
$('#modalroot').addEventListener('click',e=>{if(e.target.classList.contains('modalback'))closeModal()});

window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);$('#view').focus({preventScroll:true});});

window.HoikuDemoTest=Object.freeze({evaluate,classify,aggregate,compareRecords,csvText,validRecord,sampleRecord,unknownAnswer,industries:INDUSTRIES,samples:()=>copy(sampleResponses),potential,roleMetrics,beliefList,version:VERSION});
render();if(joinedCode){draft=freshDraft();wstep=1;if(!location.hash)go('diagnosis');}if(urlCode&&!joinedCode)toast('会社コードの形式を確認できないため、個人診断として開いています。',true);
})();

const clone=o=>JSON.parse(JSON.stringify(o));
const defaults=()=>({version:1,view:'home',store:clone(PRESETS.curry),selected:'c1',improved:false,price:1180,cost:355,pack:0,fee:3,quantity:200,shift:40,oldMargin:500,fixed:20000,ads:10000,labor:5000,customName:'',date:'',checks:[false,false,false],draftVersion:1,search:'',outputTab:'release',publishedVersion:0,recipeServings:10,creativeStyle:'earth',creativeHeadline:'',creativeCta:'発売準備中'});
let state=defaults(),storageOK=true,hasSaved=false;
try{const saved=localStorage.getItem('menu-lab-demo-v1');if(saved){const parsed=JSON.parse(saved);if(parsed.version===1&&PRESETS[parsed.store?.kind]&&DATA[parsed.store.kind].some(p=>p.id===parsed.selected)){state={...defaults(),...parsed};hasSaved=true}}}catch{storageOK=false}
function save(){try{localStorage.setItem('menu-lab-demo-v1',JSON.stringify(state));storageOK=true}catch{storageOK=false}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),3400)}
function product(){return DATA[state.store.kind].find(p=>p.id===state.selected)||DATA[state.store.kind][0]}

function overseas(id=product().pattern){return OVERSEAS[id]||OVERSEAS.citrus}
function recipeArch(){const k=product().pattern;return RECIPE_ARCH[k]||RECIPE_ARCH[k==='dip'||k==='local'?'citrus':k==='mini'?'flight':'citrus']}
function fmtQty(v,u){const x=Math.abs(v)>=10?Math.round(v):Math.round(v*10)/10;return num(x)+(u||'')}
function scaledRecipe(){const r=recipeArch(),ratio=state.recipeServings/10;return r.items.map(x=>({name:x[0],qty:x[1]*ratio,unit:x[2],note:x[3]}))}

function productName(){return state.customName.trim()||product().name}
function time(){return state.improved?product().simpleTime:product().time}
function touch(){state.draftVersion++;state.checks=[false,false,false];save()}
function calc(opts={}){const x={...state,...opts};const margin=x.price-x.cost-x.pack-x.price*x.fee/100;const displaced=x.oldMargin*x.shift/100;const contribution=margin-displaced;const fixed=x.fixed+x.ads+x.labor;return{margin,contribution,fixed,net:contribution*x.quantity-fixed,breakeven:contribution>0?Math.ceil(fixed/contribution):null,revenue:x.price*x.quantity,shiftLoss:displaced*x.quantity,variable:(x.cost+x.pack+x.price*x.fee/100)*x.quantity}}
function currentChecks(){const c=calc();return{time:time()<=state.store.limit,profit:c.net>0,equipment:!state.store.noEquip||!product().equip}}
function selectedPill(){return `<span class="pill gray">仮想商品・試作前</span>`}
function go(view){state.view=NAV.some(n=>n[0]===view)?view:'home';save();render();window.scrollTo({top:0,behavior:'instant'});$('#sidebar').classList.remove('open')}
function render(){const active=NAV.find(n=>n[0]===state.view)||NAV[0];$('#crumb').textContent=active[1];$('#projectBadge').textContent=state.store.shop;$('#nav').innerHTML=NAV.map((n,i)=>`<button class="${state.view===n[0]?'active':''}" ${state.view===n[0]?'aria-current="page"':''} onclick="go('${n[0]}')"><span class="nav-num">0${i+1}</span><span>${n[1]}</span>${state.view===n[0]?'<span class="arrow">›</span>':''}</button>`).join('');$('#view').innerHTML=({home,store:storeView,world:worldView,ideas:ideasView,recipe:recipeView,finance:financeView,launch:launchView}[state.view]||home)();bind();}
function header(title,subtitle,action=''){return `<div class="page-head"><div><div class="eyebrow orange" style="margin-bottom:9px">${state.view==='home'?'FROM IDEA TO IMPACT':'PRODUCT DEVELOPMENT'}</div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`}
function home(){const c=calc();return header('次の一皿を、次の利益へ。','海外の意見、試作レシピ、採算、販促画像までをつなぐ商品開発ワークスペース。',`<button class="btn secondary small" onclick="share()">URLをコピー ↗</button>`)+`<section class="hero"><div><div class="eyebrow">YOUR NEXT SIGNATURE DISH</div><h2>売れる理由を、つくる。<br>売る準備も、つくる。</h2><p>海外の声、レシピ、現場、採算、販促画像。<br>ばらばらだった商品開発を、ひとつの流れに。</p><div class="btn-group"><button class="btn primary" onclick="go('store')">店舗条件からはじめる <span>↗</span></button><button class="btn secondary" onclick="go('ideas')">サンプルを体験する →</button></div></div><div class="hero-visual" aria-hidden="true"><div class="plate"><div class="plate-inner"><div class="rice"></div><div class="curry"></div><div class="chicken c1"></div><div class="chicken c2"></div><div class="chicken c3"></div><div class="leaf"></div><div class="leaf l2"></div><div class="citrus"></div></div></div><div class="floating one"><div class="label">世界の発想 × お店の強み</div><div class="value">新しい一皿の可能性</div></div><div class="floating two"><div class="label">現在の条件による増分利益</div><div class="value orange">${money(c.net)}</div><div class="label">月次の仮定試算・保証なし</div></div></div></section><div class="stats"><div class="stat"><div class="stat-label">収録する参考パターン<span>↗</span></div><div class="stat-value mono">06<span>パターン</span></div><div class="stat-note">海外を想定した仮想事例</div></div><div class="stat"><div class="stat-label">お店に合わせた商品案<span>↗</span></div><div class="stat-value mono">03<span>案を比較</span></div><div class="stat-note">３業態・計９商品のサンプル</div></div><div class="stat"><div class="stat-label">見落とさない判断軸<span>↗</span></div><div class="stat-value mono">07<span>つの視点</span></div><div class="stat-note">現場・会計・顧客心理など</div></div><div class="stat"><div class="stat-label">販売に向けたアウトプット<span>↗</span></div><div class="stat-value mono">08<span>種類</span></div><div class="stat-note">文章6種＋SNS・POP画像</div></div></div><div class="section-title"><h2>ひらめきから、販売準備まで。</h2><span class="small muted">触りながら、全体像がわかる</span></div><div class="steps">${[['01','お店を理解する','目的・食材・人員を整理。','store'],['02','海外の声を翻訳','採用・修正・見送りを可視化。','world'],['03','試作レシピにする','分量と工程を店舗条件へ。','recipe'],['04','利益を確かめる','価格と数量を動かして比較。','finance'],['05','売る準備をそろえる','文章と画像を同じ台帳から。','launch']].map(x=>`<div class="step"><div class="number">STEP ${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><button class="text-btn" onclick="go('${x[3]}')">開く →</button></div>`).join('')}</div><div class="notice"><span class="pill gray" style="margin-right:8px">体験版について</span>海外の模擬意見、商品案、レシピ、文章、画像は収録サンプルとルールで変化し、採算は入力した数字で計算します。実際のAIや海外検索は動きません。入力はこのブラウザー内に保存され、他の人には共有されません。</div><div class="grid-equal"><div class="card"><div class="quick-tip"><div class="tip-icon">↗</div><div><h3 style="font-size:15px">見どころは「追いルウ改善」</h3><p>魅力的でも、厨房が回らなければ採用しない。工程を見直し、提供時間と採算が変わるところまで体験できます。</p><button class="text-btn" onclick="go('ideas')">商品レビューを見る →</button></div></div></div><div class="card"><div class="quick-tip"><div class="tip-icon">≋</div><div><h3 style="font-size:15px">同じ商品情報から、販促をそろえる</h3><p>名称・価格・発売予定日を一元管理。情報を変更したら、すべての販促文に同じ内容を反映します。</p><button class="text-btn" onclick="go('launch')">販売準備スタジオへ →</button></div></div></div></div>`}
function preset(k){modal('サンプル店舗を切り替えますか？','店舗条件・選択商品・採算・確認状況を、この業態の仮想データに戻します。現在の編集内容は置き換わります。',`<button class="btn primary" onclick="applyPreset('${k}');closeModal()">切り替える</button>`)}
function applyPreset(k){state={...defaults(),store:clone(PRESETS[k])};state.view='store';const p=DATA[k][0];state.selected=p.id;state.price=p.price;state.cost=p.cost;state.pack=p.pack;state.quantity=PRESETS[k].monthly;state.oldMargin=PRESETS[k].oldMargin;save();render();toast('仮想店舗のサンプルを読み込みました')}
function storeView(){return header('お店の現実を、開発の条件に。','３つの業態サンプルから開始。店舗名や条件も編集できます。')+`<div class="preset-row">${[['curry','カレー・食堂'],['cafe','カフェ・喫茶'],['izakaya','居酒屋・小皿']].map(x=>`<button class="chip ${state.store.kind===x[0]?'active':''}" onclick="preset('${x[0]}')">${x[1]}</button>`).join('')}</div><form id="storeForm"><div class="grid-two"><div class="card"><div class="eyebrow orange">01 / STORE PROFILE</div><h2 style="margin:8px 0 22px">どんなお店ですか？</h2><div class="two-fields"><label class="field">店舗名<input name="shop" maxlength="60" required value="${esc(state.store.shop)}"></label><label class="field">地域<input name="area" maxlength="40" required value="${esc(state.store.area)}"></label></div><label class="field">開発の一番の目的<select name="goal">${Object.entries(GOALS).map(([k,v])=>`<option value="${k}" ${state.store.goal===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">届けたいお客様<input name="audience" maxlength="120" required value="${esc(state.store.audience)}"></label><label class="field">活かしたい食材<textarea name="ingredients" rows="2" maxlength="300">${esc(state.store.ingredients)}</textarea><div class="help">企画書に反映します。自由記入から新しいレシピを自動生成する機能はありません。</div></label><label class="field">お客様の声・気になっていること<textarea name="voice" rows="3" maxlength="500">${esc(state.store.voice)}</textarea><div class="help">サンプルの声です。実在のお客様の個人情報・機密情報は入力しないでください。</div></label></div><div><div class="card"><div class="eyebrow orange">02 / REAL-WORLD LIMITS</div><h2 style="margin:8px 0 22px">守る条件を、先に決める。</h2><label class="field">１食あたりの仕上げ作業上限（秒）<input type="number" min="30" max="1800" step="10" name="limit" required value="${state.store.limit}"><div class="help">全調理時間ではなく、注文後に追加で使える作業時間の目安。</div></label><label class="check"><input type="checkbox" name="noEquip" ${state.store.noEquip?'checked':''}>新しい設備を増やさない</label><div class="notice">このデモの商品は既存設備での試作を想定したサンプルです。実際の設備適合は人が確認します。</div><div class="info-row"><span>店舗データ</span><span>仮想・編集可能</span></div><div class="info-row"><span>情報の扱い</span><span>このブラウザー内のみ</span></div><div class="info-row"><span>目的による変化</span><span>提案順とレビューに反映</span></div><button type="submit" class="btn primary wide" style="margin-top:22px">条件を保存して、商品案へ →</button></div><div class="notice warning">「材料を全部使え」とは決めません。提案と実際の在庫・原価を照合し、仕入れや工程が成立するか確認してください。</div><button type="button" class="text-btn" onclick="reset()">保存データを消して、最初から</button></div></div></form>`}
function insightTrace(){const g=overseas(),p=product();return `<section class="card"><div class="section-title" style="margin-top:0"><div><div class="eyebrow orange">GLOBAL INSIGHT TRACE</div><h2 style="margin-top:7px">海外の意見を、どう商品へ取り入れたか。</h2></div><span class="pill gray">模擬意見 ${g.voices.length}件</span></div><div class="insight-flow"><div class="flow-card"><div class="flow-no">01 / LISTEN</div><h3>海外の模擬意見</h3><p>${g.market}<br>${g.question}</p></div><div class="flow-card"><div class="flow-no">02 / EXTRACT</div><h3>共通する本音</h3><p>${g.core}</p></div><div class="flow-card"><div class="flow-no">03 / LOCALIZE</div><h3>${esc(state.store.shop)}向けに変更</h3><p>${g.adapt}</p></div><div class="flow-card"><div class="flow-no">04 / BUILD</div><h3>${esc(productName())}</h3><p>${p.concept}</p></div></div><div class="voice-grid">${g.voices.map(v=>`<article class="voice-card"><div class="expert-head"><span class="pill gray">${v[0]}</span><span class="pill ${v[2]==='採用'?'':'orange'}">${v[2]}</span></div><blockquote>「${v[1]}」</blockquote><div class="voice-meta"><strong>店舗への反映</strong><br>${v[3]}</div></article>`).join('')}</div><div class="decision-grid"><div class="decision-card adopt"><h4>取り入れた構造</h4><p>${g.core}</p></div><div class="decision-card change"><h4>日本・店舗向けに変えたこと</h4><p>${g.adapt}</p></div><div class="decision-card"><h4>そのまま持ち込まなかったこと</h4><p>${g.reject}</p></div></div><div class="notice warning">この海外意見はAPIなしデモ用に作成した模擬コメントです。実際の海外レビューや市場調査結果ではありません。本番版ではURL、地域、公開日、翻訳、根拠の強さを保存し、元情報へ戻れる設計を想定しています。</div></section>`}
function worldView(){return header('海外の声を、丸ごと真似しない。','意見の背景を読み、採用・修正・見送りの理由まで残す。',`<button class="btn primary small" onclick="go('recipe')">試作レシピへ →</button>`)+`<div class="notice warning" style="margin-top:0">すべて海外市場を想定した模擬コメントです。実在店のレビュー・ヒット実績・市場調査結果ではありません。</div>${insightTrace()}<div class="section-title"><h2>別の海外パターンも見る</h2><span class="small muted">下のカードから自店への応用例を確認</span></div><label class="field">収録サンプルを絞り込む<input id="patternSearch" placeholder="例：ソース、持ち帰り、米国" value="${esc(state.search)}"></label><div class="cards" id="patterns">${patternCards()}</div>`}
function patternCards(){const q=state.search.toLowerCase();const list=PATTERNS.filter(p=>(p.country+p.title+p.desc+p.transfer).toLowerCase().includes(q));return list.length?list.map(p=>`<article class="card"><div class="region-art ${p.style}"><span>${p.mark}</span><div class="orbit"></div><div class="code">${p.code}</div></div><div class="pill gray">${p.country}・仮想事例</div><h3 style="margin:12px 0 8px">${p.title}</h3><p>${p.desc}</p><div class="eyebrow green" style="margin-top:20px">LOCAL TRANSLATION</div><p style="color:#44513d">${p.transfer}</p><div class="change-box small"><span class="green">確かめること</span><br>${p.check}</div><button class="text-btn" style="margin-top:12px" onclick="patternDetail('${p.id}')">自店への落とし込みを見る →</button></article>`).join(''):'<div class="empty" style="grid-column:1/-1">該当するサンプルはありません。キーワードを変えてください。</div>'}
function patternDetail(id){const p=PATTERNS.find(x=>x.id===id),g=overseas(id),mapped={dip:'citrus',local:'citrus',mini:'flight'},target=DATA[state.store.kind].find(x=>x.pattern===(mapped[id]||id))||DATA[state.store.kind][0];const extra=`<div class="voice-grid">${g.voices.map(v=>`<div class="voice-card"><span class="pill gray">${v[0]}・${v[2]}</span><blockquote>「${v[1]}」</blockquote><div class="voice-meta">${v[3]}</div></div>`).join('')}</div><div class="decision-grid"><div class="decision-card adopt"><h4>採用</h4><p>${g.core}</p></div><div class="decision-card change"><h4>変更</h4><p>${g.adapt}</p></div><div class="decision-card"><h4>見送り</h4><p>${g.reject}</p></div></div>`;modal(p.title,`${g.market}から想定した模擬意見を、${esc(state.store.shop)}の顧客・設備・目的へ変換します。<br><br>商品への応用例：${esc(target.name)}<br>${esc(target.concept)}`,`<button class="btn primary" onclick="choose('${target.id}');closeModal();go('world')">この方向を商品に反映 →</button>`,extra)}
function sortedProducts(){return [...DATA[state.store.kind]].sort((a,b)=>Number(b.fit.includes(state.store.goal))-Number(a.fit.includes(state.store.goal)))}
function choose(id){const p=DATA[state.store.kind].find(x=>x.id===id);if(!p)return;state.selected=id;state.improved=false;state.price=p.price;state.cost=p.cost;state.pack=p.pack;state.customName='';state.creativeHeadline='';state.recipeServings=10;touch();render();toast('商品を選択しました。レシピ・採算・販促も切り替わります')}
function ideasView(){const p=product(),ch=currentChecks();return header('いいアイデアを、使える商品に。',`${esc(state.store.shop)} / 目的：${GOALS[state.store.goal]}`,`<button class="btn secondary small" onclick="go('store')">条件を変える</button>`)+`<div class="notice" style="margin-top:0">店舗の目的で提案順が変わります。商品案は収録テンプレートです。数値は仮置き、専門レビューはルールに基づくもので、実際の専門家の監修ではありません。</div><div class="cards">${sortedProducts().map((x,i)=>`<article class="card product-card ${x.id===state.selected?'selected':''}"><div class="product-art ${['','b','c'][DATA[state.store.kind].indexOf(x)]}"><span class="art-label">CONCEPT ${String(DATA[state.store.kind].indexOf(x)+1).padStart(2,'0')} / イメージ図</span><div class="mini-plate" aria-hidden="true"></div></div><span class="pill ${x.id===state.selected?'orange':'gray'}">${x.id===state.selected?'選択中':x.fit.includes(state.store.goal)?'目的に合うサンプル':x.tag}</span><h3>${x.name}</h3><p>${x.concept}</p><div class="product-meta"><span>売価 <strong>${money(x.id===state.selected?state.price:x.price)}</strong></span><span>仕上げ <strong>${x.id===state.selected?time():x.time}</strong> 秒</span></div><div class="small muted">税抜の仮置き価格</div><button class="btn ${x.id===state.selected?'secondary':'primary'} wide" onclick="choose('${x.id}')">${x.id===state.selected?'この案を初期状態に戻す':'この商品を検討する →'}</button></article>`).join('')}</div><div class="result-banner"><div><div class="eyebrow">CURRENT DEVELOPMENT</div><h3>${esc(productName())}</h3><p>${ch.time?'作業時間は設定上限内。次は味と実測値を確認。':`仕上げ ${time()}秒は、店舗の上限 ${state.store.limit}秒を超えています。`} ${ch.profit?'採算は仮定上プラス。':'現在の条件では増分利益がマイナスです。'}</p></div><div class="btn-group"><button class="btn ghost" onclick="go('world')">海外意見の反映</button><button class="btn ghost" onclick="go('recipe')">試作レシピへ →</button></div></div><div class="grid-two"><div class="card"><div class="section-title" style="margin-top:0"><h2>７つの視点で、味見する。</h2><span class="pill gray">ルール判定</span></div>${experts()}</div><div><div class="card"><div class="eyebrow orange">RUU IMPROVEMENT</div><h2 style="margin:8px 0 12px">追いルウで、現場に近づける。</h2><p>「おいしそう」で終わらせず、注文後の手数を減らす。保存された改善サンプルを適用できます。</p><div class="change-box"><div class="small muted">仕上げ作業時間の変化（仮定）</div><div style="font-size:23px;margin:8px 0"><span class="mono">${p.time}秒</span><span class="change-arrow">→</span><span class="mono green">${p.simpleTime}秒</span></div><div class="small">${p.simpleStep}</div></div><div class="info-row"><span>標準の食材原価（仮置き）</span><span>${money(p.cost)} → ${money(p.simpleCost)}</span></div><div class="notice warning">時間・原価の削減量はデモ用の仮定です。味、安全、実際の作業時間を検証するまで「改善済み」とは確定しません。</div><button class="btn primary wide" onclick="improve()" ${state.improved?'disabled':''}>${state.improved?'改善サンプルを適用中':'工程を減らす改善を適用 →'}</button></div><div class="card" style="margin-top:18px"><h3 style="font-size:15px">採用しない判断も、価値になる。</h3><p>${p.proof}</p><div class="info-row"><span>作業上限</span><span class="${ch.time?'green':'red'}">${ch.time?'条件内':'超過・要修正'}</span></div><div class="info-row"><span>追加設備</span><span class="green">サンプル上は不要</span></div><div class="info-row"><span>味・安全・仕入れ</span><span class="orange">人による確認待ち</span></div></div></div></div>`}
function improve(){const p=product();state.improved=true;state.cost=p.simpleCost;touch();render();toast('改善サンプルを適用しました。原価も仮置き値に更新しました')}
function experts(){const p=product(),ch=currentChecks(),c=calc();const rows=[['心','行動心理・顧客理解','購買仮説',`「${p.angle}」を注文理由の仮説にする。対象は${state.store.audience}。心理効果を断定せず、説明あり／なしで注文の違いを確かめる。`],['現','飲食の現場',ch.time?'条件内':'要修正',`仕上げ${time()}秒、設定上限${state.store.limit}秒。${state.improved?p.simpleStep:p.baseStep} 実測前のため厨房で検証する。`],['会','管理会計',ch.profit?'仮定上プラス':'要再設計',`１食の限界利益${money(c.margin)}。既存商品から${state.shift}%が移ると仮定した増分利益は月${money(c.net)}。売上ではなく追加費用と置き換わりを含めて判断する。`],['販','マーケティング','検証する',`目的は「${GOALS[state.store.goal]}」。${p.proof} 広告を増やす前に小規模テストの記録を残す。`],['経','経営','条件付き',`活かしたい食材「${state.store.ingredients}」と商品原材料「${p.ingredients}」を照合する。${state.store.noEquip?'設備を増やさない条件を優先。':'設備投資をする場合は別途費用を見積もる。'} 店舗全体の利益と負荷で採否を決める。`],['広','広報','根拠確認',`切り口は「${p.angle}」。開発背景や地域性は事実確認後に記載。「日本初」「大ヒット」は未確認のため使わない。`],['安','品質・安全','人の確認待ち',p.safety+' 本デモは衛生・アレルギー・法令適合を判定しない。']];return rows.map((r,i)=>`<div class="expert-card"><div class="expert-icon">${r[0]}</div><div><div class="expert-head"><h3>${r[1]}</h3><span class="pill ${['要修正','要再設計','人の確認待ち'].includes(r[2])?'orange':'gray'}">${r[2]}</span></div><p>${esc(r[3])}</p></div></div>`).join('')}

function recipeText(){const r=recipeArch(),g=overseas(),items=scaledRecipe();return `【試作レシピ v0.1／仮想商品・要検証】\n店舗：${state.store.shop}\n商品：${productName()}\n試作数：${state.recipeServings}食\n準備目安：${r.prep}\n\n■ 海外インサイトから取り入れたこと\n${g.core}\n\n■ 店舗向けに変更したこと\n${g.adapt}\n\n■ 材料\n${items.map((x,i)=>`${i+1}. ${x.name}　${fmtQty(x.qty,x.unit)}　${x.note}`).join('\n')}\n\n■ 試作工程\n${r.steps.map((x,i)=>`${i+1}. ${x[0]}\n${x[1]}`).join('\n\n')}\n\n■ 合格条件\n${r.quality.map((x,i)=>`${i+1}. ${x}`).join('\n')}\n\n■ 安全確認\n${r.safety}\n${product().safety}\n\n実重量、歩留まり、味見結果、作業時間、廃棄、原価、確認者を記録する。\nこのレシピはAPIなしデモ用の試作案で、販売用の確定レシピではありません。`}
function recipeView(){const r=recipeArch(),g=overseas(),items=scaledRecipe();return header('発想を、試作できるレシピへ。','材料、分量、工程、味見基準まで見える仮想商品の試作シート。',`<div class="btn-group"><button class="btn secondary small" onclick="downloadRecipe()">レシピを保存 ↓</button><button class="btn primary small" onclick="go('finance')">採算へ →</button></div>`)+`<div class="notice warning" style="margin-top:0">分量と工程はAPIなしデモ用の仮想レシピです。実際の設備、規格書、加熱・冷却・保存、アレルギーを責任者が確認してから試作してください。</div><div class="recipe-top"><div class="card"><div class="eyebrow orange">PROTOTYPE RECIPE / V0.1</div><h2 style="margin:8px 0 10px">${esc(productName())}</h2><p>${product().concept}</p><div class="recipe-kpis"><div class="recipe-kpi"><span>試作数</span><strong>${state.recipeServings}食</strong></div><div class="recipe-kpi"><span>準備目安</span><strong>${r.prep}</strong></div><div class="recipe-kpi"><span>仕上げ／食</span><strong>${time()}秒</strong></div></div></div><div class="card"><label class="field">試作する食数<select id="recipeServings">${[1,5,10,20,30,50].map(n=>`<option value="${n}" ${state.recipeServings===n?'selected':''}>${n}食</option>`).join('')}</select><div class="help">材料だけを10食基準から比例計算します。増量時は器具容量や歩留まりを再検証してください。</div></label><div class="info-row"><span>食材原価</span><span>${money(state.cost)}／食・仮置き</span></div><div class="info-row"><span>レシピ状態</span><span class="orange">未試作・未承認</span></div><button class="btn secondary wide" style="margin-top:18px" onclick="window.print()">レシピ画面を印刷</button></div></div><div class="section-title"><h2>海外の声を、レシピの判断へ。</h2><span class="pill gray">取り入れ方を明示</span></div><div class="recipe-bridge"><div class="insight-summary"><span class="pill gray">${g.market}・模擬意見</span><h3 style="margin:12px 0 8px">${g.core}</h3><p>${g.voices.map(v=>`「${v[1]}」`).join('<br>')}</p></div><div class="arrow-mid">→</div><div class="card"><div class="eyebrow orange">LOCAL RECIPE DECISION</div><h3 style="margin:9px 0">店舗向けに変えた内容</h3><p>${g.adapt}</p><div class="info-row"><span>取り入れない内容</span><span>誇張・過剰な選択肢</span></div><button class="text-btn" onclick="go('world')">意見ごとの採否を見る →</button></div></div><div class="grid-two"><div class="card"><div class="section-title" style="margin-top:0"><h2>材料表</h2><span class="pill gray">${state.recipeServings}食分</span></div><div class="table-wrap"><table class="recipe-table"><thead><tr><th>材料</th><th>分量</th><th>役割</th></tr></thead><tbody>${items.map(x=>`<tr><td>${x.name}</td><td class="mono">${fmtQty(x.qty,x.unit)}</td><td>${x.note}</td></tr>`).join('')}</tbody></table></div><div class="notice">数値は比例計算です。実材料名、配合、歩留まりは人が試作して確定します。</div></div><div class="card"><div class="section-title" style="margin-top:0"><h2>試作工程</h2><span class="pill gray">人が味見</span></div><div class="recipe-steps">${r.steps.map((x,i)=>`<div class="recipe-step"><div class="recipe-step-no">0${i+1}</div><div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join('')}</div></div></div><div class="grid-equal"><div class="card"><div class="eyebrow green">TASTING STANDARD</div><h2 style="margin:8px 0">味見・現場テストの合格条件</h2><div class="test-list">${r.quality.map(x=>`<div class="test-item"><span class="test-mark">✓</span><span>${x}</span></div>`).join('')}</div></div><div class="card"><div class="eyebrow orange">SAFETY CHECK</div><h2 style="margin:8px 0">販売前に人が確認</h2><p>${r.safety}</p><div class="notice danger">${product().safety} 本デモは安全性、期限、法令適合を判定しません。</div></div></div>`}
function downloadRecipe(){download(recipeText(),'MENU-LAB_試作レシピ_'+product().id+'.txt');toast('試作レシピを保存しました')}

function financeView(){return header('売上より、増える利益を見る。','全金額は税抜。価格を上げても数量は自動で変わりません。需要予測ではなく仮定の計算です。',`<button class="btn secondary small" onclick="go('launch')">販売準備へ →</button>`)+`<div id="numberError" class="notice danger hidden" role="alert">未入力または範囲外の数値があります。試算は最後の有効な値を表示しています。</div><div class="grid-two"><div class="card"><div class="eyebrow orange">UNIT ECONOMICS</div><h2 style="margin:8px 0 18px">${esc(productName())}</h2><label class="field">販売価格（円・税抜）<input type="number" id="price" data-n="price" min="100" max="50000" required value="${state.price}"></label><input type="range" id="priceRange" aria-label="販売価格スライダー" min="${Math.min(400,state.price)}" max="${Math.max(3000,state.price)}" step="10" value="${state.price}" style="margin-bottom:22px"><div class="two-fields">${nf('食材原価／食','cost',0,50000)}${nf('包材費／食','pack',0,10000)}${nf('決済等の変動手数料（%）','fee',0,50,.1)}${nf('月間販売食数（仮定）','quantity',0,100000)}</div><div class="range-head"><span>既存商品からの移行率（仮定）</span><strong id="shiftValue">${state.shift}%</strong></div><input type="range" id="shiftRange" aria-label="既存商品からの移行率" min="0" max="100" step="5" value="${state.shift}"><p class="small muted" style="margin:9px 0 18px">新商品を買う人のうち、もともと既存商品を買う予定だった割合。</p>${nf('既存商品１食の限界利益（円）','oldMargin',0,50000)}<div class="two-fields">${nf('試作等の追加費用／月（円）','fixed',0,10000000)}${nf('広告予算／月（円）','ads',0,10000000)}${nf('追加人件費／月（円）','labor',0,10000000)}</div><div class="notice">家賃等、今回増えない既存固定費は含みません。全店の営業利益ではなく、この企画による増分の試算です。</div></div><div id="financeResults">${financeResults()}</div></div>`}

orange">CREATIVE SETTINGS</div><h2 style="margin:8px 0 17px">見せ方を選ぶ。</h2><div class="style-palette">${[['earth','食欲・自然'],['bold','元気・目立つ'],['premium','上質・夜向け']].map(x=>`<button class="chip ${state.creativeStyle===x[0]?'active':''}" onclick="setCreativeStyle('${x[0]}')">${x[1]}</button>`).join('')}</div><label class="field">画像の見出し<input id="creativeHeadline" maxlength="70" value="${esc(state.creativeHeadline||product().angle)}"></label><label class="field">行動を促す一言<input id="creativeCta" maxlength="30" value="${esc(state.creativeCta)}"></label><div class="info-row"><span>連動する情報</span><span>店舗・商品・価格・発売日</span></div><div class="info-row"><span>画像素材</span><span>図形による料理イメージ</span></div><p class="watermark-note">実際の販売では撮影した商品写真と、確認済みの税込価格・発売情報へ差し替えてください。</p></div><div class="preview-grid"><div class="preview-panel"><h3>SNS正方形・投稿画像</h3><canvas id="snsCanvas" class="design-canvas" width="1080" height="1080"></canvas><div class="preview-meta"><span>1080 × 1080</span><button class="btn secondary small" onclick="downloadCreative('sns')">PNG保存 ↓</button></div></div><div class="preview-panel"><h3>店内POP・縦型画像</h3><canvas id="popCanvas" class="design-canvas" width="1240" height="1754"></canvas><div class="preview-meta"><span>1240 × 1754</span><button class="btn secondary small" onclick="downloadCreative('pop')">PNG保存 ↓</button></div></div></div></div><div class="section-title"><h2>販売準備スタジオ</h2><span class="pill ${stale?'orange':'gray'}">${stale?'下書き・要確認':'模擬承認済み・未配信'}</span></div><div class="card"><div class="tabs">${OUTPUTS.map(x=>`<button class="chip ${state.outputTab===x[0]?'active':''}" onclick="outputTab('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="output-label"><span class="small muted">商品台帳 v${state.draftVersion} から作成</span><button class="btn secondary small" onclick="copyOutput()">コピー</button></div><div class="output" id="output">${esc(texts()[state.outputTab])}</div><div class="btn-group" style="margin-top:18px"><button class="btn secondary small" onclick="downloadText()">この原稿を保存 ↓</button><button class="btn secondary small" onclick="window.print()">印刷</button></div></div>`}
function creativeTheme(){return {earth:{bg:'#eee9d9',ink:'#26332c',accent:'#e9683c',sub:'#71845f',paper:'#fffaf0'},bold:{bg:'#ef623c',ink:'#fff9ec',accent:'#273129',sub:'#ffd56e',paper:'#fff2d5'},premium:{bg:'#202a24',ink:'#f5efe3',accent:'#d7ad59',sub:'#90a37f',paper:'#efe4c9'}}[state.creativeStyle]}
function rr(c,x,y,w,h,r,fill){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill()}
function wrapCanvas(c,t,w,max=3){let a=[],l='';for(const ch of String(t)){const q=l+ch;if(c.measureText(q).width>w&&l){a.push(l);l=ch;if(a.length===max-1)break}else l=q}if(l&&a.length<max)a.push(l);if(a.join('').length<String(t).length)a[a.length-1]=a[a.length-1].slice(0,-1)+'…';return a}
function dish(c,x,y,z,t,pattern){c.save();c.translate(x,y);c.shadowColor='#0003';c.shadowBlur=z*.07;c.shadowOffsetY=z*.04;c.fillStyle=t.paper;c.beginPath();c.arc(0,0,z*.48,0,Math.PI*2);c.fill();c.shadowColor='transparent';if(pattern==='grab'){rr(c,-z*.32,-z*.23,z*.64,z*.46,z*.06,'#d8b77d');rr(c,-z*.25,-z*.12,z*.22,z*.24,z*.05,'#f2e3c3');rr(c,z*.04,-z*.14,z*.22,z*.12,z*.04,'#b96b3b');rr(c,z*.04,z*.04,z*.22,z*.12,z*.04,'#708b51')}else if(pattern==='flight'){for(let i=0;i<3;i++){let a=-Math.PI/2+i*Math.PI*2/3;c.fillStyle=['#d9793f','#71905b','#d3a755'][i];c.beginPath();c.arc(Math.cos(a)*z*.19,Math.sin(a)*z*.19,z*.13,0,Math.PI*2);c.fill()}}else{c.fillStyle='#f5e7ca';c.beginPath();c.ellipse(z*.1,-z*.07,z*.25,z*.28,.45,0,Math.PI*2);c.fill();c.fillStyle='#a76332';c.beginPath();c.arc(-z*.12,z*.09,z*.28,.2,Math.PI*1.8);c.fill();for(let i=0;i<3;i++)rr(c,-z*.18+i*z*.1,-z*.05+i*z*.05,z*.16,z*.08,z*.025,'#d58b43')}c.restore()}
function drawCreative(kind){const cv=document.getElementById(kind+'Canvas');if(!cv)return;const c=cv.getContext('2d'),W=cv.width,H=cv.height,t=creativeTheme(),headline=state.creativeHeadline||product().angle,cta=state.creativeCta||'発売準備中';let g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,t.bg);g.addColorStop(1,state.creativeStyle==='bold'?'#d94729':state.creativeStyle==='premium'?'#111a15':'#f7f2e5');c.fillStyle=g;c.fillRect(0,0,W,H);const pad=kind==='sns'?70:90;c.fillStyle=t.ink;c.font=`700 ${kind==='sns'?30:32}px sans-serif`;c.fillText(state.store.shop,pad,pad);rr(c,W-pad-(kind==='sns'?260:300),pad-10,kind==='sns'?260:300,55,28,t.accent);c.fillStyle=state.creativeStyle==='premium'?'#1b231e':'#fff';c.textAlign='center';c.font='800 24px sans-serif';c.fillText('NEW MENU・企画デモ',W-pad-(kind==='sns'?130:150),pad+26);c.textAlign='left';if(kind==='sns'){c.fillStyle=t.ink;c.font='900 72px sans-serif';wrapCanvas(c,productName(),W*.64,3).forEach((x,i)=>c.fillText(x,pad,180+i*88));c.fillStyle=t.sub;c.font='700 34px sans-serif';wrapCanvas(c,headline,W*.62,3).forEach((x,i)=>c.fillText(x,pad,470+i*46));dish(c,W*.73,H*.69,430,t,product().pattern);c.fillStyle=t.ink;c.font='900 68px sans-serif';c.fillText(money(state.price),pad,H-190);c.font='500 23px sans-serif';c.fillText('税抜・仮置き価格',pad,H-125);rr(c,pad,H-80,260,50,25,t.ink);c.fillStyle=t.bg;c.textAlign='center';c.font='700 23px sans-serif';c.fillText(cta,pad+130,H-47)}else{c.fillStyle=t.sub;c.font='700 32px sans-serif';c.fillText(headline,pad,175);c.fillStyle=t.ink;c.font='900 86px sans-serif';wrapCanvas(c,productName(),W-pad*2,4).forEach((x,i)=>c.fillText(x,pad,250+i*106));dish(c,W*.5,H*.55,650,t,product().pattern);c.fillStyle=t.ink;c.textAlign='center';c.font='900 98px sans-serif';c.fillText(money(state.price),W*.5,H-330);c.font='500 28px sans-serif';c.fillText('税抜・仮置き価格',W*.5,H-250);rr(c,W*.5-240,H-190,480,76,38,t.accent);c.fillStyle=state.creativeStyle==='premium'?'#1c251f':'#fff';c.font='800 31px sans-serif';c.fillText(cta,W*.5,H-143)}c.fillStyle=t.ink;c.globalAlpha=.65;c.textAlign='right';c.font='500 20px sans-serif';c.fillText('DEMO・架空商品・実物写真ではありません',W-pad,H-25);c.globalAlpha=1}

function downloadPlan(){const c=calc();const t=`MENU LAB｜飲食商品開発OS 企画デモ\n保存した時点の商品台帳 v${state.draftVersion}\n仮想事例・仮置き数値。実際のAIや検索は未使用。\n\n店舗：${state.store.shop}\n地域：${state.store.area}\n目的：${GOALS[state.store.goal]}\n顧客：${state.store.audience}\n顧客の声（入力）：${state.store.voice}\n商品：${productName()}\nコンセプト：${product().concept}\n\n${texts().recipe}\n\n────────\n７視点の確認\n${Array.from(new DOMParser().parseFromString(experts(),'text/html').querySelectorAll('.expert-card')).map(el=>el.textContent).join('\n\n')}\n\n────────\n${texts().release}\n\n────────\n${texts().sns}\n\n────────\n${texts().ads}\n\n────────\n${texts().pop}\n\nAPIなしの操作デモ。公開・配信・安全確認は実行していません。`;download(t,'MENU-LAB_商品開発企画書.txt');toast('海外インサイト・レシピ・採算・販促を一つの企画書にまとめました')}
function share(){if(location.protocol==='file:'){toast('このファイルをWeb公開すると、共有URLをコピーできます');return}copy(location.origin+location.pathname)}
function modal(title,body,actions='',extra=''){const root=$('#modal-root');window.modalFocus=document.activeElement;root.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">${title}</h2><p>${body}</p>${extra}<div class="btn-group"><button class="btn secondary" onclick="closeModal()">閉じる</button>${actions}</div></section></div>`;root.querySelector('button')?.focus()}
function closeModal(){$('#modal-root').innerHTML='';window.modalFocus?.focus()}
function about(){modal('APIなしでも、仕事の流れを体験。','収録した海外の模擬意見、商品・レシピ・文章テンプレート、条件分岐、計算、画像描画で動きます。<br><br>できること：海外意見の採用・修正・見送り、商品比較、7視点レビュー、分量連動レシピ、採算計算、販促文章、SNS・店内POP画像のPNG保存。<br><br>行わないこと：実際の海外検索、AI生成、実物写真生成、SNS投稿、広告配信。すべて仮想例で、入力はこのブラウザー内だけに保存されます。') }
function reset(){modal('このデモの保存データを削除','このブラウザーに保存されたデモの入力を削除し、初期の仮想店舗に戻します。',`<button class="btn primary" onclick="doReset()">削除してリセット</button>`)}
function doReset(){try{localStorage.removeItem('menu-lab-demo-v1')}catch{}state=defaults();closeModal();render();toast('このデモの保存データを削除しました')}
function bind(){const form=$('#storeForm');if(form)form.onsubmit=e=>{e.preventDefault();if(!form.reportValidity())return;const fd=new FormData(form);for(const k of ['shop','area','audience','ingredients','voice'])state.store[k]=String(fd.get(k)).trim();state.store.goal=String(fd.get('goal'));state.store.limit=Number(fd.get('limit'));state.store.noEquip=fd.has('noEquip');touch();go('ideas');toast('店舗条件を保存しました')};const ps=$('#patternSearch');if(ps)ps.oninput=e=>{state.search=e.target.value;$('#patterns').innerHTML=patternCards();save()};document.querySelectorAll('[data-n]').forEach(el=>el.addEventListener('input',()=>{if(!el.validity.valid||el.value==='')return;state[el.dataset.n]=Number(el.value);touch();$('#financeResults').innerHTML=financeResults();if(el.dataset.n==='price')$('#priceRange').value=state.price}));const pr=$('#priceRange');if(pr)pr.oninput=()=>{state.price=Number(pr.value);$('#price').value=state.price;touch();$('#financeResults').innerHTML=financeResults()};const sr=$('#shiftRange');if(sr)sr.oninput=()=>{state.shift=Number(sr.value);$('#shiftValue').textContent=state.shift+'%';touch();$('#financeResults').innerHTML=financeResults()};const rs=$('#recipeServings');if(rs)rs.onchange=()=>{state.recipeServings=Number(rs.value);save();const y=scrollY;render();scrollTo(0,y)};const lf=$('#ledgerForm');if(lf)lf.onsubmit=e=>{e.preventDefault();const fd=new FormData(lf);state.customName=String(fd.get('productName')).trim();state.date=String(fd.get('date'));touch();render();toast('商品台帳、文章、画像を更新しました')};document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{state.checks[Number(el.dataset.check)]=el.checked;$('#approve').disabled=!state.checks.every(Boolean);save()});const h=$('#creativeHeadline');if(h)h.oninput=()=>{state.creativeHeadline=h.value;save();drawCreatives()};const c=$('#creativeCta');if(c)c.oninput=()=>{state.creativeCta=c.value;save();drawCreatives()};if($('#snsCanvas'))requestAnimationFrame(drawCreatives)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#sidebar').classList.remove('open')}if(e.key==='Tab'&&$('#modal-root .modal')){const nodes=[...$('#modal-root .modal').querySelectorAll('button,textarea,input,a[href]')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
// Validate restored data before using any numeric fields in calculations.
const ranges={price:[100,50000],cost:[0,50000],pack:[0,10000],fee:[0,50],quantity:[0,100000],shift:[0,100],oldMargin:[0,50000],fixed:[0,10000000],ads:[0,10000000],labor:[0,10000000]};
for(const [k,[min,max]] of Object.entries(ranges))if(!Number.isFinite(state[k])||state[k]<min||state[k]>max)state[k]=defaults()[k];
if(!NAV.some(n=>n[0]===state.view))state.view='home';if(!Number.isFinite(state.recipeServings)||state.recipeServings<1||state.recipeServings>50)state.recipeServings=10;if(!['earth','bold','premium'].includes(state.creativeStyle))state.creativeStyle='earth';if(!OUTPUTS.some(n=>n[0]===state.outputTab))state.outputTab='release';if(!GOALS[state.store.goal])state.store.goal='profit';if(!Array.isArray(state.checks)||state.checks.length!==3)state.checks=[false,false,false];
render();if(!storageOK)toast('ブラウザーの保存機能が使えないため、このタブ内だけで動作します');
</script>
</body></html>

function preset(k){modal('サンプル店舗を切り替えますか？','店舗条件・選択商品・採算・確認状況を、この業態の仮想データに戻します。現在の編集内容は置き換わります。',`<button class="btn primary" onclick="applyPreset('${k}');closeModal()">切り替える</button>`)}
function applyPreset(k){state={...defaults(),store:clone(PRESETS[k])};state.view='store';const p=DATA[k][0];state.selected=p.id;state.price=p.price;state.cost=p.cost;state.pack=p.pack;state.quantity=PRESETS[k].monthly;state.oldMargin=PRESETS[k].oldMargin;save();render();toast('仮想店舗のサンプルを読み込みました')}
function storeView(){return header('お店の現実を、開発の条件に。','３つの業態サンプルから開始。店舗名や条件も編集できます。')+`<div class="preset-row">${[['curry','カレー・食堂'],['cafe','カフェ・喫茶'],['izakaya','居酒屋・小皿']].map(x=>`<button class="chip ${state.store.kind===x[0]?'active':''}" onclick="preset('${x[0]}')">${x[1]}</button>`).join('')}</div><form id="storeForm"><div class="grid-two"><div class="card"><div class="eyebrow orange">01 / STORE PROFILE</div><h2 style="margin:8px 0 22px">どんなお店ですか？</h2><div class="two-fields"><label class="field">店舗名<input name="shop" maxlength="60" required value="${esc(state.store.shop)}"></label><label class="field">地域<input name="area" maxlength="40" required value="${esc(state.store.area)}"></label></div><label class="field">開発の一番の目的<select name="goal">${Object.entries(GOALS).map(([k,v])=>`<option value="${k}" ${state.store.goal===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">届けたいお客様<input name="audience" maxlength="120" required value="${esc(state.store.audience)}"></label><label class="field">活かしたい食材<textarea name="ingredients" rows="2" maxlength="300">${esc(state.store.ingredients)}</textarea><div class="help">企画書に反映します。自由記入から新しいレシピを自動生成する機能はありません。</div></label><label class="field">お客様の声・気になっていること<textarea name="voice" rows="3" maxlength="500">${esc(state.store.voice)}</textarea><div class="help">サンプルの声です。実在のお客様の個人情報・機密情報は入力しないでください。</div></label></div><div><div class="card"><div class="eyebrow orange">02 / REAL-WORLD LIMITS</div><h2 style="margin:8px 0 22px">守る条件を、先に決める。</h2><label class="field">１食あたりの仕上げ作業上限（秒）<input type="number" min="30" max="1800" step="10" name="limit" required value="${state.store.limit}"><div class="help">全調理時間ではなく、注文後に追加で使える作業時間の目安。</div></label><label class="check"><input type="checkbox" name="noEquip" ${state.store.noEquip?'checked':''}>新しい設備を増やさない</label><div class="notice">このデモの商品は既存設備での試作を想定したサンプルです。実際の設備適合は人が確認します。</div><div class="info-row"><span>店舗データ</span><span>仮想・編集可能</span></div><div class="info-row"><span>情報の扱い</span><span>このブラウザー内のみ</span></div><div class="info-row"><span>目的による変化</span><span>提案順とレビューに反映</span></div><button type="submit" class="btn primary wide" style="margin-top:22px">条件を保存して、商品案へ →</button></div><div class="notice warning">「材料を全部使え」とは決めません。提案と実際の在庫・原価を照合し、仕入れや工程が成立するか確認してください。</div><button type="button" class="text-btn" onclick="reset()">保存データを消して、最初から</button></div></div></form>`}
function worldView(){return header('世界の発想を、自分のお店へ。','商品をコピーするのではなく、「成立する構造」を持ち帰る。',`<button class="btn primary small" onclick="go('ideas')">商品案を見る →</button>`)+`<div class="notice warning" style="margin-top:0">すべて海外市場を想定した仮想事例です。実在店のヒット実績・調査結果ではありません。APIなしのため、検索対象はこの６件の収録サンプルに限定されます。</div><label class="field">収録サンプルを絞り込む<input id="patternSearch" placeholder="例：ソース、持ち帰り、米国" value="${esc(state.search)}"></label><div class="cards" id="patterns">${patternCards()}</div>`}
function patternCards(){const q=state.search.toLowerCase();const list=PATTERNS.filter(p=>(p.country+p.title+p.desc+p.transfer).toLowerCase().includes(q));return list.length?list.map(p=>`<article class="card"><div class="region-art ${p.style}"><span>${p.mark}</span><div class="orbit"></div><div class="code">${p.code}</div></div><div class="pill gray">${p.country}・仮想事例</div><h3 style="margin:12px 0 8px">${p.title}</h3><p>${p.desc}</p><div class="eyebrow green" style="margin-top:20px">LOCAL TRANSLATION</div><p style="color:#44513d">${p.transfer}</p><div class="change-box small"><span class="green">確かめること</span><br>${p.check}</div><button class="text-btn" style="margin-top:12px" onclick="patternDetail('${p.id}')">自店への落とし込みを見る →</button></article>`).join(''):'<div class="empty" style="grid-column:1/-1">該当するサンプルはありません。キーワードを変えてください。</div>'}
function patternDetail(id){const p=PATTERNS.find(x=>x.id===id);const mapped={dip:'citrus',local:'citrus',mini:'flight'};const target=DATA[state.store.kind].find(x=>x.pattern===(mapped[id]||id));modal(p.title,`${esc(state.store.shop)}への応用例：${esc(target.name)}。${esc(target.concept)}<br><br>活用予定の食材：${esc(state.store.ingredients)}<br>自店の在庫と上記商品の原材料は、人が照合してください。<br><br><span class="pill gray">保存済みサンプルの対応付け</span>`, `<button class="btn primary" onclick="choose('${target.id}');closeModal();go('ideas')">この方向の商品を見る →</button>`)}
function sortedProducts(){return [...DATA[state.store.kind]].sort((a,b)=>Number(b.fit.includes(state.store.goal))-Number(a.fit.includes(state.store.goal)))}
function choose(id){const p=DATA[state.store.kind].find(x=>x.id===id);if(!p)return;state.selected=id;state.improved=false;state.price=p.price;state.cost=p.cost;state.pack=p.pack;state.customName='';touch();render();toast('商品を選択しました。採算・販促もこの商品に切り替わります')}
function ideasView(){const p=product(),ch=currentChecks();return header('いいアイデアを、使える商品に。',`${esc(state.store.shop)} / 目的：${GOALS[state.store.goal]}`,`<button class="btn secondary small" onclick="go('store')">条件を変える</button>`)+`<div class="notice" style="margin-top:0">店舗の目的で提案順が変わります。商品案は収録テンプレートです。数値は仮置き、専門レビューはルールに基づくもので、実際の専門家の監修ではありません。</div><div class="cards">${sortedProducts().map((x,i)=>`<article class="card product-card ${x.id===state.selected?'selected':''}"><div class="product-art ${['','b','c'][DATA[state.store.kind].indexOf(x)]}"><span class="art-label">CONCEPT ${String(DATA[state.store.kind].indexOf(x)+1).padStart(2,'0')} / イメージ図</span><div class="mini-plate" aria-hidden="true"></div></div><span class="pill ${x.id===state.selected?'orange':'gray'}">${x.id===state.selected?'選択中':x.fit.includes(state.store.goal)?'目的に合うサンプル':x.tag}</span><h3>${x.name}</h3><p>${x.concept}</p><div class="product-meta"><span>売価 <strong>${money(x.id===state.selected?state.price:x.price)}</strong></span><span>仕上げ <strong>${x.id===state.selected?time():x.time}</strong> 秒</span></div><div class="small muted">税抜の仮置き価格</div><button class="btn ${x.id===state.selected?'secondary':'primary'} wide" onclick="choose('${x.id}')">${x.id===state.selected?'この案を初期状態に戻す':'この商品を検討する →'}</button></article>`).join('')}</div><div class="result-banner"><div><div class="eyebrow">CURRENT DEVELOPMENT</div><h3>${esc(productName())}</h3><p>${ch.time?'作業時間は設定上限内。次は味と実測値を確認。':`仕上げ ${time()}秒は、店舗の上限 ${state.store.limit}秒を超えています。`} ${ch.profit?'採算は仮定上プラス。':'現在の条件では増分利益がマイナスです。'}</p></div><button class="btn ghost" onclick="go('finance')">数字を動かして確かめる →</button></div><div class="grid-two"><div class="card"><div class="section-title" style="margin-top:0"><h2>７つの視点で、味見する。</h2><span class="pill gray">ルール判定</span></div>${experts()}</div><div><div class="card"><div class="eyebrow orange">RUU IMPROVEMENT</div><h2 style="margin:8px 0 12px">追いルウで、現場に近づける。</h2><p>「おいしそう」で終わらせず、注文後の手数を減らす。保存された改善サンプルルを適用できます。</p><div class="change-box"><div class="small muted">仕上げ作業時間の変化（仮定）</div><div style="font-size:23px;margin:8px 0"><span class="mono">${p.time}秒</span><span class="change-arrow">→</span><span class="mono green">${p.simpleTime}秒</span></div><div class="small">${p.simpleStep}</div></div><div class="info-row"><span>標準の食材原価（仮置き）</span><span>${money(p.cost)} → ${money(p.simpleCost)}</span></div><div class="notice warning">時間・原価の削減量はデモ用の仮定です。味、安全、実際の作業時間を検証するまで「改善済み」とは確定しません。</div><button class="btn primary wide" onclick="improve()" ${state.improved?'disabled':''}>${state.improved?'改善サンプルを適用中':'工程を減らす改善を適用 →'}</button></div><div class="card" style="margin-top:18px"><h3 style="font-size:15px">採用しない判断も、価値になる。</h3><p>${p.proof}</p><div class="info-row"><span>作業上限</span><span class="${ch.time?'green':'red'}">${ch.time?'条件内':'超過・要修正'}</span></div><div class="info-row"><span>追加設備</span><span class="green">サンプル上は不要</span></div><div class="info-row"><span>味・安全・仕入れ</span><span class="orange">人による確認待ち</span></div></div></div></div>`}
function improve(){const p=product();state.improved=true;state.cost=p.simpleCost;touch();render();toast('改善サンプルを適用しました。原価も仮置き値に更新しました')}
function experts(){const p=product(),ch=currentChecks(),c=calc();const rows=[['心','行動心理・顧客理解','購買仮説',`「${p.angle}」を注文理由の仮説にする。対象は${state.store.audience}。心理効果を断定せず、説明あり／なしで注文の違いを確かめる。`],['現','飲食の現場',ch.time?'条件内':'要修正',`仕上げ${time()}秒、設定上限${state.store.limit}秒。${state.improved?p.simpleStep:p.baseStep} 実測前のため厨房で検証する。`],['会','管理会計',ch.profit?'仮定上プラス':'要再設計',`１食の限界利益${money(c.margin)}。既存商品から${state.shift}%が移ると仮定した増分利益は月${money(c.net)}。売上ではなく追加費用と置き換わりを含めて判断する。`],['販','マーケティング','検証する',`目的は「${GOALS[state.store.goal]}」。${p.proof} 広告を増やす前に小規模テストの記録を残す。`],['経','経営','条件付き',`活かしたい食材「${state.store.ingredients}」と商品原材料「${p.ingredients}」を照合する。${state.store.noEquip?'設備を増やさない条件を優先。':'設備投資をする場合は別途費用を見積もる。'} 店舗全体の利益と負荷で採否を決める。`],['広','広報','根拠確認',`切り口は「${p.angle}」。開発背景や地域性は事実確認後に記載。「日本初」「大ヒット」は未確認のため使わない。`],['安','品質・安全','人の確認待ち',p.safety+' 本デモは衛生・アレルギー・法令適合を判定しない。']];return rows.map((r,i)=>`<div class="expert-card"><div class="expert-icon">${r[0]}</div><div><div class="expert-head"><h3>${r[1]}</h3><span class="pill ${['要修正','要再設計','人の確認待ち'].includes(r[2])?'orange':'gray'}">${r[2]}</span></div><p>${esc(r[3])}</p></div></div>`).join('')}
function financeView(){return header('売上より、増える利益を見る。','全金額は税抜。価格を上げても数量は自動で変わりません。需要予測ではなく仮定の計算です。',`<button class="btn secondary small" onclick="go('launch')">販売準備へ →</button>`)+`<div id="numberError" class="notice danger hidden" role="alert">未入力または範囲外の数値があります。試算は最後の有効な値を表示しています。</div><div class="grid-two"><div class="card"><div class="eyebrow orange">UNIT ECONOMICS</div><h2 style="margin:8px 0 18px">${esc(productName())}</h2><label class="field">販売価格（円・税抜）<input type="number" id="price" data-n="price" min="100" max="50000" required value="${state.price}"></label><input type="range" id="priceRange" aria-label="販売価格スライダー" min="${Math.min(400,state.price)}" max="${Math.max(3000,state.price)}" step="10" value="${state.price}" style="margin-bottom:22px"><div class="two-fields">${nf('食材原価／食','cost',0,50000)}${nf('包材費／食','pack',0,10000)}${nf('決済等の変動手数料（%）','fee',0,50,.1)}${nf('月間販売食数（仮定）','quantity',0,100000)}</div><div class="range-head"><span>既存商品からの移行率（仮定）</span><strong id="shiftValue">${state.shift}%</strong></div><input type="range" id="shiftRange" aria-label="既存商品からの移行率" min="0" max="100" step="5" value="${state.shift}"><p class="small muted" style="margin:9px 0 18px">新商品を買う人のうち、もともと既存商品を買う予定だった割合。</p>${nf('既存商品１食の限界利益（円）','oldMargin',0,50000)}<div class="two-fields">${nf('試作等の追加費用／月（円）','fixed',0,10000000)}${nf('広告予算／月（円）','ads',0,10000000)}${nf('追加人件費／月（円）','labor',0,10000000)}</div><div class="notice">家賃等、今回増えない既存固定費は含みません。全店の営業利益ではなく、この企画による増分の試算です。</div></div><div id="financeResults">${financeResults()}</div></div>`}
function nf(label,key,min,max,step=1){return `<label class="field">${label}<input type="number" data-n="${key}" min="${min}" max="${max}" step="${step}" required value="${state[key]}"></label>`}
function financeResults(){const c=calc(),safe=Math.max(state.price,1),ratio=Math.min(100,(state.cost+state.pack)/safe*100);const loss=state.oldMargin*state.shift/100;return `<div class="card" style="background:#edf2e6;border-color:#dde6d2"><div class="eyebrow green">INCREMENTAL PROFIT / MONTH</div><div class="metric-label" style="margin-top:16px">月間の増分利益（仮定）</div><div class="metric-large ${c.net<0?'red':'green'}" id="netProfit">${money(c.net)}</div><div class="small muted">既存商品の利益減少と追加費用を反映</div><div class="info-row" style="margin-top:20px"><span>１食の限界利益</span><strong id="unitMargin">${money(c.margin)}</strong></div><div class="info-row"><span>置き換わり考慮後／食</span><strong>${money(c.contribution)}</strong></div><div class="info-row"><span>追加費用の回収に必要な食数</span><strong>${c.breakeven===null?'現条件では回収不可':num(c.breakeven)+'食'}</strong></div><div class="breakdown" aria-label="売価に占める変動費と限界利益"><span class="segment" style="width:${ratio}%;background:#d7a977"></span><span class="segment" style="width:${Math.min(100-ratio,state.fee)}%;background:#b3bca6"></span><span class="segment" style="flex:1;background:#638b53"></span></div><div class="legend"><span><i class="swatch" style="background:#d7a977"></i>食材・包材</span><span><i class="swatch" style="background:#b3bca6"></i>手数料</span><span><i class="swatch" style="background:#638b53"></i>限界利益</span></div></div><div class="card" style="margin-top:18px"><h3 style="font-size:15px">売れ行きが違ったら？</h3><p>需要を予測せず、販売数だけを変えて比較します。</p><div class="table-wrap"><table><thead><tr><th>シナリオ</th><th>月の食数</th><th>増分利益</th></tr></thead><tbody>${[[.6,'慎重'],[1,'入力値'],[1.4,'上振れ']].map(([r,t])=>{const q=Math.round(state.quantity*r),v=calc({quantity:q});return `<tr class="${r===1?'table-highlight':''}"><td>${t}</td><td>${num(q)}</td><td class="${v.net<0?'red':'green'}">${money(v.net)}</td></tr>`}).join('')}</tbody></table></div><div class="notice ${c.net<0?'danger':'warning'}">${c.net<0?'現条件では追加利益が出ません。原価・販売条件・販促費を見直すか、見送りを検討してください。':'利益は保証されません。販売数量、既存商品からの移行、廃棄、作業時間を現場で確かめてください。'}</div><details><summary class="small" style="cursor:pointer">計算式を確認する</summary><div class="small muted" style="margin-top:10px;line-height:2">１食の限界利益＝売価−食材原価−包材費−売価×手数料率<br>増分利益＝（１食の限界利益−既存限界利益×移行率）×販売食数−試作等追加費用−広告予算−追加人件費<br>回収食数は、置き換わり考慮後の１食利益が正の場合に切り上げで計算。表示は円単位に丸めています。</div></details><button class="btn primary wide" style="margin-top:20px" onclick="go('launch')">この条件で販売準備へ →</button></div>`}
const OUTPUTS=[['release','プレスリリース'],['sns','SNS投稿'],['ads','広告施策案'],['pop','店内POP'],['recipe','試作・運用レシピ']];
function texts(){const s=state.store,p=product(),n=productName(),pr=money(state.price)+'（税抜・仮置き）',d=state.date?state.date.replaceAll('-','/'):'未定',c=calc();const prefix='【企画デモ／下書き・未承認】';return {release:`${prefix}\n${s.shop}、新商品「${n}」の発売を企画\n${p.angle}\n\n■ 企画の概要\n${s.area}の${s.shop}では、${s.audience}に向けて、新商品「${n}」を企画しています。${p.concept}\n\n■ 開発のねらい\n目的は「${GOALS[s.goal]}」。お客様の声として登録した「${s.voice}」を検証の出発点にします。実際の声として公表する前に出典と許可を確認します。\n\n■ 商品情報\n商品名：${n}\n販売予定価格：${pr}\n発売予定日：${d}\n販売場所：${s.shop}（所在地・営業時間は要確認）\n予定原材料：${p.ingredients}\n数量・期間：未定\n\n■ 公開前の確認事項\n商品仕様、価格の税込表示、発売日、販売条件、原材料、写真、問い合わせ先を確認。開発者コメントと実績は未登録のため掲載していません。\n\n本原稿は架空店舗・仮想商品のデモです。配信は行いません。`,
sns:`${prefix}\n【発売前の告知案】\n${p.angle}\n${s.shop}で、新しい一皿「${n}」を準備しています。\n${p.concept}\n発売予定：${d}\n価格案：${pr}\n詳細は確定後にお知らせします。\n\n【発売日の投稿案／発売確認後に使用】\n「${n}」が登場。\n${p.angle}\n${s.audience}の皆さまへ。\n販売価格案：${pr}\n販売場所：${s.shop}\n営業時間・販売数量・予約方法：確認後に追記\n\n【写真・短尺動画の構成案】\n最初：商品の全体像を見せる。\n中盤：仕上げや食べ方の違いを見せる。\n最後：商品名、確認済み価格、販売場所を表示。\n未撮影の画像を「実物写真」として扱わない。\n\n掲載前に税込の販売価格と事実関係を確認してください。自動投稿は行いません。`,
ads:`${prefix}\n商品：${n}\n目的：${GOALS[s.goal]}\n対象の仮説：${s.area}で来店可能な${s.audience}\n\n■ 訴求の比較案\nA：商品の違い「${p.angle}」\nB：利用場面「いつもの食事に、新しい選択肢」\n同じ配信条件で比較し、訴求以外を同時に大きく変えない。\n\n■ 月間予算案\n合計：${money(state.ads)}\n前半の小規模テスト：${money(state.ads/2)}\n結果確認後の追加分：${money(state.ads-state.ads/2)}\n配信先・入稿・課金は未実施。\n\n■ 遷移先\n商品名、実物写真、確定価格、営業時間、来店・注文方法がそろった案内ページ。\n\n■ 記録するもの\n表示やクリックだけでなく、購入数、来店理由、既存商品からの移行、追加利益、現場の負担を記録する。\n\n■ 見直し・停止条件\n予算上限に達したら停止。想定を超える提供遅延、品切れ、安全上の問題があれば告知・配信を止めて確認。実績の増分利益がマイナスなら予算を増やす前に原因を確認する。\n\n売価：${pr}\n現在の増分利益試算：月${money(c.net)}（仮定）\n売上や広告成果を保証するものではありません。`,
pop:`${prefix}\n\n${n}\n\n${p.angle}\n\n${p.concept}\n\n価格案 ${pr}\n発売予定 ${d}\n${s.shop}\n\n【スタッフのご案内例】\n「${p.angle} ご興味があれば、特徴をご説明します。」\n\n原材料・アレルギーの質問には推測で答えず、確認済みの規格書と店舗ルールを参照してください。\n\n店頭掲示前に税込価格、販売条件、原材料情報を確認し、下書き表示と内部メモを整理してください。`,
recipe:`${prefix}\n商品台帳 v${state.draftVersion}\n店舗：${s.shop}\n商品：${n}\n目的：${GOALS[s.goal]}\n届けたいお客様：${s.audience}\n\n■ 活かしたい材料（店舗からの入力）\n${s.ingredients}\n\n■ 商品の原材料案\n${p.ingredients}\n仕入れ単価、分量、歩留まりは未確定。実際の在庫と照合する。\n\n■ 工程の仮説\n${state.improved?p.simpleStep:p.baseStep}\n仕上げ作業：${time()}秒（仮定）\n店舗の上限：${s.limit}秒\n具体的な加熱・保存条件は本デモで指示しない。責任者が適切な手順を決める。\n\n■ 採算の仮置き\n売価：${pr}\n食材原価：${money(state.cost)}／食\n包材：${money(state.pack)}／食\n手数料：売価の${state.fee}%\n販売食数：月${state.quantity}食（仮定）\n既存商品からの移行率：${state.shift}%\n増分利益：月${money(c.net)}（仮定）\n\n■ 試作と検証\n${p.proof}\n計量、試食、仕上げ時間、廃棄、注文、既存商品からの移行を記録。\n\n■ 安全確認\n${p.safety}\n\n■ 引継ぎ\n確定した分量、工程、写真、確認者、更新日、問題時の停止ルールを残す。\n公開・販売は人の確認と承認後に行う。`}}
function launchView(){const stale=state.publishedVersion!==state.draftVersion;return header('一皿から、販売準備一式へ。','商品台帳を変えると、５種類の下書きが同じ情報で更新されます。',`<button class="btn secondary small" onclick="downloadPlan()">企画書を書き出す ↓</button>`)+`<div class="grid-two"><div class="card"><div class="output-label"><div><div class="eyebrow orange">SINGLE SOURCE OF TRUTH</div><h2 style="margin-top:7px">商品台帳</h2></div><span class="pill gray">v${state.draftVersion}</span></div><form id="ledgerForm"><label class="field">商品名<input name="productName" maxlength="80" required value="${esc(productName())}"></label><label class="field">発売予定日<input type="date" name="date" value="${esc(state.date)}"><div class="help">未定のままでも下書きを作成できます。</div></label><div class="info-row"><span>店舗</span><span>${esc(state.store.shop)}</span></div><div class="info-row"><span>売価（税抜・仮置き）</span><strong>${money(state.price)}</strong></div><div class="info-row"><span>仕上げ作業（仮定）</span><span>${time()}秒</span></div><div class="info-row"><span>仕様の状態</span><span class="orange">試作・事実確認前</span></div><div class="btn-group" style="margin-top:19px"><button class="btn primary" type="submit">台帳を更新</button><button class="btn secondary" type="button" onclick="go('finance')">価格を変える</button></div></form></div><div class="card"><div class="eyebrow green">HUMAN CHECKPOINT</div><h2 style="margin:8px 0 12px">最後は、人が確かめる。</h2><p>下書きはいつでも閲覧できます。配布用の模擬承認には、３項目の確認が必要です。</p>${['価格・発売日・販売条件を確認した（模擬）','味・工程・原材料・安全を確認した（模擬）','写真・表現・権利・出典を確認した（模擬）'].map((t,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${state.checks[i]?'checked':''}>${t}</label>`).join('')}<button class="btn secondary wide" id="approve" ${state.checks.every(Boolean)?'':'disabled'} onclick="approve()">${stale?'模擬承認を記録する':'この版の模擬承認を記録済み'}</button><div class="notice warning">チェックしても、実際の安全・法令適合を保証しません。投稿・配信・広告課金の機能はありません。情報変更時は確認をリセットします。</div></div></div><div class="section-title"><h2>販売準備スタジオ</h2><span class="pill ${stale?'orange':'gray'}">${stale?'下書き・要確認':'模擬承認済み・未配信'}</span></div><div class="card"><div class="tabs" role="tablist" aria-label="販促物の種類">${OUTPUTS.map(([k,t])=>`<button role="tab" aria-selected="${state.outputTab===k}" class="chip ${state.outputTab===k?'active':''}" onclick="outputTab('${k}')">${t}</button>`).join('')}</div><div class="output-label"><span class="small muted">商品台帳 v${state.draftVersion} から作成したテンプレート下書き</span><button class="btn secondary small" onclick="copyOutput()">コピー</button></div><div class="output" id="output" role="tabpanel">${esc(texts()[state.outputTab])}</div><div class="btn-group" style="margin-top:18px"><button class="btn secondary small" onclick="downloadText()">この原稿を保存 ↓</button><button class="btn secondary small" onclick="window.print()">この画面を印刷</button></div></div><div class="section-title"><h2>販売後も、次の改善へ。</h2><span class="small muted">実行計画のサンプル</span></div><div class="timeline">${[['BEFORE','試作と条件確認','味、工程、価格、原材料を人が確認。小規模な販売条件を決める。'],['TEST','限定した条件で試す','提供時間、販売数、廃棄、来店理由を記録。安全上の問題は即時停止する。'],['REVIEW','売上ではなく、追加利益を振り返る','既存商品からの移行と現場負荷も確認。売り方・工程・商品自体のどこを直すか決める。']].map(x=>`<div class="timeline-row"><div class="timeline-time">${x[0]}</div><div><h4>${x[1]}</h4><p>${x[2]}</p></div></div>`).join('')}</div>`}
function outputTab(k){state.outputTab=k;save();const y=window.scrollY;render();window.scrollTo(0,y)}
function approve(){if(!state.checks.every(Boolean))return;state.publishedVersion=state.draftVersion;save();render();toast('模擬承認を記録しました。実際の投稿・配信は行っていません')}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('コピーしました')}catch{modal('コピーする内容','自動コピーが使えないため、下の文章を選択してコピーしてください。',`<button class="btn primary" onclick="closeModal()">閉じる</button>`,`<textarea readonly rows="7" onclick="this.select()">${esc(t)}</textarea>`)}}
function copyOutput(){copy(texts()[state.outputTab])}
function download(content,name,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob(['\uFEFF'+content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadText(){download(texts()[state.outputTab],'MENU-LAB_'+state.outputTab+'.txt');toast('下書きをテキストファイルにしました')}
function downloadPlan(){const c=calc();const t=`MENU LAB｜飲食商品開発OS 企画デモ\n保存した時点の商品台帳 v${state.draftVersion}\n仮想事例・仮置き数値。実際のAIや検索は未使用。\n\n店舗：${state.store.shop}\n地域：${state.store.area}\n目的：${GOALS[state.store.goal]}\n顧客：${state.store.audience}\n顧客の声（入力）：${state.store.voice}\n商品：${productName()}\nコンセプト：${product().concept}\n\n${texts().recipe}\n\n────────\n７視点の確認\n${Array.from(new DOMParser().parseFromString(experts(),'text/html').querySelectorAll('.expert-card')).map(el=>el.textContent).join('\n\n')}\n\n────────\n${texts().release}\n\n────────\n${texts().sns}\n\n────────\n${texts().ads}\n\n────────\n${texts().pop}\n\nAPIなしの操作デモ。公開・配信・安全確認は実行していません。`;download(t,'MENU-LAB_商品開発企画書.txt');toast('商品・採算・７視点・販促を一つの企画書にまとめました')}
function share(){if(location.protocol==='file:'){toast('このファイルをWeb公開すると、共有URLをコピーできます');return}copy(location.origin+location.pathname)}
function modal(title,body,actions='',extra=''){const root=$('#modal-root');window.modalFocus=document.activeElement;root.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">${title}</h2><p>${body}</p>${extra}<div class="btn-group"><button class="btn secondary" onclick="closeModal()">閉じる</button>${actions}</div></section></div>`;root.querySelector('button')?.focus()}
function closeModal(){$('#modal-root').innerHTML='';window.modalFocus?.focus()}
function about(){modal('APIなしでも、仕事の流れを体験。','このデモは、収録された商品と文章のテンプレート、条件分岐、ブラウザー内の計算で動きます。<br><br>できること：３業態の切り替え、商品３案の比較、７視点レビュー、改善サンプルの適用、採算の再計算、販促下書き、企画書の保存。<br><br>行わないこと：新しい商品のAI生成、実際の海外検索、最新情報の取得、SNS投稿、広告配信、他の利用者とのデータ共有。<br><br>店舗・顧客の声・商品・数値は仮想例です。自由入力は台帳と文章へ差し込みますが、新しい分析やレシピを生み出すものではありません。<br><br>入力はこの端末のブラウザー内に保存されます。同じURLを開いても他の人の編集は見えません。共有端末では使用後に保存データを削除してください。APIキーやログインは不要です。')}
function reset(){modal('このデモの保存データを削除','このブラウザーに保存されたデモの入力を削除し、初期の仮想店舗に戻します。',`<button class="btn primary" onclick="doReset()">削除してリセット</button>`)}
function doReset(){try{localStorage.removeItem('menu-lab-demo-v1')}catch{}state=defaults();closeModal();render();toast('このデモの保存データを削除しました')}
function bind(){const form=$('#storeForm');if(form)form.onsubmit=e=>{e.preventDefault();if(!form.reportValidity())return;const fd=new FormData(form);for(const k of ['shop','area','audience','ingredients','voice'])state.store[k]=String(fd.get(k)).trim();state.store.goal=String(fd.get('goal'));state.store.limit=Number(fd.get('limit'));state.store.noEquip=fd.has('noEquip');touch();go('ideas');toast('店舗条件を保存しました。目的に応じて提案順を変更しました')};const ps=$('#patternSearch');if(ps)ps.oninput=e=>{state.search=e.target.value;$('#patterns').innerHTML=patternCards();save()};document.querySelectorAll('[data-n]').forEach(el=>el.addEventListener('input',()=>{if(!el.validity.valid||el.value===''){el.setAttribute('aria-invalid','true');$('#numberError')?.classList.remove('hidden');return}el.removeAttribute('aria-invalid');if(!document.querySelector('[aria-invalid=true]'))$('#numberError')?.classList.add('hidden');state[el.dataset.n]=Number(el.value);touch();$('#financeResults').innerHTML=financeResults();if(el.dataset.n==='price'){const r=$('#priceRange');r.min=Math.min(400,state.price);r.max=Math.max(3000,state.price);r.value=state.price}}));const pr=$('#priceRange');if(pr)pr.oninput=()=>{state.price=Number(pr.value);$('#price').value=state.price;touch();$('#financeResults').innerHTML=financeResults()};const sr=$('#shiftRange');if(sr)sr.oninput=()=>{state.shift=Number(sr.value);$('#shiftValue').textContent=state.shift+'%';touch();$('#financeResults').innerHTML=financeResults()};const lf=$('#ledgerForm');if(lf)lf.onsubmit=e=>{e.preventDefault();if(!lf.reportValidity())return;const fd=new FormData(lf);const n=String(fd.get('productName')).trim();if(!n){toast('商品名を入力してください');return}state.customName=n;state.date=String(fd.get('date'));touch();render();toast('商品台帳と５種類の下書きを更新しました。確認は再度必要です')};document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{state.checks[Number(el.dataset.check)]=el.checked;$('#approve').disabled=!state.checks.every(Boolean);save()})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#sidebar').classList.remove('open')}if(e.key==='Tab'&&$('#modal-root .modal')){const nodes=[...$('#modal-root .modal').querySelectorAll('button,textarea,input,a[href]')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
// Validate restored data before using any numeric fields in calculations.
const ranges={price:[100,50000],cost:[0,50000],pack:[0,10000],fee:[0,50],quantity:[0,100000],shift:[0,100],oldMargin:[0,50000],fixed:[0,10000000],ads:[0,10000000],labor:[0,10000000]};
for(const [k,[min,max]] of Object.entries(ranges))if(!Number.isFinite(state[k])||state[k]<min||state[k]>max)state[k]=defaults()[k];
if(!NAV.some(n=>n[0]===state.view))state.view='home';if(!OUTPUTS.some(n=>n[0]===state.outputTab))state.outputTab='release';if(!GOALS[state.store.goal])state.store.goal='profit';if(!Array.isArray(state.checks)||state.checks.length!==3)state.checks=[false,false,false];
render();if(!storageOK)toast('ブラウザーの保存機能が使えないため、このタブ内だけで動作します');
</script>
</body></html>

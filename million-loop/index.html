 }

lass="bar-value mono">${compact(x.views)}</span><div class="bar ${x.views>=1e6?'high':''}" style="height:${x.views==null?0:Math.max(3,(x.views/max)*130)}px" title="${esc(x.title)}：${fmt(x.views)}"><span></span></div><small>${String(i+1).padStart(2,'0')}</small></div>`).join('')}</div><div class="chart-foot"><span>自然再生のみ／広告は棒に加算しません</span><span>平均だけでなく、母数・中央値も見る</span></div><div class="table-wrap"><table><thead><tr><th>投稿・情報種別</th><th>尺</th><th class="num">自然再生</th><th class="num">広告再生</th>${analyticsPlatform==='YouTube Shorts'?'<th class="num">Engaged</th>':''}<th class="num">保存</th><th class="num">シェア</th><th class="num">DM記録</th><th class="num">完了率</th><th></th></tr></thead><tbody>${d.map((x,i)=>`<tr><td><span class="mono muted">${String(i+1).padStart(2,'0')}</span> ${esc(x.title)}<div class="small muted">${x.sample?'架空教材':'手動入力'}${x.paid===null?'／広告の有無は不明':''}</div></td><td>${fmt(x.duration)}s</td><td class="num">${compact(x.views)}</td><td class="num">${compact(x.paid)}</td>${analyticsPlatform==='YouTube Shorts'?`<td class="num">${compact(x.engaged)}</td>`:''}<td class="num">${fmt(x.saves)}</td><td class="num">${fmt(x.shares)}</td><td class="num">${fmt(x.dm)}</td><td class="num">${x.retention==null?'未入力':fmt(x.retention)+'%'}</td><td>${x.sample?'':button('削除','remove-metric','btn-link',`data-id="${esc(x.id)}"`)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty-state">${icon('chart')}<h3>この観測窓の数値は、まだありません。</h3><p>7日後の数値を24時間後に見せかけて流用しません。<br>「実測値を手入力」から追加してください。</p></div>`}<div class="field-note">再生数はユニーク人数ではありません。保存・シェア率は露出あたりの記録指標で、購買率ではありません。媒体間で定義や分母をそろえず比較しないこと。完了率は各投稿の同じ条件で観測した値を手入力します。</div></section><div class="grid-half section-gap"><section class="panel"><div class="panel-title"><h2>どこで離脱した？</h2>${tag('固定の架空教材','tag-orange')}</div><div class="retention"><svg viewBox="0 0 560 200" role="img" aria-label="架空の維持率曲線。冒頭から低下し12秒付近で大きく離脱。実際の投稿データではない"><path d="M20 20H540M20 70H540M20 120H540M20 170H540" stroke="#e9eae4"/><path d="M20 20L66 39L112 45L158 57L204 110L250 119L296 123L342 129L388 131L434 137L480 142L530 145L530 170H20Z" fill="#e6edce"/><path d="M20 20L66 39L112 45L158 57L204 110L250 119L296 123L342 129L388 131L434 137L480 142L530 145" fill="none" stroke="#829755" stroke-width="4"/><circle cx="204" cy="110" r="6" fill="#b86e40"/><text x="20" y="193" font-size="12" fill="#687064">0秒</text><text x="181" y="193" font-size="12" fill="#687064">12秒</text><text x="498" y="193" font-size="12" fill="#687064">30秒</text></svg></div><h3>長い説明で、映像の変化が止まった？</h3><p class="small muted" style="margin:9px 0">これは例示の仮説です。実際には台本と映像を照合し、投稿条件も確認します。曲線だけで原因は断定しません。</p><div class="insight-box"><b>次の変更案</b><p>説明を短くし、結果のカットを先に置く。ほかの条件はできるだけ同じにする。</p></div><p class="field-note">この図は一覧の完了率から生成したものではありません。実データ接続・自動離脱検出は未実装。分析の考え方：R2・R8。</p></section><section class="panel"><div class="panel-title"><h2>冒頭A／Bを、比較する</h2>${tag('手動計算','tag-green')}</div><p class="small muted">媒体・観測窓・尺・本編・CTAを揃える。通常投稿同士の比較は無作為実験ではないため、差が出ても因果関係は未確定です。</p><div class="experiment-grid">${['a','b'].map((k,i)=>`<div class="ab-card"><div class="eyebrow">HOOK ${i?'B':'A'}</div><h3 style="margin:7px 0 14px">${i?'結果から見せる':'問いから始める'}</h3>${[['Views','視聴開始数'],['Complete','最後まで見た回数'],['Shares','シェア数']].map(([key,label])=>`<label for="exp-${k+key}">${label}</label><input type="number" id="exp-${k+key}" data-exp="${k+key}" value="${s.experiment[k+key]}" min="0" max="1000000000" style="margin-bottom:10px">`).join('')}</div>`).join('')}</div><div class="form-grid"><div><label for="exp-min">比較を始める最低視聴数〈仮設定〉</label><input id="exp-min" type="number" data-exp="min" value="${s.experiment.min}" min="1" max="1000000000"></div><div><label for="exp-metric">今回比べる指標</label><select id="exp-metric" data-exp="metric"><option value="completion" ${s.experiment.metric==='completion'?'selected':''}>完了率</option><option value="share" ${s.experiment.metric==='share'?'selected':''}>シェア率</option></select></div></div><div id="experiment-result" class="experiment-result" aria-live="polite"></div>${button('比較の学びを保存','save-learning','btn-primary','','book')}<p class="field-note">初期値1,000はデモの運用仮定で、統計的有意性や推奨サンプルサイズを意味しません。実測の観測窓は各版で同じにします。</p></section></div>`;}

件と相談先を案内。</p></div><div class="text-card"><b>批判・違和感</b><p>担当者が確認し、誤りは直す。</p></div></div></section></aside></div>`;}

function evidenceView(){return head('10 / research & architecture','この制作室の、設計根拠。','2026年9月16日調査。公式発表・自己申告・本デモの設計提案を分けて記録。',button('調査メモを保存','export-research','btn-primary','','download'))+`<div class="tabs" style="margin-bottom:20px">${[['research','一次情報10件'],['workflow','運用の工程'],['scope','デモの範囲']].map(([v,t])=>`<button data-action="evidence-tab" data-value="${v}" class="${evidenceTab===v?'active':''}">${t}</button>`).join('')}</div>`+(evidenceTab==='research'?notice('各社の非公開マニュアルを取得したものではありません。公開された工程・事例を比較し、本デモ独自の統合フローを設計しています。「100万再生を連発」の全投稿母数・成功率・因果関係は確認できていません。')+`<section class="panel">${SOURCES.map(r=>`<article class="source-row"><div class="source-id">${r.id}</div><div><div class="row between wrap-mobile"><span class="eyebrow">${esc(r.name)}</span>${tag(r.kind,'tag-outline')}</div><h3 style="margin:8px 0"><a class="source-link" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)} ↗</a></h3><div class="source-note">公開・変更日：${esc(r.date)}　確認：2026-09-16</div><p style="margin:12px 0" class="small">${esc(r.fact)}</p><div class="info-block"><div class="info-label">アプリへの翻訳</div><p>${esc(r.use)}</p></div><div class="source-note" style="margin-top:9px">限界：${esc(r.limit)}</div></div></article>`).join('')}</section>`:evidenceTab==='workflow'?`<section class="panel"><div class="panel-title"><h2>8工程を、1本の企画につなぐ</h2>${tag('本デモの統合設計','tag-green')}</div><div class="table-wrap"><table class="method-table"><thead><tr><th>工程・担当</th><th>入力する材料</th><th>残る成果物</th><th>次に進む条件</th><th>見る指標</th></tr></thead><tbody>${METHOD.map((r,i)=>`<tr><td><b>${i+1}. ${r[0]}</b><div class="small muted">${r[1]}</div></td>${r.slice(2).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="divider"></div><h3>一本ごとではなく、週の単位でも見直す</h3><p class="small muted" style="margin:10px 0">候補の選定 → まとめ撮り → 編集・承認 → 投稿別の観測 → 制作会議。制作可能な本数を先に決める。今週の勝者だけではなく、中央値・伸び悩み・問い合わせの質も持ち寄る。担当者・曜日・本数は各社の体制に合わせて決める提案で、公開事例の共通マニュアルではありません。</p><div class="grid-three"><div class="text-card"><h3>24時間</h3><p>誤記・導線・反応を初確認。早い数値で勝敗を決めない。</p></div><div class="text-card"><h3>72時間</h3><p>初期の傾向とコメントを整理。遅れて伸びる可能性を残す。</p></div><div class="text-card"><h3>7日</h3><p>同じ窓で比較し、次の変更を一つ決める。長期効果は別追跡。</p></div></div><p class="field-note">観測窓は本デモの運用仮定です。プラットフォームが定める一律の推奨期間ではありません。</p></section>`:`<div class="grid-half"><section class="panel"><div class="panel-title"><h2>このデモでできること</h2>${tag('端末内で動作','tag-green')}</div>${['3つのワークスペースを切り替える','戦略・観測メモ・企画を入力して保存','台本・字幕・カバー・投稿文を編集','撮影タスク・確認・版別の承認を記録','承認版を端末内の投稿予定へ登録','実測値の手入力・集計・A/B比率計算','コメントの下書き・改善仮説を企画に戻す','JSON保存・読込、TXT・SRT・PNGを書き出す'].map(t=>`<div class="check-row">${icon('check')}<span>${t}</span></div>`).join('')}</section><section class="panel"><div class="panel-title"><h2>本番化で別途必要なもの</h2>${tag('未接続・未実装','tag-orange')}</div>${['認証・会社別権限・共有データベース','API側の生成AI・費用上限・秘密鍵管理','各SNSの許諾を得た投稿・指標連携','動画のアップロード・文字起こし・編集処理','素材権利の証憑管理・監査ログ','実際の画像生成・映像レンダリング','CRM等との連携・重複／因果の慎重な検証','障害対応・バックアップ・削除・運用体制'].map(t=>`<div class="check-row">${icon('info')}<span>${t}</span></div>`).join('')}</section></div><section class="panel section-gap"><h3>入力と保存の扱い</h3><p class="small muted" style="margin:10px 0">データはこのブラウザのlocalStorageへ保存され、外部送信は行いません。ログインや暗号化された機密保管庫ではありません。顧客名・個人情報・未公開情報は入れないでください。同じ端末とブラウザを使う人には見える可能性があります。保存が使えない環境ではJSON書き出しを使ってください。</p><div class="row wrap-mobile">${button('バックアップ JSON','export-json','btn-white','','download')}${button('JSONを読み込む','import-json','btn-white','','upload')}${button('このワークスペースを初期化','reset-space','btn-white','','refresh')}</div></section>`);}

function scriptText(){const s=space();let n=0;return `MILLION LOOP 制作指示書

function researchText(){return `MILLION LOOP 調査・設計メモ
調査日：2026年9月16日

1．調査の結論
「100万再生を連発」を、再生数の自動保証に置き換えない。公開一次情報から確認できるのは、視聴者理解、戦略、企画・撮影・編集、分析と再制作をつなぐ工程である。全投稿母数・広告区分・条件を公表していない事例から、成功率を計算することはできない。

2．何を共通化したか
視聴者と企業の接点を決める → ヒットと伸び悩みを観測 → 自社の事実から企画 → 秒単位の台本 → 撮影・編集 → 人の承認 → 投稿と反応の記録 → 次の一要素を検証。
これは各社の秘密マニュアルの再現ではなく、以下の公開資料を統合した本デモ独自の運用提案。

3．評価の境界
自然再生と広告再生、単一動画と合算、視聴回数とユニーク人数、相談記録と増分売上を分ける。成功例だけでなく、同じ媒体・尺・投稿後日数の全体と中央値を見る。継続的な運用では投稿本数、広告費、制作工数、観測期間、通常投稿の基準、問い合わせの内容も記録する。

4．各工程
${METHOD.map((r,i)=>`${i+1} ${r[0]}／担当：${r[1]}
入力：${r[2]}
成果物：${r[3]}
条件：${r[4]}
評価：${r[5]}`).join('\n\n')}

5．一次情報と採用した知見
${SOURCES.map(r=>`${r.id} ${r.name}｜${r.title}
公開・変更日：${r.date}
区分：${r.kind}
URL：${r.url}
確認できたこと：${r.fact}
採用：${r.use}
限界：${r.limit}`).join('\n\n')}

6．運用上の提案と未実装
24h・72h・7dの観測窓と、比較開始の最低視聴数1,000は教材上の仮定であり、公式推奨や統計的有意性を意味しない。A/B画面は比率計算のみで、無作為割付・信頼区間・有意差検定はしない。結果差の因果関係は未確定。
台本生成は文章テンプレート、絵コンテ再生は字幕切り替え、PNGは図形と文字。実AI・SNS投稿・指標自動取得・動画編集・音声生成はない。入力は端末内だけ。JSONは機密保管庫ではない。
本番では認証、会社別権限、サーバー側秘密鍵、許諾済SNS連携、費用上限、承認監査、バックアップ、削除・復旧設計が必要。

7．試用の道筋
戦略を保存 → 企画選択 → 台本を修正 → 撮影チェック → 6項目確認と承認 → 投稿予定へ保存 → 分析に実測値を手入力 → 比較の学びを保存 → 学びから次の企画へ。
再生や売上の保証はしない。まずは少数の公開可能な素材と実測値で、工程全体を一巡させる。`}

'approve':()=>{const s=space(),by=$('#reviewer').value.trim();if(!s.gates.every(Boolean))return toast('公開前の6項目をすべて確認してください');if(!by)return toast('確認した承認者の名前を入力してください');if(!s.scenes.every(x=>x.shot.trim()&&x.speech.trim()&&x.telop.trim()))return toast('空欄の台本があります。映像・発話・字幕を確認してください');s.approval={rev:s.rev,by,at:new Date().toISOString()};record('台本'+s.rev+'版を承認：'+by);render();toast('この版を承認しました。実際の投稿は行っていません');},
'reject':()=>{const s=space();s.approval=null;s.gates=Array(6).fill(false);s.queue.forEach(q=>{if(q.idea===s.selected)q.status='要再承認';});record('制作物を差し戻し');render();toast('承認を解除しました。メモをもとに修正してください');},
'calendar-day':el=>{space().scheduleDate=el.dataset.value;save();render();},
'schedule':()=>{const s=space();if(!validApproval())return toast('現在の版を承認してから、投稿予定に追加してください');if(!s.scheduleDate||!s.scheduleTime)return toast('予定日と時刻を入力してください');if(s.queue.some(q=>q.idea===s.selected&&q.rev===s.rev&&q.date===s.scheduleDate&&q.time===s.scheduleTime&&q.platform===s.platform))return toast('同じ版・日時・媒体の予定は登録済みです');if(!capacity(s.queue,300))return;s.queue.push({id:uid('queue'),idea:s.selected,title:currentIdea().title,rev:s.rev,owner:s.approval.by,date:s.scheduleDate,time:s.scheduleTime,platform:s.platform,status:'承認済み・予定のみ',caption:s.caption,scenes:clone(s.scenes)});record('投稿予定を端末内に追加');render();toast('この端末の予定に追加しました。SNSには送信していません');},
'queue-detail':el=>{const q=space().queue.find(x=>x.id===el.dataset.id);if(q)modal('保存した投稿予定',`<h3>${esc(q.title)}</h3><p class="small muted" style="margin:10px 0">${esc(q.date)} ${esc(q.time)} JST ／ ${esc(q.platform)} ／ ${q.rev}版</p>${tag(q.status,q.status==='要再承認'?'tag-orange':'tag-green')}<div class="divider"></div><label>保存された投稿文</label><div style="white-space:pre-wrap;line-height:1.8">${esc(q.caption)}</div><p class="field-note">これは予定登録時点のコピーです。実際の投稿は行っていません。</p>`);},'remove-queue':el=>confirmAction('この予定を削除しますか？','削除するのは端末内の予定だけです。外部SNSに影響はありません。',()=>{space().queue=space().queue.filter(q=>q.id!==el.dataset.id);save();render();toast('予定を削除しました');}),
'analytics-platform':el=>{analyticsPlatform=el.dataset.value;render();},'analytics-window':el=>{analyticsWindow=el.dataset.value;render();},'add-metric':addMetricModal,'remove-metric':el=>{space().metrics=space().metrics.filter(x=>x.id!==el.dataset.id);save();render();toast('手動の記録を削除しました');},
'save-learning':()=>{const s=space(),r=experimentResult();if(!r.ready)return toast(r.text);if(!capacity(s.playbook))return;const metric=s.experiment.metric==='share'?'シェア率':'完了率';s.playbook.unshift({id:uid('learning'),title:`冒頭A／B：${metric}の観測を次へ`,pattern:'問いから始めるA ／ 結果を見せるB',evidence:`手入力の比較。${r.text} 視聴数A=${s.experiment.aViews}, B=${s.experiment.bViews}。教材の初期値が含まれる可能性あり。`,next:'別の投稿でも、冒頭以外を揃えて再検証する。',status:'要再検証',source:'手動の観測仮説／'+new Date().toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo'})});record('比較の学びを仮説として保存');toast('学びを保存しました。「勝ちパターン集」から企画に戻せます');},
'inbox-filter':el=>{inboxFilter=el.dataset.value;render();},'add-comment':addCommentModal,'draft-reply':el=>{const c=space().comments.find(x=>x.id===el.dataset.id);if(!c)return;c.reply=c.kind==='要確認'?'ご指摘ありがとうございます。確認したうえで、正しい内容をご案内します。':'コメントありがとうございます。ご質問の条件を担当者に確認したうえでご案内します。';save();render();toast('確認前でも使える返信のたたき台です。送信はしていません');},'comment-done':el=>{const c=space().comments.find(x=>x.id===el.dataset.id);if(c){c.done=!c.done;save();render();toast(c.done?'対応済みの記録に変更しました。返信送信はしていません':'未対応の記録に戻しました');}},
'comment-idea':el=>{const s=space(),c=s.comments.find(x=>x.id===el.dataset.id);if(!c||!capacity(s.ideas))return;s.ideas.unshift({id:uid('voice'),title:c.text.slice(0,120),type:'顧客の声',pattern:'質問 → 確認済みの実演 → 次の行動',why:'視聴者の不安を、実物や一次情報で解消する。',test:'一般説明ではなく一つの質問に答える。相談内容も確認。',source:'コメントから／架空または手入力',saved:true});record('顧客の声から企画を追加');navigate('ideas');toast('質問を企画ボードに追加しました');},
'playbook-idea':el=>{const s=space(),p=s.playbook.find(x=>x.id===el.dataset.id);if(!p||!capacity(s.ideas))return;s.ideas.unshift({id:uid('learn'),title:`${s.brief.product}：${p.title}`,type:'学びから',pattern:p.pattern,why:'前の制作から得た仮説を、別の条件でもう一度確かめる。',test:p.next,source:p.source,saved:true});record('学びから新しい企画を追加');navigate('ideas');toast('学びを次の企画につなげました');},
'evidence-tab':el=>{evidenceTab=el.dataset.value;render();},'reset-space':()=>confirmAction('このワークスペースを初期化しますか？','選択中の入力・台本・予定・分析記録を初期サンプルへ戻します。他のワークスペースは変更しません。必要なデータは先にJSONで書き出してください。',()=>{state.spaces[state.active]=makeSpace(state.active);if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=null;videoName='';save();render();toast('選択中のワークスペースを初期化しました');})};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(el){const fn=ACTIONS[el.dataset.action];if(fn){ev.preventDefault();fn(el);}}});
document.addEventListener('keydown',ev=>{const m=$('.modal');if(ev.key==='Escape'){closeModal();$('#sidebar').classList.remove('open');$('.mobile-toggle')?.setAttribute('aria-expanded','false');}if(ev.key==='Tab'&&m){const f=$$('button,input,select,textarea,a[href]',m).filter(x=>!x.disabled),a=f[0],b=f[f.length-1];if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();b?.focus();}else if(!ev.shiftKey&&document.activeElement===b){ev.preventDefault();a?.focus();}}});
document.addEventListener('input',ev=>{const e=ev.target,s=space();if(e.dataset.scene!==undefined){const i=Number(e.dataset.scene),k=e.dataset.key;if(k==='dur')return;stopPlay();changeContent();s.scenes[i][k]=e.value;activeScene=i;save();updatePhone();const label=$('#duration-label');if(label)label.textContent=totalSec()+'秒 · '+s.rev+'版';}
if(e.id==='research-search'){researchSearch=e.value;const pos=e.selectionStart;render();$('#research-search').focus();$('#research-search').setSelectionRange(pos,pos);}
if(e.id==='cover-title'){changeContent();s.coverTitle=e.value;save();$('#cover-preview-title').textContent=e.value;}
if(e.id==='caption'){changeContent();s.caption=e.value;save();$('#caption-count').textContent=e.value.length+'文字';}
if(e.id==='review-memo'){s.reviewMemo=e.value;save();}
if(e.dataset.reply){const c=s.comments.find(x=>x.id===e.dataset.reply);if(c){c.reply=e.value;save();}}
if(e.dataset.exp){const k=e.dataset.exp;s.experiment[k]=k==='metric'?e.value:e.value===''?null:Number(e.value);save();updateExperiment();}
if(e.dataset.task&&e.dataset.key==='owner'){const t=s.tasks.find(x=>x.id===e.dataset.task);if(t){t.owner=e.value;save();}}
});
document.addEventListener('change',async ev=>{const e=ev.target,s=space();if(e.id==='workspace-select'){stopPlay();if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=null;videoName='';state.active=e.value;activeScene=0;playSec=0;save();render();toast('ワークスペースを切り替えました');}
if(e.dataset.scene!==undefined&&e.dataset.key==='dur'){const n=Number(e.value);if(!Number.isInteger(n)||n<1||n>30){e.value=s.scenes[Number(e.dataset.scene)].dur;return toast('1カットの秒数は1〜30の整数です');}stopPlay();changeContent();s.scenes[Number(e.dataset.scene)].dur=n;save();updateSceneTime();}
if(e.id==='safe-toggle'){safeZone=e.checked;$('#safe-zone').classList.toggle('hidden',!safeZone);}
if(e.dataset.task&&e.dataset.key==='status'){const t=s.tasks.find(x=>x.id===e.dataset.task);if(t){t.status=e.value;save();render();}}
if(e.dataset.shot!==undefined){s.shots[Number(e.dataset.shot)]=e.checked;save();render();}
if(e.dataset.gate!==undefined){s.gates[Number(e.dataset.gate)]=e.checked;if(!e.checked){s.approval=null;s.queue.forEach(q=>{if(q.idea===s.selected)q.status='要再承認';});}save();const by=$('#reviewer').value;render();$('#reviewer').value=by;}
if(['schedule-date','schedule-time','schedule-platform'].includes(e.id)){const k={'schedule-date':'scheduleDate','schedule-time':'scheduleTime','schedule-platform':'platform'}[e.id];if(!e.value)return;if(!e.checkValidity())return toast('有効な予定日・時刻を入力してください');s[k]=e.value;save();render();}
if(e.id==='video-file'){const f=e.files[0];if(!f)return;if(f.size>100*1024*1024||!f.type.startsWith('video/')){e.value='';return toast('100MB以内の動画ファイルを選んでください');}if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=URL.createObjectURL(f);videoName=f.name;e.value='';changeContent();save();navigate('production');toast('端末の動画を開きました。外部には送信していません');$('#local-video').onerror=()=>toast('このブラウザでは動画を再生できません。形式を確認してください');}
if(e.id==='import-file'){const f=e.files[0];if(!f)return;e.value='';if(f.size>2*1024*1024)return toast('保存データは2MBまでです');try{const data=validate(JSON.parse(await f.text()));confirmAction('保存データを読み込みますか？','現在の3つのワークスペースを読み込んだデータに置き換えます。先に必要な内容をバックアップしてください。',()=>{stopPlay();state=data;if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=null;videoName='';activeScene=0;playSec=0;save();navigate('home');toast('保存データを読み込みました');});}catch{toast('保存データを読み込めません。MILLION LOOPから書き出したJSONを確認してください');}}
});
function readNum(form,name){const x=form.get(name);return x===null||String(x).trim()===''?null:Number(x);}
document.addEventListener('submit',ev=>{ev.preventDefault();const form=ev.target,f=new FormData(form),s=space();if(!form.checkValidity()){form.reportValidity();return;}
if(form.id==='brief-form'){const b={...s.brief};for(const key of ['name','product','audience','pain','value','evidence','avoid','goal','owner','cta'])b[key]=String(f.get(key)||'').trim();b.batch=Number(f.get('batch'));if(!b.name||!b.product)return toast('ブランド名と商品・サービス名を入力してください');if(!Number.isInteger(b.batch)||b.batch<1||b.batch>20)return toast('制作上限は1〜20本で入力してください');changeContent();s.brief=b;record('戦略を更新');render();toast('戦略を保存しました。既存台本は上書きせず残しています');}
if(form.id==='idea-form'){if(!capacity(s.ideas))return;s.ideas.unshift({id:uid('idea'),title:String(f.get('idea-title')).trim(),type:'オリジナル',pattern:String(f.get('idea-pattern')).trim(),why:String(f.get('idea-why')).trim(),test:String(f.get('idea-test')).trim(),source:'手動入力',saved:true});record('オリジナル企画を追加');closeModal();render();toast('企画を追加しました');}
if(form.id==='ref-form'){if(!capacity(s.observations,300))return;const url=String(f.get('ref-url')||'').trim();if(url&&!safeUrl(url))return toast('参照URLはhttpまたはhttpsで入力してください');const o={id:uid('ref'),title:String(f.get('ref-title')).trim(),pattern:String(f.get('ref-pattern')).trim(),hook:String(f.get('ref-hook')).trim(),body:'手動の観測メモ',cta:'未確認',platform:String(f.get('platform')),views:readNum(f,'views'),base:readNum(f,'base'),days:readNum(f,'days'),traffic:String(f.get('traffic')),theme:'purple',kind:'手動観測',limit:String(f.get('ref-limit')),url};s.observations.push(o);record('手動のリサーチ観測を追加');closeModal();render();toast('観測メモを保存しました。URLの自動取得はしていません');}
if(form.id==='metric-form'){if(!capacity(s.metrics,1000))return;const platform=String(f.get('platform')),m={id:uid('metric'),title:String(f.get('metric-title')).trim(),platform,window:String(f.get('window')),duration:readNum(f,'duration'),sample:false};for(const k of ['views','paid','engaged','saves','shares','dm','retention'])m[k]=readNum(f,k);if(platform!=='YouTube Shorts')m.engaged=null;s.metrics.push(m);analyticsPlatform=platform;analyticsWindow=m.window;record('分析指標を手動入力');closeModal();render();toast('手入力の実測値を追加しました。空欄は未入力のままです');}
if(form.id==='comment-form'){if(!capacity(s.comments))return;s.comments.unshift({id:uid('voice'),name:String(f.get('comment-title')).trim(),kind:String(f.get('kind')),text:String(f.get('comment-text')).trim(),reply:'',done:false});record('匿名の顧客の声を追加');closeModal();render();toast('顧客の声を保存しました');}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(NAV.some(x=>x[0]===h))navigate(h);});
view=NAV.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):'home';shell();
})();
</script></body></html>

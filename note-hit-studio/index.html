function renderPlan(){const p=project(),titles=p.titles.length?p.titles:generateTitles(p);return`${pageHeading('企画・タイトルラボ','THE EDITORIAL BRIEF','読者への約束が決まると、記事の軸がぶれなくなる。',button('企画を確定','confirm-brief','primary','','check'))}<div class="wide-split"><div class="stack"><section class="card"><div class="card-head"><h2>この記事で、何を届ける？</h2>${p.briefConfirmed?pill('企画を確定済み'):pill('企画中','neutral')}</div><div class="field"><label class="label" for="topic">記事のテーマ</label><input id="topic" data-field="topic" maxlength="120" value="${esc(p.topic)}" placeholder="例：AI時代に売れる社長の習慣"></div><div class="field"><label class="label" for="audience">誰に読んでほしい？</label><input id="audience" data-field="audience" maxlength="250" value="${esc(p.audience)}"></div><div class="field"><label class="label" for="pain">その人が抱えている悩み</label><textarea id="pain" data-field="pain" maxlength="500" style="min-height:86px">${esc(p.pain)}</textarea></div><div class="field"><label class="label" for="promise">読んだあと、どうなってほしい？</label><textarea id="promise" data-field="promise" maxlength="500" style="min-height:86px">${esc(p.promise)}</textarea></div><label class="label">記事の切り口</label><div class="idea-type">${[['practical','list','実践・ノウハウ','明日使える方法を届ける'],['story','quote','体験・ストーリー','実際の経験から伝える'],['opinion','bulb','考察・問い','いつもの見方を変える']].map(([v,ico,l,d])=>`<button class="${p.angle===v?'selected':''}" data-action="angle" data-value="${v}">${ic(ico,true)}<h4>${l}</h4><p>${d}</p></button>`).join('')}</div><div class="grid-2 section-space"><div class="field"><label class="label" for="goal">記事の役割</label><select id="goal" data-field="goal">${[['trust','信頼・ファンづくり'],['consult','相談・仕事につなげる'],['sales','有料記事・商品への入口']].map(([v,l])=>`<option value="${v}"${p.goal===v?' selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label class="label" for="author">著者名</label><input id="author" data-field="author" value="${esc(p.author)}" maxlength="60"></div></div></section><section class="card"><div class="card-head"><h2>タ function markdown(p=project()){const attached=new Map(p.assets.map(a=>[a.id,a]));let s=`# ${p.title}\n\n${p.author}\n\n`;const co=cover(p);if(co)s+=`![見出し画像](${assetFile(co)})\n\n`;s+=p.lead+'\n\n';for(const b of p.blocks){if(b.type==='text')s+='## '+b.heading+'\n\n'+b.text+'\n\n';else if(attached.has(b.assetId))s+=`![${(b.caption||'挿絵').replace(/[\[\]\n]/g,' ')}](${assetFile(attached.get(b.assetId))})\n\n`;if(b.evidenceId){const e=p.evidence.find(e=>e.id===b.evidenceId);if(e)s+=`参照：${e.title}${e.url?' — '+e.url:''}${e.verified?'':'（未確認）'}\n\n`;}}return s+p.cta+'\n';}

const crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(buf){let c=0xffffffff;for(const n of buf)c=crcTable[(c^n)&255]^(c>>>8);return(c^0xffffffff)>>>0;}
function zipFiles(files){const enc=new TextEncoder(),parts=[],centrals=[];let offset=0;for(const f of files){const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);const local=new Uint8Array(30+name.length),v=new DataView(local.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint16(12,0x21,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);local.set(name,30);const cen=new Uint8Array(46+name.length),cv=new DataView(cen.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x800,true);cv.setUint16(14,0x21,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);cen.set(name,46);parts.push(local,data);centrals.push(cen);offset+=local.length+data.length;}let size=centrals.reduce((s,c)=>s+c.length,0),end=new Uint8Array(22),ev=new DataView(end.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,size,true);ev.setUint32(16,offset,true);return new Blob([...parts,...centrals,end],{type:'application/zip'})}

async function uploadImage(file){if(!file)return;const p=project();if(p.assets.length>=MAX_ASSETS)throw Error('画像は12枚までです。不要な素材を削除してください');if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('PNG、JPEG、WebPのみ対応しています');if(file.size>4*1024*1024)throw Error('4MB以下の画像を選んでください');const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('画像を読み込めませんでした'));img.src=url});if(img.width>12000||img.height>12000)throw Error('画像の縦横は12000px以下にしてください');const c=document.createElement('canvas'),ratio=Math.min(1,1600/Math.max(img.width,img.height));c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const a={id:uid(),kind:'illustration',data:c.toDataURL('image/jpeg',.88),width:c.width,height:c.height,label:file.name.slice(0,160),prompt:'アップロードした素材。利用権を確認してください。',style:'upload',palette:'',origin:'upload',time:Date.now()};p.assets.unshift(a);selectedAssetId=a.id;touch();history('画像をアップロード（端末内処理）');nav('images');toast('素材を追加しました。サーバーには送信していません。')}finally{URL.revokeObjectURL(url)}}

 case'reset':return confirmModal('すべてのデータを初期化しますか？','このアプリの全記事と画像を削除します。必要なデータは先にJSONで保存してください。',()=>{state=initialState();seedAssets(project());imageConfig.headline=project().title;selectedAssetId='';persist();nav('home');toast('初期サンプルに戻しました')},'全て初期化');
 }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;if(el.dataset.action==='backdrop'&&e.target!==el)return;e.preventDefault();Promise.resolve(handleAction(el)).catch(err=>{console.error(err);toast('操作を完了できませんでした：'+(err.message||'再度お試しください'))})});
document.addEventListener('input',e=>{const el=e.target,p=project();if(el.id==='research-query'){researchFilter=el.value;$('#research-results').innerHTML=sourceCards(researchSources.filter(s=>(s.title+s.who+s.kind+s.point).toLowerCase().includes(researchFilter.toLowerCase())),p);return}if(el.id==='global-search'){$('#global-results').innerHTML=searchResults(el.value);return}if(el.dataset.imageField){imageConfig[el.dataset.imageField]=el.dataset.imageField==='count'?Number(el.value):el.value;return}if(el.dataset.check){p.checks[el.dataset.check]=el.checked;p.publishReviewed=false;p.exported=false;touch(false);render();return}if(el.dataset.block){const b=p.blocks.find(b=>b.id===el.dataset.block);if(b&&['heading','text','caption','evidenceId'].includes(el.dataset.key)){b[el.dataset.key]=el.value;touch();if(el.tagName==='TEXTAREA'){el.style.height='auto';el.style.height=Math.min(800,el.scrollHeight)+'px'}}return}const key=el.dataset.field;if(key==='switch-project'){if(state.projects.some(p=>p.id===el.value)){state.active=el.value;selectedAssetId='';imageConfig.headline=project().title;persist();render()}return}if(key&&['title','topic','audience','pain','promise','author','tags','cta','lead','experiment','goal','publishDate','publishTime','externalSNS'].includes(key)){const value=el.type==='checkbox'?el.checked:el.value;if(p[key]===value)return;p[key]=value;if(['topic','audience','pain','promise','goal'].includes(key))p.briefConfirmed=false;if(key==='title')p.titleChosen=false;if(key==='experiment')p.experimentSaved=false;touch(!['experiment','publishDate','publishTime','externalSNS'].includes(key));if(key==='externalSNS')render();}});
document.addEventListener('change',e=>{if(e.target.id==='import-file')importBackup(e.target.files[0]).catch(err=>toast('読み込めませんでした：'+err.message));if(e.target.id==='upload-file')uploadImage(e.target.files[0]).catch(err=>toast(err.message));});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();persist(true);return}if(e.key==='Escape'){if($('.modal'))closeModal();else{document.body.classList.remove('presentation');$('#sidebar')?.classList.remove('open')}return}if(e.key==='Tab'&&$('.modal')){const els=$$('button:not([disabled]),a[href],input:not([disabled]),textarea,select,[tabindex="0"]',$('.modal'));if(!els.length)return;if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});
window.addEventListener('beforeunload',()=>persist());
try{if(!project().assets.length&&project().lead)seedAssets(project());persist();render()}catch(e){console.error(e);$('#app').innerHTML='<main style="padding:40px"><h1>起動に問題がありました</h1><p>ブラウザを再読み込みしてください。保存済みデータは削除しないでください。</p></main>';}
</script></body></html>

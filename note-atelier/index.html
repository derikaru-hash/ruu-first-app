function renderAnalytics(){const q=p(),m=q.metrics[metricPeriod],has=METRIC_NAMES.some(([k])=>m[k]!==null);const ratio=m.views>0&&m.likes!==null?(m.likes/m.views*100).toFixed(1)+'%':'—';let insight=!has?'まず同じ期間の数値を記録しましょう。空欄はゼロではなく、まだ分からない状態です。':m.views===0?'ビューが0のため、比率は算出しません。集計期間や公開状態を先に確認してください。':m.consultations===0?'相談が0だった理由は、この数字だけでは特定できません。まず読後の案内が見つかるかを確認する、という仮説から。':'数値と読者の言葉を並べ、次は何を一つ変えるかを決めましょう。数字だけで原因は断定できません。';return `${head('07 / LEARNING LOOP','反応を、次の企画の材料に。','スキ、表示、売上を混同しない。数字の隣に、読者の言葉を残す。',btn('サンプルで体験','sample-metrics','chart'))}<div class="between wrap" style="margin-bottom:18px"><div class="tabs">${[['24h','公開後24時間'],['7d','公開後7日'],['30d','公開後30日']].map(([id,t])=>`<button data-action="metric-period" data-id="${id}" class="${metricPeriod===id?'active':''}">${t}</button>`).join('')}</div><div class="row">${pill(m.source==='sample'?'サンプル数値・実績ではありません':'手動入力・note未接続',m.source==='sample')}${btn('数値をクリア','clear-metrics','','ghost compact')}</div></div><div class="notice" style="margin-bottom:18px">note全体ビュー・SNS表示・スキ・売上は別の指標です。全体ビューを読了人数として扱いません。空欄は「未入力」、0は「測定して0」です。期間は公開からの累計でそろえてください。</div>
<div class="grid3 metric-inputs">${METRIC_NAMES.map(([key,title,unit])=>`<div class="card metric-input"><div class="minihead">${title} <span style="float:right">${unit}</span></div><div class="statvalue"><input type="number" min="0" max="1000000000000" step="1" data-metric="${key}" aria-label="${title}" value="${m[key]??''}" placeholder="未入力"></div><div class="small muted">${m.source==='sample'?'架空の体験データ':'同一記事・同一期間の値'}</div></div>`).join('')}</div><div class="spacer"></div><div class="mainaside"><div class="stack"><section class="card"><div class="between"><h3>記録した反応の変化</h3>${pill('note 全体ビュー')}</div><div class="spacer"></div>${analyticsChart()}<div class="small muted" style="margin-top:12px">同じ記事の累計値です。サンプルの数値を編集してもサンプル扱いです。実績の入力前に各期間の「数値をクリア」を使ってください。施策の因果効果を示すグラフではありません。</div></section><section class="card"><h3>数字の向こうの、読者の言葉。</h3><div class="spacer"></div>${field('届いた言葉・よく聞かれた質問','metric.note',m.note,'個人情報は取り除き、公開を許可された範囲で。',true,'例：「明日やる仕事を一つ決める、という話が印象に残った」')}${field('次に変えることは、一つだけ','metric.experiment',m.experiment,'例：本文は変えず、読後の案内を一文に絞る。結果の比較では集計条件も残す。',true)}${field('次の記事の種','nextIdea',q.nextIdea,'今回答えきれなかった問いを、次の企画へ。',false,'例：AIで終わらせる「最初の一件」は、どう選ぶ？')}${btn('この種で新しい記事をつくる','next-project','arrow','primary')}</section></div><aside class="stack"><section class="card soft"><div class="eyebrow">THE NEXT EXPERIMENT</div><h3 style="margin:11px 0">次に確かめたいこと。</h3><p style="font-size:12px" id="metric-insight">${e(insight)}</p><div class="recommend">一度に全部変えない。<br>次の検証を、一つだけ。</div></section><section class="card"><div class="eyebrow">REFERENCE RATIO</div><div class="statvalue" style="margin:12px 0" id="metric-ratio">${ratio}</div><div class="small">スキ ÷ note全体ビュー</div><p class="small muted">参考比率です。読了率・購入率・実読者の反応率ではありません。母数が0または未入力なら計算しません。</p><hr class="divider"><div class="small muted">記事売上と関連事業売上は別管理です。月商目標と一記事の累計売上を、そのまま比較しません。</div></section></aside></div>`}
function analyticsChart(){const data=['24h','7d','30d'].map(k=>p().metrics[k].views),available=data.filter(x=>x!==null);if(!available.length)return `<div class="empty-chart">${icon('chart')}<div>まだ、記録がありません。<br><span class="small">実測値を入れるか、サンプルで体験してください。</span></div></div>`;const max=Math.max(1,...available),pts=data.map((v,i)=>v===null?null:[50+i*280,165-v/max*135]);return `<svg class="chart" viewBox="0 0 660 210" role="img" aria-label="記録した累計ビューの推移"><path d="M50 30H610M50 75H610M50 120H610M50 165H610" fill="none" stroke="#e4e8dc"/>${pts.map((pt,i)=>pt&&pts[i-1]?`<path d="M${pts[i-1][0]} ${pts[i-1][1]}L${pt[0]} ${pt[1]}" stroke="#7e9a64" stroke-width="3"/>`:'').join('')}${pts.map((pt,i)=>pt?`<circle cx="${pt[0]}" cy="${pt[1]}" r="5" fill="#496b3e"/><text x="${pt[0]}" y="${Math.max(17,pt[1]-14)}" text-anchor="middle" fill="#557447" font-size="12">${fmt(data[i])}</text>`:'').join('')}<text x="50" y="198" text-anchor="middle" fill="#88977b" font-size="11">24時間</text><text x="330" y="198" text-anchor="middle" fill="#88977b" font-size="11">7日</text><text x="610" y="198" text-anchor="middle" fill="#88977b" font-size="11">30日</text></svg>`}
function renderMethod(){return `${head('THE THINKING BEHIND THE PRODUCT','再現するのは、才能よりも手順。','公開された実践と公式分析をもとに、独自に組み合わせた編集ワークフローです。')}<section class="card soft"><div class="eyebrow">WHAT THIS IS — AND IS NOT</div><h2 style="margin:12px 0">「ヒットする魔法」ではなく、<br>良い記事を繰り返し育てる、編集の仕組み。</h2><p style="font-size:12px">特定の書き手の全工程を内部取材したものではありません。本人が公開した制作方法と、note公式の分析・仕様を参照し、企画・制作・検証の流れとして独自に統合しています。成果の因果関係や再現確率は検証していません。</p><div class="row wrap">${pill('文体・記事をコピーしない')}${pill('架空の実績をつくらない')}${pill('公開は人が決める')}</div></section><div class="sectionhead"><h2>調査の根拠と、アプリへの反映</h2><span class="small muted">確認日 ${VERIFIED}</span></div><section class="card" style="padding:0;overflow:hidden"><div class="table-wrap"><table class="data-table"><thead><tr><th>出典・公表日</th><th>読み取れる実践</th><th>アプリに取り入れたもの</th><th>限界</th></tr></thead><tbody>${SOURCES.map(s=>`<tr><td><a href="${e(s.url)}" target="_blank" rel="noopener noreferrer">${e(s.name)} ↗</a><br><span class="small muted">${e(s.published)}</span></td><td>${e(s.summary)}</td><td>${e(s.apply)}</td><td>${e(s.limit)}</td></tr>`).join('')}</tbody></table></div></section>
<div class="sectionhead"><h2>実際に動くものと、これからつなぐもの。</h2></div><div class="grid2"><section class="card"><h3>このデモで実装済み</h3><p class="small">記事の新規作成と切替、読者・企画の編集、出典メモ、原稿の編集と並べ替え、版の保存と復元、限定的なルール確認、テンプレート画像描画、本文への配置、PNG・HTML・ZIP書き出し、手動の反応記録、ブラウザ内保存。</p>${pill('通信・課金は発生しません')}</section><section class="card"><h3>本番で別途必要な接続</h3><p class="small">検索APIと取得日時付きの根拠管理、文章生成API、画像生成API、認証と権限、クラウド保存、使用量と料金の上限、承認と操作記録。APIキーはサーバーに置き、ブラウザには渡さない設計が必要です。</p>${pill('文章AI・画像AI・noteは未接続',true)}</section></div><div class="notice" style="margin-top:22px">このデモに機密や第三者の個人情報を入力しないでください。データはこのブラウザ内のみに保存され、端末間では同期しません。制作セットを定期的に書き出せます。本アプリはnote公式製品・提携サービスではありません。</div>`}

function toast(message){let el=document.getElementById('toast');if(!el)return;el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),4200)}
function go(to){if(!ROUTES.some(r=>r[0]===to))return;route=to;history.pushState(null,'','#'+route);render();window.scrollTo({top:0,behavior:'instant'})}
function render(){const q=p(),name=ROUTES.find(r=>r[0]===route)?.[1]||'ワークスペース',done=stageDone();document.getElementById('app').innerHTML=`<aside class="side" id="sidebar"><div class="brand"><div class="brandmark">n</div><div><div class="brandname">note atelier<span style="color:#d6e4aa">.</span></div><div class="brandsub">YOUR PERSONAL EDITORIAL TEAM</div></div></div><div class="navcap">CREATE YOUR NEXT STORY</div><nav class="nav" aria-label="メインナビゲーション">${ROUTES.map(([id,t,ic],i)=>`<button data-go="${id}" class="${route===id?'active':''}" ${route===id?'aria-current="page"':''}>${icon(ic)}<span>${t}</span>${i>0&&i<8?`<span class="navnum">0${i}</span>`:''}</button>`).join('')}</nav><div class="sidebottom"><div class="side-note"><div class="between"><span>この記事の制作</span><span>${progressCount()} / 8</span></div><div class="progress"><span style="width:${progressCount()/8*100}%"></span></div><div style="margin-top:9px;color:#94ab98">一つずつ、届く記事に。</div></div><div class="side-profile"><div class="avatar">R</div><div><div>RUU EDITORIAL</div><div style="color:#91a992;font-size:9px;margin-top:3px">Personal workspace · Demo</div></div></div></div></aside><div class="mobile-overlay" data-action="menu-close"></div><div class="layout"><header class="topbar"><div class="row"><button class="iconbtn mobile-menu" data-action="menu" aria-label="メニューを開く" aria-expanded="false">${icon('menu')}</button><div class="breadcrumbs"><span class="workspace-label">My workspace</span><span class="crumb-separator">/</span><select class="project-select" id="project-switch" aria-label="作業する記事を選ぶ">${state.projects.map(pr=>`<option value="${pr.id}" ${pr.id===q.id?'selected':''}>${e(pr.title||'無題の記事')}</option>`).join('')}</select><span class="crumb-separator">/</span><strong class="crumb-current">${e(name)}</strong></div></div><div class="row actions"><span class="save-status">${saveFailed?'保存不可・書き出してください':'このブラウザに保存'}</span><button class="btn" data-action="preview" aria-label="記事をプレビュー">${icon('eye')}<span class="preview-label">プレビュー</span></button><button class="btn primary" data-action="export" aria-label="制作セットを書き出す">${icon('down')}<span class="export-label">書き出す</span></button></div></header><div class="demo-strip"><div class="row" style="gap:7px"><span class="dot"></span><span>INTERACTIVE DEMO</span><span class="detail-text">／ 文章AI・画像AI・note未接続</span></div><button data-action="about">外部送信なし・課金なし ${icon('info')}</button></div><div class="content fadein" id="page-content">${({home:renderHome,research:renderResearch,brief:renderBrief,editor:renderEditor,review:renderReview,visual:renderVisual,publish:renderPublish,analytics:renderAnalytics,method:renderMethod}[route]||renderHome)()}<footer class="footnote"><span><span class="logo-footer">note atelier.</span> ひとつの考えが、誰かの一歩になる。</span><span>v${VERSION} · 非公式の体験デモ · ブラウザ内保存</span></footer></div></div>`;paintCanvases();autoSize();document.title=name+' | note atelier';}
function autoSize(){document.querySelectorAll('textarea[data-section]').forEach(t=>{t.style.height='auto';t.style.height=Math.max(120,t.scrollHeight+2)+'px'})}
function updateStats(){for(const id of ['editor-count','side-wordcount']){let el=document.getElementById(id);if(el)el.textContent=fmt(words())+(id==='editor-count'?'文字':'')}const ratio=document.getElementById('metric-ratio');if(ratio){const m=p().metrics[metricPeriod];ratio.textContent=m.views>0&&m.likes!==null?(m.likes/m.views*100).toFixed(1)+'%':'—'}}
function showModal(title,content,foot='',large=false){closeModal(false);modalReturn=document.activeElement;const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop"><section class="modal ${large?'large':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${title}</h2><button class="iconbtn modalclose" data-action="modal-close" aria-label="閉じる">${icon('close')}</button></div>${content}${foot?`<div class="modal-foot">${foot}</div>`:''}</section></div>`;document.body.style.overflow='hidden';setTimeout(()=>root.querySelector('input:not([type=hidden]),textarea,button')?.focus(),0)}
function closeModal(restore=true){document.getElementById('modal-root').innerHTML='';document.body.style.overflow='';if(restore&&modalReturn&&document.contains(modalReturn))modalReturn.focus();modalReturn=null}
function confirmAction(title,text,action,extra=''){showModal(title,`<p style="font-size:13px">${text}</p>`,btn('戻る','modal-close')+btn('続ける',action,'arrow','primary',extra))}
function saveVersion(label='手動保存'){const q=p();q.versions.unshift({id:uid(),date:new Date().toISOString(),label,title:q.title,sections:JSON.parse(JSON.stringify(q.sections))});q.versions=q.versions.slice(0,12);save()}
function showVersions(){const list=p().versions;showModal('原稿の保存した版',`<p class="small muted">最大12版。タイトルと本文・見出しを復元します。画像や企画設定は戻しません。</p>${list.length?list.map((v,i)=>`<div class="project-card"><div class="grow"><strong style="font-size:12px">${e(v.label)}</strong><div class="small muted">${new Date(v.date).toLocaleString('ja-JP')} ／ ${e(v.title)}</div></div>${btn('復元','restore-version','undo','compact',`data-id="${v.id}"`)}</div>`).join(''):'<div class="inline-empty">まだ保存した版がありません。エディターの「版を保存」で残せます。</div>'}`)}
function showNew(topic=''){showModal('新しい一記事を、はじめよう。',`<p class="small muted">今の記事はこのブラウザに残し、新しいプロジェクトを作成します。</p><form data-form="new"><div class="field"><label for="new-topic">書きたいテーマ</label><input id="new-topic" name="topic" value="${e(topic)}" required maxlength="120" placeholder="いま、誰かに伝えたいこと"></div><button type="submit" class="btn primary wide">企画づくりをはじめる ${icon('arrow')}</button></form>`)}
function showGoals(){const q=p();showModal('数字は、目標として置く。',`<p class="small muted">目標値であって、到達の保証や予測ではありません。月間売上はnoteを起点とする記事・関連事業売上の合計目標です。一記事の累計実績とは別に管理します。</p><form data-form="goals">${[['likes','1記事あたりのスキ'],['impressions','1記事告知のSNS表示回数'],['revenue','月間売上の目標（円）']].map(([k,t])=>`<div class="field"><label for="goal-${k}">${t}</label><input id="goal-${k}" type="number" min="0" max="1000000000000" step="1" name="${k}" value="${q.targets[k]}" required></div>`).join('')}<button type="submit" class="btn primary wide">目標を保存</button></form>`)}
function showAddSource(){showModal('この記事の根拠を追加',`<p class="small muted">URLの本文を自動取得しません。原典を開き、確かめたい主張を自分で記録してください。</p><form data-form="source"><div class="field"><label for="src-title">資料のタイトル</label><input id="src-title" name="title" required maxlength="180"></div><div class="field"><label for="src-url">出典URL（https://）</label><input id="src-url" name="url" type="url" required placeholder="https://" maxlength="1500"></div><div class="grid2"><div class="field"><label for="src-type">資料の種類</label><select id="src-type" name="type"><option>公式発表・統計</option><option>本人の一次発信</option><option>取材・二次資料</option><option>自分の記録</option></select></div><div class="field"><label for="src-date">資料の日付・確認日</label><input id="src-date" name="date" type="date" value="${VERIFIED}"></div></div><div class="field"><label for="src-claim">本文で使う事実・数字、確かめたい点</label><textarea id="src-claim" name="claim" required maxlength="3000" placeholder="資料がどこまで支持しているか、制約も残します。"></textarea></div><div class="notice warm">保存時は「確認待ち」です。保存しただけで根拠を確認済みにはしません。</div><div class="spacer"></div><button type="submit" class="btn primary wide">根拠メモを追加</button></form>`)}
function sourceDetail(id){const s=SOURCES.find(s=>s.id===id);if(!s)return;showModal(e(s.name)+'の実践から',`<div class="row wrap">${pill(e(s.tag))}<span class="small muted">${e(s.published)} ／ 確認 ${VERIFIED}</span></div><h3 style="margin:18px 0">${e(s.title)}</h3><div class="source-detail-quote">${e(s.summary)}</div><h3 style="margin:22px 0 10px;font-size:14px">このアプリでは</h3><p style="font-size:12px">${e(s.apply)}</p><div class="notice warm">${e(s.limit)}</div><p class="small muted">本文の転載ではなく、制作手順の要約です。本人の全ワークフローを再現できたという意味ではありません。</p>`,ext('出典を開く',s.url,'btn')+btn(p().methods.includes(id)?'採用を外す':'この知恵を採用','adopt','check','primary',`data-id="${id}"`))}
function meeting(){const b=p().brief;showModal('小さな編集会議',`<div class="notice">4つの観点による入力チェックです。AI同士が実際に議論しているわけではありません。</div>${[['E','編集長',b.reader&&b.promise?'読者と読後の変化は言語化されています。本文で、その約束を回収できる構成にしましょう。':'まず、誰がどうなれる記事かを一文にしましょう。'],['R','読者の立場',b.pain?`「${b.pain}」という悩みに、導入で呼びかけられていますか？`:'どんな場面で困っている人なのか、もう少し具体的に。'],['F','事実確認',b.experience?'一次体験メモがあります。日時・数字・第三者の話が正確かを確認してください。':'あなた自身の体験がまだありません。AIで作り足さず、思い出せる場面を記録しましょう。'],['B','事業・導線',b.goal==='consulting'?'相談につなげる前に、読者が自分で試せる一歩を渡しましょう。連絡の案内は一つに。':b.goal==='paid'?'無料部分で持ち帰れる価値と、有料部分で追加される内容を分けて示しましょう。':'今回の記事と次の記事をつなぐ、読者の問いを一つ残しましょう。']].map(([l,t,d])=>`<div class="reviewer"><div class="avatar">${l}</div><div><h4>${t}</h4><p>${e(d)}</p></div></div>`).join('')}`,btn('企画を整える','modal-close','edit','primary'))}
function createDraft(){saveVersion('テンプレート展開前');const q=p(),b=q.brief,isEssay=b.genre==='essay';q.sections=[{id:uid(),heading:isEssay?'この話を書こうと思ったきっかけ':'はじめに：こんなことに困っていませんか',text:`${b.reader||'この記事を読んでいるあなた'}へ。\n\n「${b.pain||'なぜ、思うように進まないのだろう'}」。この記事では、${b.topic}というテーマから、この問いを考えます。\n\n持ち帰ってほしいのは、${b.promise||'次の一歩を選ぶためのヒント'}ということです。`},{id:uid(),heading:isEssay?'そのとき、何が起きていたか':'自分の現場から見えたこと',text:b.experience||'【ここに本人の実体験を記入してください】\nいつ、何が起きたのか。どこで迷ったのか。相手は何と言ったのか。体験していないことを、成功談として作らないようにします。'},{id:uid(),heading:isEssay?'自分なりに、考えたこと':'調べて分かったこと、まだ分からないこと',text:q.evidence.length?q.evidence.map(s=>`${s.claim}\n出典：${s.title}\n${s.url}\n${s.verified?'（人による原典確認を記録済み）':'（確認待ち。公開前に原典との照合が必要です）'}`).join('\n\n'):'【このテーマに必要な根拠を記入してください】\n事実と自分の意見、説明のための仮想例を分けます。出典がない数字や、成果の保証は書きません。'},{id:uid(),heading:isEssay?'あなたなら、どう感じるだろう':'次の一歩を、小さく決める',text:`${b.unique||'自分の立場から見えたこと'}を、${b.reader||'読者'}の行動につなげて考えます。\n\n【ここを具体化してください】\n何を、どの順番で試すのか。人が確認するところはどこか。うまくいかなかったときはどうするか。\n\n万能な答えではなく、自分の条件で判断できる材料を渡します。`},{id:uid(),heading:'おわりに',text:`${b.topic}について、ここまで考えてきました。\n\n${b.promise||'明日の一歩につながるヒント'}を、あなた自身の場面で試してみてください。\n\n${b.cta||'あなたなら、どの一歩から始めますか？'}`}];q.assets.forEach(a=>{if(a.type==='inline')a.position=''});invalidate();q.isSample=false;save();closeModal();go('editor');toast('入力を型に展開しました。確認欄を、ご自身の文章で仕上げてください。')}
function plainArticle(markdown=false){const q=p(),parts=[(markdown?'# ':'')+q.title,''];if(markdown&&q.cover)parts.push(`![記事バナー](cover.png)`,'');q.sections.forEach(s=>{parts.push((markdown?'## ':'')+s.heading,'',s.text,'');q.assets.filter(a=>a.type==='inline'&&a.position===s.id).forEach(a=>{if(markdown)parts.push(`![${a.text.replace(/[\[\]]/g,'')}](illustration-${q.assets.indexOf(a)+1}.png)`,'')})});return parts.join('\n')}
function articleMarkup(){const q=p(),cover=q.assets.find(a=>a.id===q.cover);return `${cover?`<img src="${artData(cover)}" alt="${e(cover.text)}">`:''}<h1>${e(q.title)}</h1><div class="byline">あなたの原稿 ／ 未公開 ／ ${fmt(words())}文字</div>${q.sections.map(s=>`<section><h2>${e(s.heading)}</h2>${s.text.split(/\n\n+/).map(t=>`<p>${e(t)}</p>`).join('')}${q.assets.filter(a=>a.type==='inline'&&a.position===s.id).map(a=>`<figure><img src="${artData(a)}" alt="${e(a.text)}"><figcaption>${e(a.text)} ／ テンプレート描画</figcaption></figure>`).join('')}</section>`).join('')}`}
function exportedHtml(){return `<!DOCTYPE html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>${e(p().title)}</title><style>body{margin:0;background:#f3f4ee;color:#253c31;font-family:-apple-system,BlinkMacSystemFont,'Yu Gothic',Meiryo,sans-serif}main{max-width:740px;margin:25px auto;padding:35px;background:white}img{width:100%;height:auto}h1{font-size:30px;line-height:1.7}h2{font-size:22px;margin-top:35px}p{line-height:2;white-space:pre-wrap;overflow-wrap:anywhere}figure{margin:25px 0}figcaption,.byline{font-size:11px;color:#798773}.notice{font-size:12px;background:#ecf0e2;padding:13px;line-height:1.8;margin-bottom:20px}@media(max-width:600px){main{margin:0;padding:23px}h1{font-size:26px}h2{font-size:20px}}</style><main><div class="notice">note atelierの制作プレビュー・未公開。原稿と画像の最終確認は本人が行ってください。これはnote上の表示を保証するものではありません。</div>${articleMarkup()}</main></html>`}
function showPreview(){showModal('読者の目線で、読んでみる。',`<div class="preview-toggle"><div class="tabs"><button data-action="preview-device" data-id="desktop" class="${previewDevice==='desktop'?'active':''}">${icon('desktop')} PC</button><button data-action="preview-device" data-id="phone" class="${previewDevice==='phone'?'active':''}">${icon('phone')} スマホ</button></div></div><div class="small muted" style="text-align:center;margin-bottom:16px">note風の読書確認画面です。noteの実表示と完全に同じではありません。</div><article class="reading-preview ${previewDevice==='phone'?'phone':''}">${articleMarkup()}</article>`,btn('編集に戻る','modal-close','edit'),true)}
function about(){showModal('あなた専用の、小さな編集部。',`<div class="notice warm">体験デモ v${VERSION} ／ 文章AI・画像生成AI・note連携は未接続です。</div><h3 style="margin:22px 0 10px">動かせること</h3><p style="font-size:12px">リサーチ資料の採用、読者と企画の編集、原稿の作成・修正、出典メモ、人による確認、画像テンプレートの描画、バナーと挿絵の配置、PNG・HTML・制作ZIPの出力、手入力での反応記録ができます。</p><h3 style="margin:20px 0 10px">このデモで、しないこと</h3><p style="font-size:12px">ライブ検索、URL本文の自動取得、AIによる自由な文章・人物・風景生成、note下書き保存・公開、SNS投稿、決済、サーバーへの保存は行いません。</p><div class="notice">入力はこのブラウザのローカル保存です。機密情報を入れないでください。ブラウザのデータ削除で失われるため、制作セットのバックアップを推奨します。別端末との同期はありません。</div>`,goBtn('設計の根拠を見る','method','book')+btn('体験をはじめる','modal-close','arrow','primary'))}
async function exportKit(){toast('原稿と画像を制作セットにまとめています。');const q=p(),files=[{name:'article.txt',data:plainArticle()},{name:'article.md',data:plainArticle(true)},{name:'preview.html',data:exportedHtml()},{name:'project.json',data:JSON.stringify({version:1,project:q},null,2)},{name:'sources.json',data:JSON.stringify({checked:VERIFIED,editorialMethods:SOURCES.filter(s=>q.methods.includes(s.id)),articleEvidence:q.evidence},null,2)},{name:'social.txt',data:['X','Threads','Instagram'].map(s=>s+'\n\n'+socialText(s)).join('\n\n---\n\n')},{name:'image-prompts.txt',data:q.assets.map((a,i)=>`画像 ${i+1}\n用途：${a.type}\n文字：${a.text}\nスタイル：${a.style}\n本番AI用メモ：${a.prompt||''}\n`).join('\n')},{name:'README.txt',data:`note atelier v${VERSION} 制作セット\n\n状態：${checks().every(c=>c.pass)?'本人の制作チェック通過':'未確認項目あり・作業中'}\nAI・note未接続の体験デモから書き出しました。\narticle.txt / article.md：編集原稿\npreview.html：画像入りの確認用プレビュー\ncover.png / illustration-番号.png：バナー・挿絵\nproject.json：編集状態のバックアップ。アプリの記事切替画面から復元できます。\nsources.json：編集ノウハウと本文の出典を区別した根拠メモ\n本文・根拠・引用・画像の使用権限・機密情報を確認してから本人がnoteへ移してください。自動公開はしていません。\n数値は手入力またはサンプルです。ヒットや売上を保証しません。\n${q.isSample?'原稿には教材用のサンプル・仮想例を含みます。実績として公開しないでください。':''}\n` }];q.assets.forEach((a,i)=>{if(a.id===q.cover||a.type==='inline')files.push({name:a.id===q.cover?'cover.png':`illustration-${i+1}.png`,data:bytesFromDataURL(artData(a))})});downloadBlob(zipStore(files),'note-atelier-kit.zip');toast('制作セットを書き出しました。自動投稿はしていません。')}
function imagePrompt(){const v=p().visual;return `記事タイトル：${p().title}\n読者：${p().brief.reader}\n伝える価値：${p().brief.promise}\n用途：${v.type==='cover'?'見出しバナー 1280×670 px':'本文挿絵 1200×800 px'}\n世界観：${v.style}\n画像指示：${v.prompt}\n画像内の文字：${v.text||p().title}\n文字は正確に後から組版する想定。重要要素は余白を取り、読みやすさを優先。実在人物の似顔絵や第三者ロゴは、許可と素材を確認するまで使用しない。\nこの指示は本番画像生成API向けの制作メモです。デモではAPIを実行しません。`}
function researchPrompt(){return `note記事の企画リサーチをしてください。\nテーマ：${p().brief.topic}\n想定読者：${p().brief.reader}\n読者の悩み：${p().brief.pain}\n\n1. 読者が実際に困っている問いを仮説として整理。\n2. 関連する公式発表・原典を検索し、公表日・確認日・URL・支持する事実・限界を記録。\n3. 同テーマの公開記事を調べ、著者・公開日・確認時点で見える反応・導入・構成・持ち帰れる価値・未回答の問いを比較。非公開の閲覧数や収益は推定しない。\n4. ヒットの理由を事実ではなく仮説として分ける。既存の人気、拡散経路、公開時期、無料/有料などの違いにも注意。\n5. 本人の実体験として追加取材が必要な質問を3つ出す。\n6. 既存記事の文体や表現をコピーせず、独自の切り口を3案提案。\n有料部分を無断取得せず、アクセスできた公開範囲だけを扱う。検索できないときは調査済みと主張しない。`}
function validURL(value){try{const u=new URL(value);return u.protocol==='https:'&&!u.username&&!u.password}catch(err){return false}}
function projectList(){showModal('育てている記事',`<p class="small muted">記事はこのブラウザに保存されます。機密や個人情報は入力しないでください。</p>${state.projects.map(pr=>`<button class="project-card" data-action="switch-project" data-id="${pr.id}"><span><strong style="font-size:13px">${e(pr.title||'無題の記事')}</strong><br><span class="small muted">${pr.isSample?'体験用サンプル':'あなたの下書き'} ／ ${pr.sections.length}ブロック</span></span><span>${pr.id===state.active?'✓':'↗'}</span></button>`).join('')}<hr class="divider"><label for="project-import">バックアップを復元（このアプリの project.json）</label><input id="project-import" type="file" accept="application/json,.json" data-import="project"><div class="small muted" style="margin-top:9px">既存の記事は上書きせず、別の記事として読み込みます。</div>`,btn('新しい記事','new','plus','primary'))}
function safeImportedProject(obj){if(!obj||obj.version!==1||!obj.project)throw Error('このアプリのproject.jsonではありません。');const pr=obj.project;if(typeof pr.title!=='string'||!pr.brief||!Array.isArray(pr.sections)||!Array.isArray(pr.assets))throw Error('必要な記事データがありません。');if(pr.sections.length<1||pr.sections.length>30||pr.assets.length>30)throw Error('ブロックや画像が上限を超えています。');const q=newProject(pr.title.slice(0,160)),keys=Object.keys(q.brief);for(const k of keys){if(k==='price'){const x=Number(pr.brief[k]);q.brief[k]=Number.isFinite(x)&&x>=0?Math.min(x,1000000):500}else if(typeof pr.brief[k]==='string')q.brief[k]=pr.brief[k].slice(0,12000)}if(q.brief.ctaUrl&&!validURL(q.brief.ctaUrl))q.brief.ctaUrl='';q.sections=pr.sections.map(s=>{if(typeof s.text!=='string'||typeof s.heading!=='string')throw Error('原稿データの形式が不正です。');return{id:String(s.id||uid()).replace(/[^a-zA-Z0-9-]/g,'').slice(0,60)||uid(),heading:s.heading.slice(0,150),text:s.text.slice(0,20000)}});q.methods=(pr.methods||[]).filter(id=>SOURCES.some(s=>s.id===id));q.evidence=(pr.evidence||[]).filter(s=>s&&typeof s.title==='string'&&typeof s.url==='string'&&validURL(s.url)).slice(0,50).map(s=>({id:uid(),title:s.title.slice(0,180),url:s.url.slice(0,1500),claim:String(s.claim||'').slice(0,3000),type:String(s.type||'').slice(0,50),date:String(s.date||'').slice(0,50),verified:false}));q.assets=pr.assets.filter(a=>a&&['cover','inline'].includes(a.type)&&typeof a.text==='string').map(a=>({id:String(a.id||uid()).replace(/[^a-zA-Z0-9-]/g,'').slice(0,60),type:a.type,text:a.text.slice(0,250),prompt:String(a.prompt||'').slice(0,12000),diagram:String(a.diagram||'').slice(0,300),style:PALETTES[a.style]?a.style:'editorial',variant:Math.max(0,Math.min(2,Number(a.variant)||0)),position:q.sections.some(s=>s.id===a.position)?a.position:''}));q.cover=q.assets.some(a=>a.id===pr.cover&&a.type==='cover')?pr.cover:null;for(const period of ['24h','7d','30d']){const old=pr.metrics?.[period];if(old){for(const [key]of METRIC_NAMES){const v=old[key];q.metrics[period][key]=v!==null&&v!==''&&typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=1e12?v:null}q.metrics[period].note=String(old.note||'').slice(0,12000);q.metrics[period].experiment=String(old.experiment||'').slice(0,12000);q.metrics[period].source=old.source==='sample'?'sample':'manual'}}for(const k of Object.keys(q.targets)){const v=pr.targets?.[k];if(typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=1e12)q.targets[k]=Math.round(v)}if(pr.visual){for(const k of ['text','prompt','diagram'])if(typeof pr.visual[k]==='string')q.visual[k]=pr.visual[k].slice(0,k==='prompt'?12000:300);if(PALETTES[pr.visual.style])q.visual.style=pr.visual.style;if(['cover','inline'].includes(pr.visual.type))q.visual.type=pr.visual.type}q.nextIdea=String(pr.nextIdea||'').slice(0,250);q.isSample=!!pr.isSample;return q}
function setBinding(key,value,number=false){const q=p();if(number){if(value==='')value=0;else{value=Number(value);if(!Number.isFinite(value)||value<0||value>1e12)return false;value=Math.round(value)}}if(key==='title'){q.title=String(value).slice(0,160);invalidate()}else if(key==='nextIdea')q.nextIdea=String(value).slice(0,250);else{const [group,k]=key.split('.');if(group==='brief'&&Object.hasOwn(q.brief,k)){q.brief[k]=value;if(['cta','ctaUrl','tags','format','price'].includes(k)){q.approvals.final=false}else changeBrief()}else if(group==='visual'&&Object.hasOwn(q.visual,k)){q.visual[k]=value;q.approvals.final=false}else if(group==='metric'&&['note','experiment'].includes(k))q.metrics[metricPeriod][k]=String(value);else return false}save();return true}
document.addEventListener('input',ev=>{const el=ev.target;if(el.matches('[data-bind]')){setBinding(el.dataset.bind,el.value,el.type==='number');updateStats()}else if(el.matches('[data-section]')){const section=p().sections.find(s=>s.id===el.dataset.section);if(section&&['heading','text'].includes(el.dataset.part)){section[el.dataset.part]=el.value;invalidate();save();updateStats();if(el.tagName==='TEXTAREA'){el.style.height='auto';el.style.height=Math.max(120,el.scrollHeight+2)+'px'}}}else if(el.matches('[data-search]')){search=el.value;document.getElementById('source-grid').innerHTML=sourceCards()}else if(el.matches('[data-metric]')){let v=el.value===''?null:Number(el.value);if(v!==null&&(!Number.isFinite(v)||v<0||v>1e12||!Number.isInteger(v))){el.setCustomValidity('0以上の整数を入力してください');return}el.setCustomValidity('');p().metrics[metricPeriod][el.dataset.metric]=v;save();updateStats()}});
document.addEventListener('change',async ev=>{const el=ev.target;if(el.id==='project-switch'){state.active=el.value;save();visualVariants=[];render()}else if(el.matches('select[data-bind]')){setBinding(el.dataset.bind,el.value);render()}else if(el.matches('[data-position]')){const a=p().assets.find(a=>a.id===el.dataset.position);if(a){a.position=el.value;p().approvals.read=false;p().approvals.final=false;save();toast('挿絵の位置を変更しました')}}else if(el.matches('[data-approve]')){const k=el.dataset.approve;if(k==='facts'&&el.checked&&p().evidence.some(s=>!s.verified)){el.checked=false;toast('先に「確認待ち」の出典を原典と照合してください。');return}if(k==='final'&&el.checked&&!checks().slice(0,-1).every(c=>c.pass)){el.checked=false;toast('ほかの確認項目を先にそろえてください。');return}p().approvals[k]=el.checked;if(k!=='final')p().approvals.final=false;save();render()}else if(el.matches('[data-metric]')){if(el.checkValidity())render();else el.reportValidity()}else if(el.matches('[data-import]')){const f=el.files[0];if(!f)return;if(f.size>2500000){toast('バックアップは2.5MB以下にしてください');return}try{const q=safeImportedProject(JSON.parse(await f.text()));if(state.projects.length>=20)throw Error('記事は最大20件です。');state.projects.push(q);state.active=q.id;save();closeModal();go('home');toast('別の記事として復元しました。出典と公開チェックは再確認してください。')}catch(err){toast(err.message||'ファイルを読み込めませんでした。')}}});
document.addEventListener('submit',ev=>{const form=ev.target;if(!form.dataset.form)return;ev.preventDefault();const f=new FormData(form),type=form.dataset.form;if(type==='new'){const topic=String(f.get('topic')||'').trim();if(!topic)return;if(state.projects.length>=20){toast('記事は最大20件です。バックアップを書き出してください。');return}const q=newProject(topic);state.projects.push(q);state.active=q.id;save();visualVariants=[];closeModal();go('brief')}else if(type==='source'){const url=String(f.get('url')||'').trim();if(!validURL(url)){toast('https://から始まる、認証情報を含まないURLを入力してください。');return}p().evidence.push({id:uid(),title:String(f.get('title')).trim(),url,type:String(f.get('type')),date:String(f.get('date')),claim:String(f.get('claim')).trim(),verified:false});invalidate();save();closeModal();render();toast('確認待ちの根拠を追加しました。')}else if(type==='goals'){for(const k of ['likes','impressions','revenue']){const n=Number(f.get(k));if(!Number.isSafeInteger(n)||n<0||n>1e12){toast('0以上の整数で設定してください');return}}for(const k of ['likes','impressions','revenue'])p().targets[k]=Number(f.get(k));save();closeModal();render();toast('目標を保存しました')}});
document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-action],[data-go]');if(!el||el.disabled)return;if(el.dataset.go){closeModal(false);go(el.dataset.go);return}const a=el.dataset.action,id=el.dataset.id,i=Number(el.dataset.index),q=p();switch(a){
case'menu':document.getElementById('sidebar').classList.toggle('open');el.setAttribute('aria-expanded',String(document.getElementById('sidebar').classList.contains('open')));break;
case'menu-close':document.getElementById('sidebar').classList.remove('open');break;
case'modal-close':closeModal();break;case'about':about();break;case'new':showNew();break;case'goals':showGoals();break;case'projects':projectList();break;case'switch-project':state.active=id;save();visualVariants=[];closeModal();render();break;
case'source-tab':tab=id;render();break;case'source':sourceDetail(id);break;case'adopt':{if(!SOURCES.some(s=>s.id===id))break;const pos=q.methods.indexOf(id);if(pos>=0)q.methods.splice(pos,1);else q.methods.push(id);q.approvals.brief=false;save();closeModal();render();toast(pos>=0?'この知恵を企画から外しました':'編集の知恵を企画に採用しました');break}
case'research-prompt':copyText(researchPrompt());break;case'add-source':showAddSource();break;
case'verify-source':{const s=q.evidence.find(s=>s.id===id);if(!s)break;if(s.verified){s.verified=false;invalidate();save();render()}else confirmAction('原典を確認しましたか？','元の資料を開き、記録した主張・数字がその内容と合っていること、資料の時期や限界を確認した場合のみ続けてください。アプリは真偽判定していません。','source-confirm',`data-id="${id}"`);break}
case'source-confirm':{const s=q.evidence.find(s=>s.id===id);if(s){s.verified=true;invalidate();save();closeModal();render();toast('人による確認を記録しました。本文との最終照合は別途必要です。')}break}
case'delete-source':confirmAction('根拠メモを削除','この根拠メモを取り除きます。原稿内に記載した引用やURLは、自分で見直してください。','delete-source-confirm',`data-id="${id}"`);break;
case'delete-source-confirm':q.evidence=q.evidence.filter(s=>s.id!==id);invalidate();save();closeModal();render();break;
case'angle':q.brief.angle=id;changeBrief();save();render();break;case'titles':render();toast('現在のテーマと切り口から、テンプレート候補を更新しました');break;
case'pick-title':q.title=titleOptions()[i];invalidate();save();render();toast('タイトルを採用しました。画像の文字も確認してください。');break;case'meeting':meeting();break;
case'approve-brief':if(!q.brief.reader.trim()||!q.brief.pain.trim()||!q.brief.promise.trim()){toast('読者・悩み・読後の変化を記入してください');break}q.approvals.brief=true;save();go('editor');break;
case'add-block':if(q.sections.length>=30){toast('見出しは最大30件です');break}q.sections.push({id:uid(),heading:'新しい見出し',text:''});invalidate();save();render();break;
case'jump':document.getElementById('block-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});break;
case'move-up':case'move-down':{const idx=q.sections.findIndex(s=>s.id===id),to=idx+(a==='move-up'?-1:1);if(idx>=0&&to>=0&&to<q.sections.length){[q.sections[idx],q.sections[to]]=[q.sections[to],q.sections[idx]];invalidate();save();render()}break}
case'delete-block':if(q.sections.length<=1)break;confirmAction('見出しと本文を削除','削除前の原稿を版として保存します。この見出しに置かれた挿絵の配置も外れます。','delete-block-confirm',`data-id="${id}"`);break;
case'delete-block-confirm':saveVersion('見出し削除前');q.sections=q.sections.filter(s=>s.id!==id);q.assets.filter(a=>a.position===id).forEach(a=>a.position='');invalidate();save();closeModal();render();break;
case'draft':confirmAction('入力を、原稿の型へ展開します。','現在の原稿を版として保存してから、企画と一次体験を差し込んだテンプレートへ置き換えます。AIの自由生成ではありません。挿絵の配置は一度外れます。','draft-confirm');break;
case'draft-confirm':createDraft();break;case'save-version':saveVersion();toast('現在のタイトルと原稿を版として保存しました');break;case'versions':showVersions();break;
case'restore-version':confirmAction('この版へ戻しますか？','復元前の原稿も保存します。企画設定と画像は復元対象ではなく、見出しが存在しなくなった挿絵は配置を外します。','restore-confirm',`data-id="${id}"`);break;
case'restore-confirm':{const v=q.versions.find(v=>v.id===id);if(v){const copy=JSON.parse(JSON.stringify(v));saveVersion('復元の直前');q.title=copy.title;q.sections=copy.sections;q.assets.forEach(a=>{if(a.position&&!q.sections.some(s=>s.id===a.position))a.position=''});invalidate();save();closeModal();render();toast('原稿を復元しました。画像と企画は変更していません。')}break}
case'visual-type':q.visual.type=id;q.visual.text='';visualVariants=[];visualSelected=0;save();render();break;
case'visual-style':q.visual.style=id;visualVariants=[];save();render();break;
case'refresh-art':visualVariants=[];render();toast('画像プレビューに現在の入力を反映しました');break;
case'generate-images':{el.disabled=true;el.innerHTML=icon('refresh','spin')+' テンプレートを描画中';const status=document.getElementById('gen-status');if(status)status.textContent='文字・配色・レイアウトを描画しています';await new Promise(r=>setTimeout(r,350));visualVariants=[0,1,2].map(variant=>({...currentSpec(),variant}));visualSelected=0;render();toast('テンプレート画像を3案作成しました。記事で使う案を選べます。');break}
case'preview-art':if(visualVariants[i]){visualSelected=i;showModal('案 '+String.fromCharCode(65+i),`<div class="studio-stage">${canvasTag(visualVariants[i])}</div>`,btn('PNGで保存','download-variant','down','primary',`data-index="${i}"`),true);paintCanvases()}break;
case'use-art':{const art=visualVariants[i];if(!art)break;if(q.assets.length>=30){toast('画像は最大30枚です。不要な画像を削除してください');break}const copy={...art,id:uid(),position:art.type==='inline'?(q.sections[1]||q.sections[0]).id:''};q.assets.push(copy);if(copy.type==='cover')q.cover=copy.id;q.approvals.read=false;q.approvals.rights=false;q.approvals.final=false;save();render();toast(copy.type==='cover'?'バナーに設定しました。プレビューで確認できます。':'挿絵を本文に配置しました。下の一覧で位置を変えられます。');break}
case'download-variant':if(visualVariants[i])makeArt(visualVariants[i]).toBlob(b=>downloadBlob(b,`note-atelier-${visualVariants[i].type}-${i+1}.png`),'image/png');break;
case'download-asset':{const art=q.assets.find(a=>a.id===id);if(art)makeArt(art).toBlob(b=>downloadBlob(b,`note-atelier-${art.type}.png`),'image/png');break}
case'delete-asset':q.assets=q.assets.filter(a=>a.id!==id);if(q.cover===id)q.cover=null;q.approvals.read=false;q.approvals.final=false;save();render();toast('画像を記事から削除しました');break;
case'remove-position':{const art=q.assets.find(a=>a.id===id);if(art){art.position='';q.approvals.read=false;q.approvals.final=false;save();render()}break}
case'image-prompt':copyText(imagePrompt());break;case'preview':showPreview();break;case'preview-device':previewDevice=id;showPreview();break;
case'append-cta':if(!q.brief.cta.trim()){toast('読後の案内を入力してください');break}if(q.sections.some(s=>s.text.includes(q.brief.cta.trim()))){toast('同じ案内が原稿に入っています');break}saveVersion('読後の案内を追加する前');q.sections[q.sections.length-1].text+='\n\n'+q.brief.cta.trim();invalidate();save();render();toast('最後のブロックに案内を追加しました。プレビューで確認してください。');break;
case'copy-article':copyText(plainArticle());break;case'download-text':downloadText(plainArticle(),'article.txt');break;case'download-md':downloadText(plainArticle(true),'article.md','text/markdown;charset=utf-8');break;case'download-html':downloadText(exportedHtml(),'note-atelier-preview.html','text/html;charset=utf-8');break;case'export':await exportKit();break;
case'social-tab':socialChannel=id;render();break;case'copy-social':copyText(socialText());break;
case'metric-period':metricPeriod=id;render();break;case'sample-metrics':confirmAction('サンプルの反応を体験する','24時間・7日・30日の数値を架空のサンプルに置き換えます。入力済みの数値は上書きされます。実績として扱わないでください。','sample-confirm');break;
case'sample-confirm':{[['24h',[480,35,4200,0,0,0]],['7d',[2400,180,12800,4,15000,55000]],['30d',[3900,240,18400,6,24000,110000]]].forEach(([period,values])=>{METRIC_NAMES.forEach(([key],i)=>q.metrics[period][key]=values[i]);q.metrics[period].source='sample'});save();closeModal();render();toast('架空のサンプル数値を読み込みました。実績ではありません。');break}
case'clear-metrics':confirmAction('この期間の数値をクリア','表示中の期間の数値だけを未入力に戻します。読者の言葉と検証メモは残します。','clear-metrics-confirm');break;
case'clear-metrics-confirm':for(const [key]of METRIC_NAMES)q.metrics[metricPeriod][key]=null;q.metrics[metricPeriod].source='manual';save();closeModal();render();break;
case'next-project':if(!q.nextIdea.trim()){toast('次の記事の種を一つ書いてください');break}showNew(q.nextIdea);break;
}});
document.addEventListener('keydown',ev=>{const modal=document.querySelector('.modal');if(ev.key==='Escape'){if(modal)closeModal();document.getElementById('sidebar')?.classList.remove('open')}if(ev.key==='Tab'&&modal){const nodes=[...modal.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),textarea,select,[tabindex="0"]')].filter(x=>x.offsetParent!==null);if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(ROUTES.some(r=>r[0]===h)){route=h;closeModal(false);render()}});
window.addEventListener('storage',ev=>{if(ev.key===KEY)toast('別のタブで編集されました。競合を避けるため、一つのタブで作業してください。')});
route=ROUTES.some(r=>r[0]===location.hash.slice(1))?location.hash.slice(1):'home';render();
</script></body></html>

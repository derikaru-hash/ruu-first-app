'use strict';
const KEY='ruu.win-lab.v1';
const $=(q,el=document)=>el.querySelector(q);
const $$=(q,el=document)=>[...el.querySelectorAll(q)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number.isFinite(v)?new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(v):'未計算';
const count=v=>new Intl.NumberFormat('ja-JP',{maximumFractionDigits:1}).format(v);
const clone=v=>JSON.parse(JSON.stringify(v));
const now=()=>new Date().toISOString();
const uid=()=>globalThis.crypto?.randomUUID?.()||'local-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const stamp=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?'日時不明':d.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})};
const icons={arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',spark:'<path d="m12 3 2.8 6.2L21 12l-6.2 2.8L12 21l-2.8-6.2L3 12l6.2-2.8L12 3Z"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',box:'<path d="m3 7 9-4 9 4-9 4-9-4ZM3 7v10l9 4 9-4V7M12 11v10"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',book:'<path d="M4 3h13a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2V3ZM4 17h15M8 7h7M8 11h5"/>',external:'<path d="M14 3h7v7M21 3 10 14M10 4H4v16h16v-6"/>',sliders:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="7" cy="18" r="2"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1.5.8-1.5 1.2-1.5 2M12 16v.2"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',leaf:'<path d="M19 3C6 3 3 7 5 14s12 9 14-11ZM5 19 15 9"/>',pen:'<path d="m14 5 5 5M4 20l4-1L20 7a2 2 0 0 0-5-5L3 15l1 5Z"/>',shield:'<path d="M12 3 3 7v5c0 5 9 9 9 9s9-4 9-9V7l-9-4Z"/><path d="m8 12 3 3 5-6"/>'};
const icon=(name)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.spark}</svg>`;
const btn=(text,action,id='',cls='',disabled=false)=>`<button type="button" class="btn ${cls}" data-action="${action}"${id?` data-id="${esc(id)}"`:''}${disabled?' disabled':''}>${text}</button>`;
const tag=(text,type='')=>`<span class="tag ${type}">${esc(text)}</span>`;
const STEPS=[['context','条件を決める'],['cases','事例をほどく'],['ideas','自社へ移す'],['plan','小さく試す'],['ledger','判断を残す']];
let state, serial=0, storageError='', conflict=false, invalidStored=false, caseFilter='all', ledgerTab='plans', toastTimer, dialogFocus=null;
const initial=()=>({schema:1,serial:0,screen:'context',revision:1,context:{company:'カレー店A（仮想）',scene:PRESETS.upsell.scene,goal:'upsell',budget:10000,maxMinutes:20,maxStaff:0,assets:Object.keys(ASSETS),noDiscount:true,noEquipment:true,noIngredients:true,other:''},caseSelection:CASES.map(x=>x.id),variants:{},draft:null,plans:[],decisions:[],audit:[]});
function validStore(x){
 const ctx=c=>c&&typeof c.company==='string'&&typeof c.scene==='string'&&Object.hasOwn(GOALS,c.goal)&&['budget','maxMinutes','maxStaff'].every(k=>Number.isFinite(c[k])&&c[k]>=0)&&Array.isArray(c.assets)&&c.assets.every(k=>Object.hasOwn(ASSETS,k));
 const form=f=>f&&['title','owner','reason','start','stop'].every(k=>typeof f[k]==='string')&&['period','activeDays','price','variable','units','minutes','fixed','wage','target'].every(k=>typeof f[k]==='number'||typeof f[k]==='string');
 const recipe=r=>r&&CANDIDATES.some(c=>c.id===r.id)&&Array.isArray(r.sources)&&r.sources.every(id=>CASES.some(c=>c.id===id));
 return !!(x&&x.schema===1&&Number.isInteger(x.serial)&&ctx(x.context)&&Number.isInteger(x.revision)&&Array.isArray(x.caseSelection)&&x.caseSelection.every(id=>CASES.some(c=>c.id===id))&&x.variants&&typeof x.variants==='object'&&(!x.draft||(CANDIDATES.some(c=>c.id===x.draft.candidateId)&&form(x.draft.form)))&&Array.isArray(x.plans)&&x.plans.every(p=>p&&typeof p.id==='string'&&recipe(p.recipe)&&form(p.form)&&ctx(p.context)&&p.projection&&Number.isFinite(p.projection.net)&&Array.isArray(p.results)&&p.results.every(r=>r&&['sim','user'].includes(r.type)&&Number.isFinite(r.rate)&&typeof r.signal==='string'))&&Array.isArray(x.decisions)&&x.decisions.every(d=>d&&typeof d.title==='string'&&typeof d.reason==='string')&&Array.isArray(x.audit)&&x.audit.every(a=>a&&typeof a.title==='string'&&typeof a.detail==='string')&&STEPS.some(s=>s[0]===x.screen));
}
function load(){state=initial();try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(!validStore(s))throw new Error('保存形式を読み取れません');state=s;serial=s.serial;}}catch(e){storageError='保存データを読めません。今の操作は一時的です。必要なら書き出してから初期化してください。';invalidStored=true;}}
function persist(){if(conflict||invalidStored){paintStorage();return false}try{const old=localStorage.getItem(KEY);if(old){const parsed=JSON.parse(old);if(parsed.serial!==serial){conflict=true;storageError='別のタブで更新されました。このタブは一時保存です。書き出してから再読込してください。';paintStorage();return false}}state.serial=serial+1;localStorage.setItem(KEY,JSON.stringify(state));serial=state.serial;storageError='';paintStorage();return true}catch(e){storageError='ブラウザへ保存できません。今の操作は一時的です。記録を書き出して保管してください。';paintStorage();return false}}
function paintStorage(){const line=$('#save-state');if(line){line.className='save-line'+(storageError?' error':'');line.textContent=storageError?'一時保存のみ・書出し推奨':'このブラウザに保存'}const b=$('#storage-banner');if(b){b.classList.toggle('hidden',!storageError);$('#storage-message').textContent=storageError;}}
function toast(text,error=false){clearTimeout(toastTimer);const el=$('#toast');el.textContent=text;el.className='toast'+(error?' error':'');toastTimer=setTimeout(()=>el.classList.add('hidden'),4800)}
function audit(title,detail){state.audit.unshift({id:uid(),time:now(),title,detail,revision:state.revision});state.audit=state.audit.slice(0,120)}
function changed(){state.revision++;state.draft=null}
function go(screen){if(!STEPS.some(s=>s[0]===screen))return;state.screen=screen;persist();render();window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true})}
const currentRecipe=id=>{const c=CANDIDATES.find(c=>c.id===id);return c?{...c,...(state.variants[id]?c.shrink:{}),refined:!!state.variants[id]}:null};
function assess(c,ctx=state.context,selected=state.caseSelection){const stop=[],hold=[];if(ctx.noDiscount&&c.discount)stop.push('値引き禁止に該当');if(ctx.noEquipment&&c.equipment)stop.push('新設備を使わない条件に該当');if(ctx.noIngredients&&c.ingredients)stop.push('新食材を増やさない条件に該当');if(c.staff>ctx.maxStaff)stop.push(`追加人員 ${c.staff}人 > 上限 ${ctx.maxStaff}人`);for(const a of c.needs)if(!ctx.assets.includes(a))stop.push(`必要な資産が未選択：${ASSETS[a]}`);if(c.cost>ctx.budget)hold.push(`準備費 ${money(c.cost)} > 上限 ${money(ctx.budget)}`);if(c.minutes>ctx.maxMinutes)hold.push(`追加作業 ${c.minutes}分/日 > 上限 ${ctx.maxMinutes}分`);const missing=c.sources.filter(id=>!selected.includes(id));if(missing.length)hold.push(`参照する事例が未選択：${missing.map(id=>CASES.find(c=>c.id===id).name).join('・')}`);return{kind:stop.length?'stop':hold.length?'hold':'ready',reasons:[...stop,...hold]}}
const statusTag=a=>tag(a.kind==='ready'?'条件内・要実測':a.kind==='hold'?'小さく直す':'今回は見送る',a.kind==='ready'?'green':a.kind==='hold'?'orange':'red');
const chips=()=>`<div class="rules-mini"><span class="rule-chip">${esc(state.context.company)}</span><span class="rule-chip">準備費 ${money(state.context.budget)}まで</span><span class="rule-chip">追加作業 ${state.context.maxMinutes}分/日まで</span>${state.context.noDiscount?'<span class="rule-chip">値引きしない</span>':''}${state.context.noEquipment?'<span class="rule-chip">設備を増やさない</span>':''}${state.context.noIngredients?'<span class="rule-chip">新食材なし</span>':''}</div>`;
const sourcePills=c=>`<div class="source-pills">${c.sources.map(id=>`<button type="button" data-action="case" data-id="${id}">${esc(CASES.find(x=>x.id===id).name)}</button>`).join('')}</div>`;
function render(){const step=STEPS.findIndex(s=>s[0]===state.screen);$('#nav').innerHTML=STEPS.map(([s,label],i)=>`<button type="button" data-action="go" data-id="${s}" class="${s===state.screen?'active':''}" ${s===state.screen?'aria-current="step"':''}><span class="step-n">0${i+1}</span><span>${label}</span></button>`).join('');$('#main').innerHTML=`<div class="breadcrumb"><span class="dot"></span>RUU STRATEGY LAB <span>/</span> ${String(step+1).padStart(2,'0')} ${STEPS[step][1]}</div>${({context:renderContext,cases:renderCases,ideas:renderIdeas,plan:renderPlan,ledger:renderLedger})[state.screen]()}<footer class="footer"><span>勝ち筋は、売上の保証ではなく「試す価値のある仮説」。</span><span>RUU LAB · DEMO v1.0 / 2026.09.05</span></footer>`;paintStorage();}
function field(name,label,value,type='text',extra='',hint=''){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}>${hint?`<small>${hint}</small>`:''}</div>`}
function check(name,label,checked){return `<label class="check"><input type="checkbox" name="${name}"${checked?' checked':''}><span>${label}</span></label>`}
function renderContext(){const c=state.context;return `<section class="hero"><div><span class="eyebrow">BORROW THE STRUCTURE. NOT THE SURFACE.</span><h1>他社の成功を、<br>自社の<span>「次の一手」</span>に。</h1><p>借りるのは、見た目ではなく仕組み。<br>自社の条件で選び直し、現場で試せる一案にします。</p><div class="tags">${tag('ルウ王子の判断法をもとに設計','green')}${tag('飲食店向け体験デモ')}</div></div><div class="hero-visual"><span class="eyebrow">たとえば、こんな移し替え。</span><div class="transfer-mini"><div class="tile"><small>REFERENCE / IKEA</small><b>選んでから<br>受け取る</b></div>${icon('arrow')}<div class="tile"><small>YOUR STORE / 仮説</small><b>10食だけの<br>金曜予約カレー</b></div></div><div class="dash"></div><p>商品も、物流網も、真似しない。</p><p class="highlight">「先に決める段取り」だけを借りる。</p><p>食品への転用は自店で別途設計。事例の原文は次の画面へ。</p></div></section><form id="context-form" novalidate><div class="presets" aria-label="相談の入口">${Object.entries(PRESETS).map(([id,p])=>`<button type="button" class="${c.goal===id?'active':''}" data-action="preset" data-id="${id}">${{upsell:'客単価を育てたい',reserve:'予約を増やしたい',repeat:'また来てもらいたい'}[id]}</button>`).join('')}</div><div class="conditions"><section class="panel"><div class="panel-title"><h3>${icon('sliders')}まず、自社を知る</h3>${tag('仮の店舗でお試し')}</div>${field('company','店舗・会社の呼び名',c.company,'text','maxlength="60" required','実名でなくて構いません。機密・個人情報は入力しないでください。')}<div class="field"><label for="scene">誰の、どんな場面を変えたい？</label><textarea name="scene" id="scene" maxlength="400" required>${esc(c.scene)}</textarea></div><div class="field"><label for="goal">最初に変えたい行動</label><select name="goal" id="goal">${Object.entries(GOALS).map(([id,v])=>`<option value="${id}"${id===c.goal?' selected':''}>${v}</option>`).join('')}</select></div><p class="mini-title">いま使えるもの</p>${Object.entries(ASSETS).map(([id,label])=>check('asset-'+id,label,c.assets.includes(id))).join('')}</section><section class="panel"><div class="panel-title"><h3>${icon('shield')}やらないことを先に決める</h3></div><div class="fields3">${field('budget','準備費の上限（円）',c.budget,'number','min="0" max="1000000" step="1" required')}${field('maxMinutes','追加作業（分/日）',c.maxMinutes,'number','min="0" max="480" step="1" required')}${field('maxStaff','追加人員（人）',c.maxStaff,'number','min="0" max="20" step="1" required')}</div><p class="small muted">準備費は初期の制作費など。材料費・稼働中の人件費は、実験計画で別に計算します。</p>${check('noDiscount','値引きで売らない',c.noDiscount)}${check('noEquipment','新しい設備を買わない',c.noEquipment)}${check('noIngredients','新しい食材を増やさない',c.noIngredients)}<div class="field" style="margin-top:17px"><label for="other">現場メモ</label><textarea name="other" id="other" maxlength="600" placeholder="例：金曜17時から18時は受渡しが重なる">${esc(c.other)}</textarea><small>自由記述は記録用。自動判定には上の数値・チェック条件のみ使います。</small></div><div class="note">「面白い」より先に「続けられるか」。条件を変えると、候補の採否も変わります。</div></section></div><div class="foot-action"><p>公式情報6件＋編集済み企画6案を使う体験版です。生成AI・リアルタイム検索は動きません。数字はデモ用の仮置きです。</p><button class="btn primary" type="submit">6つの事例を見にいく ${icon('arrow')}</button></div><p id="context-error" class="form-error" role="alert"></p></form>`}
function renderCases(){const selected=CASES.filter(c=>state.caseSelection.includes(c.id));return `<div class="section-head"><div><span class="eyebrow">02 / 3・2・1 BENCHMARK</span><h1>同じ業界の外にも、ヒントがある。</h1><p>同業3件、隣接2件、逆の売り方1件。<br>「何を売っているか」ではなく、「どう選びやすくしているか」を見ます。</p></div>${btn('自社の条件を直す','go','context','text')}</div><div class="scan-strip">${Object.entries(GROUPS).map(([id,label],i)=>`<div class="scan-stat"><b>${selected.filter(c=>c.group===id).length}</b><span>${label}<small>基準 ${[3,2,1][i]}件 / 飲食店視点</small></span></div>`).join('')}<div class="scan-tip">${icon('book')}公式情報の確認日：2026年9月5日<br>売れた理由や心理的効果は、こちらの仮説です。</div></div><div class="filters" aria-label="事例の種類">${[['all','すべて'],...Object.entries(GROUPS)].map(([id,label])=>`<button type="button" data-action="filter" data-id="${id}" class="${caseFilter===id?'active':''}" aria-pressed="${caseFilter===id}">${label}</button>`).join('')}</div><div class="case-grid">${CASES.filter(c=>caseFilter==='all'||c.group===caseFilter).map(c=>`<article class="case-card" data-group="${c.group}"><div class="case-top"><div class="tags">${tag(GROUPS[c.group])}<span class="mono muted small">${c.mark}</span></div><div class="case-name">${esc(c.name)}</div><div class="case-region">${esc(c.region)}</div></div><div class="case-body"><h3>${c.headline}</h3><p class="fact"><span class="eyebrow">公式で確認した仕組み</span>${c.fact}</p><p class="small muted">顧客レビュー：未収集<br>購入導線：公式案内まで・実注文は未検証</p></div><div class="case-bottom"><label class="select-case"><input type="checkbox" data-case="${c.id}"${state.caseSelection.includes(c.id)?' checked':''}>企画に使う</label>${btn('仕組みをほどく '+icon('arrow'),'case',c.id,'sm text')}</div></article>`).join('')}</div><p class="legend">企業による推奨・提携ではありません。ロゴ・写真・コピーは流用せず、公式ページの情報を要約しています。</p><div class="foot-action"><p>事例のチェックを外すと、それを使う企画は「参照不足」になります。事例の数ではなく、自社につながる理由で選びます。</p>${btn('借りる仕組みを、自社へ移す '+icon('arrow'),'go','ideas','primary',!selected.length)}</div>${!selected.length?'<p class="form-error">比較に使う事例を1件以上選んでください。</p>':''}`}
function sortedRecipes(){const rank={ready:0,hold:1,stop:2};return CANDIDATES.map(c=>currentRecipe(c.id)).sort((a,b)=>rank[assess(a).kind]-rank[assess(b).kind]||Number(b.goal===state.context.goal)-Number(a.goal===state.context.goal));}
function renderIdeas(){const rows=sortedRecipes(),n=k=>rows.filter(c=>assess(c).kind===k).length;return `<div class="section-head"><div><span class="eyebrow">03 / TRANSFER & SELECT</span><h1>そのまま借りない。自社で選び直す。</h1><p>候補を増やすだけでは、企画は前へ進みません。<br>採る理由も、見送る理由も残します。</p></div>${btn('条件を変更','go','context','soft')}</div>${chips()}<div class="summary-band"><div><b>${n('ready')}</b><span>条件内・要実測</span></div><div><b>${n('hold')}</b><span>小さく直す</span></div><div><b>${n('stop')}</b><span>条件に合わない</span></div><p class="last">成功率の採点ではありません。<br>決めた条件との照合です。</p></div><div class="idea-grid">${rows.map((c,i)=>{const a=assess(c);return `<article class="idea ${i===0&&a.kind==='ready'?'featured':''}" data-candidate="${c.id}"><div class="topline"><span class="kind">${c.label}</span>${statusTag(a)}</div><h3>${esc(c.title)}</h3><p class="hook">${esc(c.hook)}</p>${sourcePills(c)}<div class="numbers"><div><small>準備費・仮置き</small><b>${money(c.cost)}</b></div><div><small>追加作業・仮置き</small><b>${c.minutes}<small> 分/日</small></b></div></div><div class="reason ${a.kind==='stop'?'bad':''}">${a.reasons.length?a.reasons.map(esc).join('<br>'):`設定条件の範囲内です。${c.goal===state.context.goal?'選んだ目的にも一致。':'目的は「'+GOALS[c.goal]+'」。'}実施前に現場で確認します。`}</div><div class="btn-row">${btn('移植の中身','idea',c.id,'sm')}${btn(c.refined?'追いルウ済み':'追いルウで小さく','refine',c.id,'sm soft',c.refined)}</div><div class="btn-row" style="margin-top:9px">${btn('実験計画へ '+icon('arrow'),'adopt',c.id,'sm primary',a.kind!=='ready')}${btn('見送りを記録','reject',c.id,'sm text')}</div>${c.refined?'<p class="small muted" style="margin:10px 0 0">変更前の案は、判断履歴に残しています。</p>':''}</article>`}).join('')}</div><div class="note orange" style="margin-top:22px">候補は固定の6案です。「追いルウ」は用意した縮小版への切り替えです。独自の案をAIが生成しているわけではありません。現場メモや記録した理由は自動学習しません。</div>`}
function openDialog(title,body){const d=$('#dialog');if(d.open)d.close();dialogFocus=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;d.showModal();d.scrollTop=0;$('#dialog-close').focus()}
function closeDialog(){const d=$('#dialog');if(d.open)d.close();}
function showCase(id){const c=CASES.find(x=>x.id===id);if(!c)return;openDialog('事例の仕組みをほどく',`<div class="tags">${tag(GROUPS[c.group],'green')}${tag('公式情報 / 2026.09.05')}</div><h3 class="big-title" style="margin:14px 0">${esc(c.name)}</h3><p>${c.headline}</p><div class="evidence-grid"><article><h4>確認したこと</h4><p>${c.fact}</p></article><article><h4>借りる仕組みの仮説</h4><p>${c.mechanism}</p></article></div><a class="source-link" href="${c.url}" target="_blank" rel="noopener noreferrer">${icon('external')}${esc(c.source)}を開く</a><div class="note orange"><b>真似しないこと</b><br>${c.notCopy}</div><p class="small" style="margin-top:15px">成立条件：${c.condition}</p><details><summary>6つの構造質問を見る</summary><div class="qa">${QUESTIONS.map((q,i)=>`<article><h4>${i+1}. ${q}</h4><p>${c.questions[i]}</p></article>`).join('')}</div></details><div class="note white" style="margin-top:20px">レビューは未収集、実際の注文操作は未検証です。仕組みの存在を、売上や人気の原因だとは断定しません。</div><div class="actions">${btn('戻る','close','','primary')}</div>`)}
function showIdea(id){const c=currentRecipe(id);if(!c)return;const a=assess(c);openDialog('移植の設計図',`<div class="tags">${statusTag(a)}${tag(c.refined?'追いルウ後の案':'自社向けの仮説')}</div><h3 class="big-title" style="margin:14px 0">${esc(c.title)}</h3><p>${c.idea}</p><div class="mapping"><article><span class="eyebrow">借りる</span><p>${c.borrow}</p></article><article><span class="eyebrow">自社と組む</span><p>${c.own}</p></article><article><span class="eyebrow">持ち込まない</span><p>${c.refined?esc(c.change):c.remove}</p></article></div>${sourcePills(c)}<div class="note orange"><b>反対から考える</b><br>${c.risk}</div><div class="qa" style="margin-top:17px"><article><h4>確かめたいこと</h4><p>${c.unknown}</p></article><article><h4>小さな実験</h4><p>${c.test}</p></article></div><details><summary>王子の判断を、6つの確認軸にする</summary><div class="axes">${[['顧客の価値','選んだ場面に役立つか。現場で確認。'],['自社らしさ','既存商品との関係を担当者が確認。'],['実行できるか',a.reasons.length?a.reasons.join(' / '):'数値条件内。作業は要実測。'],['続けられるか','負担と追加分の差額を計画で確認。'],['違いがあるか','表現でなく、自社の組み合わせで確認。'],['確かめられるか',c.metric+'と作業時間を記録。']].map(([h,t])=>`<div><h4>${h}</h4><p>${esc(t)}</p></div>`).join('')}</div></details><div class="actions">${btn('戻る','close')}${btn('実験計画へ','adopt',c.id,'primary',a.kind!=='ready')}</div>`)}
function showRefine(id){const base=CANDIDATES.find(x=>x.id===id);if(!base||state.variants[id])return;const after={...base,...base.shrink};openDialog('追いルウ｜大きくする前に、削ってみる',`<div class="before-after"><article><span class="eyebrow">BEFORE</span><b>${esc(base.title)}</b><p>準備費 ${money(base.cost)}<br>追加作業 ${base.minutes}分/日</p></article>${icon('arrow')}<article><span class="eyebrow">AFTER / 仮置き</span><b>${esc(after.title)}</b><p>準備費 ${money(after.cost)}<br>追加作業 ${after.minutes}分/日</p></article></div><div class="note">${base.shrink.change}</div><p style="margin-top:17px">${base.shrink.idea}</p><form id="refine-form" data-id="${id}" novalidate><div class="field"><label for="critique">どこが難しいと感じた？（この案の判断メモ）</label><textarea id="critique" name="critique" maxlength="600" required placeholder="例：通常営業に加えて25分かかるなら続けにくい"></textarea><small>この理由と変更前後を保存します。自由記述をAIが解釈する機能や、全案件への自動学習はありません。</small></div><p class="form-error" id="refine-error" role="alert"></p><div class="actions">${btn('変更しない','close')}<button class="btn primary" type="submit">小さい案に切り替える ${icon('pen')}</button></div></form>`)}
function showReject(id){const c=currentRecipe(id);if(!c)return;openDialog('採らない理由も、次の資産にする',`<h3 style="margin-bottom:18px">${esc(c.title)}</h3><form id="reject-form" data-id="${id}" novalidate><div class="field"><label for="decision-type">今回の判断</label><select id="decision-type" name="decisionType"><option value="見送り">今回は見送る</option><option value="保留">追加確認まで保留</option></select></div><div class="field"><label for="decision-reason">理由</label><textarea id="decision-reason" name="reason" maxlength="800" required placeholder="何の条件が合わなかったか、何が分かれば再検討できるか"></textarea></div><p class="small muted">この案件の記録です。王子本人が承認した汎用ルールにはしません。</p><p class="form-error" id="reject-error" role="alert"></p><div class="actions">${btn('戻る','close')}<button class="btn primary" type="submit">判断を記録</button></div></form>`)}
function newDraft(id){const c=currentRecipe(id);if(!c||assess(c).kind!=='ready'){toast('現在の条件に合わないため、先に条件か企画を見直してください。',true);return}state.draft={candidateId:id,revision:state.revision,parentId:null,form:{title:c.title,owner:'',reason:'',start:localDate(),period:14,activeDays:c.activeDays,price:c.price,variable:c.variable,units:c.units,minutes:c.minutes,fixed:c.cost,wage:1200,target:20,stop:'設定した追加作業時間を超えたら一度止める。安全や受渡しに問題があれば直ちに中止する。',checked:false}};closeDialog();go('plan')}
function numberValue(v,min,max,integer=false){if(v===null||v===undefined||String(v).trim()==='')return false;const n=Number(v);return Number.isFinite(n)&&n>=min&&n<=max&&(!integer||Number.isInteger(n))}
function projection(f){const keys=['price','variable','units','activeDays','minutes','fixed','wage'];if(!keys.every(k=>numberValue(f[k],0,10000000)))return null;const price=+f.price,variable=+f.variable,units=+f.units,days=+f.activeDays,minutes=+f.minutes,fixed=+f.fixed,wage=+f.wage;const revenue=price*units*days,contribution=(price-variable)*units*days,labor=minutes/60*wage*days;return{revenue,contribution,labor,fixed,net:contribution-labor-fixed,totalUnits:units*days,breakEven:price>variable?Math.ceil((fixed+labor)/(price-variable)):null}}
function calcHtml(f){const p=projection(f);return `<span class="eyebrow">HYPOTHESIS / 実績ではありません</span><h3>追加分の見込み差額</h3><div class="total">${p?money(p.net):'未計算'}</div><div class="calc-line"><span>追加売上（仮）</span><b>${p?money(p.revenue):'—'}</b></div><div class="calc-line"><span>材料等を引いた額</span><b>${p?money(p.contribution):'—'}</b></div><div class="calc-line"><span>追加作業の人件費</span><b>− ${p?money(p.labor):'—'}</b></div><div class="calc-line"><span>初期準備費</span><b>− ${p?money(p.fixed):'—'}</b></div><div class="divider"></div><div class="calc-line"><span>実施日合計の件数</span><b>${p?count(p.totalUnits):'—'} 件</b></div><div class="calc-line"><span>差額0円に必要な件数</span><b>${p&&p.breakEven!==null?count(p.breakEven)+' 件':'算出不可'}</b></div><p class="tiny">（単価 − 1件の材料等）× 件数/日 × 実施日数<br>− 追加分/日 ÷ 60 × 時給 × 実施日数 − 準備費</p>${p&&p.net<0?'<p class="note orange">この仮定では持ち出しです。費用または試す規模を見直してください。</p>':''}`}
function renderPlan(){const d=state.draft;if(!d)return `<div class="section-head"><div><span class="eyebrow">04 / SMALL EXPERIMENT</span><h1>一案を選んで、小さく試す。</h1><p>企画一覧から「実験計画へ」を押すと、担当者・費用・測る数字までつなげます。</p></div></div><div class="empty panel">${icon('leaf')}<h3>まだ、試す案は選ばれていません。</h3><p>「条件内・要実測」の案から一つ選びましょう。</p>${btn('企画一覧へ','go','ideas','primary')}</div>`;const c=currentRecipe(d.candidateId),f=d.form;return `<div class="section-head"><div><span class="eyebrow">04 / SMALL EXPERIMENT</span><h1>当てにいくより、確かめにいく。</h1><p>誰が、いつ、何を試し、どこで止めるか。<br>試した後に判断できる計画を、一枚に残します。</p></div>${btn('別の案を見る','go','ideas','text')}</div><div class="plan-choice"><div class="tags">${tag('企画仮説','green')}${tag(d.parentId?'改訂版の下書き':'新しい計画')}${tag(c.refined?'追いルウ済み':'初回案')}</div><h3>${esc(c.title)}</h3><p>${c.idea}</p>${sourcePills(c)}</div><form id="plan-form" novalidate><div class="plan-layout"><div><section class="panel"><h3 class="section-label"><span class="num">1</span>実験の約束</h3>${field('title','計画名',f.title,'text','maxlength="100" required')}${field('owner','確認・実施する担当（役割名で可）',f.owner,'text','maxlength="60" required','例：店長。実行の依頼や通知は送信されません。')}<div class="field"><label for="reason">この案を選ぶ理由</label><textarea id="reason" name="reason" maxlength="800" required>${esc(f.reason)}</textarea></div><div class="fields3">${field('start','開始日',f.start,'date','required')}<div class="field"><label for="period">観察期間（日）</label><select id="period" name="period"><option value="7"${+f.period===7?' selected':''}>7日</option><option value="14"${+f.period===14?' selected':''}>14日</option><option value="28"${+f.period===28?' selected':''}>28日</option></select></div>${field('activeDays','実際に試す日数',f.activeDays,'number',`min="1" max="${f.period}" step="1" required`)}</div><div class="note">${c.test}</div></section><section class="panel"><h3 class="section-label"><span class="num">2</span>数値の仮置きを直す</h3><p class="small muted">以下はデモの仮定です。すべて追加で売れた場合の試算で、既存注文の置換は含みません。</p><div class="fields2">${field('price','1件の追加売上（円）',f.price,'number','min="1" max="1000000" step="1" required')}${field('variable','1件の材料・容器等（円）',f.variable,'number','min="0" max="1000000" step="1" required')}${field('units','見込む追加件数 / 実施日',f.units,'number',`min="1" max="${c.maxUnits||1000}" step="1" required`,c.maxUnits?`この縮小案は1日${c.maxUnits}件が上限です。`:'予測値ではありません。試す数量の仮定です。')}${field('minutes','追加作業（分 / 実施日）',f.minutes,'number',`min="0" max="${state.context.maxMinutes}" step="1" required`)}${field('fixed','初期準備費（円）',f.fixed,'number',`min="0" max="${state.context.budget}" step="1" required`)}${field('wage','人件費換算の時給（円）',f.wage,'number','min="0" max="100000" step="1" required','デモの換算単価です。実際の人件費を確認してください。')}</div></section><section class="panel"><h3 class="section-label"><span class="num">3</span>続ける・止める条件</h3>${field('target','案内した人・組のうち、行動した割合の目安（％）',f.target,'number','min="0" max="100" step="1" required','デモ用の判断目安。統計的な有意差や成功保証ではありません。')}<div class="field"><label for="stop">数字以外の中止・見直し条件</label><textarea id="stop" name="stop" maxlength="800" required>${esc(f.stop)}</textarea></div>${check('checked','仮の条件・計算・現場確認の工程を確認しました。実際の実施前には担当者の確認が必要です。',f.checked)}<p id="plan-error" class="form-error" role="alert"></p><button class="btn primary block" type="submit">実験計画をこのブラウザに保存 ${icon('book')}</button><p class="small muted" style="margin:13px 0 0">押しても予約受付・発注・広告配信は行いません。実施前の計画記録です。</p></section></div><aside class="plan-aside"><section class="estimate" id="calc">${calcHtml(f)}</section><div class="assumption-box"><h4>試算に含めていないもの</h4><p>家賃などの共通費、既存売上の置換、廃棄、税の調整、予想外の追加費用。表示額は店舗の利益全体ではありません。</p></div><div class="note orange">必要な準備費と作業時間は、まだ仮置きです。小さく実測し、次の判断へ戻します。</div></aside></div></form>`}
function validatePlan(f,c){const errors=[];for(const [k,label]of [['title','計画名'],['owner','担当'],['reason','選ぶ理由'],['stop','中止条件']])if(!String(f[k]||'').trim())errors.push(label+'を入力してください。');if(!/^\d{4}-\d{2}-\d{2}$/.test(f.start)||Number.isNaN(new Date(f.start+'T12:00:00').getTime()))errors.push('開始日を確認してください。');const bounds={period:[7,28],activeDays:[1,Number(f.period)||0],price:[1,1000000],variable:[0,1000000],units:[1,c.maxUnits||1000],minutes:[0,state.context.maxMinutes],fixed:[0,state.context.budget],wage:[0,100000],target:[0,100]};for(const [k,[min,max]]of Object.entries(bounds))if(!numberValue(f[k],min,max,true))errors.push(({period:'観察期間',activeDays:'実施日数',price:'単価',variable:'材料等',units:'件数',minutes:'追加作業',fixed:'準備費',wage:'時給',target:'目標割合'})[k]+`は ${min}〜${max} の整数で入力してください。`);if(+f.price<=+f.variable)errors.push('単価が材料等を上回る条件に見直してください。');if(assess(c).kind!=='ready')errors.push('自社条件・参照事例が変わりました。企画を選び直してください。');if(!f.checked)errors.push('最後の確認欄をチェックしてください。');return errors}
function resultsHtml(p){return p.results.map(r=>`<div class="observation"><div class="tags">${tag(r.type==='sim'?'操作練習用の記録':'利用者入力・未検証',r.type==='sim'?'orange':'')}${tag(r.decision)}<small class="muted">${stamp(r.time)}</small></div><p>案内 ${r.exposed}人・組 → 行動 ${r.actions}人・組 ／ ${count(r.rate)}％<br>追加作業 ${r.minutes}分/日</p><p>${esc(r.feedback)}</p><p class="muted">${esc(r.signal)}</p></div>`).join('')}
function renderLedger(){return `<div class="section-head"><div><span class="eyebrow">05 / DECISION NOTEBOOK</span><h1>選んだ理由が、次の知見になる。</h1><p>計画も、見送りも、追いルウも。同じブラウザに残します。<br>本人の承認なしに、別の企業へ自動適用することはありません。</p></div>${btn('記録を書き出す '+icon('download'),'export','','soft')}</div><div class="tabs" role="group" aria-label="記録の種類">${[['plans','実験計画',state.plans.length],['decisions','見送り・保留',state.decisions.length],['audit','変更の履歴',state.audit.length]].map(([id,label,n])=>`<button type="button" data-action="tab" data-id="${id}" class="${ledgerTab===id?'active':''}" aria-pressed="${ledgerTab===id}">${label} <span>${n}</span></button>`).join('')}</div>${ledgerTab==='plans'?renderPlans():ledgerTab==='decisions'?renderDecisions():renderAudit()}<div class="note white" style="margin-top:20px">保存先は、この端末・ブラウザだけです。別の端末・相手のブラウザへは共有されません。ブラウザのデータ削除で消えるため、必要な記録は書き出してください。</div>`}
function renderPlans(){return state.plans.length?state.plans.map(p=>`<article class="plan-card" data-plan="${p.id}"><div class="heading"><div><div class="tags">${tag(p.results.length?'結果の記録あり':'実施前の計画','green')}${tag(p.parentId?'改訂版':'初回計画')}${tag('見込み数値は仮定')}</div><h3>${esc(p.form.title)}</h3><div class="meta">${esc(p.context.company)} / 担当：${esc(p.form.owner)} / ${stamp(p.time)}</div></div>${btn('計画をテキスト出力','plan-export',p.id,'sm')}</div><p>${esc(p.recipe.idea)}</p><div class="plan-details"><div><small>開始・観察期間</small><b>${esc(p.form.start)} / ${p.form.period}日</b></div><div><small>実施日数</small><b>${p.form.activeDays}日</b></div><div><small>追加分の見込み差額</small><b>${money(p.projection.net)}</b></div></div><p><b>選んだ理由</b><br>${esc(p.form.reason)}</p><p class="muted"><b>止める条件</b><br>${esc(p.form.stop)}</p>${resultsHtml(p)}<div class="btn-row">${btn('試した反応を記録','observe',p.id,'soft')}${btn('この計画を改訂する','revise-plan',p.id)}</div></article>`).join(''):`<div class="empty panel">${icon('book')}<h3>まだ、実験計画がありません。</h3><p>条件に合う案を一つ選び、計画として残しましょう。</p>${btn('企画を選ぶ','go','ideas','primary')}</div>`}
function renderDecisions(){return state.decisions.length?state.decisions.map(d=>`<article class="decision-card"><div>${tag(d.type,d.type==='見送り'?'red':'orange')}<br><small>${stamp(d.time)}</small></div><div><h3>${esc(d.title)}</h3><p>${esc(d.reason)}</p><small>${esc(d.company)} / 条件版 ${d.revision} / ${d.refined?'追いルウ後':'初回案'}</small></div></article>`).join(''):'<div class="empty panel"><h3>見送りも、価値のある判断です。</h3><p>企画の「見送りを記録」から、理由を残せます。</p></div>'}
function renderAudit(){return state.audit.length?`<div class="panel">${state.audit.map(a=>`<div class="timeline-item"><time>${stamp(a.time)}</time><div><b>${esc(a.title)}</b><p>${esc(a.detail)}</p></div></div>`).join('')}</div>`:'<div class="empty panel"><h3>変更の履歴は、ここに残ります。</h3><p>条件変更や追いルウの前後を確認できます。</p></div>'}
function showObservation(id){const p=state.plans.find(x=>x.id===id);if(!p)return;openDialog('実験後の反応を記録する',`<h3 style="margin-bottom:16px">${esc(p.form.title)}</h3><form id="observation-form" data-id="${id}" novalidate><div class="field"><label for="result-type">記録の種類</label><select name="resultType" id="result-type"><option value="sim">デモの操作練習</option><option value="user">利用者が入力した現場記録（アプリでは未検証）</option></select></div><div class="fields3">${field('exposed','案内した人・組',40,'number','min="1" max="1000000" step="1" required')}${field('actions','行動した人・組',11,'number','min="0" max="1000000" step="1" required')}${field('actualMinutes','追加作業（分/日）',14,'number','min="0" max="480" step="1" required')}</div><p class="small muted">分母・分子は同じ人または組で数えます。購買件数と人数を混ぜず、同じ対象を重複して数えないでください。初期値は練習用です。</p><div class="field"><label for="feedback">匿名の反応・現場で気づいたこと</label><textarea name="feedback" id="feedback" maxlength="1000">案内の言葉は伝わったが、受渡しが重なる時間は調整が必要。（練習用）</textarea></div><div class="field"><label for="result-decision">担当者の判断</label><select name="decision" id="result-decision"><option>修正して再確認</option><option>小規模で継続</option><option>今回は中止</option><option>判断を保留</option></select></div><div class="note orange">この割合だけで、施策が原因で売上が増えたとは言えません。日付・客層・通常営業との差も別途確かめます。</div><p class="form-error" id="observation-error" role="alert"></p><div class="actions">${btn('戻る','close')}<button class="btn primary" type="submit">結果と判断を保存</button></div></form>`)}
function downloadFile(name,content,type='text/plain;charset=utf-8'){try{const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('書き出しファイルを作成しました。')}catch(e){toast('書き出せませんでした。ブラウザの設定を確認してください。',true)}}
function planText(p){const f=p.form;return [`勝ち筋移植ラボ｜${f.title}`,`保存：${stamp(p.time)}`,`会社：${p.context.company}　担当：${f.owner}`,`顧客場面：${p.context.scene}`,`選んだ理由：${f.reason}`,``, `企画仮説：${p.recipe.idea}`,`借りる仕組み：${p.recipe.borrow}`,`組み合わせる自社資産：${p.recipe.own}`,`持ち込まない要素：${p.recipe.refined?p.recipe.change:p.recipe.remove}`,`反対材料：${p.recipe.risk}`,`未確認：${p.recipe.unknown}`,`現場メモ（自動判定なし）：${p.context.other||'なし'}`,``, `期間：${f.start}から${f.period}日間（実施は${f.activeDays}日）`,`準備費：${money(+f.fixed)} / 追加作業：${f.minutes}分/日 / 換算時給：${money(+f.wage)}`,`仮の単価：${money(+f.price)} / 材料等：${money(+f.variable)} / 件数：${f.units}件/日`,`追加分の見込み差額：${money(p.projection.net)}（実績・店舗全体の利益ではない）`,`計算：（単価−材料等）×件数/日×実施日数 − 追加分/日÷60×時給×実施日数 − 準備費`,`含まない：共通費、既存売上の置換、廃棄、税の調整、予想外の追加費用。件数はすべて追加売上という仮定。`,`中止条件：${f.stop}`,`行動割合の判断目安：${f.target}％（有意差や成功保証ではない）`,``, `参考事例：公式確認日2026-09-05 / レビュー未収集・注文実操作未検証`,...p.recipe.sources.flatMap(id=>{const c=CASES.find(c=>c.id===id);return [c.name,c.url,`公式情報：${c.fact}`,`こちらの仮説：${c.mechanism}`,`真似しない：${c.notCopy}`]}),``, `反応記録：`,...p.results.flatMap(r=>[`${stamp(r.time)} / ${r.type==='sim'?'操作練習用':'利用者入力・未検証'}`,`案内${r.exposed}人・組→行動${r.actions}人・組（${count(r.rate)}％）、追加作業${r.minutes}分/日`,r.feedback,`担当判断：${r.decision}`,r.signal]),``, `このデモは生成AI・検索・送信・発注を行いません。保存は同じブラウザ内のみ。実施前に担当者が確認してください。`].join('\n')}
function help(){openDialog('このデモでできること',`<span class="eyebrow">勝ち筋移植ラボ / v1.0</span><h3>調べた先に、決める仕事を。</h3><p style="margin-top:13px">同業3件・隣接2件・逆の売り方1件の公式情報を読み、自社の条件で選び、縮小して実験計画へつなぐ体験です。</p><div class="evidence-grid"><article><h4>動く機能</h4><p>条件照合、事例選択、固定案の縮小、採否理由、計算、計画保存、結果記録、テキスト・JSON出力。</p></article><article><h4>まだ接続していないもの</h4><p>生成AI、リアルタイム検索、ログイン、サーバー保存、複数端末共有、予約・広告・発注。</p></article></div><div class="note orange">「王子の判断基準」は教材・対話から実装した初期案です。王子本人の採否が自動で保証されるものではありません。自由記述の自動解釈・自動学習は行いません。</div><p class="small muted" style="margin-top:17px">公式情報は2026年9月5日に確認。企画の効果は仮説、予算・作業時間・単価・件数は仮定です。顧客レビューや実際の購入操作を確認したとは扱いません。</p><p class="small">入力情報をネットワークへ送る処理はありません。ただし、同じブラウザ・端末を使う人が記録を見られる可能性があります。実名・機密・個人情報は入力しないでください。</p><div class="actions">${btn('記録を書き出す','export')}${btn('デモを初期化','reset','','red')}${btn('閉じる','close','','primary')}</div>`)}
function resetDialog(){openDialog('このデモの記録を初期化しますか？',`<p>このブラウザの「勝ち筋移植ラボ」の計画、理由、結果、下書きだけを削除します。ほかのデモの記録は消しません。</p><p class="note orange">元に戻せません。必要な記録は先に書き出してください。</p><div class="actions">${btn('やめる','close')}${btn('記録を書き出す','export')}${btn('このデモだけ初期化','reset-confirm','','red')}</div>`)}
function readContext(form){const f=new FormData(form);return{company:String(f.get('company')||'').trim(),scene:String(f.get('scene')||'').trim(),goal:f.get('goal'),budget:f.get('budget'),maxMinutes:f.get('maxMinutes'),maxStaff:f.get('maxStaff'),assets:Object.keys(ASSETS).filter(id=>f.has('asset-'+id)),noDiscount:f.has('noDiscount'),noEquipment:f.has('noEquipment'),noIngredients:f.has('noIngredients'),other:String(f.get('other')||'').trim()}}

function saveContextForm(form){const c=readContext(form),errors=[];if(!c.company||!c.scene)errors.push('呼び名と顧客の場面を入力してください。');for(const[k,max]of [['budget',1000000],['maxMinutes',480],['maxStaff',20]])if(!numberValue(c[k],0,max,true))errors.push('準備費・追加作業・人員は、表示範囲の0以上の整数で入力してください。');if(errors.length){$('#context-error').textContent=[...new Set(errors)].join(' ');$('#context-error').scrollIntoView({block:'center'});return false}['budget','maxMinutes','maxStaff'].forEach(k=>c[k]=Number(c[k]));if(JSON.stringify(c)!==JSON.stringify(state.context)){state.context=c;changed();audit('自社条件を更新',`準備費${money(c.budget)}・追加作業${c.maxMinutes}分/日・追加人員${c.maxStaff}人。過去の保存済み計画は変更しません。`)}return true}

 else if(a==='export')downloadFile('win-lab-records-'+localDate()+'.json',JSON.stringify({exportedAt:now(),notice:'操作デモ。AI未接続。実績と仮説を区別。',data:state},null,2),'application/json');
 else if(a==='plan-export'){const p=state.plans.find(x=>x.id===id);if(p)downloadFile('win-lab-plan-'+p.id.slice(0,8)+'.txt',planText(p))}
 else if(a==='observe')showObservation(id);
 else if(a==='revise-plan'){const p=state.plans.find(x=>x.id===id);if(!p)return;const c=currentRecipe(p.recipe.id);if(!c||assess(c).kind!=='ready'){toast('現在の条件では計画に進めません。先に候補・参照事例を見直してください。',true);return}state.draft={candidateId:c.id,parentId:p.id,revision:state.revision,form:{...clone(p.form),title:p.form.title+'（改訂）',reason:'',start:localDate(),checked:false}};go('plan')}
 else if(a==='reset')resetDialog();
 else if(a==='reset-confirm'){try{localStorage.removeItem(KEY);serial=0;state=initial();invalidStored=false;conflict=false;storageError='';closeDialog();persist();render();toast('このデモだけ初期化しました。')}catch(e){toast('初期化できませんでした。ブラウザ設定を確認してください。',true)}}
 else if(a==='reload')location.reload();
});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-case]')){if(t.checked&&!state.caseSelection.includes(t.dataset.case))state.caseSelection.push(t.dataset.case);else if(!t.checked)state.caseSelection=state.caseSelection.filter(id=>id!==t.dataset.case);changed();persist();render()}
 if(t.id==='result-type'&&t.value==='user'){const f=t.closest('form');for(const n of ['exposed','actions','actualMinutes','feedback'])f.elements[n].value='';toast('練習値を消しました。確認できた現場の数字を入力してください。')}
});
document.addEventListener('input',e=>{if(e.target.closest('#plan-form')&&state.draft){const f=collectPlan($('#plan-form'));f.checked=$('#plan-form').elements.checked.checked;state.draft.form=f;persist();$('#calc').innerHTML=calcHtml(f);if(e.target.name==='period')$('#activeDays').max=f.period;}});
document.addEventListener('change',e=>{if(e.target.closest('#plan-form')&&state.draft){const f=collectPlan($('#plan-form'));f.checked=$('#plan-form').elements.checked.checked;state.draft.form=f;persist();$('#calc').innerHTML=calcHtml(f);if(e.target.name==='period')$('#activeDays').max=f.period;}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,fd=new FormData(form);if(form.id==='context-form'){if(saveContextForm(form))go('cases')}
 else if(form.id==='refine-form'){const id=form.dataset.id,base=CANDIDATES.find(x=>x.id===id),reason=String(fd.get('critique')||'').trim();if(!reason){$('#refine-error').textContent='難しいと感じた点を一言、残してください。';return}state.variants[id]=true;changed();audit('追いルウ：'+base.title,`${reason} → ${base.shrink.change} 準備費${money(base.cost)}→${money(base.shrink.cost)}、作業${base.minutes}→${base.shrink.minutes}分/日（いずれも仮定）。`);closeDialog();persist();render();toast('小さい案へ切り替え、変更前後を記録しました。')}
 else if(form.id==='reject-form'){const c=currentRecipe(form.dataset.id),reason=String(fd.get('reason')||'').trim();if(!reason){$('#reject-error').textContent='見送り・保留の理由を入力してください。';return}state.decisions.unshift({id:uid(),time:now(),candidateId:c.id,title:c.title,refined:c.refined,company:state.context.company,context:clone(state.context),revision:state.revision,type:fd.get('decisionType'),reason});const saved=persist();closeDialog();render();toast(saved?'判断をこのブラウザに記録しました。':'判断は一時保存です。書き出して保管してください。',!saved)}
 else if(form.id==='plan-form'){if(!state.draft)return;const c=currentRecipe(state.draft.candidateId),f=collectPlan(form);f.checked=form.elements.checked.checked;state.draft.form=f;const errors=validatePlan(f,c);if(errors.length){$('#plan-error').innerHTML=errors.map(esc).join('<br>');$('#plan-error').scrollIntoView({block:'center'});return}const p=projection(f);const id=uid();state.plans.unshift({id,time:now(),parentId:state.draft.parentId,recipe:clone(c),context:clone(state.context),revision:state.revision,form:clone(f),projection:p,results:[]});audit('実験計画を記録',f.title+' / 担当：'+f.owner+' / 理由：'+f.reason);state.draft=null;state.screen='ledger';ledgerTab='plans';const saved=persist();render();window.scrollTo(0,0);toast(saved?'計画をこのブラウザに保存しました。まだ実施はしていません。':'計画は一時保存です。書き出して保管してください。',!saved)}
 else if(form.id==='observation-form'){const p=state.plans.find(x=>x.id===form.dataset.id);if(!p)return;const exposed=fd.get('exposed'),actions=fd.get('actions'),minutes=fd.get('actualMinutes');if(!numberValue(exposed,1,1000000,true)||!numberValue(actions,0,1000000,true)||+actions>+exposed||!numberValue(minutes,0,480,true)){$('#observation-error').textContent='案内数は1以上、行動数は案内数以下、作業時間は0〜480分の整数で入力してください。';return}const rate=+actions/+exposed*100;let signal=+minutes>p.context.maxMinutes?'作業時間が上限を超えました。行動割合より先に、現場負担を見直す材料です。':rate>=+p.form.target?'設定した行動割合の目安は超えています。ただし継続は担当者が判断します。':'設定した行動割合の目安に届いていません。場面・案内・手順を再確認する材料です。';if(+exposed<30)signal+=' 対象数が少ないため、大きく一般化しないでください。';signal+=' 因果関係や売上増の証明ではありません。';p.results.push({id:uid(),time:now(),type:fd.get('resultType'),exposed:+exposed,actions:+actions,minutes:+minutes,rate,feedback:String(fd.get('feedback')||'').trim(),decision:fd.get('decision'),signal});const saved=persist();closeDialog();render();toast(saved?'結果の種類と、担当者の判断を保存しました。':'結果は一時保存です。書き出して保管してください。',!saved)}
});
window.addEventListener('storage',e=>{if(e.key===KEY){conflict=true;storageError='別のタブで記録が変わりました。このタブは書出し後に再読込してください。';paintStorage();}});
